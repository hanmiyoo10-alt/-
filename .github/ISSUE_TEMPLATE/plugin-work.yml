name: Repository work
description: Track work for one registered plugin, product, or repository/shared concern.
title: ""
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Choose the exact operational scope. The control plane does not infer this from prose.
      options:
        - usage-dashboard
        - simcore
        - devpass
        - termux-large-doc-editor
        - voyage-token-check
        - pocketrisu-helper-mod
        - shared
        - repo
        - custom
    validations:
      required: true
  - type: input
    id: custom_scope
    attributes:
      label: Custom scope
      description: Used only when Scope is custom. Enter a lowercase ASCII slug of 1-44 characters using letters, digits, and single hyphens.
      placeholder: example-scope
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the work, evidence, or requested change.
    validations:
      required: true
