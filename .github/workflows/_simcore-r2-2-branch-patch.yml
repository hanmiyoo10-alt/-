name: SimCore R2.2 bounded branch patch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded current-state patch
        run: python products/simcore/tooling/_r2_2_branch_patch.py
      - name: Commit patched document
        run: |
          git diff --check
          test ! -e .github/workflows/_simcore-r2-2-branch-patch.yml
          test ! -e products/simcore/tooling/_r2_2_branch_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(simcore): retire duplicate current-state authority"
          git push
