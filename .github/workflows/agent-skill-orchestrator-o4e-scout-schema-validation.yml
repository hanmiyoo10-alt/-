name: Agent Skill Orchestrator O4-E Scout Schema Validation

on:
  push:
    branches:
      - 'agent-skill-o4e-request/**'
    paths:
      - '.agent-skill-o4e-requests/*.json'

permissions:
  contents: read

jobs:
  o4e-scout-schema-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BENCH_ROOT: .agent-skill-orchestrator-o4e-scout-schema-validation
      LLAMA_RELEASE: b10516
      LLAMA_SOURCE_DIGEST: b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9
      LLAMA_ARTIFACT: llama-b10516-bin-ubuntu-x64.tar.gz
      LLAMA_ARTIFACT_SHA256: f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35
      SERVER_PORT: '39141'
    steps:
      - name: Checkout exact O4-E request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve bounded request commit
        id: resolve
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$BENCH_ROOT"
          mkdir -p "$BENCH_ROOT/cells"
          python tools/agent-skill-orchestrator/benchmarks/resolve_o4e_request.py \
            --repo-root . \
            --github-ref "$EVENT_REF" \
            --github-sha "$EVENT_SHA" \
            --output "$BENCH_ROOT/request-provenance.json"
          target_sha="$(python -c 'import json; print(json.load(open(".agent-skill-orchestrator-o4e-scout-schema-validation/request-provenance.json"))["target_repository_sha"])')"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "O4E_REQUEST_TARGET_SHA:$target_sha"

      - name: Checkout exact evaluated target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.resolve.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Enforce exact main target and zero-credential boundary
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f "$BENCH_ROOT/request-provenance.json"
          git fetch --no-tags --depth=64 origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          for name in HF_TOKEN HUGGING_FACE_HUB_TOKEN HUGGINGFACEHUB_API_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "O4E_MODEL_CREDENTIAL_PRESENT:$name"
              exit 2
            fi
          done
          echo 'O4E_HOSTED_AI_BOUNDARY:ZERO'
          echo 'O4E_MODEL_CREDENTIAL_ENV:ABSENT'

      - name: Prepare frozen O4-E execution inputs before inference
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail
          python tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_schema_validation.py prepare \
            --target-sha "$TARGET_SHA" \
            --output "$BENCH_ROOT/matrix.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.agent-skill-orchestrator-o4e-scout-schema-validation')
          matrix = json.loads((root / 'matrix.json').read_text(encoding='utf-8'))
          expected = [
              'qwen2.5-3b-instruct-q4_k_m',
              'ministral-3-3b-instruct-2512-q4_k_m',
          ]
          if matrix.get('model_profile_ids') != expected:
              raise SystemExit('O4-E model matrix drifted')
          if matrix.get('request_timeout_seconds') != 1800:
              raise SystemExit('O4-E timeout drifted')
          if matrix.get('local_model_call_ceiling') != 2 or matrix.get('hosted_ai_call_ceiling') != 0:
              raise SystemExit('O4-E call ceiling drifted')
          forbidden = {'winner','recommended_model','assignment','rank','ranking','tie_break'}
          if forbidden.intersection(matrix):
              raise SystemExit('O4-E matrix contains forbidden winner semantics')
          print('O4E_MATRIX_SHA256:' + matrix['matrix_sha256'])
          print('O4E_RESPONSE_SCHEMA_SHA256:' + matrix['response_schema_sha256'])
          PY

      - name: Download and verify pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/o4e-runtime"
          mkdir -p "$runtime_root"
