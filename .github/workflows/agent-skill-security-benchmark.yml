name: Agent Skill Security Benchmark (Advisory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'tools/agent-skill-security/**'
      - '.github/workflows/agent-skill-security-benchmark.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'tools/agent-skill-security/**'
      - '.github/workflows/agent-skill-security-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCH_ROOT: .agent-skill-security-benchmark
      SCANNER_VERSION: '2.1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository-owned corpus contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/agent-skill-security/tests -p 'test_*.py' -v

      - name: Install pinned scanner in isolated environment
        id: scanner_install
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BENCH_ROOT"
          mkdir -p "$BENCH_ROOT"
          VENV_ROOT="$RUNNER_TEMP/agent-skill-security-venv"
          python -m venv "$VENV_ROOT"
          start_ns="$(date +%s%N)"
          "$VENV_ROOT/bin/python" -m pip install --disable-pip-version-check \
            "cisco-ai-skill-scanner==$SCANNER_VERSION"
          end_ns="$(date +%s%N)"
          install_ms="$(( (end_ns - start_ns) / 1000000 ))"
          printf '%s\n' "$install_ms" > "$BENCH_ROOT/install-duration-ms.txt"
          "$VENV_ROOT/bin/python" -m pip freeze --all | LC_ALL=C sort \
            > "$BENCH_ROOT/resolved-dependencies.txt"
          sha256sum "$BENCH_ROOT/resolved-dependencies.txt" \
            > "$BENCH_ROOT/resolved-dependencies.sha256"
          actual="$("$VENV_ROOT/bin/python" -c \
            'import importlib.metadata; print(importlib.metadata.version("cisco-ai-skill-scanner"))')"
          test "$actual" = "$SCANNER_VERSION"
          printf 'VENV_ROOT=%s\n' "$VENV_ROOT" >> "$GITHUB_ENV"
          echo "SCANNER_PIN_VERIFIED:$actual"
          echo "SCANNER_DEPENDENCY_LOCK_REPOSITORY_OWNED:false"

      - name: Execute deterministic advisory benchmark
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$VENV_ROOT/bin:$PATH"
          install_ms="$(cat "$BENCH_ROOT/install-duration-ms.txt")"
          set +e
          "$VENV_ROOT/bin/python" tools/agent-skill-security/evaluate.py \
            --repo-root . \
            --output-dir "$BENCH_ROOT" \
            --dependency-manifest "$BENCH_ROOT/resolved-dependencies.txt" \
            --install-duration-ms "$install_ms"
          benchmark_code=$?
          set -e
          if [[ -f "$BENCH_ROOT/summary.md" ]]; then
            cat "$BENCH_ROOT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$benchmark_code" -eq 2 ]]; then
            echo "BENCHMARK_INVALID"
            exit 2
          fi
          test "$benchmark_code" -eq 0
          echo "BENCHMARK_COMPLETE"

      - name: Upload bounded benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-skill-security-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-skill-security-benchmark
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
