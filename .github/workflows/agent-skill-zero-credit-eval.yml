name: Agent Skill Zero-Credit Eval

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Agent Skill to evaluate locally
        required: true
        type: choice
        options:
          - plugin-authority-scan
          - plugin-impact-scope
      case_id:
        description: Exact output eval case id
        required: true
        type: string
      model_profile:
        description: Allowlisted local CPU model profile
        required: true
        default: qwen2.5-1.5b-instruct-q4_k_m
        type: choice
        options:
          - qwen2.5-1.5b-instruct-q4_k_m
          - qwen2.5-3b-instruct-q4_k_m
  push:
    branches:
      - 'agent-skill-zero-credit-request/**'
    paths:
      - '.agent-skill-zero-credit-requests/*.json'

permissions:
  contents: read

jobs:
  local-output-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVAL_ROOT: .agent-skill-zero-credit-eval
      LLAMA_RELEASE: b10516
      LLAMA_SOURCE_DIGEST: b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9
      LLAMA_ARTIFACT: llama-b10516-bin-ubuntu-x64.tar.gz
      LLAMA_ARTIFACT_SHA256: f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35
      SERVER_PORT: '39127'
      GENERATION_JSON: '{"temperature":0,"seed":42,"n_predict":768,"ctx_size":16384,"threads":4,"gpu_layers":0,"transport":"llama-server-v1-chat-completions"}'
    steps:
      - name: Checkout event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve bounded evaluation request and checkout target
        shell: bash
        env:
          DISPATCH_SKILL: ${{ github.event.inputs.skill || '' }}
          DISPATCH_CASE_ID: ${{ github.event.inputs.case_id || '' }}
          DISPATCH_MODEL_PROFILE: ${{ github.event.inputs.model_profile || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$EVAL_ROOT"
          python tools/agent-skill-eval/resolve_zero_credit_request.py \
            --repo-root . \
            --event-name "$GITHUB_EVENT_NAME" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --dispatch-skill "$DISPATCH_SKILL" \
            --dispatch-case-id "$DISPATCH_CASE_ID" \
            --dispatch-model-profile "$DISPATCH_MODEL_PROFILE" \
            --output "$EVAL_ROOT/request-provenance.json"

          EVAL_SKILL="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["skill"])')"
          EVAL_CASE_ID="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["case_id"])')"
          EVAL_MODEL_PROFILE="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["model_profile"])')"
          EVAL_REPOSITORY_SHA="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["target_repository_sha"])')"
          EVAL_REQUEST_SHA="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["request_commit_sha"])')"
          EVAL_EXECUTION_TRIGGER="$(python -c 'import json; print(json.load(open(".agent-skill-zero-credit-eval/request-provenance.json"))["execution_trigger"])')"

          case "$EVAL_MODEL_PROFILE" in
            qwen2.5-1.5b-instruct-q4_k_m)
              LOCAL_MODEL_ID='qwen2.5-1.5b-instruct-q4_k_m-local'
              MODEL_REPOSITORY='Qwen/Qwen2.5-1.5B-Instruct-GGUF'
              MODEL_REVISION='a615a81362316d7b9f5a7a9c4313adfdf9b54588'
              MODEL_FILE='qwen2.5-1.5b-instruct-q4_k_m.gguf'
              MODEL_SHA256='6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'
              ;;
            qwen2.5-3b-instruct-q4_k_m)
              LOCAL_MODEL_ID='qwen2.5-3b-instruct-q4_k_m-local'
              MODEL_REPOSITORY='Qwen/Qwen2.5-3B-Instruct-GGUF'
              MODEL_REVISION='af75b7aaf5bb163ce4c5dab4e6b84d844e96265d'
              MODEL_FILE='qwen2.5-3b-instruct-q4_k_m.gguf'
              MODEL_SHA256='626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d'
              ;;
            *)
              echo "ZERO_CREDIT_MODEL_PROFILE:UNALLOWLISTED:$EVAL_MODEL_PROFILE"
              exit 2
              ;;
          esac

          printf 'EVAL_SKILL=%s\n' "$EVAL_SKILL" >> "$GITHUB_ENV"
          printf 'EVAL_CASE_ID=%s\n' "$EVAL_CASE_ID" >> "$GITHUB_ENV"
          printf 'EVAL_MODEL_PROFILE=%s\n' "$EVAL_MODEL_PROFILE" >> "$GITHUB_ENV"
          printf 'EVAL_REPOSITORY_SHA=%s\n' "$EVAL_REPOSITORY_SHA" >> "$GITHUB_ENV"
          printf 'EVAL_REQUEST_SHA=%s\n' "$EVAL_REQUEST_SHA" >> "$GITHUB_ENV"
          printf 'EVAL_EXECUTION_TRIGGER=%s\n' "$EVAL_EXECUTION_TRIGGER" >> "$GITHUB_ENV"
          printf 'LOCAL_MODEL_ID=%s\n' "$LOCAL_MODEL_ID" >> "$GITHUB_ENV"
          printf 'MODEL_REPOSITORY=%s\n' "$MODEL_REPOSITORY" >> "$GITHUB_ENV"
          printf 'MODEL_REVISION=%s\n' "$MODEL_REVISION" >> "$GITHUB_ENV"
          printf 'MODEL_FILE=%s\n' "$MODEL_FILE" >> "$GITHUB_ENV"
          printf 'MODEL_SHA256=%s\n' "$MODEL_SHA256" >> "$GITHUB_ENV"

          if ! git cat-file -e "${EVAL_REPOSITORY_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$EVAL_REPOSITORY_SHA"
          fi
          git checkout --detach "$EVAL_REPOSITORY_SHA"
          test "$(git rev-parse HEAD)" = "$EVAL_REPOSITORY_SHA"
          echo "ZERO_CREDIT_REQUEST_SHA:$EVAL_REQUEST_SHA"
          echo "ZERO_CREDIT_TARGET_SHA:$EVAL_REPOSITORY_SHA"
          echo "ZERO_CREDIT_EXECUTION_TRIGGER:$EVAL_EXECUTION_TRIGGER"
          echo "ZERO_CREDIT_MODEL_PROFILE:$EVAL_MODEL_PROFILE"

      - name: Fetch read-only eval authority refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            release-usage-dashboard:refs/remotes/origin/release-usage-dashboard
          git rev-parse refs/remotes/origin/release-usage-dashboard^{commit}

          if [[ "$EVAL_SKILL" == 'plugin-impact-scope' && "$EVAL_CASE_ID" == 'simcore-3m3-structured-sidecar-validation-heldout' ]]; then
            for frozen_sha in \
              e4daaa427ed902ca6f8368c45d509f7fd0f26d42 \
              861100f4771967aa5b8ab8811d06f11702c0d3ff
            do
              if ! git cat-file -e "${frozen_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$frozen_sha"
              fi
              test "$(git rev-parse "${frozen_sha}^{commit}")" = "$frozen_sha"
              echo "ZERO_CREDIT_FROZEN_AUTHORITY_SHA:$frozen_sha"
            done
          fi

      - name: Prepare output eval and bounded source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVAL_ROOT/with_skill" "$EVAL_ROOT/baseline_without_target_skill"
          python tools/agent-skill-eval/prepare_local_eval.py \
            --repo-root . \
            --skill "$EVAL_SKILL" \
            --case-id "$EVAL_CASE_ID" \
            --repository-sha "$EVAL_REPOSITORY_SHA" \
            --model-id "$LOCAL_MODEL_ID" \
            --output "$EVAL_ROOT/matrix.json"
          python tools/agent-skill-eval/build_local_context.py \
            --repo-root . \
            --profile tools/agent-skill-eval/local-context-profiles.json \
            --skill "$EVAL_SKILL" \
            --case-id "$EVAL_CASE_ID" \
            --output "$EVAL_ROOT/context.json"
          for mode in with_skill baseline_without_target_skill; do
            python tools/agent-skill-eval/compose_local_prompt.py \
              --matrix "$EVAL_ROOT/matrix.json" \
              --context "$EVAL_ROOT/context.json" \
              --skill-file ".agents/skills/$EVAL_SKILL/SKILL.md" \
              --mode "$mode" \
              --response-contracts tools/agent-skill-eval/local-response-contracts.json \
              --prompt-output "$EVAL_ROOT/$mode/prompt.txt" \
              --meta-output "$EVAL_ROOT/$mode/prompt-meta.json"
          done

      - name: Download and verify pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zero-credit-runtime"
          cd "$RUNNER_TEMP/zero-credit-runtime"
          curl -L --fail --retry 3 --retry-all-errors \
            -o "$LLAMA_ARTIFACT" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/${LLAMA_ARTIFACT}"
          printf '%s  %s\n' "$LLAMA_ARTIFACT_SHA256" "$LLAMA_ARTIFACT" > llama.sha256
          sha256sum -c llama.sha256
          mkdir extracted
          tar -xzf "$LLAMA_ARTIFACT" -C extracted
          llama_server="$(find extracted -type f -name llama-server -perm -u+x -print -quit)"
          if [[ -z "$llama_server" ]]; then
            echo 'ZERO_CREDIT_LLAMA_SERVER:MISSING'
            exit 2
          fi
          printf '%s\n' "$(realpath "$llama_server")" > "$GITHUB_WORKSPACE/$EVAL_ROOT/llama-server-path.txt"
          "$llama_server" --version > "$GITHUB_WORKSPACE/$EVAL_ROOT/llama-runtime-version.txt" 2>&1

      - name: Download and verify pinned local model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zero-credit-model"
          cd "$RUNNER_TEMP/zero-credit-model"
          curl -L --fail --retry 3 --retry-all-errors \
            -o "$MODEL_FILE" \
            "https://huggingface.co/${MODEL_REPOSITORY}/resolve/${MODEL_REVISION}/${MODEL_FILE}?download=true"
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_FILE" > model.sha256
          sha256sum -c model.sha256
          printf '%s\n' "$(realpath "$MODEL_FILE")" > "$GITHUB_WORKSPACE/$EVAL_ROOT/model-path.txt"

      - name: Run zero-credit local pair
        shell: bash
        run: |
          set -euo pipefail
          llama_server="$(cat "$EVAL_ROOT/llama-server-path.txt")"
          model_path="$(cat "$EVAL_ROOT/model-path.txt")"
          python tools/agent-skill-eval/run_local_server_pair.py \
            --server-binary "$llama_server" \
            --model-path "$model_path" \
            --eval-root "$EVAL_ROOT" \
            --generation-json "$GENERATION_JSON" \
            --response-contracts tools/agent-skill-eval/local-response-contracts.json \
            --port "$SERVER_PORT"

      - name: Build and validate zero-credit receipts
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(tr '\n' ' ' < "$EVAL_ROOT/llama-runtime-version.txt" | sed 's/[[:space:]]*$//')"
          if [[ -z "$runtime_version" ]]; then
            echo 'ZERO_CREDIT_RUNTIME_VERSION:MISSING'
            exit 2
          fi
          for mode in with_skill baseline_without_target_skill; do
            code="$(cat "$EVAL_ROOT/$mode/exit-code.txt")"
            python tools/agent-skill-eval/validate_local_receipt.py make \
              --matrix "$EVAL_ROOT/matrix.json" \
              --context "$EVAL_ROOT/context.json" \
              --prompt-meta "$EVAL_ROOT/$mode/prompt-meta.json" \
              --response "$EVAL_ROOT/$mode/response.txt" \
              --exit-code "$code" \
              --mode "$mode" \
              --model-repository "$MODEL_REPOSITORY" \
              --model-revision "$MODEL_REVISION" \
              --model-file "$MODEL_FILE" \
              --model-sha256 "$MODEL_SHA256" \
              --llama-release "$LLAMA_RELEASE" \
              --llama-source-digest "$LLAMA_SOURCE_DIGEST" \
              --llama-artifact "$LLAMA_ARTIFACT" \
              --llama-artifact-sha256 "$LLAMA_ARTIFACT_SHA256" \
              --llama-runtime-version "$runtime_version" \
              --generation-json "$GENERATION_JSON" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$EVAL_ROOT/$mode/receipt.json"
          done
          python tools/agent-skill-eval/validate_local_receipt.py pair \
            --with-receipt "$EVAL_ROOT/with_skill/receipt.json" \
            --baseline-receipt "$EVAL_ROOT/baseline_without_target_skill/receipt.json" \
            --output "$EVAL_ROOT/pair-validation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.agent-skill-zero-credit-eval/pair-validation.json').read_text(encoding='utf-8'))
          print('ZERO_CREDIT_PAIR_STATUS:' + str(data.get('status')))
          print('ZERO_CREDIT_TRIGGER_OBSERVABILITY:' + str(data.get('trigger_observability')))
          print('ZERO_CREDIT_RESPONSE_CONTRACT_SHA256:' + str(data.get('response_contract_sha256')))
          if data.get('status') != 'PAIR_VALID':
              raise SystemExit(3)
          PY

      - name: Upload bounded zero-credit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-skill-zero-credit-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-skill-zero-credit-eval/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
