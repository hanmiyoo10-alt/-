name: Agent Materialize Usage Dashboard 5.70

on:
  push:
    branches: [release/usage-dashboard-570-request-duration-fidelity]
    paths:
      - '.github/workflows/agent-usage-dashboard-570-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: release/usage-dashboard-570-request-duration-fidelity
          fetch-depth: 0

      - name: Materialize and validate 5.70
        env:
          PYTHONPYCACHEPREFIX: /tmp/usage-dashboard-pycache
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_request_duration_fidelity_570.py
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node plugins/usage-dashboard/tests/behavior-request-duration.cjs
          node plugins/usage-dashboard/tests/p34-request-duration-fidelity.cjs
          git diff --check

      - name: Commit final candidate bytes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            plugins/usage-dashboard/src \
            plugins/usage-dashboard/runtime-src \
            plugins/usage-dashboard/runtime \
            plugins/usage-dashboard/latest.js \
            docs/USAGE_DASHBOARD_GUIDELINES.md \
            .github/workflows/reusable-usage-dashboard-validate.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '5.70 candidate already materialized'
            exit 0
          fi
          git commit -m 'release: materialize Local Usage Dashboard 5.70 candidate'
          git push origin HEAD:release/usage-dashboard-570-request-duration-fidelity
