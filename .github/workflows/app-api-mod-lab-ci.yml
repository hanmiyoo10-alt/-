name: App API Mod Lab CI

on:
  pull_request:
    paths:
      - 'products/app-api-mod-lab/**'
      - 'docs/APP_API_MOD_LAB_GUIDELINES.md'
      - '.github/workflows/app-api-mod-lab-ci.yml'
  push:
    branches: [main]
    paths:
      - 'products/app-api-mod-lab/**'
      - 'docs/APP_API_MOD_LAB_GUIDELINES.md'
      - '.github/workflows/app-api-mod-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate App API Mod Lab targets
        run: node products/app-api-mod-lab/validate-targets.mjs
