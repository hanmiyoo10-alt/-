name: App API Mod Lab CI

on:
  pull_request:
    paths:
      - 'products/app-api-mod-lab/**'
      - 'docs/APP_API_MOD_LAB_GUIDELINES.md'
      - '.github/workflows/app-api-mod-lab-ci.yml'
  push:
    branches: [main]
    paths:
      - 'products/app-api-mod-lab/**'
      - 'docs/APP_API_MOD_LAB_GUIDELINES.md'
      - '.github/workflows/app-api-mod-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Validate App API Mod Lab targets
        run: node products/app-api-mod-lab/validate-targets.mjs
      - name: Validate legacy target candidates
        run: node products/app-api-mod-lab/validate-legacy-candidates.mjs
