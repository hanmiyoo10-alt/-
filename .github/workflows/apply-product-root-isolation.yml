name: Apply product root isolation

on:
  push:
    branches: [main]
    paths:
      - 'products/**'
      - 'scripts/apply-product-root-isolation.py'
      - '.github/workflows/apply-product-root-isolation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolation migration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-product-root-isolation.py
          python3 scripts/apply-product-root-isolation.py
          git diff --check
          grep -Fq 'group: repo-main-write' .github/workflows/simcore-release-command.yml
          grep -Fq 'group: repo-main-write' .github/workflows/simcore-release-state-sync.yml
          grep -Fq 'group: repo-main-write' .github/workflows/stage-usage-dashboard-557-organization-discovery-dedup.yml

      - name: Commit main-write isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/simcore-release-command.yml \
            .github/workflows/simcore-release-state-sync.yml \
            .github/workflows/stage-usage-dashboard-557-organization-discovery-dedup.yml
          if git diff --cached --quiet; then
            echo 'Product root main-write isolation already applied.'
            exit 0
          fi
          git commit -m 'ci: isolate product main writers'
          git pull --rebase origin main
          git push origin HEAD:main
