name: Audit Local Usage 5.24 Power

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-local-usage-524-power.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect 5.23 power-sensitive runtime paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git show origin/release-usage-dashboard:plugins/usage-dashboard/latest.js > /tmp/latest.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/latest.js').read_text()

          def around(anchor, before=800, after=5000):
              i = s.find(anchor)
              print('\n===== ' + anchor + ' =====')
              if i < 0:
                  print('NOT FOUND')
                  return
              print(s[max(0, i-before):min(len(s), i+after)])

          for anchor in [
              'function markPerformanceInteraction(',
              'function beginResumeMeasurement(',
              'async function refresh(',
              'async function renderPanel(',
              'async function openSettings(',
          ]:
              around(anchor)

          print('\n===== persist call sites =====')
          for n, line in enumerate(s.splitlines(), 1):
              if 'persist(' in line:
                  print(f'{n}: {line}')

          print('\n===== renderWidget call sites =====')
          for n, line in enumerate(s.splitlines(), 1):
              if 'renderWidget(' in line:
                  print(f'{n}: {line}')
          PY
