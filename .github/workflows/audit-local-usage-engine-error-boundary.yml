name: Audit Local Usage Engine Error Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-local-usage-engine-error-boundary.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce unhandled health-route failure on released engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git show origin/release-usage-dashboard:plugins/usage-dashboard/runtime/bridge-engine.mjs > /tmp/bridge-engine.mjs
          node --check /tmp/bridge-engine.mjs

          tmp_home="$(mktemp -d)"
          mkdir -p "$tmp_home/PocketRisu/bridge/update-ready/latest_dashboard.js"
          port=39217

          HOME="$tmp_home" DEVPASS_BRIDGE_PORT="$port" node /tmp/bridge-engine.mjs >/tmp/engine-audit.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$tmp_home"
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if grep -q "URL   : http://127.0.0.1:$port" /tmp/engine-audit.log 2>/dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "engine exited before request"
              cat /tmp/engine-audit.log
              exit 1
            fi
            sleep 0.1
          done

          set +e
          curl --silent --show-error --max-time 3 -o /tmp/health-body -w '%{http_code}' "http://127.0.0.1:$port/health" >/tmp/health-code 2>/tmp/curl-err
          curl_rc=$?
          set -e
          sleep 0.5

          code="$(cat /tmp/health-code 2>/dev/null || true)"
          alive=no
          if kill -0 "$pid" 2>/dev/null; then alive=yes; fi

          echo "curl_rc=$curl_rc http_code=$code process_alive=$alive"
          echo "--- curl stderr ---"
          cat /tmp/curl-err 2>/dev/null || true
          echo "--- response body ---"
          cat /tmp/health-body 2>/dev/null || true
          echo
          echo "--- engine log ---"
          cat /tmp/engine-audit.log

          # Current 1.6.2 has no outer Promise rejection boundary around handle().
          # The forced EISDIR from pluginUpdateInfo() should therefore fail the
          # request (and on normal Node unhandled-rejection behavior, terminate
          # the process). If it somehow returns a normal HTTP response, do not
          # claim the bug is reproduced.
          if [ "$curl_rc" -eq 0 ]; then
            echo "AUDIT_NOT_REPRODUCED: health returned HTTP $code"
            exit 1
          fi
          echo "AUDIT_REPRODUCED: route-local filesystem error escaped the request handler"
