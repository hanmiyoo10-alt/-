name: Audit Local Usage Manager Request Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-local-usage-manager-request-boundary.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce unhandled manager request error
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git show origin/release-usage-dashboard:plugins/usage-dashboard/runtime/bridge-manager.cjs > /tmp/bridge-manager.cjs
          node --check /tmp/bridge-manager.cjs

          tmp_home="$(mktemp -d)"
          mkdir -p "$tmp_home/.config/llmgateway-devpass-bridge"
          printf '%s\n' 'audit-token' > "$tmp_home/.config/llmgateway-devpass-bridge/token"
          chmod 600 "$tmp_home/.config/llmgateway-devpass-bridge/token"
          port=39219

          HOME="$tmp_home" LUD_MANAGER_PORT="$port" node /tmp/bridge-manager.cjs >/tmp/manager-audit.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$tmp_home"
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if grep -q "127.0.0.1:$port" /tmp/manager-audit.log 2>/dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "manager exited before request"
              cat /tmp/manager-audit.log
              exit 1
            fi
            sleep 0.1
          done

          set +e
          curl --path-as-is --silent --show-error --max-time 3 \
            -H 'X-Local-Bridge-Key: audit-token' \
            -o /tmp/manager-body -w '%{http_code}' \
            "http://127.0.0.1:$port//" >/tmp/manager-code 2>/tmp/manager-curl-err
          curl_rc=$?
          set -e
          sleep 0.5

          code="$(cat /tmp/manager-code 2>/dev/null || true)"
          alive=no
          if kill -0 "$pid" 2>/dev/null; then alive=yes; fi
          echo "curl_rc=$curl_rc http_code=$code process_alive=$alive"
          echo "--- curl stderr ---"
          cat /tmp/manager-curl-err 2>/dev/null || true
          echo "--- response body ---"
          cat /tmp/manager-body 2>/dev/null || true
          echo
          echo "--- manager log ---"
          cat /tmp/manager-audit.log

          if [ "$curl_rc" -eq 0 ]; then
            echo "AUDIT_NOT_REPRODUCED: malformed route returned HTTP $code"
            exit 1
          fi
          if [ "$alive" = yes ]; then
            echo "AUDIT_NOT_REPRODUCED: manager remained alive"
            exit 1
          fi
          echo "AUDIT_REPRODUCED: malformed request URL escaped async manager callback and terminated process"
