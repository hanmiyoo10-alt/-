name: BaseCore v0.1 materialize source

on:
  push:
    branches:
      - basecore-v0.1
    paths:
      - 'plugins/basecore/.materialize/**'
      - 'scripts/basecore-materialize-v01.py'
      - '.github/workflows/basecore-materialize-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basecore-v01-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BaseCore feature branch
        uses: actions/checkout@v4
        with:
          ref: basecore-v0.1
          fetch-depth: 0

      - name: Materialize exact BaseCore runtime
        run: |
          set -euo pipefail
          python3 scripts/basecore-materialize-v01.py
          node --check plugins/basecore/latest.js
          node --check plugins/basecore/install.js
          cmp -s plugins/basecore/latest.js plugins/basecore/install.js
          grep -q '^//@name basecore$' plugins/basecore/latest.js
          grep -q '^//@version 0.1.0$' plugins/basecore/latest.js
          grep -q '<BASECORE_SWITCH>' plugins/basecore/latest.js
          grep -q 'basecore:state:' plugins/basecore/latest.js
          grep -q '\$basecore_state' plugins/basecore/latest.js
          if grep -Eq 'sim:core:|\$simcore_core_|<SIMCORE_CORE_SWITCH>|SimCore\.require|const SimCore' plugins/basecore/latest.js; then
            echo 'SimCore runtime namespace leaked into BaseCore' >&2
            exit 1
          fi
          git diff --check

      - name: Commit materialized runtime and remove staging payload
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/basecore/latest.js plugins/basecore/install.js
          git rm -r plugins/basecore/.materialize scripts/basecore-materialize-v01.py
          git commit -m 'feat: materialize BaseCore v0.1 runtime'
          git push origin HEAD:basecore-v0.1
