name: Build SimCore update artifact

on:
  push:
    paths:
      - 'plugins/simcore/build.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild JavaScript artifact
        shell: bash
        run: |
          set -euo pipefail
          cat plugins/simcore/.parts/part-00.b64 plugins/simcore/.parts/part-01.b64 | base64 -d | gzip -dc > plugins/simcore/latest.js
          cp plugins/simcore/latest.js plugins/simcore/install.js
          node --check plugins/simcore/latest.js
          grep -m1 '^//@version ' plugins/simcore/latest.js
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish SimCore v0.62.14 update channel'
          git push
