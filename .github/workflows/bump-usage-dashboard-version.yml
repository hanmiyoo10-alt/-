name: Bump usage dashboard updater version

on:
  push:
    paths:
      - '.github/workflows/bump-usage-dashboard-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump alpha.3.2 to alpha.3.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugins/usage-dashboard/latest.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('3.0.0-alpha.3.2', '3.0.0-alpha.3.3')
          if s2 == s:
              raise SystemExit('expected alpha.3.2 version marker not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit version-only updater test
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'test: bump usage dashboard updater to alpha.3.3'
          git push
