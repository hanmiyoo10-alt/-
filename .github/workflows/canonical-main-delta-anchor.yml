name: Canonical Main Delta Anchor

on:
  workflow_dispatch:
    inputs:
      anchor_issue:
        description: Issue number owning the canonical-main last-seen anchor
        required: true
        default: '562'
      expected_anchor:
        description: Exact anchor SHA currently expected in the issue marker
        required: true
      target_main:
        description: Exact main SHA that was explicitly briefed
        required: true
      reason:
        description: Stable uppercase reason code for the advancement
        required: true
        default: EXPLICIT_BRIEF_DELIVERED

permissions:
  contents: read
  issues: write

concurrency:
  group: canonical-main-delta-anchor
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted canonical main controller
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Advance issue-backed last-seen anchor
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node .github/plugin-control-plane/canonical-main/main-delta-anchor.cjs advance \
            --issue '${{ inputs.anchor_issue }}' \
            --expected-anchor '${{ inputs.expected_anchor }}' \
            --target-main '${{ inputs.target_main }}' \
            --reason '${{ inputs.reason }}'
