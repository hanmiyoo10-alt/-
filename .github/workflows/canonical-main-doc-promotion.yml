name: Canonical Main Documentation Promotion

on:
  workflow_run:
    workflows: [Canonical Main Documentation Stream]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: canonical-main-documentation-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOC_BRANCH: automation/canonical-main-docs
      DOC_FILES: docs/REPO_DECISION_LOG.md docs/REPO_CHANGELOG.md docs/REPO_ARCHITECTURE_SNAPSHOT.md docs/REPO_PROJECT_CATALOG.md
      HANDOFF_ISSUE: '457'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render stable durable documentation
        id: render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          node .github/plugin-control-plane/canonical-main/documentation-stream/promote.cjs
          if [[ -z "$(git status --porcelain -- $DOC_FILES)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CANONICAL_MAIN_DOC_PROMOTION:NOOP"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          tar -czf /tmp/canonical-main-docs.tgz $DOC_FILES
          git reset --hard HEAD
          git clean -fd -- $DOC_FILES
      - name: Publish generated branch or hand off PR creation
        if: steps.render.outputs.changed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ steps.render.outputs.base_sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT_MAIN" != "$BASE_SHA" ]]; then
            cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: STALE_BEFORE_PUBLISH**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Current main SHA: $CURRENT_MAIN
          - Head SHA: none
          - PR: none
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Merge rule: exact generated head + required CI PASS + unchanged exact base
          - Direct generated-doc writes to main: forbidden
          EOF
            gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
            echo "CANONICAL_MAIN_DOC_PROMOTION:STALE_BEFORE_PUBLISH:$BASE_SHA:$CURRENT_MAIN"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "handoff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$DOC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DOC_BRANCH"
            git checkout -B "$DOC_BRANCH" "origin/$DOC_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$DOC_BRANCH" origin/main
          fi

          tar -xzf /tmp/canonical-main-docs.tgz
          git add $DOC_FILES
          if ! git diff --cached --quiet; then
            git commit -m 'docs(repo): promote canonical documentation [repo-docs-generated]'
          fi
          git push origin "HEAD:$DOC_BRANCH"

          HEAD_SHA="$(git rev-parse HEAD)"
          PR="$(gh pr list --head "$DOC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR" ]]; then
            cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: PENDING**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Head SHA: $HEAD_SHA
          - PR: none
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Bridge authority: connected ChatGPT GitHub connector
          - Merge rule: exact generated head + required CI PASS + unchanged exact base
          - Direct generated-doc writes to main: forbidden
          EOF
            gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            echo "CANONICAL_MAIN_DOC_PROMOTION:HANDOFF:#$HANDOFF_ISSUE:$BASE_SHA:$HEAD_SHA"
            exit 0
          fi

          cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: PR_OPEN**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Head SHA: $HEAD_SHA
          - PR: #$PR
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Merge rule: exact generated head + required CI PASS + unchanged exact base
          - Direct generated-doc writes to main: forbidden
          EOF
          gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "handoff=false" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_MAIN_DOC_PROMOTION:PR:#$PR:$HEAD_SHA"
      - name: Activate exact native PR checks
        if: steps.publish.outputs.published == 'true'
        id: native_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ steps.publish.outputs.head_sha }}'
          PR='${{ steps.publish.outputs.pr }}'
          API_VERSION='2026-03-10'
          PLUGIN_NATIVE_RUN_ID=''
          SIMCORE_NATIVE_RUN_ID=''

          write_native_handoff() {
            local state="$1"
            local reason="$2"
            cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: $state**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: ${{ steps.render.outputs.base_sha }}
          - Head SHA: $HEAD_SHA
          - PR: #$PR
          - Plugin Control Plane native PR run: ${PLUGIN_NATIVE_RUN_ID:-unknown}
          - SimCore native PR run: ${SIMCORE_NATIVE_RUN_ID:-unknown}
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Native PR activation reason: $reason
          - Native PR rule: exact PR + exact head + pull_request event + expected workflow identity; action_required may be approved once for the exact run
          - Close/reopen fallback: forbidden
          - Workflow-dispatch substitution for native Required: forbidden
          - Direct generated-doc writes to main: forbidden
          EOF
            gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
          }

          block_native() {
            local state="$1"
            local reason="$2"
            write_native_handoff "$state" "$reason"
            {
              echo "ready=false"
              echo "plugin_native_run_id=${PLUGIN_NATIVE_RUN_ID:-}"
              echo "simcore_native_run_id=${SIMCORE_NATIVE_RUN_ID:-}"
            } >> "$GITHUB_OUTPUT"
            echo "CANONICAL_MAIN_DOC_PROMOTION:NATIVE_PR_BLOCKED:$state:$reason:#$PR:$HEAD_SHA:${PLUGIN_NATIVE_RUN_ID:-unknown}:${SIMCORE_NATIVE_RUN_ID:-unknown}"
            exit 0
          }

          PR_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          PR_STATE="$(jq -er '.state' <<<"$PR_JSON")"
          PR_BASE_REF="$(jq -er '.base.ref' <<<"$PR_JSON")"
          PR_HEAD_REF="$(jq -er '.head.ref' <<<"$PR_JSON")"
          PR_HEAD_SHA="$(jq -er '.head.sha' <<<"$PR_JSON")"
          if [[ "$PR_STATE" != 'open' || "$PR_BASE_REF" != 'main' || "$PR_HEAD_REF" != "$DOC_BRANCH" || "$PR_HEAD_SHA" != "$HEAD_SHA" ]]; then
            block_native NATIVE_PR_CHECK_UNKNOWN PR_IDENTITY_MISMATCH
          fi

          ASSOCIATED_PRS="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")"
          OPEN_ASSOCIATED="$(jq -c \
            --arg head "$HEAD_SHA" \
            --arg branch "$DOC_BRANCH" \
            '[.[] | select(.state == "open" and .base.ref == "main" and .head.ref == $branch and .head.sha == $head) | .number]' \
            <<<"$ASSOCIATED_PRS")"
          if [[ "$(jq -r 'length' <<<"$OPEN_ASSOCIATED")" != '1' || "$(jq -r '.[0]' <<<"$OPEN_ASSOCIATED")" != "$PR" ]]; then
            block_native NATIVE_PR_CHECK_UNKNOWN PR_ASSOCIATION_AMBIGUOUS
          fi

          discover_native_run() {
            local workflow="$1"
            local expected_path=".github/workflows/$workflow"
            local response matches count
            if ! response="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f event=pull_request \
              -f head_sha="$HEAD_SHA" \
              -f per_page=100)"; then
              printf 'unknown\n'
              return 0
            fi
            matches="$(jq -c \
              --arg head "$HEAD_SHA" \
              --arg branch "$DOC_BRANCH" \
              --arg path "$expected_path" \
              '[.workflow_runs[] | select(.event == "pull_request" and .head_sha == $head and .head_branch == $branch and .path == $path) | .id]' \
              <<<"$response")"
            count="$(jq -r 'length' <<<"$matches")"
            if [[ "$count" != '1' ]]; then
              printf 'ambiguous:%s\n' "$count"
              return 0
            fi
            jq -r '.[0]' <<<"$matches"
          }

          PLUGIN_NATIVE_RUN_ID="$(discover_native_run plugin-control-plane-ci.yml)"
          SIMCORE_NATIVE_RUN_ID="$(discover_native_run simcore-ci.yml)"
          [[ "$PLUGIN_NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || block_native NATIVE_PR_CHECK_UNKNOWN PLUGIN_RUN_DISCOVERY_AMBIGUOUS
          [[ "$SIMCORE_NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || block_native NATIVE_PR_CHECK_UNKNOWN SIMCORE_RUN_DISCOVERY_AMBIGUOUS

          prepare_native_run() {
            local run_id="$1"
            local expected_path="$2"
            local label="$3"
            local metadata event head_sha head_branch path status conclusion
            metadata="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            event="$(jq -er '.event' <<<"$metadata")"
            head_sha="$(jq -er '.head_sha' <<<"$metadata")"
            head_branch="$(jq -er '.head_branch' <<<"$metadata")"
            path="$(jq -er '.path' <<<"$metadata")"
            status="$(jq -er '.status' <<<"$metadata")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$metadata")"

            [[ "$event" == 'pull_request' && "$head_sha" == "$HEAD_SHA" && "$head_branch" == "$DOC_BRANCH" && "$path" == "$expected_path" ]] || return 20

            if [[ "$status" == 'completed' && "$conclusion" == 'success' ]]; then
              return 0
            fi

            if [[ "$status" == 'completed' && "$conclusion" == 'action_required' ]]; then
              if ! gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H "X-GitHub-Api-Version: $API_VERSION" \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" \
                >/tmp/doc-promotion-native-approve-"$run_id".out 2>/tmp/doc-promotion-native-approve-"$run_id".err; then
                return 30
              fi
              echo "CANONICAL_MAIN_DOC_PROMOTION:NATIVE_PR_APPROVED:$label:$run_id:$HEAD_SHA"
            elif [[ "$status" =~ ^(queued|in_progress|requested|waiting|pending)$ ]]; then
              echo "CANONICAL_MAIN_DOC_PROMOTION:NATIVE_PR_WAIT_EXISTING:$label:$run_id:$status"
            else
              return 40
            fi

            if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
              return 40
            fi

            metadata="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            [[ "$(jq -er '.event' <<<"$metadata")" == 'pull_request' ]] || return 20
            [[ "$(jq -er '.head_sha' <<<"$metadata")" == "$HEAD_SHA" ]] || return 20
            [[ "$(jq -er '.head_branch' <<<"$metadata")" == "$DOC_BRANCH" ]] || return 20
            [[ "$(jq -er '.path' <<<"$metadata")" == "$expected_path" ]] || return 20
            [[ "$(jq -er '.status' <<<"$metadata")" == 'completed' ]] || return 40
            [[ "$(jq -er '.conclusion' <<<"$metadata")" == 'success' ]] || return 40
          }

          if prepare_native_run "$PLUGIN_NATIVE_RUN_ID" '.github/workflows/plugin-control-plane-ci.yml' plugin-control-plane; then
            :
          else
            rc=$?
            if [[ "$rc" == '30' ]]; then
              block_native NATIVE_PR_APPROVAL_BLOCKED PLUGIN_APPROVAL_FORBIDDEN
            fi
            block_native NATIVE_PR_CHECK_UNKNOWN "PLUGIN_NATIVE_RUN_INVALID_$rc"
          fi
          if prepare_native_run "$SIMCORE_NATIVE_RUN_ID" '.github/workflows/simcore-ci.yml' simcore; then
            :
          else
            rc=$?
            if [[ "$rc" == '30' ]]; then
              block_native NATIVE_PR_APPROVAL_BLOCKED SIMCORE_APPROVAL_FORBIDDEN
            fi
            block_native NATIVE_PR_CHECK_UNKNOWN "SIMCORE_NATIVE_RUN_INVALID_$rc"
          fi

          PLUGIN_JOBS="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PLUGIN_NATIVE_RUN_ID/jobs" \
            -f filter=latest)"
          SIMCORE_JOBS="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SIMCORE_NATIVE_RUN_ID/jobs" \
            -f filter=latest)"
          jq -e '[.jobs[] | select(.name == "contract" and .status == "completed" and .conclusion == "success")] | length == 1' <<<"$PLUGIN_JOBS" >/dev/null \
            || block_native NATIVE_PR_CHECK_UNKNOWN PLUGIN_CONTRACT_NOT_PROVEN
          jq -e '[.jobs[] | select(.name == "Verify" and .status == "completed" and .conclusion == "success")] | length == 1' <<<"$SIMCORE_JOBS" >/dev/null \
            || block_native NATIVE_PR_CHECK_UNKNOWN SIMCORE_VERIFY_NOT_PROVEN
          jq -e '[.jobs[] | select(.name == "Required" and .status == "completed" and .conclusion == "success")] | length == 1' <<<"$SIMCORE_JOBS" >/dev/null \
            || block_native NATIVE_PR_CHECK_UNKNOWN SIMCORE_REQUIRED_NOT_PROVEN

          {
            echo "plugin_native_run_id=$PLUGIN_NATIVE_RUN_ID"
            echo "simcore_native_run_id=$SIMCORE_NATIVE_RUN_ID"
            echo "ready=true"
          } >> "$GITHUB_OUTPUT"
          echo "CANONICAL_MAIN_DOC_PROMOTION:NATIVE_PR_PASS:#$PR:$HEAD_SHA:$PLUGIN_NATIVE_RUN_ID:$SIMCORE_NATIVE_RUN_ID"
      - name: Dispatch exact documentation candidate checks
        if: steps.publish.outputs.published == 'true' && steps.native_pr.outputs.ready == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ steps.publish.outputs.head_sha }}'
          API_VERSION='2026-03-10'

          dispatch_workflow() {
            local workflow="$1"
            local payload="$2"
            local response run_id
            response="$(gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --input - <<<"$payload")"
            run_id="$(jq -er '.workflow_run_id | numbers | tostring' <<<"$response")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid workflow_run_id for $workflow" >&2; exit 1; }
            printf '%s\n' "$run_id"
          }

          PLUGIN_PAYLOAD="$(jq -nc --arg ref "$DOC_BRANCH" '{ref:$ref}')"
          PLUGIN_RUN_ID="$(dispatch_workflow plugin-control-plane-ci.yml "$PLUGIN_PAYLOAD")"

          SIMCORE_PAYLOAD="$(jq -nc --arg ref "$DOC_BRANCH" '{ref:$ref,inputs:{profile:"MAIN_HEALTH"}}')"
          SIMCORE_RUN_ID="$(dispatch_workflow simcore-ci.yml "$SIMCORE_PAYLOAD")"

          echo "plugin_run_id=$PLUGIN_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "simcore_run_id=$SIMCORE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_MAIN_DOC_PROMOTION:CHECKS_DISPATCHED:$HEAD_SHA:$PLUGIN_RUN_ID:$SIMCORE_RUN_ID"
      - name: Wait for exact candidate checks
        if: steps.publish.outputs.published == 'true' && steps.native_pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ steps.publish.outputs.head_sha }}'
          PLUGIN_RUN_ID='${{ steps.dispatch.outputs.plugin_run_id }}'
          SIMCORE_RUN_ID='${{ steps.dispatch.outputs.simcore_run_id }}'
          API_VERSION='2026-03-10'

          verify_exact_run() {
            local run_id="$1"
            local label="$2"
            local metadata event head_sha
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Missing or invalid $label run id: $run_id" >&2; exit 1; }
            metadata="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            event="$(jq -er '.event' <<<"$metadata")"
            head_sha="$(jq -er '.head_sha' <<<"$metadata")"
            [[ "$event" == 'workflow_dispatch' ]] || { echo "$label run $run_id event mismatch: $event" >&2; exit 1; }
            [[ "$head_sha" == "$HEAD_SHA" ]] || { echo "$label run $run_id head mismatch: $head_sha != $HEAD_SHA" >&2; exit 1; }
            echo "CANONICAL_MAIN_DOC_PROMOTION:EXACT_RUN_VERIFIED:$label:$run_id:$head_sha"
          }

          verify_exact_run "$PLUGIN_RUN_ID" plugin-control-plane
          verify_exact_run "$SIMCORE_RUN_ID" simcore
          gh run watch "$PLUGIN_RUN_ID" --exit-status
          gh run watch "$SIMCORE_RUN_ID" --exit-status
          echo "CANONICAL_MAIN_DOC_PROMOTION:CHECKS_PASS:$HEAD_SHA:$PLUGIN_RUN_ID:$SIMCORE_RUN_ID"
      - name: Exact-base / exact-head merge handoff
        if: steps.publish.outputs.published == 'true' && steps.native_pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ steps.render.outputs.base_sha }}'
          HEAD_SHA='${{ steps.publish.outputs.head_sha }}'
          PR='${{ steps.publish.outputs.pr }}'
          PLUGIN_NATIVE_RUN_ID='${{ steps.native_pr.outputs.plugin_native_run_id }}'
          SIMCORE_NATIVE_RUN_ID='${{ steps.native_pr.outputs.simcore_native_run_id }}'
          PLUGIN_RUN_ID='${{ steps.dispatch.outputs.plugin_run_id }}'
          SIMCORE_RUN_ID='${{ steps.dispatch.outputs.simcore_run_id }}'
          API_VERSION='2026-03-10'
          MATCH_HEAD_TOKEN="$(printf '%b--match-head-commit %s%b' '\x60' "$HEAD_SHA" '\x60')"

          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT_MAIN" != "$BASE_SHA" ]]; then
            cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: STALE_MAIN**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Current main SHA: $CURRENT_MAIN
          - Head SHA: $HEAD_SHA
          - PR: #$PR
          - Plugin Control Plane run: $PLUGIN_RUN_ID
          - SimCore run: $SIMCORE_RUN_ID
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Merge rule: fresh current main must equal the exact recorded base before bridge merge
          - Direct generated-doc writes to main: forbidden
          EOF
            gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
            echo "CANONICAL_MAIN_DOC_PROMOTION:STALE_MAIN_SKIP:$BASE_SHA:$CURRENT_MAIN"
            exit 0
          fi

          PR_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          PR_STATE="$(jq -er '.state' <<<"$PR_JSON")"
          PR_DRAFT="$(jq -er 'if (.draft | type) == "boolean" then (.draft | tostring) else error("draft must be boolean") end' <<<"$PR_JSON")"
          PR_BASE_REF="$(jq -er '.base.ref' <<<"$PR_JSON")"
          PR_BASE_SHA="$(jq -er '.base.sha' <<<"$PR_JSON")"
          PR_HEAD="$(jq -er '.head.sha' <<<"$PR_JSON")"

          if [[ "$PR_STATE" != 'open' || "$PR_DRAFT" != 'false' || "$PR_BASE_REF" != 'main' || "$PR_BASE_SHA" != "$BASE_SHA" || "$PR_HEAD" != "$HEAD_SHA" ]]; then
            cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: STALE_PR**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Current main SHA: $CURRENT_MAIN
          - Head SHA: $HEAD_SHA
          - PR: #$PR
          - Observed PR state: $PR_STATE
          - Observed PR draft: $PR_DRAFT
          - Observed PR base ref: $PR_BASE_REF
          - Observed PR base SHA: $PR_BASE_SHA
          - Observed PR head SHA: $PR_HEAD
          - Plugin Control Plane run: $PLUGIN_RUN_ID
          - SimCore run: $SIMCORE_RUN_ID
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Merge rule: exact generated head + exact base + successful bound check runs
          - Direct generated-doc writes to main: forbidden
          EOF
            gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
            echo "CANONICAL_MAIN_DOC_PROMOTION:STALE_PR_SKIP:$PR:$BASE_SHA:$HEAD_SHA"
            exit 0
          fi

          cat > /tmp/doc-promotion-handoff.md <<EOF
          # Canonical Main — Documentation Promotion Bridge

          > Single mutable handoff mailbox between GitHub Actions durable-document rendering and the connected ChatGPT GitHub bridge.

          <!-- canonical-main-doc-promotion-handoff:v1 -->

          **State: MERGE_READY**

          - Repository: $GITHUB_REPOSITORY
          - Source branch: $DOC_BRANCH
          - Base SHA: $BASE_SHA
          - Head SHA: $HEAD_SHA
          - PR: #$PR
          - Plugin Control Plane native PR run: $PLUGIN_NATIVE_RUN_ID
          - SimCore native PR run: $SIMCORE_NATIVE_RUN_ID
          - Plugin Control Plane candidate run: $PLUGIN_RUN_ID
          - SimCore candidate run: $SIMCORE_RUN_ID
          - Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Bridge authority: connected ChatGPT GitHub connector
          - Bridge merge effect: squash + expected-head guard equivalent to $MATCH_HEAD_TOKEN
          - Merge rule: fresh current main == exact base; exact open non-draft PR head; exact successful bound check runs; expected-head guarded bridge merge
          - Direct generated-doc writes to main: forbidden
          - Candidate-head workflow_dispatch proof is not merged-main push proof
          EOF
          gh issue edit "$HANDOFF_ISSUE" --body-file /tmp/doc-promotion-handoff.md
          echo "CANONICAL_MAIN_DOC_PROMOTION:MERGE_READY:#$PR:$BASE_SHA:$HEAD_SHA:$PLUGIN_NATIVE_RUN_ID:$SIMCORE_NATIVE_RUN_ID:$PLUGIN_RUN_ID:$SIMCORE_RUN_ID"
