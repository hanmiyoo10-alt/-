name: Canonical Main Documentation Stream

on:
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened]
  branch_protection_rule:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canonical-main-documentation-stream
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.event_name != 'issues' || github.event.issue.number != 440 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record stable repository documentation event
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/documentation-stream/live.cjs
