name: Canonical Main Operations

on:
  workflow_call:
    inputs:
      coordination_work_issue:
        description: 'Required active Work Record issue for trusted Harness handoff'
        required: true
        type: string
  # Break-glass only. Steady-state operation is fully automatic through events + schedule.
  workflow_dispatch:
    inputs:
      coordination_work_issue:
        description: 'Optional active Work Record issue for Harness receipt-gated canary'
        required: false
        type: string
  # B6 live-proof issue edits remain available for bounded owner-only canaries.
  # The temporary pull_request proof transport was retired after live evidence was captured.
  issues:
    types: [edited]
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - SimCore CI
      - SimCore release state sync
      - SimCore R2.7 Durable Status Projection
      - SimCore R2.8 Human-Evidence Terminal Convergence
      - SimCore Generic Candidate Materialize
      - Usage Dashboard Project Memory
      - Canonical Main Protection Guard
      - Canonical Main Proof Bundle
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/canonical-main/**'
      - '.github/plugin-control-plane/registry.json'
      - '.github/workflows/canonical-main-ops.yml'
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/workflows/simcore-ci.yml'
      - '.github/workflows/simcore-release-state-sync.yml'
      - '.github/workflows/simcore-r2-7-status-projection.yml'
      - '.github/workflows/product-simcore-terminal-convergence-r2-8.yml'
      - '.github/workflows/product-simcore-candidate-materialize.yml'
      - '.github/workflows/usage-dashboard-project-memory.yml'
      - 'docs/*_GUIDELINES.md'
      - 'product-manifest.json'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: canonical-main-operations
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ inputs.coordination_work_issue != '' || github.event_name != 'issues' || (github.actor == github.repository_owner && contains(github.event.issue.body, '<!-- repository-harness-canary:v1 -->') && contains(github.event.issue.body, '<!-- repository-work-record:v1 -->')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Harness canary Work Record
        if: ${{ inputs.coordination_work_issue != '' || github.event_name == 'issues' }}
        env:
          CANARY_EVENT_NAME: ${{ github.event_name }}
          CANARY_DISPATCH_WORK_ISSUE: ${{ inputs.coordination_work_issue }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          let workIssue = '';
          if (process.env.CANARY_DISPATCH_WORK_ISSUE) {
            workIssue = String(process.env.CANARY_DISPATCH_WORK_ISSUE);
          } else if (process.env.CANARY_EVENT_NAME === 'issues') {
            workIssue = String(event.issue?.number ?? '');
          }
          if (!/^[1-9]\d*$/.test(workIssue)) {
            console.error('invalid canary Work Record issue number');
            process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `COORDINATION_WORK_ISSUE=${workIssue}\n`);
          NODE
      - name: Harness coordination receipt canary gate
        if: ${{ inputs.coordination_work_issue != '' || github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/plugin-control-plane/canonical-main/work-harness/mutation-gate.cjs \
            --work-issue "$COORDINATION_WORK_ISSUE"
      # Phase J compatibility names only: ops-controller.cjs refresh / protected-main-surface.cjs refresh / bootstrap-surface.cjs refresh
      - name: Refresh canonical-main modular operator snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/orchestrator/refresh.cjs refresh

  closure-bookkeeping:
    name: Deterministic Closure Bookkeeping
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Canonical Main Proof Bundle' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted current main bookkeeping owner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile deterministic issue-only packet closure
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
          PROOF_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          PROOF_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node .github/plugin-control-plane/canonical-main/orchestrator/closure-bookkeeping.cjs
