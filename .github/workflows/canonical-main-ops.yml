name: Canonical Main Operations

on:
  # Break-glass only. Steady-state operation is fully automatic through events + schedule.
  workflow_dispatch:
    inputs:
      coordination_work_issue:
        description: 'Optional active Work Record issue for Harness receipt-gated canary'
        required: false
        type: string
  # B6 live-proof bridges. Issue edits remain supported; owner-authored PR canaries provide
  # a repository-native event transport that can be exercised without user manual dispatch.
  issues:
    types: [edited]
  pull_request:
    types: [opened, edited, reopened]
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - SimCore CI
      - SimCore release state sync
      - SimCore Permanent Release
      - SimCore Generic Candidate Materialize
      - Usage Dashboard Project Memory
      - Canonical Main Protection Guard
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/canonical-main/**'
      - '.github/plugin-control-plane/registry.json'
      - '.github/workflows/canonical-main-ops.yml'
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/workflows/simcore-ci.yml'
      - '.github/workflows/simcore-release-state-sync.yml'
      - '.github/workflows/simcore-release-permanent.yml'
      - '.github/workflows/product-simcore-candidate-materialize.yml'
      - '.github/workflows/usage-dashboard-project-memory.yml'
      - 'docs/*_GUIDELINES.md'
      - 'product-manifest.json'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: canonical-main-operations
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ (github.event_name != 'issues' && github.event_name != 'pull_request') || (github.event_name == 'issues' && github.actor == github.repository_owner && contains(github.event.issue.body, '<!-- repository-harness-canary:v1 -->') && contains(github.event.issue.body, '<!-- repository-work-record:v1 -->')) || (github.event_name == 'pull_request' && github.actor == github.repository_owner && contains(github.event.pull_request.body, '<!-- repository-harness-canary-pr:v1 -->') && contains(github.event.pull_request.body, '<!-- repository-harness-canary-work-issue:')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Harness canary Work Record
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.coordination_work_issue != '') || github.event_name == 'issues' || github.event_name == 'pull_request' }}
        env:
          CANARY_EVENT_NAME: ${{ github.event_name }}
          CANARY_DISPATCH_WORK_ISSUE: ${{ inputs.coordination_work_issue }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          let workIssue = '';
          if (process.env.CANARY_EVENT_NAME === 'issues') {
            workIssue = String(event.issue?.number ?? '');
          } else if (process.env.CANARY_EVENT_NAME === 'workflow_dispatch') {
            workIssue = String(process.env.CANARY_DISPATCH_WORK_ISSUE || '');
          } else if (process.env.CANARY_EVENT_NAME === 'pull_request') {
            const body = String(event.pull_request?.body || '');
            const matches = [...body.matchAll(/<!-- repository-harness-canary-work-issue:(\d+) -->/g)];
            if (matches.length !== 1) {
              console.error('expected exactly one repository-harness-canary-work-issue marker');
              process.exit(2);
            }
            workIssue = matches[0][1];
          }
          if (!/^[1-9]\d*$/.test(workIssue)) {
            console.error('invalid canary Work Record issue number');
            process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `COORDINATION_WORK_ISSUE=${workIssue}\n`);
          NODE
      - name: Harness coordination receipt canary gate
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.coordination_work_issue != '') || github.event_name == 'issues' || github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/plugin-control-plane/canonical-main/work-harness/mutation-gate.cjs \
            --work-issue "$COORDINATION_WORK_ISSUE"
      # Phase J compatibility names only: ops-controller.cjs refresh / protected-main-surface.cjs refresh / bootstrap-surface.cjs refresh
      - name: Refresh canonical-main modular operator snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/orchestrator/refresh.cjs refresh
