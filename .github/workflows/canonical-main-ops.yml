name: Canonical Main Operations

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/canonical-main/**'
      - '.github/plugin-control-plane/registry.json'
      - '.github/workflows/canonical-main-ops.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: canonical-main-operations
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh canonical-main operator surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/ops-controller.cjs refresh
