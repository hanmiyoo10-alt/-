name: Canonical Main Operations

on:
  # Break-glass only. Steady-state operation is fully automatic through events + schedule.
  workflow_dispatch:
    inputs:
      coordination_work_issue:
        description: 'Optional active Work Record issue for Harness receipt-gated canary'
        required: false
        type: string
  # Automated B6 live-proof bridge: owner-only exact command on an active Work Record.
  # Unrelated comments skip the writer job entirely.
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - SimCore CI
      - SimCore release state sync
      - SimCore Permanent Release
      - SimCore Generic Candidate Materialize
      - Usage Dashboard Project Memory
      - Canonical Main Protection Guard
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/canonical-main/**'
      - '.github/plugin-control-plane/registry.json'
      - '.github/workflows/canonical-main-ops.yml'
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/workflows/simcore-ci.yml'
      - '.github/workflows/simcore-release-state-sync.yml'
      - '.github/workflows/simcore-release-permanent.yml'
      - '.github/workflows/product-simcore-candidate-materialize.yml'
      - '.github/workflows/usage-dashboard-project-memory.yml'
      - 'docs/*_GUIDELINES.md'
      - 'product-manifest.json'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: canonical-main-operations
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'issue_comment' || (github.actor == github.repository_owner && github.event.issue.pull_request == null && github.event.comment.body == '/harness-canary') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harness coordination receipt canary gate
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.coordination_work_issue != '') || github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COORDINATION_WORK_ISSUE: ${{ github.event_name == 'issue_comment' && github.event.issue.number || inputs.coordination_work_issue }}
        run: |
          node .github/plugin-control-plane/canonical-main/work-harness/mutation-gate.cjs \
            --work-issue "$COORDINATION_WORK_ISSUE"
      # Phase J compatibility names only: ops-controller.cjs refresh / protected-main-surface.cjs refresh / bootstrap-surface.cjs refresh
      - name: Refresh canonical-main modular operator snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/orchestrator/refresh.cjs refresh
