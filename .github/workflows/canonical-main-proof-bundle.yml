name: Canonical Main Proof Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: canonical-main-proof-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compose:
    name: Compose Read-Only Proof Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Compose repository-authority proof bundle
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PROOF_BUNDLE_ATTEMPTS: '30'
          PROOF_BUNDLE_DELAY_MS: '5000'
        run: node .github/plugin-control-plane/canonical-main/orchestrator/proof-bundle.cjs compose

      - name: Render compact CI summary
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set +e
          mkdir -p .ci-summary
          python3 .github/tooling/ci-summary/adapters/canonical_main.py \
            --report .artifacts/canonical-main-proof-bundle.json \
            --output .ci-summary/adapter.json \
            --proof-outcome "$PROOF_OUTCOME" \
            --workflow 'Canonical Main Proof Bundle' \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA"
          adapter_code=$?
          python3 .github/tooling/ci-summary/render.py \
            --input .ci-summary/adapter.json \
            --json-out .ci-summary/summary.json \
            --text-out .ci-summary/inline.txt \
            --markdown-out .ci-summary/inline.md \
            --workflow 'Canonical Main Proof Bundle' \
            > /tmp/canonical-main-ci-summary-render.log
          render_code=$?

          if [[ -f .ci-summary/inline.txt ]]; then
            cat .ci-summary/inline.txt
          elif [[ -s /tmp/canonical-main-ci-summary-render.log ]]; then
            cat /tmp/canonical-main-ci-summary-render.log
          else
            printf '%s\n' \
              'CI_SUMMARY_V1_BEGIN' \
              'CI SUMMARY · Canonical Main Proof Bundle' \
              'Result: INFRA_ERROR' \
              'Reason codes:' \
              '- CI_SUMMARY_RENDER_CATASTROPHIC' \
              'Summary complete: false' \
              'CI_SUMMARY_V1_END'
          fi

          if [[ -f .ci-summary/inline.md ]]; then
            cat .ci-summary/inline.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'CI SUMMARY · Canonical Main Proof Bundle'
              echo 'Result: INFRA_ERROR'
              echo 'Reason codes: CI_SUMMARY_RENDER_CATASTROPHIC'
              echo 'Summary complete: false'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$adapter_code" -ne 0 || "$render_code" -ne 0 ]]; then
            echo "::warning::CI compact summary generation incomplete (adapter=$adapter_code renderer=$render_code); Canonical Main proof-bundle authority is unchanged."
          fi
          exit 0

      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-main-proof-bundle-${{ github.sha }}
          path: .artifacts/canonical-main-proof-bundle.json
          if-no-files-found: error
          retention-days: 14
