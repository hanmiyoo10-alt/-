name: Canonical Main Proof Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: canonical-main-proof-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compose:
    name: Compose Read-Only Proof Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Compose repository-authority proof bundle
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PROOF_BUNDLE_ATTEMPTS: '30'
          PROOF_BUNDLE_DELAY_MS: '5000'
        run: node .github/plugin-control-plane/canonical-main/orchestrator/proof-bundle.cjs compose

      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-main-proof-bundle-${{ github.sha }}
          path: .artifacts/canonical-main-proof-bundle.json
          if-no-files-found: error
          retention-days: 14
