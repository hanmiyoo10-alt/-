name: Canonical Main Protection Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/plugin-control-plane/canonical-main/protected-main.json'
      - '.github/plugin-control-plane/canonical-main/protection-activate.sh'
      - '.github/plugin-control-plane/canonical-main/required-guard.sh'
  workflow_run:
    workflows:
      - SimCore CI
    types: [requested, completed]

permissions:
  contents: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: canonical-main-protection-guard
  cancel-in-progress: false

jobs:
  activation-attempt:
    name: Attempt Native Protection
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main protection controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Classify successful result against current main
        id: target_currentness
        if: github.event_name == 'workflow_run'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          observed="$(git rev-parse origin/main)"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "observed_main_sha=$observed" >> "$GITHUB_OUTPUT"
          if [ "$observed" = "$TARGET_SHA" ]; then
            echo "disposition=CURRENT_MAIN" >> "$GITHUB_OUTPUT"
            echo "TARGET_DISPOSITION=CURRENT_MAIN expected=$TARGET_SHA observed=$observed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "disposition=SUPERSEDED_CURRENT_MAIN" >> "$GITHUB_OUTPUT"
            echo "TARGET_DISPOSITION=SUPERSEDED_CURRENT_MAIN expected=$TARGET_SHA observed=$observed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate native protection attempt
        id: attempt_gate
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           steps.target_currentness.outputs.disposition == 'CURRENT_MAIN')
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTION_ISSUE_NUMBER: '321'
          EXPLICIT_REARM: ${{ github.event_name == 'workflow_dispatch' }}
        run: node .github/plugin-control-plane/canonical-main/orchestrator/protection-attempt.cjs gate

      - name: Attempt GitHub-native main protection
        if: steps.attempt_gate.outputs.allow_attempt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTION_ISSUE_NUMBER: '321'
        run: bash .github/plugin-control-plane/canonical-main/protection-activate.sh

      - name: Refresh canonical-main governance read-back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run canonical-main-ops.yml --repo "$GITHUB_REPOSITORY" --ref main || true

  required-guard:
    name: Recover Failed Exact Main
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted current main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact Required job result
        id: required_result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          attempts=1
          if [ "$EVENT_ACTION" = requested ]; then attempts=24; fi
          for attempt in $(seq 1 "$attempts"); do
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
            count="$(jq '[.jobs[] | select(.name == "Required")] | length' <<<"$jobs")"
            if [ "$count" -gt 1 ]; then
              echo "REQUIRED_JOB_CARDINALITY_CONFLICT:$count" >&2
              exit 2
            fi
            if [ "$count" -eq 1 ]; then
              status="$(jq -r '[.jobs[] | select(.name == "Required")][0].status' <<<"$jobs")"
              conclusion="$(jq -r '[.jobs[] | select(.name == "Required")][0].conclusion // ""' <<<"$jobs")"
              if [ "$status" = completed ] && [ -n "$conclusion" ]; then
                if [ "$EVENT_ACTION" = requested ] && [ "$conclusion" != success ]; then
                  echo "disposition=FAILURE_DEFERRED" >> "$GITHUB_OUTPUT"
                else
                  echo "disposition=RESOLVED" >> "$GITHUB_OUTPUT"
                fi
                echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif [ "$EVENT_ACTION" = completed ]; then
              echo 'REQUIRED_JOB_MISSING_AFTER_WORKFLOW_COMPLETION' >&2
              exit 3
            fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          if [ "$EVENT_ACTION" = completed ]; then
            echo 'REQUIRED_JOB_NOT_TERMINAL_AFTER_WORKFLOW_COMPLETION' >&2
            exit 4
          fi
          echo "disposition=DEFERRED" >> "$GITHUB_OUTPUT"
          echo "conclusion=unknown" >> "$GITHUB_OUTPUT"

      - name: Enforce exact-main Required result
        if: steps.required_result.outputs.disposition == 'RESOLVED'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ steps.required_result.outputs.conclusion }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PROTECTION_ISSUE_NUMBER: '321'
        run: bash .github/plugin-control-plane/canonical-main/required-guard.sh

      - name: Refresh canonical-main after Required observation
        if: >-
          steps.required_result.outputs.disposition == 'RESOLVED' ||
          steps.required_result.outputs.disposition == 'FAILURE_DEFERRED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run canonical-main-ops.yml --repo "$GITHUB_REPOSITORY" --ref main || true
