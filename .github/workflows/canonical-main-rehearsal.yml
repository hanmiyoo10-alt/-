name: Canonical Main Incident Rehearsal

on:
  workflow_run:
    workflows:
      - Canonical Main Operations
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: canonical-main-incident-rehearsal-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[phase-h-rehearsal]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trusted main identity
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove canonical incident open dedupe recovery cycle
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/plugin-control-plane/canonical-main/rehearsal.cjs cycle
