name: Canonical Main Stage Checkpoint Publish

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: canonical-main-stage-checkpoint-publish-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'hanmiyoo10-alt/-' &&
      github.event.issue.number == 3469 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'hanmiyoo10-alt' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Publish bounded paired checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/plugin-control-plane/canonical-main/work-harness/stage-checkpoint-request.cjs