name: ChatGPT Android Toolchain Bridge

on:
  push:
    branches:
      - chatgpt/rust-toolchain-bridge-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Android SDK, platform tools, API 36, build tools, and NDK r30
        shell: bash
        run: |
          set -euo pipefail

          sdk="$GITHUB_WORKSPACE/android-sdk"
          mkdir -p "$sdk/cmdline-tools"

          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 \
            -o /tmp/cmdline-tools.zip \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip'
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$sdk/cmdline-tools/latest"

          export ANDROID_HOME="$sdk"
          export ANDROID_SDK_ROOT="$sdk"
          export PATH="$sdk/cmdline-tools/latest/bin:$sdk/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;30.0.16248370'

          adb version
          sdkmanager --version
          test -x "$sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

          {
            echo 'commandline-tools=15859902'
            echo 'platform=android-36'
            echo 'build-tools=36.0.0'
            echo 'ndk=30.0.16248370'
            adb version | head -n 2
            sdkmanager --version | head -n 1 | sed 's/^/sdkmanager=/'
          } > "$GITHUB_WORKSPACE/ANDROID_TOOLCHAIN_MANIFEST.txt"

          bundle="$GITHUB_WORKSPACE/android-sdk-api36-ndk-r30-linux-x86_64.tar.zst"
          tar -I 'zstd -T0 -6' -cf "$bundle" \
            -C "$sdk" cmdline-tools platform-tools platforms build-tools ndk licenses
          sha256sum "$bundle" > "$bundle.sha256"
          split -b 350M -d -a 2 "$bundle" "$GITHUB_WORKSPACE/android-sdk.part-"
          test -f "$GITHUB_WORKSPACE/android-sdk.part-00"
          test -f "$GITHUB_WORKSPACE/android-sdk.part-01"
          test -f "$GITHUB_WORKSPACE/android-sdk.part-02"
          rm -f "$bundle"

      - name: Upload Android toolchain part 00
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-sdk-part-00
          path: android-sdk.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android toolchain part 01
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-sdk-part-01
          path: android-sdk.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android toolchain part 02
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-sdk-part-02
          path: android-sdk.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android toolchain metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-sdk-metadata
          path: |
            android-sdk-api36-ndk-r30-linux-x86_64.tar.zst.sha256
            ANDROID_TOOLCHAIN_MANIFEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
