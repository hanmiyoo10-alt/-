name: Fortune Golf APK

on:
  push:
    branches: [fortune-golf-apk]
    paths:
      - '.github/workflows/fortune-golf-apk.yml'
      - 'fortune-golf-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune-golf-apk
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned WIE emulator
        uses: actions/checkout@v4
        with:
          repository: dlunch/wie
          ref: 1ed8710956e727629e67db762ddc1e6bd6151a1f
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,tauri-cli

      - name: Select Android NDK
        run: |
          ndk_path=${ANDROID_NDK_LATEST_HOME:-$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)}
          test -d "$ndk_path"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_path" >> "$GITHUB_ENV"

      - name: Build bundled emulator frontend
        run: |
          npm ci
          npm run build:prod

      - name: Initialize Android app
        working-directory: wie-app
        run: |
          cargo tauri android init --ci
          cargo tauri icon ../wie-web/src/assets/favicon.png

      - name: Build installable debug APK
        working-directory: wie-app
        run: cargo tauri android build --debug --target aarch64 --apk --ci --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect APK and provenance
        run: |
          mkdir -p apk-output
          apk_path=$(find wie-app/gen/android/app/build/outputs/apk -name '*-debug.apk' -type f -print -quit)
          test -n "$apk_path"
          cp "$apk_path" apk-output/fortune-golf-emulator-debug.apk
          cp LICENSE apk-output/WIE-LICENSE.txt
          echo 'WIE source: https://github.com/dlunch/wie/commit/1ed8710956e727629e67db762ddc1e6bd6151a1f' > apk-output/BUILD.txt
          echo 'No game ROMs included. Fortune Golf compatibility is unverified.' >> apk-output/BUILD.txt
          sha256sum apk-output/fortune-golf-emulator-debug.apk >> apk-output/BUILD.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortune-golf-emulator-apk
          path: apk-output/
          if-no-files-found: error
