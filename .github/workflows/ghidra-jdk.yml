name: Portable JDK for Ghidra
on:
  push:
    branches: [fortune-golf-apk]
    paths: ['.github/workflows/ghidra-jdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package actual JDK files
        run: |
          mkdir -p output
          tar -czf output/jdk.tar.gz -C "$JAVA_HOME" .
          sha256sum output/jdk.tar.gz > output/jdk-sha256.txt
          split -b 64M -d output/jdk.tar.gz output/jdk.part
      - uses: actions/upload-artifact@v4
        with:
          name: jdk-chunk00
          path: output/jdk.part00
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jdk-chunk01
          path: output/jdk.part01
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jdk-chunk02
          path: output/jdk.part02
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jdk-chunk03
          path: output/jdk.part03
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jdk-sha256
          path: output/jdk-sha256.txt
