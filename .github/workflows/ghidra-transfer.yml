name: Transfer verified Ghidra environment
on:
  push:
    branches: [fortune-golf-apk]
    paths: ['.github/workflows/ghidra-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghidra-linux-x64-environment
          run-id: 34139251875
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: environment
      - name: Split verified archive
        run: |
          split -b 64M -d environment/ghidra-linux-x64.tar.gz environment/ghidra.part
          sha256sum environment/ghidra-linux-x64.tar.gz environment/ghidra.part* > environment/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk00
          path: environment/ghidra.part00
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk01
          path: environment/ghidra.part01
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk02
          path: environment/ghidra.part02
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk03
          path: environment/ghidra.part03
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk04
          path: environment/ghidra.part04
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk05
          path: environment/ghidra.part05
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk06
          path: environment/ghidra.part06
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk07
          path: environment/ghidra.part07
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-chunk08
          path: environment/ghidra.part08
          compression-level: 0
