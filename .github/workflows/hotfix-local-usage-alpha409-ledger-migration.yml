name: Finalize Local Usage Dashboard alpha.4.9 ledger fidelity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-local-usage-alpha409-ledger-migration.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate persisted ledger precision and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/usage-dashboard/src/10-usage-data.part.js')
          s = p.read_text()
          old = "      byKey.set(requestLedgerKey(row), {...row, scopes:Array.isArray(row.scopes) ? row.scopes : ['all']});"
          new = "      byKey.set(requestLedgerKey(row), {...row, timestampPrecision:String(row.timestampPrecision && row.timestampPrecision !== 'unknown' ? row.timestampPrecision : requestTimestampPrecision(row.timestamp, row.timestampSource, row.requestNumber)), scopes:Array.isArray(row.scopes) ? row.scopes : ['all']});"
          if s.count(old) != 1: raise SystemExit('persisted ledger migration marker mismatch')
          s = s.replace(old, new, 1)
          old = "    const exact = list.filter(row => row?.timestampPrecision === 'exact').length;\n    const bucket = list.filter(row => row?.timestampPrecision === 'hour' || row?.timestampPrecision === 'hour-estimated').length;"
          new = "    const precisionOf = row => row?.timestampPrecision && row.timestampPrecision !== 'unknown' ? row.timestampPrecision : requestTimestampPrecision(row?.timestamp, row?.timestampSource, row?.requestNumber);\n    const exact = list.filter(row => precisionOf(row) === 'exact').length;\n    const bucket = list.filter(row => ['hour','hour-estimated'].includes(precisionOf(row))).length;"
          if s.count(old) != 1: raise SystemExit('capability migration marker mismatch')
          s = s.replace(old, new, 1)
          old = "    if (row?.timestampPrecision === 'hour' || row?.timestampPrecision === 'hour-estimated') return `${requestHourLabel(requestHourKey(timestamp))} 버킷 · 정확 시각 미제공`;"
          new = "    const precision = row?.timestampPrecision && row.timestampPrecision !== 'unknown' ? row.timestampPrecision : requestTimestampPrecision(timestamp, row?.timestampSource, row?.requestNumber);\n    if (precision === 'hour' || precision === 'hour-estimated') return `${requestHourLabel(requestHourKey(timestamp))} 버킷 · 정확 시각 미제공`;"
          if s.count(old) != 1: raise SystemExit('request time migration marker mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          grep -Fq '//@version 3.0.0-alpha.4.9' plugins/usage-dashboard/latest.js
          grep -Fq "timestampPrecision:String(row.timestampPrecision && row.timestampPrecision !== 'unknown'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
      - name: Commit finalized 4.9 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src
          git commit -m 'fix: migrate persisted request ledger fidelity in alpha.4.9'
          git push origin HEAD:main
      - name: Publish finalized 4.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          git add plugins/usage-dashboard/latest.js
          git diff --cached --quiet && exit 0
          git commit -m 'release: finalize Local Usage Dashboard 3.0.0-alpha.4.9'
          git push origin HEAD:release-usage-dashboard
