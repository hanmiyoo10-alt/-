name: Hotfix Local Usage Manager Fast Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-local-usage-manager-fast-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-local-usage-manager-fast-probe
  cancel-in-progress: false

jobs:
  patch-validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Bridge Manager 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          manager_path = Path('plugins/usage-dashboard/runtime/bridge-manager.cjs')
          test_path = Path('plugins/usage-dashboard/tests/p5-bridge-manager.cjs')
          manifest_path = Path('plugins/usage-dashboard/runtime/product-manifest.json')

          manager = manager_path.read_text()
          if "const MANAGER_VERSION = '1.1.2';" in manager:
              manager = manager.replace("const MANAGER_VERSION = '1.1.2';", "const MANAGER_VERSION = '1.1.3';", 1)

              old_probe = r'''async function bridgeSnapshot(timeoutMs = 2500) {
            const token = readToken();
            if (!token) throw new Error('bridge token missing');
            return new Promise((resolve, reject) => {
              const req = http.request({host:ENGINE_HOST,port:ENGINE_PORT,path:'/snapshot',method:'GET',headers:{Accept:'application/json','X-Local-Bridge-Key':token,'X-DevPass-Bridge-Key':token,'Cache-Control':'no-cache'}}, res => {
                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => {
                  const text = Buffer.concat(chunks).toString('utf8');
                  if (Number(res.statusCode) < 200 || Number(res.statusCode) >= 300) return reject(new Error(`bridge HTTP ${res.statusCode}`));
                  try { resolve(JSON.parse(text)); } catch (_) { reject(new Error('bridge JSON invalid')); }
                });
              });
              req.setTimeout(timeoutMs, () => req.destroy(new Error('bridge snapshot timeout')));
              req.on('error', reject); req.end();
            });
          }
          async function bridgeReachable(timeoutMs = 700) {
            try { await bridgeSnapshot(timeoutMs); return true; } catch (_) { return false; }
          }'''

              new_probe = r'''const BRIDGE_PROBE_PATH = '/__local_usage_runtime_probe__';
          async function bridgeAuthProbe(timeoutMs = 1500) {
            const token = readToken();
            if (!token) throw new Error('bridge token missing');
            return new Promise((resolve, reject) => {
              const chunks = [];
              let total = 0;
              const req = http.request({host:ENGINE_HOST,port:ENGINE_PORT,path:BRIDGE_PROBE_PATH,method:'GET',headers:{Accept:'application/json','X-Local-Bridge-Key':token,'X-DevPass-Bridge-Key':token,'Cache-Control':'no-cache'}}, res => {
                res.on('data', chunk => {
                  total += chunk.length;
                  if (total > 8192) return req.destroy(new Error('bridge auth probe response too large'));
                  chunks.push(chunk);
                });
                res.on('end', () => {
                  const statusCode = Number(res.statusCode);
                  const text = Buffer.concat(chunks).toString('utf8');
                  if (statusCode !== 404) return reject(new Error(`bridge auth probe HTTP ${statusCode}`));
                  let body;
                  try { body = JSON.parse(text); } catch (_) { return reject(new Error('bridge auth probe JSON invalid')); }
                  if (String(body?.error || '') !== 'Not found') return reject(new Error('bridge auth probe signature mismatch'));
                  resolve({ok:true,statusCode});
                });
              });
              req.setTimeout(timeoutMs, () => req.destroy(new Error('bridge auth probe timeout')));
              req.on('error', reject); req.end();
            });
          }
          async function bridgeHealth(timeoutMs = 1500) {
            return new Promise((resolve, reject) => {
              const chunks = [];
              let total = 0;
              const req = http.request({host:ENGINE_HOST,port:ENGINE_PORT,path:'/health',method:'GET',headers:{Accept:'application/json','Cache-Control':'no-cache'}}, res => {
                res.on('data', chunk => {
                  total += chunk.length;
                  if (total > 64 * 1024) return req.destroy(new Error('bridge health response too large'));
                  chunks.push(chunk);
                });
                res.on('end', () => {
                  const statusCode = Number(res.statusCode);
                  if (statusCode < 200 || statusCode >= 300) return reject(new Error(`bridge health HTTP ${statusCode}`));
                  let body;
                  try { body = JSON.parse(Buffer.concat(chunks).toString('utf8')); } catch (_) { return reject(new Error('bridge health JSON invalid')); }
                  if (body?.ok !== true || String(body?.status || '') !== 'healthy' || Number(body?.port) !== ENGINE_PORT) return reject(new Error('bridge health signature mismatch'));
                  resolve(body);
                });
              });
              req.setTimeout(timeoutMs, () => req.destroy(new Error('bridge health timeout')));
              req.on('error', reject); req.end();
            });
          }
          async function bridgeIdentity(timeoutMs = 1500) {
            const [probe, health] = await Promise.all([bridgeAuthProbe(timeoutMs), bridgeHealth(timeoutMs)]);
            return {ok:true,probe,health,bridgeVersion:String(health?.version || '')};
          }
          async function bridgeReachable(timeoutMs = 700) {
            return new Promise(resolve => {
              let settled = false;
              const finish = value => { if (!settled) { settled = true; resolve(value); } };
              const req = http.request({host:ENGINE_HOST,port:ENGINE_PORT,path:'/health',method:'GET',headers:{Connection:'close'}}, res => {
                res.resume();
                finish(true);
              });
              req.setTimeout(timeoutMs, () => req.destroy(new Error('bridge reachability timeout')));
              req.on('error', () => finish(false)); req.end();
            });
          }'''
              if old_probe not in manager:
                  raise SystemExit('old snapshot probe block not found')
              manager = manager.replace(old_probe, new_probe, 1)

              old_wait = r'''async function waitForManagedEngine(expected, timeoutMs = 12000) {
            const started = Date.now();
            let lastError = '';
            while (Date.now() - started < timeoutMs) {
              const service = serviceStatus();
              const pid = listenerPid(ENGINE_PORT);
              const processVerified = Boolean(service.running && service.pid && processMatchesSpec(service.pid, expected));
              if (service.running && service.pid && (pid === service.pid || (!pid && processVerified))) {
                try {
                  const snap = await bridgeSnapshot();
                  return {ok:true,service,pid:service.pid,snapshot:snap,ownership:pid === service.pid ? 'proc-net' : 'service-process'};
                } catch (e) { lastError = e?.message || String(e); }
              }
              await sleep(350);
            }
            return {ok:false,error:lastError || 'managed engine did not become healthy',service:serviceStatus(),pid:listenerPid(ENGINE_PORT)};
          }'''
              new_wait = r'''async function waitForManagedEngine(expected, timeoutMs = 12000) {
            const started = Date.now();
            let lastError = '';
            while (Date.now() - started < timeoutMs) {
              const service = serviceStatus();
              const pid = listenerPid(ENGINE_PORT);
              const processVerified = Boolean(service.running && service.pid && processMatchesSpec(service.pid, expected));
              if (service.running && service.pid && (pid === service.pid || (!pid && processVerified))) {
                try {
                  const identity = await bridgeIdentity();
                  return {ok:true,service,pid:service.pid,identity,bridgeVersion:identity.bridgeVersion,ownership:pid === service.pid ? 'proc-net' : 'service-process'};
                } catch (e) { lastError = e?.message || String(e); }
              }
              await sleep(350);
            }
            return {ok:false,error:lastError || 'managed engine did not become verified',service:serviceStatus(),pid:listenerPid(ENGINE_PORT)};
          }'''
              if old_wait not in manager:
                  raise SystemExit('old waitForManagedEngine block not found')
              manager = manager.replace(old_wait, new_wait, 1)

              old_status = r'''async function engineRuntimeStatus() {
            const descriptor = readDescriptor();
            const service = serviceStatus();
            const pid = listenerPid(ENGINE_PORT);
            let snapshot = null;
            try { snapshot = await bridgeSnapshot(1200); } catch (_) {}
            const processVerified = Boolean(descriptor && service.running && service.pid && processMatchesSpec(service.pid, descriptor));
            const managed = Boolean(descriptor && snapshot && service.running && service.pid && (pid === service.pid || (!pid && processVerified)));
            const candidate = managed ? {safe:true,reason:'managed-service'} : discoverEngineCandidate();
            const fallbackNeedsHealth = candidate?.reason === 'canonical-pidfile';
            const candidateSafe = typeof candidate?.safe === 'boolean' ? (candidate.safe && (!fallbackNeedsHealth || Boolean(snapshot))) : null;
            const candidateReason = fallbackNeedsHealth && !snapshot ? 'pidfile-health-unverified' : String(candidate?.reason || '');
            return {
              engineManaged:managed,
              engineMode:managed ? 'managed-adopted' : 'legacy-external',
              engineService:ENGINE_SERVICE,
              engineVersion:String(snapshot?.bridgeVersion || snapshot?.health?.bridgeVersion || ''),
              candidateSafe,
              candidateReason,
              adoptionState:managed ? 'adopted' : descriptor ? 'service-degraded' : 'pending'
            };
          }'''
              new_status = r'''async function engineRuntimeStatus() {
            const descriptor = readDescriptor();
            const service = serviceStatus();
            const pid = listenerPid(ENGINE_PORT);
            let identity = null;
            try { identity = await bridgeIdentity(1500); } catch (_) {}
            const processVerified = Boolean(descriptor && service.running && service.pid && processMatchesSpec(service.pid, descriptor));
            const managed = Boolean(descriptor && identity && service.running && service.pid && (pid === service.pid || (!pid && processVerified)));
            const candidate = managed ? {safe:true,reason:'managed-service'} : discoverEngineCandidate();
            const fallbackNeedsProbe = candidate?.reason === 'canonical-pidfile';
            const candidateSafe = typeof candidate?.safe === 'boolean' ? (candidate.safe && (!fallbackNeedsProbe || Boolean(identity))) : null;
            const candidateReason = fallbackNeedsProbe && !identity ? 'pidfile-auth-unverified' : String(candidate?.reason || '');
            return {
              engineManaged:managed,
              engineMode:managed ? 'managed-adopted' : 'legacy-external',
              engineService:ENGINE_SERVICE,
              engineVersion:String(identity?.bridgeVersion || ''),
              candidateSafe,
              candidateReason,
              adoptionState:managed ? 'adopted' : descriptor ? 'service-degraded' : 'pending'
            };
          }'''
              if old_status not in manager:
                  raise SystemExit('old engineRuntimeStatus block not found')
              manager = manager.replace(old_status, new_status, 1)

              manager = manager.replace("  try { await bridgeSnapshot(1200); }\n  catch (e) { return {ok:false,adopted:false,state:'bridge-unhealthy',candidateSafe:true,retryable:true,error:e?.message || String(e)}; }",
                                        "  try { await bridgeIdentity(1500); }\n  catch (e) { return {ok:false,adopted:false,state:'bridge-unhealthy',candidateSafe:true,retryable:true,error:e?.message || String(e)}; }", 1)
              manager = manager.replace("      sourceVersion:String(verified.snapshot?.bridgeVersion || '')",
                                        "      sourceVersion:String(verified.bridgeVersion || '')", 1)
              manager_path.write_text(manager)
          elif "const MANAGER_VERSION = '1.1.3';" not in manager:
              raise SystemExit('unexpected manager version')

          manager = manager_path.read_text()
          if "path:'/snapshot'" in manager or 'bridgeSnapshot(' in manager:
              raise SystemExit('heavy snapshot probe still present in manager lifecycle path')
          for marker in [
              "const MANAGER_VERSION = '1.1.3';",
              "const BRIDGE_PROBE_PATH = '/__local_usage_runtime_probe__';",
              'async function bridgeAuthProbe(timeoutMs = 1500)',
              'async function bridgeHealth(timeoutMs = 1500)',
              'async function bridgeIdentity(timeoutMs = 1500)',
              'async function bridgeReachable(timeoutMs = 700)',
              "process.kill(candidate.pid, 'SIGTERM')",
          ]:
              if marker not in manager:
                  raise SystemExit(f'missing manager marker: {marker}')

          test = test_path.read_text()
          test = test.replace('// Android proc-net fallback regression lock for Bridge Manager 1.1.2.', '// Android proc-net + fast authenticated lifecycle probe regression lock for Bridge Manager 1.1.3.')
          test = test.replace("assert.ok(manager.includes(\"const MANAGER_VERSION = '1.1.2';\"), 'manager hotfix version missing');", "assert.ok(manager.includes(\"const MANAGER_VERSION = '1.1.3';\"), 'manager hotfix version missing');")
          old_marker = "assert.ok(manager.includes('async function bridgeReachable(timeoutMs = 700)'), 'endpoint transition verifier missing');"
          new_marker = """assert.ok(manager.includes('async function bridgeReachable(timeoutMs = 700)'), 'endpoint transition verifier missing');
          assert.ok(manager.includes(\"const BRIDGE_PROBE_PATH = '/__local_usage_runtime_probe__';\"), 'fast authenticated bridge probe path missing');
          assert.ok(manager.includes('async function bridgeAuthProbe(timeoutMs = 1500)'), 'authenticated lifecycle probe missing');
          assert.ok(manager.includes('async function bridgeIdentity(timeoutMs = 1500)'), 'bridge identity verifier missing');
          assert.ok(!manager.includes(\"path:'/snapshot'\"), 'manager lifecycle verification must not call heavy snapshot');
          assert.ok(!manager.includes('bridgeSnapshot('), 'snapshot-based lifecycle verifier regressed');"""
          if old_marker in test:
              test = test.replace(old_marker, new_marker, 1)
          elif 'fast authenticated bridge probe path missing' not in test:
              raise SystemExit('bridge manager test marker insertion point missing')
          test_path.write_text(test)

          manifest = json.loads(manifest_path.read_text())
          manifest['components']['bridgeManager']['version'] = '1.1.3'
          manifest['components']['bridgeManager']['sha256'] = hashlib.sha256(manager_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          print('manager sha256', manifest['components']['bridgeManager']['sha256'])
          PY

      - name: Validate hotfix and full Usage suite
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          git diff --check

      - name: Commit hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/runtime/bridge-manager.cjs plugins/usage-dashboard/runtime/product-manifest.json plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use fast authenticated bridge lifecycle probe'
            git push origin HEAD:main
          else
            echo 'main already contains Manager 1.1.3 hotfix'
          fi

      - name: Publish runtime hotfix to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq "const MANAGER_VERSION = '1.1.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"version": "1.1.3"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release runtime already contains Manager 1.1.3'
            exit 0
          fi
          git commit -m 'release: publish Bridge Manager 1.1.3 fast probe hotfix'
          git push origin HEAD:release-usage-dashboard
