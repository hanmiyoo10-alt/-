name: Apply usage dashboard drag hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-usage-drag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch latest.js
        run: python3 .github/scripts/patch_usage_drag.py
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restrict dashboard drag to handle'
          git push
