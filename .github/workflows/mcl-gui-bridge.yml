name: MCL GUI Bridge

on:
  pull_request:
    paths:
      - 'products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/**'
      - 'products/chatgpt-mobile-coder-lab/docs/device-routing.md'
      - 'products/chatgpt-mobile-coder-lab/docs/decisions.md'
      - '.github/workflows/mcl-gui-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/**'
      - 'products/chatgpt-mobile-coder-lab/docs/device-routing.md'
      - 'products/chatgpt-mobile-coder-lab/docs/decisions.md'
      - '.github/workflows/mcl-gui-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '8.9'
      - name: Python CLI and contract tests
        run: python3 -m unittest discover -s products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/tests -v
      - name: Android JVM unit tests
        run: gradle -p products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/android-companion :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle -p products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/android-companion :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcl-gui-bridge-debug-apk
          path: products/chatgpt-mobile-coder-lab/device-ops/gui-bridge/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
