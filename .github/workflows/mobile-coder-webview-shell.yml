name: Mobile Coder WebView Shell

on:
  pull_request:
    paths:
      - 'products/chatgpt-mobile-coder-lab/webview-shell/**'
      - '.github/workflows/mobile-coder-webview-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-coder-webview-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: products/chatgpt-mobile-coder-lab/webview-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Validate zero-bridge security contract
        run: python validate_webview_shell.py
      - name: Validate Rust formatting and metadata
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
      - name: Select Android NDK
        run: |
          ndk_path=${ANDROID_NDK_LATEST_HOME:-$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)}
          test -d "$ndk_path"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
      - name: Generate disposable app icons
        run: cargo tauri icon assets/icon.svg
      - name: Initialize Android project
        run: cargo tauri android init --ci
      - name: Build debug ARM64 APK
        run: cargo tauri android build --debug --target aarch64 --apk --ci
      - name: Collect APK
        run: |
          mkdir -p apk-output
          apk_path=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' -type f -print -quit)
          test -n "$apk_path"
          cp "$apk_path" apk-output/chatgpt-webview-nologin-smoke.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-nologin-smoke
          path: products/chatgpt-mobile-coder-lab/webview-shell/apk-output/
          if-no-files-found: error
