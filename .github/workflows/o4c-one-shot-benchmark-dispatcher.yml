name: O4-C One-Shot Benchmark Dispatcher

on:
  push:
    branches:
      - 'automation/o4c-scout-benchmark-dispatch-20260902'
    paths:
      - '.o4c-benchmark-dispatch-trigger'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact merged O4-C benchmark once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 79a034d0fd589d13e536f7d54291773287d7b06e
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"target_sha\":\"%s\"}}' "$TARGET_SHA")"
          code="$(curl -sS -o /tmp/dispatch-body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/agent-skill-orchestrator-o4c-scout-benchmark.yml/dispatches" \
            -d "$payload")"
          test "$code" = '204' || { cat /tmp/dispatch-body; exit 2; }
          echo "O4C_DISPATCH_TARGET_SHA:$TARGET_SHA"
          echo 'O4C_DISPATCH_COUNT:1'
