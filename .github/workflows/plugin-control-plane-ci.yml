name: Plugin Control Plane CI

on:
  pull_request:
    paths:
      - '.github/plugin-control-plane/**'
      - '.github/workflows/plugin-control-plane-*.yml'
      - '.github/workflows/repository-work-harness-*.yml'
      - '.github/workflows/canonical-main-ops.yml'
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/workflows/canonical-main-rehearsal.yml'
      - '.github/workflows/canonical-main-doc*.yml'
      - '.github/ISSUE_TEMPLATE/plugin-work.yml'
      - 'docs/*_GUIDELINES.md'
      - 'docs/REPOSITORY_PLUGIN_CONTROL_PLANE_*.md'
      - 'docs/REPO_*.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Plugin Control Plane contracts
        run: |
          bash -n .github/plugin-control-plane/canonical-main/protection-activate.sh
          bash -n .github/plugin-control-plane/canonical-main/required-guard.sh
          node .github/plugin-control-plane/tests/control-plane-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/canonical-main-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/bootstrap-rollout-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/rehearsal-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/notification-bot-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/delivery-receipt-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/notification-bundling-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/protected-main-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/module-architecture-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/stability-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/documentation-stream-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/work-system-contract.cjs
          node .github/plugin-control-plane/canonical-main/tests/main-delta-brief-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/preflight-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/active-work-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/report-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/workflow-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/dispatch-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/handoff-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/invoke-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/receipt-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/mutation-boundary-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/receipt-shadow-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/mutation-gate-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/canonical-main-canary-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/receipt-sync-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/receipt-sync-workflow-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/authoritative-handoff-contract.cjs
          node .github/plugin-control-plane/canonical-main/work-harness/tests/mutation-enforcement-coverage-contract.cjs
