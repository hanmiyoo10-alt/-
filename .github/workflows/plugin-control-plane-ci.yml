name: Plugin Control Plane CI

on:
  pull_request:
    paths:
      - '.github/plugin-control-plane/**'
      - '.github/tooling/ci-summary/**'
      - '.github/workflows/plugin-control-plane-*.yml'
      - '.github/workflows/repository-work-harness-*.yml'
      - '.github/workflows/canonical-main-ops.yml'
      - '.github/workflows/canonical-main-protection-guard.yml'
      - '.github/workflows/canonical-main-proof-bundle.yml'
      - '.github/workflows/canonical-main-rehearsal.yml'
      - '.github/workflows/canonical-main-doc*.yml'
      - '.github/ISSUE_TEMPLATE/plugin-work.yml'
      - 'docs/*_GUIDELINES.md'
      - 'docs/REPOSITORY_PLUGIN_CONTROL_PLANE_*.md'
      - 'docs/REPO_*.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Plugin Control Plane contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tooling/ci-summary/receipt_runner.py \
            --manifest .github/tooling/ci-summary/manifests/plugin-control-plane.json \
            --report .ci-summary/plugin-control-plane-receipt.json

      - name: Render compact CI summary
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p .ci-summary
          python3 .github/tooling/ci-summary/adapters/plugin_control_plane.py \
            --report .ci-summary/plugin-control-plane-receipt.json \
            --output .ci-summary/adapter.json \
            --workflow 'Plugin Control Plane CI' \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA"
          adapter_code=$?
          python3 .github/tooling/ci-summary/render.py \
            --input .ci-summary/adapter.json \
            --json-out .ci-summary/summary.json \
            --text-out .ci-summary/inline.txt \
            --markdown-out .ci-summary/inline.md \
            --workflow 'Plugin Control Plane CI' \
            > /tmp/plugin-control-plane-summary-render.log
          render_code=$?

          if [[ -f .ci-summary/inline.txt ]]; then
            cat .ci-summary/inline.txt
          elif [[ -s /tmp/plugin-control-plane-summary-render.log ]]; then
            cat /tmp/plugin-control-plane-summary-render.log
          else
            printf '%s\n' \
              'CI_SUMMARY_V1_BEGIN' \
              'CI SUMMARY · Plugin Control Plane CI' \
              'Result: INFRA_ERROR' \
              'Reason codes:' \
              '- CI_SUMMARY_RENDER_CATASTROPHIC' \
              'Summary complete: false' \
              'CI_SUMMARY_V1_END'
          fi

          if [[ -f .ci-summary/inline.md ]]; then
            cat .ci-summary/inline.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'CI SUMMARY · Plugin Control Plane CI'
              echo 'Result: INFRA_ERROR'
              echo 'Reason codes: CI_SUMMARY_RENDER_CATASTROPHIC'
              echo 'Summary complete: false'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$adapter_code" -ne 0 || "$render_code" -ne 0 ]]; then
            echo "::warning::CI compact summary generation incomplete (adapter=$adapter_code renderer=$render_code); authoritative Plugin Control Plane contract gate is unchanged."
          fi
          exit 0
