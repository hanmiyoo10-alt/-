name: Plugin Control Plane — Issue scope

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify explicit issue scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node .github/plugin-control-plane/controller.cjs classify-issue; then
            echo "::warning::Plugin Control Plane issue classification failed; plugin release systems remain unblocked."
          fi
