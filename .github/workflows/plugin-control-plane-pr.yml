name: Plugin Control Plane — PR reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/**'
      - '.github/workflows/plugin-control-plane-pr*.yml'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: plugin-control-plane-pr-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main classifier
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile all open PR scopes from GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node .github/plugin-control-plane/pr-classifier.cjs; then
            echo "::warning::Plugin Control Plane PR reconciliation failed; release/product CI remains authoritative and unblocked."
          fi
