name: Plugin Control Plane — PR scope

on:
  workflow_run:
    workflows: ["Plugin Control Plane — PR observe"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  classify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify changed paths without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node .github/plugin-control-plane/pr-classifier.cjs; then
            echo "::warning::Plugin Control Plane PR classification failed; release/product CI remains authoritative and unblocked."
          fi
