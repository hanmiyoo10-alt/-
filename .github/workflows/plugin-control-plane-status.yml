name: Repository Control Plane — Status views

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/plugin-control-plane/**'
      - '.github/usage-dashboard/releases/**'
      - 'plugins/devpass/**'
      - 'plugins/termux/large-doc-editor/**'
      - 'voyage-token-check/**'
      - 'products/pocketrisu-helper-mod/**'
      - '.github/workflows/pocketrisu-helper-docs.yml'
      - 'product-manifest.json'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: plugin-control-plane-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile open PR ownership from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node .github/plugin-control-plane/pr-classifier.cjs; then
            echo "::warning::Repository Control Plane PR fallback reconciliation failed; release/product CI remains authoritative and unblocked."
          fi
      - name: Refresh mutable GitHub status issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node .github/plugin-control-plane/controller.cjs refresh-status; then
            echo "::warning::Repository Control Plane status refresh failed; no release/product authority is affected."
          fi
