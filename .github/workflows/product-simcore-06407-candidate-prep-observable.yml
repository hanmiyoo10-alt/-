name: SimCore v0.64.7 Candidate Preparation Observable

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: simcore-06407-candidate-prep
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.title == 'SimCore v0.64.7 candidate activation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact production parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Bind frozen parent and load main builder
        shell: bash
        run: |
          set -euo pipefail
          P="$(git rev-parse HEAD)"
          test "$P" = '47969d24771f6cc188df6e32150fc6fde519182d'
          test "$(sed -n 's#^//@version[[:space:]]*##p' plugins/simcore/latest.js | head -n1)" = '0.64.6'
          test "$(git rev-parse HEAD:plugins/simcore/latest.js)" = '34da01aa131f760b92d65d961a7843e9cc0d37d6'
          test "$(git rev-parse HEAD:plugins/simcore/install.js)" = '34da01aa131f760b92d65d961a7843e9cc0d37d6'
          git fetch --no-tags origin main
          git show origin/main:products/simcore/tooling/build-06407-reload-cache-continuity.py > /tmp/simcore-06407-build.py
          python3 -m py_compile /tmp/simcore-06407-build.py

      - name: Build exact v0.64.7 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/simcore-06407-build.py
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          grep -q '^//@version 0.64.7$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.64.7';" plugins/simcore/latest.js
          grep -q '^// v0.64.7 Cross-Reload Cache Observer Continuity:$' plugins/simcore/latest.js
          grep -q '__SIMCORE_TELEMETRY_HANDOFF_SESSION_V1__' plugins/simcore/latest.js
          grep -q 'const MAX_SESSION_CHARS = 16384;' plugins/simcore/latest.js
          grep -q 'transport: adoption.transport || null' plugins/simcore/latest.js
          grep -q 'provider cache .*UNVERIFIED' plugins/simcore/latest.js
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'plugins/simcore/latest.js'
          printf '%s\n' "${changed[@]}" | grep -Fx 'plugins/simcore/install.js'

      - name: Run permanent candidate regression suite from main
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/simcore/latest.js /tmp/simcore-06407-candidate.js
          rm -rf /tmp/simcore-main-verifier
          git worktree add --detach /tmp/simcore-main-verifier origin/main
          cd /tmp/simcore-main-verifier
          node products/simcore/tooling/test.mjs \
            --source /tmp/simcore-06407-candidate.js \
            --suite batch-a \
            --report /tmp/simcore-06407-batch-a.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/simcore-06407-batch-a.json'))
          ids={x['id']:x['status'] for x in r['suites']}
          assert ids.get('reload-cache-continuity') == 'PASS'
          print('SIMCORE_06407_PERMANENT_REGRESSION_PASS')
          PY

      - name: Commit immutable direct-child candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_REF='refs/heads/candidate/simcore-06407-reload-cache-continuity'
          if git ls-remote --exit-code --heads origin "$CANDIDATE_REF" >/tmp/existing-ref 2>/dev/null; then
            echo '06407_CANDIDATE_REF_ALREADY_EXISTS' >&2
            cat /tmp/existing-ref >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'SimCore v0.64.7 Cross-Reload Cache Observer Continuity'
          C="$(git rev-parse HEAD)"
          P="$(git rev-parse HEAD^)"
          test "$P" = '47969d24771f6cc188df6e32150fc6fde519182d'
          test "$(git diff --name-only "$P" "$C" | wc -l | tr -d ' ')" = '2'
          test "$(git rev-parse "$C:plugins/simcore/latest.js")" = "$(git rev-parse "$C:plugins/simcore/install.js")"
          git push origin "HEAD:$CANDIDATE_REF"
          echo "candidate_commit=$C" >> "$GITHUB_OUTPUT"
          echo "candidate_blob=$(git rev-parse "$C:plugins/simcore/latest.js")" >> "$GITHUB_OUTPUT"

      - name: Candidate summary
        shell: bash
        env:
          C: ${{ steps.candidate.outputs.candidate_commit }}
          BLOB: ${{ steps.candidate.outputs.candidate_blob }}
        run: |
          set -euo pipefail
          echo "SIMCORE_06407_CANDIDATE_READY C=$C BLOB=$BLOB P=47969d24771f6cc188df6e32150fc6fde519182d"
