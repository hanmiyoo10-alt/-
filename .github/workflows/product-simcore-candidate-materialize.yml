name: SimCore Generic Candidate Materialize

on:
  push:
    branches: [main]
    paths:
      - 'products/simcore/releases/candidate-requests/**'

permissions:
  contents: read

concurrency:
  group: simcore-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize Candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    outputs:
      intent_id: ${{ steps.request.outputs.intent_id }}
      release_id: ${{ steps.request.outputs.release_id }}
      request_path: ${{ steps.request.outputs.request_path }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      coordination_work_issue: ${{ steps.request.outputs.coordination_work_issue }}
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
      candidate_disposition: ${{ steps.candidate.outputs.candidate_disposition }}
    steps:
      - name: Checkout exact merged product intent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: ''

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.x'
          cache: ''

      - name: Resolve one immutable candidate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD^ >/dev/null
          mapfile -t REQUESTS < <(git diff --name-only HEAD^ HEAD -- 'products/simcore/releases/candidate-requests/*.json')
          test "${#REQUESTS[@]}" -eq 1
          REQUEST="${REQUESTS[0]}"
          test -f "$REQUEST"
          TOUCHES="$(git log --first-parent --format=%H HEAD -- "$REQUEST" | wc -l | tr -d ' ')"
          test "$TOUCHES" = 1
          python3 - "$REQUEST" <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json,re,sys
          r=json.load(open(sys.argv[1]))
          rid=str(r.get('releaseId') or '')
          version=str(r.get('targetVersion') or '')
          mode=str(r.get('releaseMode') or '')
          suffix={'NEW_VERSION':'new','SAME_VERSION_CORRECTION':'correction','ROLLBACK':'rollback'}.get(mode)
          if suffix is None: raise SystemExit('CANDIDATE_REQUEST_RELEASE_MODE_INVALID')
          if not re.fullmatch(rf'simcore-v{re.escape(version)}-{suffix}-[0-9]{{2,}}',rid): raise SystemExit('CANDIDATE_RELEASE_ID_INVALID')
          work=r.get('coordinationWorkIssue')
          if work is None or work == '':
              work=''
          elif type(work) is int and work > 0:
              work=str(work)
          else:
              raise SystemExit('SIMCORE_CANDIDATE_COORDINATION_ISSUE_INVALID')
          print('intent_id='+str(r['intentId']))
          print('release_id='+rid)
          print('coordination_work_issue='+work)
          PY
          echo "request_path=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'SIMCORE_GENERIC_CANDIDATE_REQUEST_BOUNDARY_PASS'

      - name: Observe exact production parent
        id: production
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          P="$(git rev-parse origin/release-simcore)"
          [[ "$P" =~ ^[0-9a-f]{40}$ ]]
          echo "production_commit=$P" >> "$GITHUB_OUTPUT"

      - name: Revalidate optional candidate coordination receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_WORK_ISSUE: ${{ steps.request.outputs.coordination_work_issue }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_WORK_ISSUE" ]]; then
            echo 'SIMCORE_CANDIDATE_COORDINATION_GATE_BYPASS:NO_WORK_ISSUE'
            exit 0
          fi
          [[ "$TARGET_WORK_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo 'SIMCORE_CANDIDATE_COORDINATION_ISSUE_INVALID'; exit 3; }
          mkdir -p "$RUNNER_TEMP/simcore-candidate-gate"
          RESULT="$RUNNER_TEMP/simcore-candidate-gate/mutation-gate.json"
          set +e
          node .github/plugin-control-plane/canonical-main/work-harness/mutation-gate.cjs --work-issue "$TARGET_WORK_ISSUE" > "$RESULT"
          code=$?
          set -e
          status="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.status || ''))" "$RESULT")"
          adapter="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.boundary?.adapterId || ''))" "$RESULT")"
          mutation="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.boundary?.mutationClass || ''))" "$RESULT")"
          {
            echo '### SimCore Candidate Coordination Gate'
            echo '```json'
            cat "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" -ne 0 || "$status" != 'MUTATION_GATE_READY' ]]; then
            echo "SIMCORE_CANDIDATE_COORDINATION_GATE_BLOCKED:$status"
            exit 3
          fi
          [[ "$adapter" == 'simcore' ]] || { echo "SIMCORE_CANDIDATE_ADAPTER_MISMATCH:$adapter"; exit 3; }
          [[ "$mutation" == 'CANDIDATE_STATE' ]] || { echo "SIMCORE_CANDIDATE_MUTATION_CLASS_MISMATCH:$mutation"; exit 3; }
          echo "SIMCORE_CANDIDATE_COORDINATION_GATE_READY:$TARGET_WORK_ISSUE"

      - name: Materialize or reuse exact candidate
        id: candidate
        shell: bash
        env:
          REQUEST: ${{ steps.request.outputs.request_path }}
          SOURCE: ${{ steps.request.outputs.source_commit }}
          PRODUCTION: ${{ steps.production.outputs.production_commit }}
        run: |
          set -euo pipefail
          mkdir -p .simcore-candidate
          node products/simcore/tooling/candidate-materialize.mjs \
            --root . \
            --request "$REQUEST" \
            --source-commit "$SOURCE" \
            --production-commit "$PRODUCTION" \
            --report .simcore-candidate/report.json
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          r=json.load(open('.simcore-candidate/report.json'))
          assert r['result']=='PASS'
          assert r['productionMutation']=='NONE'
          assert r['releaseAuthority']=='CANDIDATE_TRANSPORT_ONLY'
          assert r['candidateDisposition'] in ('CREATED','ALREADY_MATERIALIZED')
          print('candidate_commit='+r['candidateCommit'])
          print('candidate_disposition='+r['candidateDisposition'])
          print('candidate_fetch_ref='+r['candidateFetchRef'])
          print('candidate_blob='+r['candidateReleaseBlob'])
          PY

      - name: Upload bounded candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simcore-candidate-${{ steps.request.outputs.intent_id }}-${{ github.run_id }}
          path: .simcore-candidate/report.json
          if-no-files-found: error
          retention-days: 90

      - name: Candidate summary
        shell: bash
        env:
          INTENT: ${{ steps.request.outputs.intent_id }}
          C: ${{ steps.candidate.outputs.candidate_commit }}
          D: ${{ steps.candidate.outputs.candidate_disposition }}
        run: |
          set -euo pipefail
          echo "SIMCORE_GENERIC_CANDIDATE_PASS intent=$INTENT disposition=$D C=$C productionMutation=NONE"

  receipt:
    name: Persist Candidate Receipt and Spec Shadow
    needs: materialize
    runs-on: ubuntu-24.04
    concurrency:
      group: simcore-main-state-sync
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main administrative authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact candidate report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: simcore-candidate-${{ needs.materialize.outputs.intent_id }}-${{ github.run_id }}
          path: .simcore-candidate

      - name: Reobserve immutable request and candidate
        shell: bash
        env:
          SOURCE: ${{ needs.materialize.outputs.source_commit }}
          REQUEST: ${{ needs.materialize.outputs.request_path }}
          C: ${{ needs.materialize.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$C" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p .simcore-candidate/source
          git show "$SOURCE:$REQUEST" > .simcore-candidate/source/request.json
          test -f "$REQUEST"
          cmp -s "$REQUEST" .simcore-candidate/source/request.json
          REF="$(python3 - <<'PY'
          import json
          print(json.load(open('.simcore-candidate/report.json'))['candidateFetchRef'])
          PY
          )"
          HEAD="$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')"
          test "$HEAD" = "$C"
          echo 'SIMCORE_CANDIDATE_RECEIPT_REOBSERVE_PASS'

      - name: Derive bounded machine receipt and spec shadow
        id: receipt
        shell: bash
        env:
          INTENT: ${{ needs.materialize.outputs.intent_id }}
          RELEASE_ID: ${{ needs.materialize.outputs.release_id }}
          SOURCE: ${{ needs.materialize.outputs.source_commit }}
        run: |
          set -euo pipefail
          RECEIPT="products/simcore/releases/candidate-receipts/${INTENT}.json"
          SHADOW="products/simcore/releases/spec-shadows/${RELEASE_ID}.json"
          node products/simcore/tooling/candidate-receipt.mjs \
            --request .simcore-candidate/source/request.json \
            --candidate-report .simcore-candidate/report.json \
            --verifier-commit "$SOURCE" \
            --receipt "$RECEIPT" \
            --spec-shadow "$SHADOW"
          echo "receipt_path=$RECEIPT" >> "$GITHUB_OUTPUT"
          echo "shadow_path=$SHADOW" >> "$GITHUB_OUTPUT"
          git diff --check

      - name: Commit and gate machine-known candidate truth
        shell: bash
        env:
          INTENT: ${{ needs.materialize.outputs.intent_id }}
          RECEIPT: ${{ steps.receipt.outputs.receipt_path }}
          SHADOW: ${{ steps.receipt.outputs.shadow_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RECEIPT" "$SHADOW"
          if git diff --cached --quiet; then
            echo 'SIMCORE_CANDIDATE_RECEIPT_ALREADY_DURABLE'
          else
            git commit -m "state(simcore): record candidate ${INTENT}"
            PAYLOAD="$(git rev-parse HEAD)"
            python3 scripts/repo-main-write.py --commit "$PAYLOAD" \
              --allow "$RECEIPT" \
              --allow "$SHADOW" \
              --required-workflow simcore-ci.yml \
              --required-profile MAIN_HEALTH \
              --required-job Required \
              --staging-prefix simcore-candidate-receipt
          fi

      - name: Reobserve durable machine receipt
        shell: bash
        env:
          RECEIPT: ${{ steps.receipt.outputs.receipt_path }}
          SHADOW: ${{ steps.receipt.outputs.shadow_path }}
          C: ${{ needs.materialize.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show "origin/main:$RECEIPT" > .simcore-candidate/durable-receipt.json
          git show "origin/main:$SHADOW" > .simcore-candidate/durable-shadow.json
          C="$C" python3 - <<'PY'
          import json,os
          r=json.load(open('.simcore-candidate/durable-receipt.json'))
          s=json.load(open('.simcore-candidate/durable-shadow.json'))
          assert r['candidateCommit']==os.environ['C']
          assert r['result']=='PASS'
          assert r['productionMutation']=='NONE'
          assert s['authority']=='SHADOW_ONLY'
          assert s['derivedSpec']['candidateCommit']==os.environ['C']
          print('SIMCORE_CANDIDATE_RECEIPT_DURABLE_PASS')
          PY
