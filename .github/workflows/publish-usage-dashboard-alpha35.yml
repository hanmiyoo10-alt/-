name: Publish usage dashboard alpha.3.5

on:
  push:
    paths:
      - '.github/workflows/publish-usage-dashboard-alpha35.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write exact alpha.3.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          blob = ''
          Path('plugins/usage-dashboard/latest.js').write_bytes(gzip.decompress(base64.b64decode(blob)))
          PY

      - name: Verify exact blob
        shell: bash
        run: test "$(git hash-object plugins/usage-dashboard/latest.js)" = "ff4dc56041aaa5836920d9038ddc09545150a950"

      - name: Commit updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/usage-dashboard/latest.js
          git commit -m "feat: publish usage dashboard alpha.3.5"
          git push
