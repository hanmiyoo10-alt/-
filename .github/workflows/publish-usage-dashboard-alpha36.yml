name: Publish usage dashboard alpha.3.6

on:
  push:
    paths:
      - '.github/workflows/publish-usage-dashboard-alpha36.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest.js
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check plugins/usage-dashboard/latest.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'feat: publish usage dashboard alpha.3.6'
          git push
