name: release-beta1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-beta1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote Local Usage Dashboard to beta.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('plugins/usage-dashboard/latest.js')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'marker not found: {label}')
              text = text.replace(old, new, 1)

          rep('//@version 3.0.0-alpha.3.7', '//@version 3.0.0-beta.1', 'metadata version')
          rep("const VERSION = '3.0.0-alpha.3.7';", "const VERSION = '3.0.0-beta.1';", 'runtime version')

          rep(
              "    staleAfterMs: 0, stalePolicyV37Migrated: false,\n    widgetVisible: true, widgetMode: 'compact', widgetX: null, widgetY: null,\n",
              "    staleAfterMs: 0, stalePolicyV37Migrated: false,\n    widgetVisible: false, widgetMode: 'compact', widgetX: null, widgetY: null, iconQuickViewV1Migrated: false,\n",
              'quick view defaults'
          )

          rep(
              "  async function openSettings() { document.body.dataset.panelOpen='1'; renderSettings(); await Risuai.showContainer('fullscreen'); }\n\n  function widgetHtml() {\n",
              "  async function openSettings() { document.body.dataset.panelOpen='1'; renderSettings(); await Risuai.showContainer('fullscreen'); }\n\n  async function toggleUsageQuickView() {\n    state.widgetVisible = state.widgetVisible === false;\n    await persist();\n    await renderWidget();\n    if (state.widgetVisible && state.bridgeEnabled && token) await refresh('icon', true);\n  }\n\n  function widgetHtml() {\n",
              'quick view function'
          )

          rep(
              "    if (state.stalePolicyV37Migrated !== true) {\n      if (Number(state.staleAfterMs) === 300000) state.staleAfterMs = 0;\n      state.stalePolicyV37Migrated = true;\n      await store.setItem(STATE_KEY,state);\n    }\n    try{state.bridgeBase=normalizeBridgeBase(state.bridgeBase);}catch(_){state.bridgeBase=DEFAULT_BRIDGE;state.bridgeEnabled=false;}\n",
              "    if (state.stalePolicyV37Migrated !== true) {\n      if (Number(state.staleAfterMs) === 300000) state.staleAfterMs = 0;\n      state.stalePolicyV37Migrated = true;\n      await store.setItem(STATE_KEY,state);\n    }\n    if (state.iconQuickViewV1Migrated !== true) {\n      state.widgetVisible = false;\n      state.iconQuickViewV1Migrated = true;\n      await store.setItem(STATE_KEY,state);\n    }\n    try{state.bridgeBase=normalizeBridgeBase(state.bridgeBase);}catch(_){state.bridgeBase=DEFAULT_BRIDGE;state.bridgeEnabled=false;}\n",
              'quick view migration'
          )

          rep(
              "    uiParts.push(await Risuai.registerSetting('Local Usage Dashboard',openSettings,'◴','html','local-usage-dashboard-settings-v3'));\n    uiParts.push(await Risuai.registerButton({name:'Usage',icon:'$',iconType:'html',location:'hamburger',id:'local-usage-dashboard-button-v3'},openSettings));\n",
              "    uiParts.push(await Risuai.registerSetting('Local Usage Dashboard',openSettings,'◴','html','local-usage-dashboard-settings-v3'));\n    uiParts.push(await Risuai.registerButton({name:'Usage',icon:'$',iconType:'html',location:'hamburger',id:'local-usage-dashboard-button-v3'},toggleUsageQuickView));\n",
              'hamburger callback'
          )

          p.write_text(text, encoding='utf-8')
          PY
          node --check plugins/usage-dashboard/latest.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'feat: Local Usage Dashboard 3.0.0-beta.1 quick view'
          git push
