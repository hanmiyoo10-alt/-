name: Release Command Usage Dashboard 3.0.0-alpha.5.69

# Retry marker: re-emit the one-shot release trigger after the PR #106 merge
# overlapped an independent main writer. The shared monotonic guard remains
# authoritative if an earlier publish attempt later completes.
# Deployment trigger: post-#114 product-local main-write coordination
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-command-usage-dashboard-569.yml'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.69.json
      publish: true
