name: Release Command Usage Dashboard 3.0.0-alpha.5.69

# One-shot publish command branch. This branch is not merged; the reusable
# release workflow validates, materializes main through repo-main-write.py,
# then publishes product artifacts monotonically to release-usage-dashboard.
on:
  push:
    branches: [release/usage-dashboard-569-publish-command]
    paths:
      - '.github/workflows/release-command-usage-dashboard-569.yml'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.69.json
      publish: true
