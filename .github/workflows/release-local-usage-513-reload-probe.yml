name: Release Local Usage 5.13 Reload Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-513-reload-probe.yml'

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 5.13 probe bump
        shell: bash
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_alpha513_reload_probe.py
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate 5.13 product
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.13' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.13';" plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.4';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.13';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const VERSION = '1.6.2';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          git diff --check

      - name: Stage validated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/usage-dashboard-runtime
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime

      - name: Commit 5.13 source product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            plugins/usage-dashboard/src/00-runtime-core.part.js \
            plugins/usage-dashboard/src/manifest.json \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json
          git diff --cached --check
          git commit -m 'chore: publish Local Usage 5.13 reload probe'
          git push origin HEAD:main

      - name: Publish 5.13 release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq '//@version 3.0.0-alpha.5.13' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.13"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.13 probe'
          git push origin HEAD:release-usage-dashboard
