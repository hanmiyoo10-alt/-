name: Release Local Usage 5.24 Battery Thermal

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-local-usage-524-battery-thermal.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish 5.24 battery thermal pack
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git switch release-usage-dashboard

          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, re, base64

          old = '3.0.0-alpha.5.23'
          new = '3.0.0-alpha.5.24'
          plugin_path = Path('plugins/usage-dashboard/latest.js')
          manager_path = Path('plugins/usage-dashboard/runtime/bridge-manager.cjs')
          manifest_path = Path('plugins/usage-dashboard/runtime/product-manifest.json')

          s = plugin_path.read_text()
          if s.count(old) != 2:
              raise SystemExit(f'unexpected plugin version count: {s.count(old)}')
          s = s.replace(old, new)

          const_anchor = "  const UI_STALL_PROBE_INTERVAL_MS = 100;\n"
          const_insert = (
              const_anchor
              + "  const UI_STALL_PROBE_IDLE_INTERVAL_MS = 1000;\n"
              + "  const UI_STALL_PROBE_TIMER_BURST_MS = 1500;\n"
              + "  const UI_STALL_PROBE_ACTIVE_BURST_MS = 5000;\n"
          )
          if s.count(const_anchor) != 1:
              raise SystemExit('ui stall constant anchor mismatch')
          s = s.replace(const_anchor, const_insert, 1)

          parts_anchor = "  const uiParts = [], remoteListeners = [], domListeners = [];\n"
          power_runtime = (
              "  const powerRuntime = {probeWakeups:0,probeIdleWakeups:0,probeBurstWakeups:0,probeBurstUntil:0,persistWrites:0,widgetRenderCalls:0};\n"
              + parts_anchor
          )
          if s.count(parts_anchor) != 1:
              raise SystemExit('power runtime anchor mismatch')
          s = s.replace(parts_anchor, power_runtime, 1)

          start_pattern = re.compile(r"  function startUiStallProbe\(\) \{\n.*?\n  \}\n\n  function stopResumeMeasurement\(\)", re.S)
          if len(start_pattern.findall(s)) != 1:
              raise SystemExit('startUiStallProbe body mismatch')
          start_replacement = base64.b64decode('').decode()
          s = start_pattern.sub(lambda _: start_replacement, s, count=1)

          resume_anchor = "  function beginResumeMeasurement(reason = 'visibility') {\n    stopResumeMeasurement();\n"
          resume_replacement = resume_anchor + "    requestUiStallProbeBurst(UI_STALL_PROBE_ACTIVE_BURST_MS);\n"
          if s.count(resume_anchor) != 1:
              raise SystemExit('resume measurement anchor mismatch')
          s = s.replace(resume_anchor, resume_replacement, 1)

          refresh_anchor = "    if (state.backgroundPause !== false && document.visibilityState === 'hidden') return;\n    const started = Date.now();\n"
          refresh_replacement = (
              "    if (state.backgroundPause !== false && document.visibilityState === 'hidden') return;\n"
              "    requestUiStallProbeBurst(reason === 'timer' ? UI_STALL_PROBE_TIMER_BURST_MS : UI_STALL_PROBE_ACTIVE_BURST_MS);\n"
              "    const started = Date.now();\n"
          )
          if s.count(refresh_anchor) != 1:
              raise SystemExit('refresh burst anchor mismatch')
          s = s.replace(refresh_anchor, refresh_replacement, 1)

          persist_anchor = "  async function persist() {\n    if (runtimeDisposed) return dropStaleAsync();\n    await store.setItem(STATE_KEY, {...state});\n  }\n"
          persist_replacement = "  async function persist() {\n    if (runtimeDisposed) return dropStaleAsync();\n    await store.setItem(STATE_KEY, {...state});\n    powerRuntime.persistWrites += 1;\n  }\n"
          if s.count(persist_anchor) != 1:
              raise SystemExit('persist anchor mismatch')
          s = s.replace(persist_anchor, persist_replacement, 1)

          render_anchor = "  async function renderWidget(reason = 'ui') {\n    if (runtimeDisposed) return;\n"
          render_replacement = render_anchor + "    powerRuntime.widgetRenderCalls += 1;\n"
          if s.count(render_anchor) != 1:
              raise SystemExit('render widget anchor mismatch')
          s = s.replace(render_anchor, render_replacement, 1)

          lines = s.splitlines()
          perf_idx = [i for i, line in enumerate(lines) if '`Performance settings:' in line]
          if len(perf_idx) != 1:
              raise SystemExit(f'performance settings diagnostic anchor mismatch: {len(perf_idx)}')
          i = perf_idx[0] + 1
          lines[i:i] = [
              "      `Power guard: adaptive-probe · idle ${UI_STALL_PROBE_IDLE_INTERVAL_MS}ms · burst ${UI_STALL_PROBE_INTERVAL_MS}ms · timer-burst ${UI_STALL_PROBE_TIMER_BURST_MS}ms · active-burst ${UI_STALL_PROBE_ACTIVE_BURST_MS}ms`,",
              "      `Power activity: probe ${Date.now() < Number(powerRuntime.probeBurstUntil || 0) ? 'burst' : 'idle'} · wakeups ${powerRuntime.probeWakeups} · idle ${powerRuntime.probeIdleWakeups} · burst ${powerRuntime.probeBurstWakeups} · persist writes ${powerRuntime.persistWrites} · widget renders ${powerRuntime.widgetRenderCalls}`,",
          ]
          s = '\n'.join(lines) + '\n'
          plugin_path.write_text(s)

          manager = manager_path.read_text()
          if manager.count(old) != 1:
              raise SystemExit(f'unexpected manager version count: {manager.count(old)}')
          manager = manager.replace(old, new)
          manager_path.write_text(manager)

          manifest = json.loads(manifest_path.read_text())
          manifest['productVersion'] = new
          manifest['components']['plugin']['version'] = new
          manifest['components']['bridgeManager']['productVersion'] = new
          manifest['components']['bridgeManager']['sha256'] = hashlib.sha256(manager_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          git diff --check
          grep -Fq '//@version 3.0.0-alpha.5.24' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.24'" plugins/usage-dashboard/latest.js
          grep -Fq 'const UI_STALL_PROBE_IDLE_INTERVAL_MS = 1000;' plugins/usage-dashboard/latest.js
          grep -Fq 'function requestUiStallProbeBurst' plugins/usage-dashboard/latest.js
          grep -Fq 'Power guard: adaptive-probe' plugins/usage-dashboard/latest.js
          grep -Fq 'Power activity:' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.4'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.24'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.2'" plugins/usage-dashboard/runtime/bridge-manager.cjs

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime/bridge-manager.cjs plugins/usage-dashboard/runtime/product-manifest.json
          git commit -m 'release: local usage dashboard 5.24 battery thermal pack'
          git push origin release-usage-dashboard
