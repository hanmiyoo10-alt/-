name: Release Local Usage 5.27 Async Tail Fence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-local-usage-527-async-tail-fence.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish 5.27 async tail fence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git switch release-usage-dashboard
          printf '%s' '' | base64 -d > /tmp/release_527.py
          python3 /tmp/release_527.py
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          git diff --check
          grep -Fq '//@version 3.0.0-alpha.5.27' plugins/usage-dashboard/latest.js
          grep -Fq 'if (runtimeDisposed) return;' plugins/usage-dashboard/latest.js
          grep -Fq 'if (!runtimeIsCurrent(refreshEpoch)) return dropStaleAsync();' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.4'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.27'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.2'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime/bridge-manager.cjs plugins/usage-dashboard/runtime/product-manifest.json
          git commit -m 'release: local usage dashboard 5.27 async tail fence'
          git push origin release-usage-dashboard
