name: Finalize Local Usage 5.3 Bundled Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-53-bundled-engine-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 5.3 exactly once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '//@version 3.0.0-alpha.5.3' plugins/usage-dashboard/src/00-runtime-core.part.js; then
            echo '5.3 already committed; mutation skipped'
          else
            grep -Fq '//@version 3.0.0-alpha.5.2' plugins/usage-dashboard/src/00-runtime-core.part.js
            python3 .github/lud53/prepatch53.py
            python3 .github/lud53/patch53.py
            python3 .github/lud53/postpatch53.py
          fi
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate exact bundled runtime and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          for test in plugins/usage-dashboard/tests/*.cjs; do
            echo "=== $test ==="
            node "$test"
          done
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          ENGINE_SHA="$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')"
          test "$ENGINE_SHA" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          grep -Fq 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d' plugins/usage-dashboard/tests/fixtures/p5-bundled-engine.sha256
          grep -Fq '//@version 3.0.0-alpha.5.3' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.3';" plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.0';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "url.pathname === '/engine/sync'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'async function syncBundledEngine()' plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'rollbackRestored' plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'async function syncBridgeEngineBundleIfNeeded(status)' plugins/usage-dashboard/latest.js
          grep -Fq 'bridgeEngineBundleSyncAttemptedVersion' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.3"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"state": "managed-bundled"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"sourceBundled": true' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"version": "1.2.0"' plugins/usage-dashboard/runtime/product-manifest.json
          MANIFEST_ENGINE_SHA="$(node -e "const m=require('./plugins/usage-dashboard/runtime/product-manifest.json');process.stdout.write(String(m.components.bridge.sha256||''))")"
          MANIFEST_MANAGER_SHA="$(node -e "const m=require('./plugins/usage-dashboard/runtime/product-manifest.json');process.stdout.write(String(m.components.bridgeManager.sha256||''))")"
          test "$MANIFEST_ENGINE_SHA" = "$ENGINE_SHA"
          test "$MANIFEST_MANAGER_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-manager.cjs | awk '{print $1}')"
          git diff --check

      - name: Commit product to main if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/lud53/patch53-last.log .github/lud53/validate53-last.log .github/lud53/r2-last.log .github/lud53/r3-last.log
          git add plugins/usage-dashboard .github/workflows/release-local-usage-dashboard.yml
          if git diff --cached --quiet; then
            echo 'main product already matches 5.3'
          else
            git commit -m 'feat: Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
            git push origin HEAD:main
          fi
          git fetch origin main
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Publish exact product artifacts to release branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          rm -rf /tmp/lud53-runtime
          mkdir -p /tmp/lud53-runtime
          cp plugins/usage-dashboard/latest.js /tmp/lud53-latest.js
          cp -R plugins/usage-dashboard/runtime/. /tmp/lud53-runtime/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard/runtime
          cp /tmp/lud53-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/lud53-runtime/. plugins/usage-dashboard/runtime/
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          test "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release branch already matches 5.3'
          else
            git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
            git push origin HEAD:release-usage-dashboard
          fi

      - name: Verify main and release product bytes match
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main release-usage-dashboard
          for p in \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/product-manifest.json \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          do
            MAIN_HASH="$(git show "origin/main:$p" | sha256sum | awk '{print $1}')"
            RELEASE_HASH="$(git show "origin/release-usage-dashboard:$p" | sha256sum | awk '{print $1}')"
            echo "$p · main $MAIN_HASH · release $RELEASE_HASH"
            test "$MAIN_HASH" = "$RELEASE_HASH"
          done
          test "$(git show origin/main:plugins/usage-dashboard/runtime/bridge-engine.mjs | sha256sum | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'

      - name: Dispatch authoritative long-term release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/actions/workflows/release-local-usage-dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "authoritative workflow dispatched for $MAIN_SHA"

          RUN_ID=''
          for _ in $(seq 1 36); do
            sleep 5
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/workflows/release-local-usage-dashboard.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              -o /tmp/lud53-authoritative-runs.json
            RUN_ID="$(MAIN_SHA="$MAIN_SHA" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/lud53-authoritative-runs.json'))
          sha=os.environ['MAIN_SHA']
          rows=[r for r in d.get('workflow_runs',[]) if r.get('head_sha')==sha and r.get('event')=='workflow_dispatch']
          rows.sort(key=lambda r:r.get('id',0), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
            )"
            [ -n "$RUN_ID" ] && break
          done
          test -n "$RUN_ID" || { echo 'authoritative workflow run was not discovered'; exit 1; }
          echo "AUTHORITATIVE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          for _ in $(seq 1 72); do
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/runs/$RUN_ID" -o /tmp/lud53-authoritative-run.json
            read -r STATUS CONCLUSION < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lud53-authoritative-run.json'))
          print(r.get('status',''), r.get('conclusion') or '')
          PY
            )
            echo "authoritative $RUN_ID · $STATUS · ${CONCLUSION:-pending}"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              break
            fi
            sleep 5
          done
          read -r STATUS CONCLUSION < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lud53-authoritative-run.json'))
          print(r.get('status',''), r.get('conclusion') or '')
          PY
          )
          test "$STATUS" = completed
          test "$CONCLUSION" = success

      - name: Verify authoritative publication still matches main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main release-usage-dashboard
          for p in \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/product-manifest.json \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          do
            test "$(git show "origin/main:$p" | sha256sum | awk '{print $1}')" = "$(git show "origin/release-usage-dashboard:$p" | sha256sum | awk '{print $1}')"
          done
          test "$(git show origin/release-usage-dashboard:plugins/usage-dashboard/runtime/bridge-engine.mjs | sha256sum | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          echo "authoritative run $AUTHORITATIVE_RUN_ID verified main/release byte parity"

      - name: Remove temporary 5.3 staging machinery after full pass
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/lud53
          rm -f \
            .github/workflows/stage-local-usage-53-engine.yml \
            .github/workflows/release-local-usage-53-bundled-engine.yml \
            .github/workflows/release-local-usage-53-bundled-engine-r2.yml \
            .github/workflows/release-local-usage-53-bundled-engine-r3.yml \
            .github/workflows/release-local-usage-53-bundled-engine-final.yml
          git add -A .github
          if git diff --cached --quiet; then
            echo 'temporary staging machinery already clean'
          else
            git commit -m 'ci: clean Local Usage 5.3 temporary release machinery'
            git push origin HEAD:main
          fi
