              s=s.replace(marker, marker+'          ENGINE_SHA="$(node -e \'const m=require(process.argv[1]);process.stdout.write(String(m.components?.bridge?.sha256||\"\"))\' plugins/usage-dashboard/runtime/product-manifest.json)"\n          test "$ENGINE_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk \'{print $1}\')"\n',1)
          s=s.replace("              plugins/usage-dashboard/latest.js|plugins/usage-dashboard/runtime/product-manifest.json|plugins/usage-dashboard/runtime/bridge-manager.cjs|plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh) ;;", "              plugins/usage-dashboard/latest.js|plugins/usage-dashboard/runtime/product-manifest.json|plugins/usage-dashboard/runtime/bridge-manager.cjs|plugins/usage-dashboard/runtime/bridge-engine.mjs|plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh) ;;",1)
          # Release-side syntax check too.
          release_anchor='          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs\n          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh\n'
          s=s.replace(release_anchor, '          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs\n          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs\n          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh\n',1)
          wf.write_text(s)
          PY

      - name: Validate full 5.3 suite
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          for test in plugins/usage-dashboard/tests/*.cjs; do node "$test"; done
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          test "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          grep -Fq '//@version 3.0.0-alpha.5.3' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.0';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "url.pathname === '/engine/sync'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'async function syncBridgeEngineBundleIfNeeded(status)' plugins/usage-dashboard/latest.js
          git diff --check

      - name: Commit 5.3 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard .github/workflows/release-local-usage-dashboard.yml
          git commit -m 'feat: Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
          git push origin HEAD:main

      - name: Publish 5.3 product artifacts to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lud53-runtime
          mkdir -p /tmp/lud53-runtime
          cp plugins/usage-dashboard/latest.js /tmp/lud53-latest.js
          cp -R plugins/usage-dashboard/runtime/. /tmp/lud53-runtime/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard/runtime
          cp /tmp/lud53-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/lud53-runtime/. plugins/usage-dashboard/runtime/
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          test "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
          git push origin HEAD:release-usage-dashboard
