name: Release Local Usage 5.3 Bundled Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-53-bundled-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Local Usage 5.3 bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: anchor missing: {old[:100]!r} · found {actual}')
              p.write_text(s.replace(old,new,count))

          core='plugins/usage-dashboard/src/00-runtime-core.part.js'
          rep(core, '//@version 3.0.0-alpha.5.2', '//@version 3.0.0-alpha.5.3')
          rep(core, "const VERSION = '3.0.0-alpha.5.2';", "const VERSION = '3.0.0-alpha.5.3';")
          rep(core, "    bridgeEngineAdoptionAttemptedVersion: '',\n    data: null", "    bridgeEngineAdoptionAttemptedVersion: '',\n    bridgeEngineBundleSyncAttemptedVersion: '',\n    data: null")

          bridge_io='plugins/usage-dashboard/src/20-bridge-io.part.js'
          rep(bridge_io,
              "      engineVersion:String(raw.engineVersion || raw.engine_version || ''),\n      candidateSafe:",
              "      engineVersion:String(raw.engineVersion || raw.engine_version || ''),\n      engineBundled:raw.engineBundled === true || raw.engine_bundled === true,\n      engineBundleAvailable:raw.engineBundleAvailable === true || raw.engine_bundle_available === true,\n      engineBundleReady:raw.engineBundleReady === true || raw.engine_bundle_ready === true,\n      engineSourceMode:String(raw.engineSourceMode || raw.engine_source_mode || ''),\n      engineBundleVersion:String(raw.engineBundleVersion || raw.engine_bundle_version || ''),\n      candidateSafe:")
          anchor="""  async function adoptBridgeEngineIfNeeded(status) {
    if (!status?.connected || status.engineManaged === true || status.engineAdoption !== true) return status;
    if (String(status.productVersion || '') !== VERSION) return status;
    if (String(state.bridgeEngineAdoptionAttemptedVersion || '') === VERSION) return status;
    try {
      const res = await Risuai.nativeFetch(`${BRIDGE_MANAGER_BASE}/engine/adopt`, {method:'POST',headers:bridgeManagerAuthHeaders()});
      const text = await res.text();
      const payload = JSON.parse(text);
      if (!res.ok) {
        if (payload?.retryable === false) state.bridgeEngineAdoptionAttemptedVersion = VERSION;
        return {...status,adoptionState:String(payload?.state || 'failed'),adoptionError:String(payload?.error || `HTTP ${res.status}`),candidateSafe:typeof payload?.candidateSafe === 'boolean' ? payload.candidateSafe : status.candidateSafe};
      }
      state.bridgeEngineAdoptionAttemptedVersion = VERSION;
      state.bridgeManagerLastProbeAt = 0;
      const fresh = await fetchBridgeManagerStatus(true);
      return {...fresh,adoptionState:String(payload?.state || (payload?.adopted ? 'adopted' : 'current')),adoptionError:''};
    } catch (e) {
      return {...status,adoptionState:'probe-error',adoptionError:e?.message || String(e)};
    }
  }
"""
          addition=anchor+"""
  async function syncBridgeEngineBundleIfNeeded(status) {
    if (!status?.connected || status.engineManaged !== true || status.engineBundleAvailable !== true || status.engineBundled === true) return status;
    if (String(status.productVersion || '') !== VERSION) return status;
    if (String(state.bridgeEngineBundleSyncAttemptedVersion || '') === VERSION) return status;
    try {
      const res = await Risuai.nativeFetch(`${BRIDGE_MANAGER_BASE}/engine/sync`, {method:'POST',headers:bridgeManagerAuthHeaders()});
