name: Release Local Usage 5.4 Auto Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-54-auto-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-usage-54-auto-reconciliation
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Local Usage 5.4 reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          OLD = '3.0.0-alpha.5.3'
          NEW = '3.0.0-alpha.5.4'
          OLD_MANAGER = '1.2.0'
          NEW_MANAGER = '1.2.1'

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def require_replace(text, old, new, label, count=None):
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{label}: expected {count} matches, got {found}')
              if found == 0:
                  if new in text:
                      return text
                  raise SystemExit(f'{label}: old marker missing')
              return text.replace(old, new)

          core_path = 'plugins/usage-dashboard/src/00-runtime-core.part.js'
          core = read(core_path)
          core = require_replace(core, OLD, NEW, 'runtime core version')
          write(core_path, core)

          bridge_path = 'plugins/usage-dashboard/src/20-bridge-io.part.js'
          bridge = read(bridge_path)

          sync_manager = r'''  async function syncBridgeManagerIfNeeded(status) {
            if (!status?.connected || status.selfUpdate !== true) return status;
            if (String(status.productVersion || '') === VERSION) {
              state.bridgeManagerSyncedProductVersion = VERSION;
              return status;
            }
            // Live /status is authoritative. A persisted success marker must never suppress reconciliation.
            state.bridgeManagerSyncedProductVersion = '';
            try {
              const res = await Risuai.nativeFetch(`${BRIDGE_MANAGER_BASE}/sync`, {method:'POST',headers:bridgeManagerAuthHeaders()});
              const text = await res.text();
              if (!res.ok) {
                state.bridgeManagerLastProbeAt = 0;
                return {...status,syncError:`HTTP ${res.status}`};
              }
              const payload = JSON.parse(text);
              state.bridgeManagerLastProbeAt = 0;
              let fresh = null;
              for (const waitMs of [200, 350, 600, 900]) {
                await new Promise(resolve => setTimeout(resolve, waitMs));
                fresh = await fetchBridgeManagerStatus(true);
                if (fresh?.connected && String(fresh.productVersion || '') === VERSION) break;
              }
              const reconciled = Boolean(fresh?.connected && String(fresh.productVersion || '') === VERSION);
              if (reconciled) state.bridgeManagerSyncedProductVersion = VERSION;
              else state.bridgeManagerLastProbeAt = 0;
              return {
                ...(fresh?.connected ? fresh : status),
                lastSyncAction:payload?.updated ? 'updated' : 'current',
                syncTarget:String(payload?.productVersion || VERSION),
                syncError:reconciled ? '' : 'manager restart pending'
              };
            } catch (e) {
              state.bridgeManagerLastProbeAt = 0;
              return {...status,syncError:e?.message || String(e)};
            }
          }'''

          adopt_engine = r'''  async function adoptBridgeEngineIfNeeded(status) {
            if (!status?.connected || status.engineAdoption !== true) return status;
            if (String(status.productVersion || '') !== VERSION) return status;
            if (status.engineManaged === true) {
              state.bridgeEngineAdoptionAttemptedVersion = VERSION;
              return status;
            }
            // Live engine ownership wins over a persisted attempt marker; retry safely when still unmanaged.
            state.bridgeEngineAdoptionAttemptedVersion = '';
            try {
              const res = await Risuai.nativeFetch(`${BRIDGE_MANAGER_BASE}/engine/adopt`, {method:'POST',headers:bridgeManagerAuthHeaders()});
              const text = await res.text();
              const payload = JSON.parse(text);
              if (!res.ok) {
                state.bridgeManagerLastProbeAt = 0;
                return {...status,adoptionState:String(payload?.state || 'failed'),adoptionError:String(payload?.error || `HTTP ${res.status}`),candidateSafe:typeof payload?.candidateSafe === 'boolean' ? payload.candidateSafe : status.candidateSafe};
              }
              state.bridgeManagerLastProbeAt = 0;
              const fresh = await fetchBridgeManagerStatus(true);
              if (fresh?.connected && fresh.engineManaged === true) state.bridgeEngineAdoptionAttemptedVersion = VERSION;
              else state.bridgeManagerLastProbeAt = 0;
              return {...fresh,adoptionState:String(payload?.state || (payload?.adopted ? 'adopted' : 'current')),adoptionError:''};
            } catch (e) {
              state.bridgeManagerLastProbeAt = 0;
              return {...status,adoptionState:'probe-error',adoptionError:e?.message || String(e)};
            }
          }'''

          sync_bundle = r'''  async function syncBridgeEngineBundleIfNeeded(status) {
            if (!status?.connected || status.engineManaged !== true || status.engineBundleAvailable !== true) return status;
            if (String(status.productVersion || '') !== VERSION) return status;
            if (status.engineBundled === true) {
              state.bridgeEngineBundleSyncAttemptedVersion = VERSION;
              return status;
            }
            // Live bundle state wins over a persisted attempt marker; retry while the manager still reports adopted.
            state.bridgeEngineBundleSyncAttemptedVersion = '';
            try {
              const res = await Risuai.nativeFetch(`${BRIDGE_MANAGER_BASE}/engine/sync`, {method:'POST',headers:bridgeManagerAuthHeaders()});
              const text = await res.text();
              const payload = JSON.parse(text);
              if (!res.ok) {
                state.bridgeManagerLastProbeAt = 0;
                return {...status,engineBundleSyncState:String(payload?.state || 'failed'),engineBundleSyncError:String(payload?.error || `HTTP ${res.status}`)};
              }
              state.bridgeManagerLastProbeAt = 0;
              let fresh = await fetchBridgeManagerStatus(true);
              if (!fresh?.connected || fresh.engineBundled !== true) {
                await new Promise(resolve => setTimeout(resolve, 300));
                fresh = await fetchBridgeManagerStatus(true);
              }
              const reconciled = Boolean(fresh?.connected && fresh.engineBundled === true);
              if (reconciled) state.bridgeEngineBundleSyncAttemptedVersion = VERSION;
              else state.bridgeManagerLastProbeAt = 0;
              return {
                ...(fresh?.connected ? fresh : status),
                engineBundleSyncState:String(payload?.state || (payload?.synced ? 'bundled' : 'current')),
                engineBundleSyncError:reconciled ? '' : 'engine restart pending'
              };
            } catch (e) {
              state.bridgeManagerLastProbeAt = 0;
              return {...status,engineBundleSyncState:'probe-error',engineBundleSyncError:e?.message || String(e)};
            }
          }'''

          bridge, n = re.subn(
              r"  async function syncBridgeManagerIfNeeded\(status\) \{.*?(?=\n\n  async function adoptBridgeEngineIfNeeded\(status\))",
              sync_manager,
              bridge,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'bridge manager function patch count {n}')
          bridge, n = re.subn(
              r"  async function adoptBridgeEngineIfNeeded\(status\) \{.*?(?=\n\n  async function syncBridgeEngineBundleIfNeeded\(status\))",
              adopt_engine,
              bridge,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'engine adoption function patch count {n}')
          bridge, n = re.subn(
              r"  async function syncBridgeEngineBundleIfNeeded\(status\) \{.*\Z",
              sync_bundle + '\n',
              bridge,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'engine bundle function patch count {n}')
          write(bridge_path, bridge)

          manager_path = 'plugins/usage-dashboard/runtime/bridge-manager.cjs'
          manager = read(manager_path)
          manager = require_replace(manager, "const MANAGER_VERSION = '1.2.0';", "const MANAGER_VERSION = '1.2.1';", 'manager version', 1)
          manager = require_replace(manager, "const PRODUCT_VERSION = '3.0.0-alpha.5.3';", "const PRODUCT_VERSION = '3.0.0-alpha.5.4';", 'manager product version', 1)
          write(manager_path, manager)

          # Keep existing P5 coverage active for 5.4+ bundled releases and lock the stale-marker regression.
          path = 'plugins/usage-dashboard/tests/p5-bridge-manager.cjs'
          text = read(path)
          text = text.replace("else if (version === '3.0.0-alpha.5.3')", "else if (/^3\\.0\\.0-alpha\\.5\\.(?:[3-9]|\\d{2,})$/.test(version))")
          text = text.replace("const MANAGER_VERSION = '1.2.0';", "const MANAGER_VERSION = '1.2.1';")
          marker = "assert.ok(!manager.includes('`${CURRENT_FILE}.next-${process.pid}`'), 'unknown-extension self-update temp path regressed');"
          addition = marker + "\nassert.ok(!source.includes(\"if (String(state.bridgeManagerSyncedProductVersion || '') === VERSION) return status;\"), 'persisted manager sync marker must not suppress live reconciliation');\nassert.ok(source.includes(\"state.bridgeManagerSyncedProductVersion = '';\"), 'manager mismatch must clear stale sync marker');\nassert.ok(source.includes('for (const waitMs of [200, 350, 600, 900])'), 'manager restart re-probe loop missing');"
          text = require_replace(text, marker, addition, 'bridge-manager orchestration assertions', 1)
          write(path, text)

          path = 'plugins/usage-dashboard/tests/p5-engine-adoption.cjs'
          text = read(path)
          text = require_replace(text, "const bundled = version === '3.0.0-alpha.5.3';", "const bundled = /^3\\.0\\.0-alpha\\.5\\.(?:[3-9]|\\d{2,})$/.test(version);", 'adoption bundled range', 1)
          marker = "assert.ok(!manager.includes(\"process.kill(candidate.pid, 'SIGKILL')\"), 'automatic adoption must not force-kill legacy bridge');"
          addition = marker + "\nassert.ok(!source.includes(\"if (String(state.bridgeEngineAdoptionAttemptedVersion || '') === VERSION) return status;\"), 'persisted adoption marker must not suppress live reconciliation');"
          text = require_replace(text, marker, addition, 'adoption stale-marker assertion', 1)
          write(path, text)

          path = 'plugins/usage-dashboard/tests/p5-bundled-engine.cjs'
          text = read(path)
          text = require_replace(text, "if (version !== '3.0.0-alpha.5.3')", "if (!/^3\\.0\\.0-alpha\\.5\\.(?:[3-9]|\\d{2,})$/.test(version))", 'bundled test range', 1)
          text = text.replace("const MANAGER_VERSION = '1.2.0';", "const MANAGER_VERSION = '1.2.1';")
          text = require_replace(text, "assert.equal(manifest.components.bridgeManager.version,'1.2.0');", "assert.equal(manifest.components.bridgeManager.version,'1.2.1');", 'bundled manifest manager version', 1)
          marker = "assert.ok(source.includes('bridgeEngineBundleSyncAttemptedVersion'));"
          addition = marker + "\nassert.ok(!source.includes(\"if (String(state.bridgeEngineBundleSyncAttemptedVersion || '') === VERSION) return status;\"), 'persisted bundle marker must not suppress live reconciliation');\nassert.ok(source.includes(\"state.bridgeEngineBundleSyncAttemptedVersion = '';\"), 'unbundled live status must clear stale bundle marker');"
          text = require_replace(text, marker, addition, 'bundle stale-marker assertions', 1)
          write(path, text)

          path = 'plugins/usage-dashboard/tests/p5-unified-runtime.cjs'
          text = read(path)
          text = text.replace("else if (version === '3.0.0-alpha.5.3')", "else if (/^3\\.0\\.0-alpha\\.5\\.(?:[3-9]|\\d{2,})$/.test(version))")
          text = text.replace("if (version === '3.0.0-alpha.5.3') {", "if (/^3\\.0\\.0-alpha\\.5\\.(?:[3-9]|\\d{2,})$/.test(version)) {")
          write(path, text)

          manifest_path = 'plugins/usage-dashboard/runtime/product-manifest.json'
          manifest = json.loads(read(manifest_path))
          manifest['productVersion'] = NEW
          manifest['components']['plugin']['version'] = NEW
          manifest['components']['bridge']['state'] = 'managed-bundled'
          manifest['components']['bridge']['sourceBundled'] = True
          bm = manifest['components']['bridgeManager']
          bm['state'] = 'bundled-engine-ready'
          bm['version'] = NEW_MANAGER
          bm['productVersion'] = NEW
          bm['sha256'] = hashlib.sha256(Path(manager_path).read_bytes()).hexdigest()
          write(manifest_path, json.dumps(manifest, indent=2) + '\n')
          PY

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate 5.4 product
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.4' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.4';" plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.1';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.4';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          test "$(node -e 'const fs=require("node:fs"),c=require("node:crypto");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const h=c.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex");process.stdout.write(m.components.bridgeManager.sha256===h?"ok":"bad")' plugins/usage-dashboard/runtime/product-manifest.json plugins/usage-dashboard/runtime/bridge-manager.cjs)" = ok
          git diff --check

      - name: Commit 5.4 product to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard
          if git diff --cached --quiet; then
            echo 'Local Usage 5.4 already reconciled'
            exit 0
          fi
          git commit -m 'fix: Local Usage 5.4 reconcile runtime from live status'
          git push origin HEAD:main
