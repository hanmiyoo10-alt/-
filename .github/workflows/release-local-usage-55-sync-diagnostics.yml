name: Release Local Usage 5.5 Sync Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-55-sync-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-usage-55-sync-diagnostics
  cancel-in-progress: false

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch 5.5 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          old = '3.0.0-alpha.5.4'
          new = '3.0.0-alpha.5.5'

          core_path = Path('plugins/usage-dashboard/src/00-runtime-core.part.js')
          core = core_path.read_text()
          if old not in core:
              raise SystemExit('5.4 core version marker missing')
          core = core.replace(old, new)
          core_path.write_text(core)

          diag_path = Path('plugins/usage-dashboard/src/40-diagnostics.part.js')
          diag = diag_path.read_text()
          if 'Bridge manager sync: action' in diag:
              raise SystemExit('manager sync diagnostic already present')
          lines = diag.splitlines(keepends=True)
          index = next((i for i, line in enumerate(lines) if '`Bridge manager probe:' in line), None)
          if index is None:
              raise SystemExit('manager probe diagnostic marker missing')
          lines[index + 1:index + 1] = [
              "      `Bridge manager sync: action ${state.bridgeManagerRuntime?.lastSyncAction || 'none'} · target ${state.bridgeManagerRuntime?.syncTarget || '—'} · error ${state.bridgeManagerRuntime?.syncError || 'none'}`,\n",
              "      `Bridge engine sync: bundle ${state.bridgeManagerRuntime?.engineBundleSyncState || 'none'} · error ${state.bridgeManagerRuntime?.engineBundleSyncError || 'none'}`,\n",
          ]
          diag_path.write_text(''.join(lines))

          manager_path = Path('plugins/usage-dashboard/runtime/bridge-manager.cjs')
          manager = manager_path.read_text()
          expected = "const PRODUCT_VERSION = '3.0.0-alpha.5.4';"
          replacement = "const PRODUCT_VERSION = '3.0.0-alpha.5.5';"
          if expected not in manager:
              raise SystemExit('5.4 manager product marker missing')
          manager_path.write_text(manager.replace(expected, replacement, 1))

          manifest_path = Path('plugins/usage-dashboard/runtime/product-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('productVersion') != old:
              raise SystemExit('5.4 product manifest marker missing')
          manifest['productVersion'] = new
          manifest['components']['plugin']['version'] = new
          manifest['components']['bridgeManager']['productVersion'] = new
          manifest['components']['bridgeManager']['sha256'] = hashlib.sha256(manager_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          test_path = Path('plugins/usage-dashboard/tests/p5-bridge-manager.cjs')
          test = test_path.read_text()
          needle = "  'Bridge manager probe:',\n  'engine-managed ${runtimeBridge.engineManaged',"
          replacement = "  'Bridge manager probe:',\n  'Bridge manager sync: action',\n  'Bridge engine sync: bundle',\n  'engine-managed ${runtimeBridge.engineManaged',"
          if needle not in test:
              raise SystemExit('bridge manager test marker missing')
          test_path.write_text(test.replace(needle, replacement, 1))
          PY

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate product
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          test "$(sed -n 's#^//@version ##p' plugins/usage-dashboard/latest.js | head -n1)" = '3.0.0-alpha.5.5'
          grep -Fq "const VERSION = '3.0.0-alpha.5.5';" plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge manager sync: action' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge engine sync: bundle' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.1';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.5';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          ENGINE_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridge?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$ENGINE_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')"
          MANAGER_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridgeManager?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$MANAGER_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-manager.cjs | awk '{print $1}')"
          git diff --check

      - name: Commit 5.5 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js \
                  plugins/usage-dashboard/src/00-runtime-core.part.js \
                  plugins/usage-dashboard/src/40-diagnostics.part.js \
                  plugins/usage-dashboard/src/manifest.json \
                  plugins/usage-dashboard/runtime/bridge-manager.cjs \
                  plugins/usage-dashboard/runtime/product-manifest.json \
                  plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          git diff --cached --check
          git commit -m 'diag: Local Usage 5.5 expose runtime sync errors'
          git push origin HEAD:main

      - name: Publish validated artifacts to release branch
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          grep -Fq '//@version 3.0.0-alpha.5.5' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge manager sync: action' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge engine sync: bundle' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.5"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.5 diagnostics'
          git push origin HEAD:release-usage-dashboard
