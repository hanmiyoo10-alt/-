name: Release Local Usage 5.6 NativeFetch POST Body

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-56-nativefetch-post-body.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-usage-56-nativefetch-post-body
  cancel-in-progress: false

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Local Usage 5.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib

          root = Path('plugins/usage-dashboard')
          core = root / 'src/00-runtime-core.part.js'
          bridge = root / 'src/20-bridge-io.part.js'
          manager = root / 'runtime/bridge-manager.cjs'
          product = root / 'runtime/product-manifest.json'
          test = root / 'tests/p5-bridge-manager.cjs'

          s = core.read_text()
          if '3.0.0-alpha.5.5' not in s:
              raise SystemExit('expected 5.5 core version marker missing')
          core.write_text(s.replace('3.0.0-alpha.5.5', '3.0.0-alpha.5.6'))

          s = bridge.read_text()
          old = "{method:'POST',headers:bridgeManagerAuthHeaders()}"
          new = "{method:'POST',headers:{...bridgeManagerAuthHeaders(),'Content-Type':'application/json'},body:'{}'}"
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 manager POST calls, found {count}')
          bridge.write_text(s.replace(old, new))

          s = manager.read_text()
          if "const PRODUCT_VERSION = '3.0.0-alpha.5.5';" not in s:
              raise SystemExit('expected manager product 5.5 marker missing')
          manager.write_text(s.replace("const PRODUCT_VERSION = '3.0.0-alpha.5.5';", "const PRODUCT_VERSION = '3.0.0-alpha.5.6';"))

          m = json.loads(product.read_text())
          m['productVersion'] = '3.0.0-alpha.5.6'
          m['components']['plugin']['version'] = '3.0.0-alpha.5.6'
          m['components']['bridgeManager']['productVersion'] = '3.0.0-alpha.5.6'
          m['components']['bridgeManager']['sha256'] = hashlib.sha256(manager.read_bytes()).hexdigest()
          product.write_text(json.dumps(m, indent=2) + '\n')

          s = test.read_text()
          marker = "const managerPostBodyCalls = (source.match(/body:'\\{\\}'/g) || []).length;"
          if marker not in s:
              insert = "\nconst managerPostBodyCalls = (source.match(/body:'\\{\\}'/g) || []).length;\nassert.equal(managerPostBodyCalls, 3, 'all Risuai.nativeFetch manager POST calls must include a body');\nassert.equal((source.match(/'Content-Type':'application\\/json'/g) || []).length, 3, 'all manager POST calls must declare JSON content type');\n"
              needle = "\nconsole.log(`usage-dashboard P5 bridge manager regression: OK · ${version}`);"
              if needle not in s:
                  raise SystemExit('p5 bridge-manager console marker missing')
              s = s.replace(needle, insert + needle)
              test.write_text(s)
          PY

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate Local Usage 5.6
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.6' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.6';" plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.6"' plugins/usage-dashboard/runtime/product-manifest.json
          test "$(grep -o "body:'{}'" plugins/usage-dashboard/latest.js | wc -l)" -eq 3
          test "$(grep -o "'Content-Type':'application/json'" plugins/usage-dashboard/latest.js | wc -l)" -eq 3
          ENGINE_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridge?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$ENGINE_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')"
          MANAGER_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridgeManager?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$MANAGER_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-manager.cjs | awk '{print $1}')"
          git diff --check

      - name: Commit 5.6 product to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard
          git commit -m 'fix: Local Usage 5.6 add nativeFetch POST bodies'
          git push origin HEAD:main
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime

      - name: Publish validated 5.6 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.6' plugins/usage-dashboard/latest.js
          test "$(grep -o "body:'{}'" plugins/usage-dashboard/latest.js | wc -l)" -eq 3
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.6 product artifacts'
          git push origin HEAD:release-usage-dashboard
