name: Release Local Usage 5.7 Termux Engine Env Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-57-termux-env.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 5.7 patch
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_alpha57_patch.py
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate 5.7 patch
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.7' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.2';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const TERMUX_EXEC_LD_PRELOAD = path.join(PREFIX, 'lib', 'libtermux-exec-ld-preload.so');" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'export LD_PRELOAD=${shellQuote(TERMUX_EXEC_LD_PRELOAD)}' plugins/usage-dashboard/runtime/bridge-manager.cjs
          git diff --check

      - name: Commit 5.7 source patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src plugins/usage-dashboard/runtime plugins/usage-dashboard/tests/p5-bridge-manager.cjs plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          git diff --cached --check
          git commit -m 'fix: preserve Termux exec environment for managed bridge'
          git push origin HEAD:main
