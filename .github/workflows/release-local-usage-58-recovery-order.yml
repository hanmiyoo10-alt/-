name: Release Local Usage 5.8 Recovery Order Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-58-recovery-order.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate 5.8 product
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          ENGINE_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridge?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$ENGINE_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')"
          MANAGER_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridgeManager?.sha256||""))' plugins/usage-dashboard/runtime/product-manifest.json)"
          test "$MANAGER_SHA" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-manager.cjs | awk '{print $1}')"
          grep -Fq '//@version 3.0.0-alpha.5.8' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('plugins/usage-dashboard/latest.js','utf8');
          const manager = s.indexOf("const managerStatus = await fetchBridgeManagerStatus(reason !== 'timer');");
          const snapshot = s.indexOf('state.data = applyObservedToday(await fetchSnapshot());');
          if (!(manager >= 0 && snapshot >= 0 && manager < snapshot)) throw new Error('recovery order regression');
          NODE
          git diff --check

      - name: Publish 5.8 product artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.8' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.8"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq "const MANAGER_VERSION = '1.2.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.8 product artifacts'
          git push origin HEAD:release-usage-dashboard
