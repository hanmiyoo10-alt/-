name: Release Local Usage 5.8 Recovery Order Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-58-recovery-order.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 5.8 patch
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_alpha58_patch.py
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write

      - name: Validate 5.8 patch
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.8' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('plugins/usage-dashboard/latest.js','utf8');
          const manager = s.indexOf("const managerStatus = await fetchBridgeManagerStatus(reason !== 'timer');");
          const snapshot = s.indexOf('state.data = applyObservedToday(await fetchSnapshot());');
          if (!(manager >= 0 && snapshot >= 0 && manager < snapshot)) throw new Error('recovery order regression');
          NODE
          git diff --check

      - name: Commit 5.8 source patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            plugins/usage-dashboard/src/00-runtime-core.part.js \
            plugins/usage-dashboard/src/30-refresh-runtime.part.js \
            plugins/usage-dashboard/src/manifest.json \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json \
            plugins/usage-dashboard/tests/p5-bridge-manager.cjs \
            plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          git diff --cached --check
          git commit -m 'fix: reconcile managed runtime before snapshot fetch'
          git push origin HEAD:main
