name: Release Local Usage Dashboard alpha.3.7

on:
  push:
    paths:
      - '.github/workflows/release-local-usage-alpha37.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch latest.js to alpha.3.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/usage-dashboard/latest.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing marker: {label}')
              s = s.replace(old, new, 1)

          rep('//@version 3.0.0-alpha.3.6', '//@version 3.0.0-alpha.3.7', 'meta version')
          rep("const VERSION = '3.0.0-alpha.3.6';", "const VERSION = '3.0.0-alpha.3.7';", 'runtime version')
          rep('    staleAfterMs: 300000,\n', '    staleAfterMs: 0, stalePolicyV37Migrated: false,\n', 'default stale policy')
          rep("      `Stale after: ${Math.round((Number(state.staleAfterMs)||0)/1000)}s`,\n", "      `Stale after: ${Number(state.staleAfterMs) > 0 ? `${Math.round(Number(state.staleAfterMs)/1000)}s` : 'off'}`,\n", 'diagnostics stale label')
          rep("        <label><span>STALE 기준</span><select id=\"stale-ms\">${[[60000,'1분'],[300000,'5분'],[900000,'15분'],[1800000,'30분'],[0,'사용 안 함']].map(([v,l])=>`<option value=\"${v}\" ${Number(state.staleAfterMs)===v?'selected':''}>${l}</option>`).join('')}</select></label>\n", "        <label><span>STALE 기준</span><select id=\"stale-ms\">${[[0,'사용 안 함 · Local JSON 기본'],[60000,'1분'],[300000,'5분'],[900000,'15분'],[1800000,'30분']].map(([v,l])=>`<option value=\"${v}\" ${Number(state.staleAfterMs)===v?'selected':''}>${l}</option>`).join('')}</select></label>\n", 'settings stale select')
          rep("        state.staleAfterMs = Math.max(0, Number(q('#stale-ms')?.value ?? state.staleAfterMs));\n        state.widgetMode = q('#widget-mode')?.value === 'detailed' ? 'detailed' : 'compact';\n", "        state.staleAfterMs = Math.max(0, Number(q('#stale-ms')?.value ?? state.staleAfterMs));\n        state.stalePolicyV37Migrated = true;\n        state.widgetMode = q('#widget-mode')?.value === 'detailed' ? 'detailed' : 'compact';\n", 'connect save migration marker')
          rep("    if (q('#stale-ms')) q('#stale-ms').onchange = async e => { state.staleAfterMs = Math.max(0, Number(e.target.value)||0); await persist(); await renderWidget(); renderSettings(); };\n", "    if (q('#stale-ms')) q('#stale-ms').onchange = async e => { state.staleAfterMs = Math.max(0, Number(e.target.value)||0); state.stalePolicyV37Migrated = true; await persist(); await renderWidget(); renderSettings(); };\n", 'stale onchange migration marker')
          rep("    state={...DEFAULTS,...((await store.getItem(STATE_KEY))||{})};\n    try{state.bridgeBase=normalizeBridgeBase(state.bridgeBase);}catch(_){state.bridgeBase=DEFAULT_BRIDGE;state.bridgeEnabled=false;}\n", "    state={...DEFAULTS,...((await store.getItem(STATE_KEY))||{})};\n    if (state.stalePolicyV37Migrated !== true) {\n      if (Number(state.staleAfterMs) === 300000) state.staleAfterMs = 0;\n      state.stalePolicyV37Migrated = true;\n      await store.setItem(STATE_KEY,state);\n    }\n    try{state.bridgeBase=normalizeBridgeBase(state.bridgeBase);}catch(_){state.bridgeBase=DEFAULT_BRIDGE;state.bridgeEnabled=false;}\n", 'one-time migration')

          p.write_text(s, encoding='utf-8')
          PY
          node --check plugins/usage-dashboard/latest.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.7'
          git push origin main
