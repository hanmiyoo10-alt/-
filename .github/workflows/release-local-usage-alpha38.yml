name: Release Local Usage Dashboard alpha.3.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.13 to alpha.3.14
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.13') || !src.includes("const VERSION = '3.0.0-alpha.3.13';")) {
            throw new Error('latest.js가 정확한 alpha.3.13이 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.13', '//@version 3.0.0-alpha.3.14');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.13';", "const VERSION = '3.0.0-alpha.3.14';");

          replaceOnce(
            '상세 월간 라벨',
            "${row(m?.label||'월간',main(m),'#aeb5c0')}",
            "${row(detailed?'월간 남음':(m?.label||'월간'),main(m),'#aeb5c0')}"
          );
          replaceOnce(
            '상세 Premium 라벨',
            "${row(w?.label||'주간',main(w),'#b7add0')}",
            "${row(detailed?'프리미엄 남음':(w?.label||'주간'),main(w),'#b7add0')}"
          );
          replaceOnce(
            '상세 Credits 라벨',
            "${row(c?.label||'Credits',detailed?money(c?.balance):(num(c?.todayUsed)?money(c.todayUsed,4):money(c?.balance)),'#9fc9df')}",
            "${row(detailed?'크레딧':(c?.label||'Credits'),detailed?money(c?.balance):(num(c?.todayUsed)?money(c.todayUsed,4):money(c?.balance)),'#9fc9df')}"
          );

          const oldSubStyle = 'style="color:#7f8792;font-size:10px"';
          const newSubStyle = 'style="color:#7f8792;font-size:11px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap"';
          const subCount = src.split(oldSubStyle).length - 1;
          if (subCount !== 3) throw new Error(`상세 sub style 개수 이상: ${subCount}`);
          src = src.split(oldSubStyle).join(newSubStyle);

          replaceOnce(
            '24h 요약 nowrap',
            'style="color:#969da8;font-size:10px;border-top:1px solid rgba(255,255,255,.09);margin-top:7px;padding-top:6px"',
            'style="color:#8e96a2;font-size:10px;font-weight:650;line-height:1.35;border-top:1px solid rgba(255,255,255,.09);margin-top:7px;padding-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right"'
          );

          replaceOnce(
            '위젯 폭 helper',
            '  async function ensureWidget() {',
            "  const widgetWidth = () => state.widgetMode === 'detailed' ? 'clamp(196px,52vw,220px)' : 'clamp(166px,44vw,184px)';\n\n  async function ensureWidget() {"
          );
          replaceOnce(
            '초기 위젯 폭',
            'width:184px;max-width:calc(100vw - 16px);',
            'width:${widgetWidth()};max-width:calc(100vw - 16px);'
          );
          replaceOnce(
            '렌더 시 위젯 폭 동기화',
            "  async function renderWidget() {\n    await ensureWidget(); if (!widget) return;\n    await widget.setStyle('display',state.widgetVisible===false?'none':'block');",
            "  async function renderWidget() {\n    await ensureWidget(); if (!widget) return;\n    await widget.setStyle('width',widgetWidth());\n    await widget.setStyle('display',state.widgetVisible===false?'none':'block');"
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.14$' plugins/usage-dashboard/latest.js
          grep -q "'월간 남음'" plugins/usage-dashboard/latest.js
          grep -q "'프리미엄 남음'" plugins/usage-dashboard/latest.js
          grep -q "'크레딧'" plugins/usage-dashboard/latest.js
          grep -q 'clamp(196px,52vw,220px)' plugins/usage-dashboard/latest.js
          grep -q "setStyle('width',widgetWidth())" plugins/usage-dashboard/latest.js
          grep -q 'white-space:nowrap;text-align:right' plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.14'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.14 widget layout parity'
          git push
