name: Release Local Usage Dashboard alpha.3.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.14 to alpha.3.15
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.14') || !src.includes("const VERSION = '3.0.0-alpha.3.14';")) {
            throw new Error('latest.js가 정확한 alpha.3.14가 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.14', '//@version 3.0.0-alpha.3.15');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.14';", "const VERSION = '3.0.0-alpha.3.15';");

          replaceOnce(
            '위치 초기화 버튼',
            '<button id="toggle">${state.widgetVisible===false?\'위젯 보이기\':\'위젯 숨기기\'}</button></div>',
            '<button id="toggle">${state.widgetVisible===false?\'위젯 보이기\':\'위젯 숨기기\'}</button><button id="reset-position">위치 초기화</button></div>'
          );

          replaceOnce(
            '위치 초기화 핸들러',
            "    if (q('#toggle')) q('#toggle').onclick = async () => { state.widgetVisible = state.widgetVisible === false; await persist(); await renderWidget(); renderSettings(); };\n",
            "    if (q('#toggle')) q('#toggle').onclick = async () => { state.widgetVisible = state.widgetVisible === false; await persist(); await renderWidget(); renderSettings(); };\n    if (q('#reset-position')) q('#reset-position').onclick = async () => {\n      state.widgetX = null;\n      state.widgetY = null;\n      drag = null;\n      await persist();\n      if (widget) {\n        await widget.setStyle('left','auto');\n        await widget.setStyle('top','auto');\n        await widget.setStyle('right','12px');\n        await widget.setStyle('bottom','74px');\n      }\n      await renderWidget();\n      renderSettings();\n    };\n"
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.15$' plugins/usage-dashboard/latest.js
          grep -q 'id="reset-position">위치 초기화' plugins/usage-dashboard/latest.js
          grep -q "q('#reset-position')" plugins/usage-dashboard/latest.js
          grep -q "setStyle('right','12px')" plugins/usage-dashboard/latest.js
          grep -q "setStyle('bottom','74px')" plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.15'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.15 widget position reset'
          git push
