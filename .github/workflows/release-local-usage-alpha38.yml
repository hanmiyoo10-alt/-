name: Release Local Usage Dashboard alpha.3.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.11 to alpha.3.12
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.11') || !src.includes("const VERSION = '3.0.0-alpha.3.11';")) {
            throw new Error('latest.js가 정확한 alpha.3.11이 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.11', '//@version 3.0.0-alpha.3.12');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.11';", "const VERSION = '3.0.0-alpha.3.12';");

          replaceOnce(
            'reset timer 변수',
            "  let store, state, token = '', refreshTimer = null, refreshInFlight = null;",
            "  let store, state, token = '', refreshTimer = null, resetSyncTimer = null, refreshInFlight = null;"
          );

          const resetScheduler = `  function resetTimestamp(value) {
            if (value === null || value === undefined || value === '') return null;
            if (num(value)) {
              const n = Number(value);
              return n > 0 && n < 1000000000000 ? n * 1000 : n;
            }
            const parsed = Date.parse(String(value));
            return Number.isFinite(parsed) ? parsed : null;
          }

          function scheduleResetSync() {
            if (resetSyncTimer) clearTimeout(resetSyncTimer);
            resetSyncTimer = null;
            if (!state?.bridgeEnabled || !token || !state?.data) return;
            const now = Date.now();
            const resetCandidates = [
              resetTimestamp(state.data.monthly?.resetAt),
              resetTimestamp(state.data.weekly?.resetAt)
            ].filter(value => Number.isFinite(value) && value > now);
            if (!resetCandidates.length) return;
            const nextReset = Math.min(...resetCandidates);
            const delay = Math.min(2147480000, Math.max(1000, nextReset - now + 3000));
            resetSyncTimer = setTimeout(async () => {
              resetSyncTimer = null;
              if (nextReset - Date.now() > 5000) {
                scheduleResetSync();
                return;
              }
              await refresh('reset', true);
            }, delay);
          }

`;

          replaceOnce(
            'reset scheduler 삽입',
            '  function scheduleRefresh() {',
            resetScheduler + '  function scheduleRefresh() {'
          );

          replaceOnce(
            'refresh와 reset scheduler 연결',
            "  function scheduleRefresh() {\n    if (refreshTimer) clearTimeout(refreshTimer); refreshTimer=null;\n    const baseMs=Math.max(0,Number(state.refreshMs)||0);",
            "  function scheduleRefresh() {\n    if (refreshTimer) clearTimeout(refreshTimer); refreshTimer=null;\n    scheduleResetSync();\n    const baseMs=Math.max(0,Number(state.refreshMs)||0);"
          );

          replaceOnce(
            'unload reset timer 정리',
            "      if(refreshTimer)clearTimeout(refreshTimer);\n",
            "      if(refreshTimer)clearTimeout(refreshTimer);\n      if(resetSyncTimer)clearTimeout(resetSyncTimer);\n"
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.12$' plugins/usage-dashboard/latest.js
          grep -q 'resetSyncTimer' plugins/usage-dashboard/latest.js
          grep -q 'function scheduleResetSync' plugins/usage-dashboard/latest.js
          grep -q "refresh('reset', true)" plugins/usage-dashboard/latest.js
          grep -q 'nextReset - now + 3000' plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.12'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.12 reset sync timer'
          git push
