name: Release Local Usage Dashboard alpha.3.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.10 to alpha.3.11
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.10') || !src.includes("const VERSION = '3.0.0-alpha.3.10';")) {
            throw new Error('latest.js가 정확한 alpha.3.10이 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.10', '//@version 3.0.0-alpha.3.11');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.10';", "const VERSION = '3.0.0-alpha.3.11';");

          replaceOnce(
            'reset period helper',
            "function applyObservedToday(snapshot) {\n",
            "function resetPeriodKey(value) {\n  if (value === null || value === undefined || value === '') return null;\n  if (num(value)) return String(Number(value));\n  const parsed = Date.parse(String(value));\n  return Number.isFinite(parsed) ? String(parsed) : String(value);\n}\n\nfunction applyObservedToday(snapshot) {\n"
          );

          replaceOnce(
            'period keys read',
            "  const today = localDateKey();\n\n  const previous = state.dailyUsage?.date === today ? state.dailyUsage : null;\n",
            "  const today = localDateKey();\n  const monthlyPeriod = resetPeriodKey(snapshot.monthly?.resetAt);\n  const premiumPeriod = resetPeriodKey(snapshot.weekly?.resetAt);\n\n  const previous = state.dailyUsage?.date === today ? state.dailyUsage : null;\n"
          );

          replaceOnce(
            'period transition baseline reset',
            "  let monthlyBaseline = num(previous?.monthlyBaseline) ? Number(previous.monthlyBaseline) : monthlyUsed;\n  let premiumBaseline = num(previous?.premiumBaseline) ? Number(previous.premiumBaseline) : premiumUsed;\n\n  if (num(monthlyUsed) && num(monthlyBaseline) && monthlyUsed < monthlyBaseline) monthlyBaseline = monthlyUsed;\n  if (num(premiumUsed) && num(premiumBaseline) && premiumUsed < premiumBaseline) premiumBaseline = premiumUsed;\n",
            "  let monthlyBaseline = num(previous?.monthlyBaseline) ? Number(previous.monthlyBaseline) : monthlyUsed;\n  let premiumBaseline = num(previous?.premiumBaseline) ? Number(previous.premiumBaseline) : premiumUsed;\n\n  const monthlyPeriodChanged = Boolean(previous?.monthlyPeriod && monthlyPeriod && previous.monthlyPeriod !== monthlyPeriod);\n  const premiumPeriodChanged = Boolean(previous?.premiumPeriod && premiumPeriod && previous.premiumPeriod !== premiumPeriod);\n  if (monthlyPeriodChanged) monthlyBaseline = monthlyUsed;\n  if (premiumPeriodChanged) premiumBaseline = premiumUsed;\n\n  // Fallback for bridges that omit/reset resetAt: a counter drop still means a new period.\n  if (num(monthlyUsed) && num(monthlyBaseline) && monthlyUsed < monthlyBaseline) monthlyBaseline = monthlyUsed;\n  if (num(premiumUsed) && num(premiumBaseline) && premiumUsed < premiumBaseline) premiumBaseline = premiumUsed;\n"
          );

          replaceOnce(
            'period keys persist',
            "    monthlyBaseline,\n    premiumBaseline,\n    observedFrom: previous?.observedFrom || Date.now(),\n",
            "    monthlyBaseline,\n    premiumBaseline,\n    monthlyPeriod,\n    premiumPeriod,\n    observedFrom: (monthlyPeriodChanged || premiumPeriodChanged) ? Date.now() : (previous?.observedFrom || Date.now()),\n"
          );

          replaceOnce(
            'daily source marker',
            "    source: 'key-status-local-delta'\n",
            "    source: 'key-status-local-delta-reset-aware'\n"
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.11$' plugins/usage-dashboard/latest.js
          grep -q 'function resetPeriodKey' plugins/usage-dashboard/latest.js
          grep -q 'monthlyPeriodChanged' plugins/usage-dashboard/latest.js
          grep -q 'premiumPeriodChanged' plugins/usage-dashboard/latest.js
          grep -q "key-status-local-delta-reset-aware" plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.11'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.11 reset-aware daily usage'
          git push
