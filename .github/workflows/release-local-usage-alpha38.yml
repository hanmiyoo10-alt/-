name: Release Local Usage Dashboard alpha.3.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.15 to alpha.3.16
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.15') || !src.includes("const VERSION = '3.0.0-alpha.3.15';")) {
            throw new Error('latest.js가 정확한 alpha.3.15가 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.15', '//@version 3.0.0-alpha.3.16');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.15';", "const VERSION = '3.0.0-alpha.3.16';");

          replaceOnce(
            'JSON 내보내기 버튼',
            '<div class="actions"><button id="copy-diag">진단 복사</button></div></section>',
            '<div class="actions"><button id="copy-diag">진단 복사</button><button id="export-json">JSON 내보내기</button></div></section>'
          );

          replaceOnce(
            'JSON 내보내기 핸들러',
            "    if (q('#copy-diag')) q('#copy-diag').onclick = async e => { const b=e.currentTarget, old=b.textContent; b.textContent=(await copyDiag())?'복사됨 ✓':'복사 실패'; setTimeout(()=>b.textContent=old,1200); };\n",
            "    if (q('#copy-diag')) q('#copy-diag').onclick = async e => { const b=e.currentTarget, old=b.textContent; b.textContent=(await copyDiag())?'복사됨 ✓':'복사 실패'; setTimeout(()=>b.textContent=old,1200); };\n    if (q('#export-json')) q('#export-json').onclick = () => {\n      const payload = {\n        exportedAt: new Date().toISOString(),\n        plugin: {name:'Local Usage Dashboard', version:VERSION},\n        usage: state.data || null,\n        dailyUsage: state.dailyUsage || null,\n        creditDailyUsage: state.creditDailyUsage || null,\n        sync: {\n          bridgeBase: state.bridgeBase || DEFAULT_BRIDGE,\n          bridgeEnabled: state.bridgeEnabled === true,\n          bridgeStatus: state.bridgeStatus || 'off',\n          refreshMs: Number(state.refreshMs || 0),\n          lastSyncAt: state.lastSyncAt || null,\n          lastSyncDurationMs: state.lastSyncDurationMs ?? null,\n          lastRefreshReason: state.lastRefreshReason || '',\n          refreshCount: Number(state.refreshCount || 0),\n          failures: Number(state.consecutiveFailures || 0),\n          error: state.bridgeError || ''\n        }\n      };\n      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});\n      const a = document.createElement('a');\n      const url = URL.createObjectURL(blob);\n      a.href = url;\n      a.download = `local-usage-dashboard-${new Date().toISOString().slice(0,10)}.json`;\n      a.click();\n      setTimeout(() => URL.revokeObjectURL(url), 0);\n    };\n"
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.16$' plugins/usage-dashboard/latest.js
          grep -q 'id="export-json">JSON 내보내기' plugins/usage-dashboard/latest.js
          grep -q "q('#export-json')" plugins/usage-dashboard/latest.js
          grep -q 'local-usage-dashboard-' plugins/usage-dashboard/latest.js
          grep -q 'creditDailyUsage: state.creditDailyUsage' plugins/usage-dashboard/latest.js
          if grep -A35 "q('#export-json')" plugins/usage-dashboard/latest.js | grep -q 'TOKEN_KEY\|token[[:space:]]*:'; then
            echo '민감한 token 필드가 export 블록에 들어갔어.' >&2
            exit 1
          fi

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.16'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.16 JSON export'
          git push
