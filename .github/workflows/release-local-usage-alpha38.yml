name: Release Local Usage Dashboard alpha.3.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build alpha.3.8 from alpha.3.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/storage/downloads"
          bash plugins/usage-dashboard/tools/build_alpha38_devpass_standalone.sh
          OUT="$HOME/storage/downloads/local_usage_dashboard_v3.0.0-alpha.3.8.js"
          test -s "$OUT"
          grep -q '^//@name local_usage_dashboard_modular$' "$OUT"
          grep -q '^//@version 3.0.0-alpha.3.8$' "$OUT"
          grep -q 'X-DevPass-Bridge-Key' "$OUT"
          node --check "$OUT"
          cp "$OUT" plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.8'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.8 DevPass bridge adapter'
          git push
