name: Release Local Usage Dashboard alpha.3.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.17 to alpha.3.18
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.17') || !src.includes("const VERSION = '3.0.0-alpha.3.17';")) {
            throw new Error('latest.js가 정확한 alpha.3.17이 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.17', '//@version 3.0.0-alpha.3.18');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.17';", "const VERSION = '3.0.0-alpha.3.18';");

          const todayHelpers = `  function dashboardDateText(value, short = false) {
            const ts = resetTimestamp(value);
            if (!Number.isFinite(ts)) return '—';
            return new Date(ts).toLocaleString('ko-KR', short
              ? {timeZone:KST_TIME_ZONE, month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'}
              : {timeZone:KST_TIME_ZONE});
          }

          function previousMonthlyStart(resetValue) {
            const end = resetTimestamp(resetValue);
            if (!Number.isFinite(end)) return null;
            const kst = new Date(end + 9 * 3600000);
            const originalDay = kst.getUTCDate();
            let year = kst.getUTCFullYear();
            let month = kst.getUTCMonth() - 1;
            if (month < 0) { month = 11; year -= 1; }
            const lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
            return Date.UTC(year, month, Math.min(originalDay, lastDay), kst.getUTCHours(), kst.getUTCMinutes(), kst.getUTCSeconds(), kst.getUTCMilliseconds()) - 9 * 3600000;
          }

          function todayOverviewMetrics(d) {
            const m=d?.monthly, w=d?.weekly, c=d?.credits, a=d?.activity;
            const devToday=num(m?.todayUsed)?Number(m.todayUsed):null;
            const premiumToday=num(w?.todayUsed)?Number(w.todayUsed):null;
            const creditsToday=num(c?.todayUsed)?Number(c.todayUsed):null;
            const observedDailyTotal=(num(devToday)||num(creditsToday)) ? Number(devToday||0)+Number(creditsToday||0) : null;
            const now=Date.now();
            const monthEnd=resetTimestamp(m?.resetAt);
            const weekEnd=resetTimestamp(w?.resetAt);
            const monthlyDays=Number.isFinite(monthEnd)&&monthEnd>now ? Math.max(1,Math.ceil((monthEnd-now)/86400000)) : null;
            const weeklyDays=Number.isFinite(weekEnd)&&weekEnd>now ? Math.max(1,Math.ceil((weekEnd-now)/86400000)) : 7;
            const monthlyTarget=monthlyDays&&num(m?.remaining)&&num(devToday) ? (Math.max(0,Number(m.remaining))+Number(devToday))/monthlyDays : null;
            const weeklyTarget=weeklyDays&&num(w?.remaining)&&num(premiumToday) ? (Math.max(0,Number(w.remaining))+Number(premiumToday))/weeklyDays : null;
            const monthlyLeft=num(monthlyTarget)&&num(devToday) ? Math.max(0,Number(monthlyTarget)-Number(devToday)) : null;
            const weeklyLeft=num(weeklyTarget)&&num(premiumToday) ? Math.max(0,Number(weeklyTarget)-Number(premiumToday)) : null;
            let projected=null, projectedPercent=null;
            const monthStart=previousMonthlyStart(monthEnd);
            if (Number.isFinite(monthStart)&&Number.isFinite(monthEnd)&&monthStart<now&&now<monthEnd&&num(m?.used)&&num(m?.limit)&&Number(m.limit)>0) {
              const elapsed=now-monthStart, total=monthEnd-monthStart;
              projected=Math.max(Number(m.used),Number(m.used)*total/elapsed);
              projectedPercent=projected/Number(m.limit)*100;
            }
            return {devToday,premiumToday,creditsToday,observedDailyTotal,monthEnd,monthlyLeft,weeklyLeft,projected,projectedPercent,cost24h:num(a?.cost24h)?Number(a.cost24h):null,resetPasses:num(w?.resetPasses)?Number(w.resetPasses):null,resetPassesExact:w?.resetPassesExact===true};
          }

`;
          replaceOnce('오늘 관측 helper 삽입', '  function settingsHtml() {', todayHelpers + '  function settingsHtml() {');

          replaceOnce(
            '오늘 관측 변수',
            "    const creditsMeta = [\n      num(c?.todayUsed) ? `오늘 ${money(c.todayUsed,4)}` : '',\n      num(runway?.avgDailySpend7d) ? `7일평균 ${money(runway.avgDailySpend7d,4)}/일` : '',\n      num(runway?.runwayDays) ? `약 ${Math.round(Number(runway.runwayDays))}일` : '',\n      d.source ? esc(d.source) : ''\n    ].filter(Boolean).join(' · ');",
            "    const creditsMeta = [\n      num(c?.todayUsed) ? `오늘 ${money(c.todayUsed,4)}` : '',\n      num(runway?.avgDailySpend7d) ? `7일평균 ${money(runway.avgDailySpend7d,4)}/일` : '',\n      num(runway?.runwayDays) ? `약 ${Math.round(Number(runway.runwayDays))}일` : '',\n      d.source ? esc(d.source) : ''\n    ].filter(Boolean).join(' · ');\n    const today = todayOverviewMetrics(d);\n    const observedStamp = state.dailyUsage?.updatedAt || state.creditDailyUsage?.updatedAt || state.lastSyncAt;"
          );

          replaceOnce(
            '오늘 관측 CSS',
            '      .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.mini{background:var(--p2);border-radius:9px;padding:9px}.mini span{display:block;color:var(--m);font-size:10px}.mini b{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n',
            '      .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.mini{background:var(--p2);border-radius:9px;padding:9px}.mini span{display:block;color:var(--m);font-size:10px}.mini b{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n      .today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.today-head b{font-size:14px}.stamp{color:var(--m);font-size:10px;white-space:nowrap}.today-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.today-grid .mini b{white-space:normal;overflow:visible;text-overflow:clip}.today-grid .accent b{color:var(--g)}.today-grid .purple b{color:var(--v)}.today-grid .cyan b{color:var(--c)}\n'
          );
          replaceOnce(
            '오늘 관측 모바일 CSS',
            '@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.minis{grid-template-columns:1fr 1fr}}',
            '@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.minis,.today-grid{grid-template-columns:1fr 1fr}}'
          );

          const todaySection = `      <section class="panel wide">
        <div class="today-head"><div><b>오늘 관측</b><p style="margin:2px 0 0">핵심 값만 한 화면에 유지</p></div><span class="stamp">KST${observedStamp ? ` · ${dashboardDateText(observedStamp)}` : ''}</span></div>
        <div class="today-grid">
          <div class="mini accent"><span>일간 총 사용량 · 관측</span><b>${money(today.observedDailyTotal,4)}</b></div>
          <div class="mini"><span>월간 총 사용량 · DevPass</span><b>${money(d.monthly?.used,4)}</b></div>
          <div class="mini"><span>오늘 DevPass</span><b>${money(today.devToday,4)}</b></div>
          <div class="mini purple"><span>오늘 프리미엄</span><b>${money(today.premiumToday,4)}</b></div>
          <div class="mini cyan"><span>오늘 Credits</span><b>${money(today.creditsToday,4)}</b></div>
          <div class="mini"><span>24h 서버 비용</span><b>${money(today.cost24h,4)}</b></div>
          <div class="mini accent"><span>월말 예상</span><b>${num(today.projected) ? `${money(today.projected)} · ${Number(today.projectedPercent).toFixed(0)}%` : '리셋 시각 필요'}</b></div>
          <div class="mini"><span>월간 남은 권장</span><b>${money(today.monthlyLeft)}</b></div>
          <div class="mini"><span>프리미엄 남은 권장</span><b>${money(today.weeklyLeft)}</b></div>
          <div class="mini purple"><span>Reset Pass</span><b>${num(today.resetPasses) ? `${today.resetPasses}장${today.resetPassesExact ? '' : ' 기본'}` : 'API 미제공'}</b></div>
          <div class="mini accent"><span>월간 초기화</span><b>${Number.isFinite(today.monthEnd) ? `${remainingTimeForDashboard(today.monthEnd)} · ${dashboardDateText(today.monthEnd,true)}` : '서버 미제공'}</b></div>
          <div class="mini"><span>Bridge 상태</span><b>${esc(h.status || '—')} · ${esc(state.bridgeStatus)}</b></div>
        </div>
        <p>DevPass/Credits의 일간 총 사용량은 이 기기에서 그날 처음 확인한 서버 누적값 이후의 증가분이야.</p>
      </section>
`;

          const remainingHelper = `  function remainingTimeForDashboard(value) {
            const timestamp=resetTimestamp(value);
            if (!Number.isFinite(timestamp)) return '—';
            const diff=timestamp-Date.now();
            if (diff<=0) return '곧 초기화';
            const totalMinutes=Math.ceil(diff/60000);
            const days=Math.floor(totalMinutes/1440);
            const hours=Math.floor((totalMinutes%1440)/60);
            const minutes=totalMinutes%60;
            if (days>0) return `${days}일 ${hours}시간`;
            if (hours>0) return `${hours}시간 ${minutes}분`;
            return `${minutes}분`;
          }

`;
          replaceOnce('남은 시간 helper 삽입', todayHelpers + '  function settingsHtml() {', todayHelpers + remainingHelper + '  function settingsHtml() {');

          replaceOnce(
            '오늘 관측 section 삽입',
            '      <section class="panel metric"><small>${esc(c?.label || \'Credits\')}</small><strong>${money(c?.balance)}</strong><p>${creditsMeta || \'—\'}</p></section>\n      <section class="panel wide"><b>24h Activity</b>',
            '      <section class="panel metric"><small>${esc(c?.label || \'Credits\')}</small><strong>${money(c?.balance)}</strong><p>${creditsMeta || \'—\'}</p></section>\n' + todaySection + '      <section class="panel wide"><b>24h Activity</b>'
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.18$' plugins/usage-dashboard/latest.js
          grep -q '오늘 관측' plugins/usage-dashboard/latest.js
          grep -q '일간 총 사용량 · 관측' plugins/usage-dashboard/latest.js
          grep -q '월말 예상' plugins/usage-dashboard/latest.js
          grep -q '월간 남은 권장' plugins/usage-dashboard/latest.js
          grep -q '프리미엄 남은 권장' plugins/usage-dashboard/latest.js
          grep -q 'Reset Pass' plugins/usage-dashboard/latest.js
          grep -q 'function todayOverviewMetrics' plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.18'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.18 today overview'
          git push
