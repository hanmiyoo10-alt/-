name: Release Local Usage Dashboard alpha.3.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha38.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.16 to alpha.3.17
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'plugins/usage-dashboard/latest.js';
          let src = fs.readFileSync(path, 'utf8');

          if (!src.includes('//@version 3.0.0-alpha.3.16') || !src.includes("const VERSION = '3.0.0-alpha.3.16';")) {
            throw new Error('latest.js가 정확한 alpha.3.16이 아니야.');
          }

          function replaceOnce(label, find, replacement) {
            const before = src;
            src = src.replace(find, replacement);
            if (src === before) throw new Error(`${label} 패치 지점을 찾지 못했어.`);
          }

          replaceOnce('메타 버전', '//@version 3.0.0-alpha.3.16', '//@version 3.0.0-alpha.3.17');
          replaceOnce('런타임 버전', "const VERSION = '3.0.0-alpha.3.16';", "const VERSION = '3.0.0-alpha.3.17';");

          replaceOnce(
            'runway 정규화',
            "      const activity = ba ? {\n        requests24h:num(ba.totalRequests)?Number(ba.totalRequests):null,\n        cost24h:num(ba.totalCost)?Number(ba.totalCost):null,\n        totalTokens24h:num(ba.totalTokens)?Number(ba.totalTokens):null,\n        errorRate24h:num(ba.errorRate)?Number(ba.errorRate):null\n      } : null;\n      const out = {",
            "      const activity = ba ? {\n        requests24h:num(ba.totalRequests)?Number(ba.totalRequests):null,\n        cost24h:num(ba.totalCost)?Number(ba.totalCost):null,\n        totalTokens24h:num(ba.totalTokens)?Number(ba.totalTokens):null,\n        errorRate24h:num(ba.errorRate)?Number(ba.errorRate):null\n      } : null;\n      const runwayRaw = r.runway && typeof r.runway === 'object' ? r.runway : null;\n      const runway = runwayRaw ? {\n        runwayDays:num(runwayRaw.runwayDays)?Number(runwayRaw.runwayDays):null,\n        avgDailySpend7d:num(runwayRaw.avgDailySpend7d)?Number(runwayRaw.avgDailySpend7d):null,\n        fetchedAt:runwayRaw.fetchedAt || r.fetchedAt || Date.now()\n      } : null;\n      const out = {"
          );

          replaceOnce(
            'runway snapshot 포함',
            '        monthly, weekly, credits, activity\n      };',
            '        monthly, weekly, credits, activity, runway\n      };'
          );

          replaceOnce(
            'settings runway 변수',
            "  function settingsHtml() {\n    const d = state.data || {}, c = d.credits, a = d.activity, h = d.health || {};",
            "  function settingsHtml() {\n    const d = state.data || {}, c = d.credits, a = d.activity, runway = d.runway, h = d.health || {};\n    const creditsMeta = [\n      num(c?.todayUsed) ? `오늘 ${money(c.todayUsed,4)}` : '',\n      num(runway?.avgDailySpend7d) ? `7일평균 ${money(runway.avgDailySpend7d,4)}/일` : '',\n      num(runway?.runwayDays) ? `약 ${Math.round(Number(runway.runwayDays))}일` : '',\n      d.source ? esc(d.source) : ''\n    ].filter(Boolean).join(' · ');"
          );

          replaceOnce(
            'Credits runway 표시',
            '<section class="panel metric"><small>${esc(c?.label || \'Credits\')}</small><strong>${money(c?.balance)}</strong><p>${num(c?.todayUsed)?`오늘 ${money(c.todayUsed,4)} · `:\'\'}${esc(d.source || \'Local Bridge\')}</p></section>',
            '<section class="panel metric"><small>${esc(c?.label || \'Credits\')}</small><strong>${money(c?.balance)}</strong><p>${creditsMeta || \'—\'}</p></section>'
          );

          fs.writeFileSync(path, src);
          NODE

          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.17$' plugins/usage-dashboard/latest.js
          grep -q 'avgDailySpend7d' plugins/usage-dashboard/latest.js
          grep -q 'runwayDays' plugins/usage-dashboard/latest.js
          grep -q 'monthly, weekly, credits, activity, runway' plugins/usage-dashboard/latest.js
          grep -q '7일평균' plugins/usage-dashboard/latest.js
          grep -q 'creditsMeta' plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.17'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.17 credits runway'
          git push
