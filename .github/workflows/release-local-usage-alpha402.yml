name: Release Local Usage Dashboard alpha.4.2 modular build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha402.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch, split, and verify deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha402_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha402_patch.py
          node plugins/usage-dashboard/tools/split_usage_dashboard.cjs
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          git diff --check
          grep -q '^//@version 3.0.0-alpha.4.2$' plugins/usage-dashboard/latest.js
          grep -q "const VERSION = '3.0.0-alpha.4.2';" plugins/usage-dashboard/latest.js
          grep -q '"format": 1' plugins/usage-dashboard/src/manifest.json
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 10
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit modular source and alpha.4.2 artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src
          STAGED="$(git diff --cached --name-only)"
          test -n "$STAGED"
          if echo "$STAGED" | grep -Ev '^plugins/usage-dashboard/(latest\.js|src/)'; then
            echo 'unexpected staged file'; exit 1
          fi
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.4.2 modular source build'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish alpha.4.2 artifact to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.4.2$' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release-usage-dashboard already matches alpha.4.2'
            exit 0
          fi
          test "$(git diff --name-only)" = 'plugins/usage-dashboard/latest.js'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: publish Local Usage Dashboard v3.0.0-alpha.4.2'
          git push origin HEAD:release-usage-dashboard
