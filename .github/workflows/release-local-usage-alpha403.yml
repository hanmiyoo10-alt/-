name: Release Local Usage Dashboard alpha.4.3 P3 UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha403.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch P3 UI, split modules, and validate
        shell: bash
        run: |
          set -euo pipefail
          # Clean up two authoring-only patcher issues before compiling it.
          sed -i '/^usage_diag = /d' plugins/usage-dashboard/tools/release_alpha403_patch.py
          sed -i "s/'function aggregateMetaText'/'const aggregateMetaText = row =>'/" plugins/usage-dashboard/tools/release_alpha403_patch.py
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha403_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha403_patch.py
          rm plugins/usage-dashboard/tools/release_alpha403_patch.py

          node plugins/usage-dashboard/tools/split_usage_dashboard.cjs
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs

          grep -Fq '//@version 3.0.0-alpha.4.3' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.4.3';" plugins/usage-dashboard/latest.js
          grep -Fq 'Provider · 요청 / 비용 / 효율' plugins/usage-dashboard/latest.js
          grep -Fq 'Model · 요청 / 비용 / 효율' plugins/usage-dashboard/latest.js
          grep -Fq '최근 요청 · 메타데이터' plugins/usage-dashboard/latest.js
          grep -Fq 'class="panel wide usage-primary"' plugins/usage-dashboard/latest.js
          grep -Fq 'class="panel wide activity-secondary"' plugins/usage-dashboard/latest.js
          grep -Fq 'class="panel wide analytics-panel"' plugins/usage-dashboard/latest.js
          grep -Fq 'class="panel wide advanced-panel"' plugins/usage-dashboard/latest.js
          grep -Fq 'UI layout: usage-first · aggregate enriched · recent metadata · advanced collapsed' plugins/usage-dashboard/latest.js
          grep -Fq 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge module freshness:' plugins/usage-dashboard/latest.js
          grep -Fq "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit alpha.4.3 modular source and artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src plugins/usage-dashboard/tools/release_alpha403_patch.py
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.4.3 P3 UI'
          git push origin HEAD:main

      - name: Publish alpha.4.3 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.4.3' plugins/usage-dashboard/latest.js
          grep -Fq '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release branch already matches alpha.4.3'
            exit 0
          fi
          test "$(git diff --name-only)" = 'plugins/usage-dashboard/latest.js'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.4.3'
          git push origin HEAD:release-usage-dashboard
