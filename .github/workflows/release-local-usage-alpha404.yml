name: Release Local Usage Dashboard alpha.4.4 P3 recent UI
# retry after recent-filter regression marker fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha404.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch P3 recent UI, split modules, and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha404_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha404_patch.py
          rm plugins/usage-dashboard/tools/release_alpha404_patch.py

          node plugins/usage-dashboard/tools/split_usage_dashboard.cjs
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs

          grep -Fq '//@version 3.0.0-alpha.4.4' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.4.4';" plugins/usage-dashboard/latest.js
          grep -Fq "recentRequestFilter: 'all'" plugins/usage-dashboard/latest.js
          grep -Fq 'data-recent-filter=' plugins/usage-dashboard/latest.js
          grep -Fq 'class="recent-filter"' plugins/usage-dashboard/latest.js
          grep -Fq 'class="stat-chip"' plugins/usage-dashboard/latest.js
          grep -Fq 'Recent UI: filter ${' plugins/usage-dashboard/latest.js
          grep -Fq '.request-detail-row{flex-direction:row' plugins/usage-dashboard/latest.js
          grep -Fq 'UI layout: usage-first · aggregate enriched · recent metadata · advanced collapsed' plugins/usage-dashboard/latest.js
          grep -Fq 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge module freshness:' plugins/usage-dashboard/latest.js
          grep -Fq "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit alpha.4.4 modular source and artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src plugins/usage-dashboard/tools/release_alpha404_patch.py
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.4.4 P3 recent UI'
          git push origin HEAD:main

      - name: Publish alpha.4.4 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.4.4' plugins/usage-dashboard/latest.js
          grep -Fq '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release branch already matches alpha.4.4'
            exit 0
          fi
          git add plugins/usage-dashboard/latest.js
          test "$(git diff --cached --name-only)" = 'plugins/usage-dashboard/latest.js'
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.4.4'
          git push origin HEAD:release-usage-dashboard
