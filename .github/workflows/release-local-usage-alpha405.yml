name: Release Local Usage Dashboard alpha.4.5 P4 render hygiene

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha405.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch P4 render hygiene and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha405_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha405_patch.py
          rm plugins/usage-dashboard/tools/release_alpha405_patch.py

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs

          grep -Fq '//@version 3.0.0-alpha.4.5' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.4.5';" plugins/usage-dashboard/latest.js
          grep -Fq 'P4 render: closed-panel skip · widget DOM dedup' plugins/usage-dashboard/latest.js
          grep -Fq 'Render cache: widget html writes' plugins/usage-dashboard/latest.js
          grep -Fq "document.body.dataset.panelOpen='0'" plugins/usage-dashboard/latest.js
          grep -Fq 'widgetRenderCache.html !== nextHtml' plugins/usage-dashboard/latest.js
          grep -Fq 'Recent UI: filter ${' plugins/usage-dashboard/latest.js
          grep -Fq 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -Fq "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit alpha.4.5 modular source and artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src plugins/usage-dashboard/tools/release_alpha405_patch.py
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.4.5 P4 render hygiene'
          git push origin HEAD:main

      - name: Publish alpha.4.5 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.4.5' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release branch already matches alpha.4.5'
            exit 0
          fi
          git add plugins/usage-dashboard/latest.js
          test "$(git diff --cached --name-only)" = 'plugins/usage-dashboard/latest.js'
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.4.5'
          git push origin HEAD:release-usage-dashboard

# rerun after moving the closed-panel guard patch to the settings UI module
