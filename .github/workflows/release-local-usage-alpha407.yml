name: Release Local Usage Dashboard alpha.4.7 hourly drilldown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha407.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch hourly drilldown and validate
        shell: bash
        run: |
          set -euo pipefail
          # rerun after aligning the cache HIT/MISS regression marker
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/usage-dashboard/tools/release_alpha407_patch.py')
          s = p.read_text()
          old_marker = "css_marker = '      .request-detail-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0;border-top:1px solid var(--l)}'"
          new_marker = "css_marker = '      .request-detail-row{'"
          if old_marker not in s:
              raise SystemExit('alpha.4.7 CSS marker fix target missing')
          s = s.replace(old_marker, new_marker, 1)
          old_apply = "s = replace_once(s, css_marker, css_insert + css_marker, 'hourly CSS')"
          new_apply = "s = s.replace(css_marker, css_insert + css_marker, 1) if css_marker in s else replace_once(s, '    </style>', css_insert + '    </style>', 'hourly CSS fallback')"
          if old_apply not in s:
              raise SystemExit('alpha.4.7 CSS apply target missing')
          p.write_text(s.replace(old_apply, new_apply, 1))
          PY
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha407_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha407_patch.py
          rm plugins/usage-dashboard/tools/release_alpha407_patch.py

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs

          grep -Fq '//@version 3.0.0-alpha.4.7' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.4.7';" plugins/usage-dashboard/latest.js
          grep -Fq 'function collectRecentRequestLedger(data)' plugins/usage-dashboard/latest.js
          grep -Fq 'function hourlyRequestDrilldownHtml(scopeKey)' plugins/usage-dashboard/latest.js
          grep -Fq '시간별 요청 · 24h 로컬 관측' plugins/usage-dashboard/latest.js
          grep -Fq 'Hourly drilldown: local observed · selected-hour lazy render · request cache HIT/MISS' plugins/usage-dashboard/latest.js
          grep -Fq 'P4 partial: auto section patch · diagnostics live · settings preserved' plugins/usage-dashboard/latest.js
          grep -Fq 'P4 render: closed-panel skip · widget DOM dedup' plugins/usage-dashboard/latest.js
          grep -Fq 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -Fq "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit alpha.4.7 modular source and artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/src plugins/usage-dashboard/tools/release_alpha407_patch.py
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.4.7 hourly request drilldown'
          git push origin HEAD:main

      - name: Publish alpha.4.7 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.4.7' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release branch already matches alpha.4.7'
            exit 0
          fi
          git add plugins/usage-dashboard/latest.js
          test "$(git diff --cached --name-only)" = 'plugins/usage-dashboard/latest.js'
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.4.7'
          git push origin HEAD:release-usage-dashboard
