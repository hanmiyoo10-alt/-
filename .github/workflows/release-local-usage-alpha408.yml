name: Release Local Usage Dashboard alpha.4.8 hourly detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha408.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch hourly detail and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha408_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha408_patch.py
          rm plugins/usage-dashboard/tools/release_alpha408_patch.py

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs

          grep -Fq '//@version 3.0.0-alpha.4.8' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.4.8';" plugins/usage-dashboard/latest.js
          grep -Fq 'Provider 합계' plugins/usage-dashboard/latest.js
          grep -Fq 'Model 합계' plugins/usage-dashboard/latest.js
          grep -Fq 'function requestLedgerCoverageText()' plugins/usage-dashboard/latest.js
          grep -Fq 'function renderHourlyDrilldownOnly()' plugins/usage-dashboard/latest.js
          grep -Fq 'Hourly detail: provider/model summary · cache coverage · click-only partial render' plugins/usage-dashboard/latest.js
          grep -Fq 'Hourly drilldown: local observed · selected-hour lazy render · request cache HIT/MISS' plugins/usage-dashboard/latest.js
          grep -Fq 'P4 partial: auto section patch · diagnostics live · settings preserved' plugins/usage-dashboard/latest.js
          grep -Fq 'P4 render: closed-panel skip · widget DOM dedup' plugins/usage-dashboard/latest.js
          grep -Fq "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          git diff --check
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit alpha.4.8 modular source and artifact to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A plugins/usage-dashboard
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.4.8 hourly detail refinement'
          git push origin HEAD:main

      - name: Publish alpha.4.8 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.4.8' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release branch already matches alpha.4.8'
            exit 0
          fi
          git add plugins/usage-dashboard/latest.js
          test "$(git diff --cached --name-only)" = 'plugins/usage-dashboard/latest.js'
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.4.8'
          git push origin HEAD:release-usage-dashboard
