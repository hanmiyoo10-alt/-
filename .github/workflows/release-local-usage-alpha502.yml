name: Release Local Usage Dashboard alpha.5.2 managed engine adoption

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-alpha502.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch alpha.5.2 and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha502_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha502_patch.py
          rm plugins/usage-dashboard/tools/release_alpha502_patch.py
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha502_fix.py
          python3 plugins/usage-dashboard/tools/release_alpha502_fix.py
          rm plugins/usage-dashboard/tools/release_alpha502_fix.py

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          git diff --check

          grep -Fq '//@version 3.0.0-alpha.5.2' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.2';" plugins/usage-dashboard/latest.js
          grep -Fq 'async function adoptBridgeEngineIfNeeded(status)' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge engine: mode' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.1.0';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "url.pathname === '/engine/adopt'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"state": "managed-adoption"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"engineAdoption": true' plugins/usage-dashboard/runtime/product-manifest.json

          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime

      - name: Commit alpha.5.2 modular product source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A plugins/usage-dashboard
          git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.5.2 managed engine adoption'
          git push origin HEAD:main

      - name: Publish alpha.5.2 product artifacts to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.2' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.2"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release branch already matches alpha.5.2'
            exit 0
          fi
          CHANGED="$(git diff --cached --name-only | sort)"
          while IFS= read -r path; do
            case "$path" in
              plugins/usage-dashboard/latest.js|plugins/usage-dashboard/runtime/product-manifest.json|plugins/usage-dashboard/runtime/bridge-manager.cjs|plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh) ;;
              *) echo "unexpected release artifact: $path"; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.2 managed runtime artifacts'
          git push origin HEAD:release-usage-dashboard
