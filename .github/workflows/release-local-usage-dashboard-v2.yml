name: Publish Local Usage Dashboard Release Channel

on:
  push:
    branches: [main]
    paths:
      - 'plugins/usage-dashboard/latest.js'
      - '.github/workflows/release-local-usage-dashboard-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate staged artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Publish only to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release-usage-dashboard already matches staged artifact'
            exit 0
          fi
          test "$(git diff --name-only)" = 'plugins/usage-dashboard/latest.js'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: publish Local Usage Dashboard channel artifact'
          git push origin HEAD:release-usage-dashboard
