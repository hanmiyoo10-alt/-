name: Release Local Usage Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'plugins/usage-dashboard/latest.js'
      - 'plugins/usage-dashboard/src/**'
      - 'plugins/usage-dashboard/runtime/**'
      - 'plugins/usage-dashboard/contracts/**'
      - 'plugins/usage-dashboard/tests/**'
      - 'plugins/usage-dashboard/tools/build_usage_dashboard.cjs'
      - 'plugins/usage-dashboard/tools/split_usage_dashboard.cjs'
      - '.github/workflows/release-local-usage-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Usage Dashboard artifact and contracts
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/contracts/snapshot-v1.schema.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/contracts/recent-request-v1.schema.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/tests/fixtures/foundation-snapshot.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/tests/fixtures/cache-zero.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/tests/fixtures/state-v3.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/tests/fixtures/p1-bridge-contract.json >/dev/null
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 10
          git diff --check

          VERSION="$(sed -n 's#^//@version ##p' plugins/usage-dashboard/latest.js | head -n1)"
          test -n "$VERSION"
          grep -Fq "const VERSION = '$VERSION';" plugins/usage-dashboard/latest.js
          grep -Fq "\"version\": \"$VERSION\"" plugins/usage-dashboard/src/manifest.json
          grep -Fq "\"productVersion\": \"$VERSION\"" plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq "\"version\": \"$VERSION\"" plugins/usage-dashboard/runtime/product-manifest.json || true
          case "$VERSION" in
            3.0.0-alpha.*|3.0.0-beta.*|3.0.0) ;;
            *) echo "unexpected Usage Dashboard version: $VERSION"; exit 1 ;;
          esac

          grep -q 'const SNAPSHOT_SCHEMA_VERSION = 1;' plugins/usage-dashboard/latest.js
          grep -q 'const RECENT_REQUEST_SCHEMA_VERSION = 1;' plugins/usage-dashboard/latest.js
          grep -q 'function hydrateState(saved)' plugins/usage-dashboard/latest.js
          grep -q 'function normalizeBridgeModule(name, row)' plugins/usage-dashboard/latest.js
          grep -q 'function normalizeErrorMap(raw)' plugins/usage-dashboard/latest.js
          grep -q 'function usageCacheText(scope)' plugins/usage-dashboard/latest.js
          grep -q 'Bridge module freshness:' plugins/usage-dashboard/latest.js
          grep -q 'Bridge module duration:' plugins/usage-dashboard/latest.js
          grep -q 'Bridge partial:' plugins/usage-dashboard/latest.js
          grep -q 'Schema: snapshot v' plugins/usage-dashboard/latest.js
          grep -q 'Usage detail:' plugins/usage-dashboard/latest.js
          grep -q 'UI layout: usage-first · aggregate enriched · recent metadata · advanced collapsed' plugins/usage-dashboard/latest.js
          grep -q 'Recent UI: filter' plugins/usage-dashboard/latest.js
          grep -q "recentRequestFilter: 'all'" plugins/usage-dashboard/latest.js
          grep -q 'data-recent-filter=' plugins/usage-dashboard/latest.js
          grep -q 'class="stat-chip"' plugins/usage-dashboard/latest.js
          grep -q 'Provider · 요청 / 비용 / 효율' plugins/usage-dashboard/latest.js
          grep -q '최근 요청 · 메타데이터' plugins/usage-dashboard/latest.js
          grep -q 'class="panel wide advanced-panel"' plugins/usage-dashboard/latest.js
          grep -q 'Render cache: widget html writes' plugins/usage-dashboard/latest.js
          grep -q 'P4 render: closed-panel skip · widget DOM dedup' plugins/usage-dashboard/latest.js
          grep -q 'function patchPanelSections(nextHtml)' plugins/usage-dashboard/latest.js
          grep -q 'function renderSettingsPartial()' plugins/usage-dashboard/latest.js
          grep -q 'Panel partial: mode' plugins/usage-dashboard/latest.js
          grep -q 'P4 partial: auto section patch · diagnostics live · settings preserved' plugins/usage-dashboard/latest.js
          grep -q 'function collectRecentRequestLedger(data)' plugins/usage-dashboard/latest.js
          grep -q 'function hourlyRequestDrilldownHtml(scopeKey)' plugins/usage-dashboard/latest.js
          grep -q '시간별 요청 · 24h 로컬 관측' plugins/usage-dashboard/latest.js
          grep -q 'Request ledger: rows' plugins/usage-dashboard/latest.js
          grep -q 'Hourly drilldown: local observed · selected-hour lazy render · request cache HIT/MISS' plugins/usage-dashboard/latest.js
          grep -q 'function aggregateSelectedHour(rows, key)' plugins/usage-dashboard/latest.js
          grep -q 'Provider 합계' plugins/usage-dashboard/latest.js
          grep -q 'Model 합계' plugins/usage-dashboard/latest.js
          grep -q 'function requestLedgerCoverageText()' plugins/usage-dashboard/latest.js
          grep -q 'function renderHourlyDrilldownOnly()' plugins/usage-dashboard/latest.js
          grep -q 'Hourly detail: provider/model summary · cache coverage · click-only partial render' plugins/usage-dashboard/latest.js
          grep -q 'function recentRequestField(row, keys)' plugins/usage-dashboard/latest.js
          grep -q 'function requestCacheSignal(row)' plugins/usage-dashboard/latest.js
          grep -q 'function requestTimestampPrecision(timestamp, sourceKey, requestNumber)' plugins/usage-dashboard/latest.js
          grep -q 'function requestLedgerCapabilities(rows)' plugins/usage-dashboard/latest.js
          grep -q 'Request fidelity: exact' plugins/usage-dashboard/latest.js
          grep -q '버킷 · 정확 시각 미제공' plugins/usage-dashboard/latest.js
          grep -Fq "['requestLedger', raw.requestLedger]" plugins/usage-dashboard/latest.js
          grep -q 'usage.input_tokens_details.cached_tokens' plugins/usage-dashboard/latest.js
          grep -q 'const PRODUCT_RUNTIME_SCHEMA_VERSION = 1;' plugins/usage-dashboard/latest.js
          grep -q "const BRIDGE_MANAGER_PROTOCOL = 'bridge-manager-v1';" plugins/usage-dashboard/latest.js
          grep -q "const BRIDGE_MANAGER_BASE = 'http://127.0.0.1:39119';" plugins/usage-dashboard/latest.js
          grep -q 'function bridgeRuntimeSnapshot()' plugins/usage-dashboard/latest.js
          grep -q 'async function fetchBridgeManagerStatus(force = false)' plugins/usage-dashboard/latest.js
          grep -q 'async function syncBridgeManagerIfNeeded(status)' plugins/usage-dashboard/latest.js
          grep -q 'Unified runtime: schema v' plugins/usage-dashboard/latest.js
          grep -q 'Bridge manager: protocol' plugins/usage-dashboard/latest.js
          grep -q 'Bridge manager probe:' plugins/usage-dashboard/latest.js
          grep -q 'Runtime manifest:' plugins/usage-dashboard/latest.js
          grep -q 'single-product-modular-sidecar' plugins/usage-dashboard/runtime/product-manifest.json
          grep -q 'legacy-external' plugins/usage-dashboard/runtime/product-manifest.json
          grep -q 'bootstrap-ready' plugins/usage-dashboard/runtime/product-manifest.json
          grep -q 'bridge-manager-v1' plugins/usage-dashboard/runtime/product-manifest.json
          grep -q "const HOST = '127.0.0.1';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -q "url.pathname === '/sync'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -q "url.pathname === '/rollback'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -q 'start-services.sh' plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          grep -q 'sv-enable' plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          grep -q "document.body.dataset.panelOpen='0'" plugins/usage-dashboard/latest.js
          grep -q 'widgetRenderCache.html !== nextHtml' plugins/usage-dashboard/latest.js
          grep -q 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -q 'Stall/render coincidence:' plugins/usage-dashboard/latest.js
          grep -q 'Bridge detail:' plugins/usage-dashboard/latest.js
          grep -q 'Performance settings:' plugins/usage-dashboard/latest.js
          grep -q 'Runtime state:' plugins/usage-dashboard/latest.js
          grep -q 'Resume input:' plugins/usage-dashboard/latest.js
          grep -q 'Panel render scheduler:' plugins/usage-dashboard/latest.js
          grep -q 'Render spike:' plugins/usage-dashboard/latest.js
          grep -q 'Scheduler: pending' plugins/usage-dashboard/latest.js
          grep -q 'Resume grace:' plugins/usage-dashboard/latest.js
          grep -q 'UI stall probe:' plugins/usage-dashboard/latest.js
          grep -q "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          grep -q 'Analytics · 24h / 7d / 30d' plugins/usage-dashboard/latest.js
          grep -q '24h Usage Scope' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js

          printf '%s\n' "$VERSION" > /tmp/usage-dashboard-version.txt
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime

      - name: Publish validated product artifacts to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat /tmp/usage-dashboard-version.txt)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq "//@version $VERSION" plugins/usage-dashboard/latest.js
          grep -Fq "\"productVersion\": \"$VERSION\"" plugins/usage-dashboard/runtime/product-manifest.json
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo "release-usage-dashboard already matches $VERSION"
            exit 0
          fi
          CHANGED="$(git diff --cached --name-only | sort)"
          while IFS= read -r path; do
            case "$path" in
              plugins/usage-dashboard/latest.js|plugins/usage-dashboard/runtime/product-manifest.json|plugins/usage-dashboard/runtime/bridge-manager.cjs|plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh) ;;
              *) echo "unexpected release artifact: $path"; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git commit -m "release: publish Local Usage Dashboard $VERSION product artifacts"
          git push origin HEAD:release-usage-dashboard
