name: Release Local Usage Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-dashboard.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alpha.3.23 to alpha.3.24
        shell: bash
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_alpha324_patch.py
          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.24$' plugins/usage-dashboard/latest.js
          grep -q 'UI_STALL_PROBE_INTERVAL_MS = 100' plugins/usage-dashboard/latest.js
          grep -q 'UI_STALL_THRESHOLD_MS = 50' plugins/usage-dashboard/latest.js
          grep -q 'function startUiStallProbe' plugins/usage-dashboard/latest.js
          grep -q 'UI stall probe:' plugins/usage-dashboard/latest.js
          grep -q 'UI Stall Probe ·' plugins/usage-dashboard/latest.js
          grep -q 'Performance guard:' plugins/usage-dashboard/latest.js
          grep -q 'Analytics · 24h / 7d / 30d' plugins/usage-dashboard/latest.js
          grep -q '24h Usage Scope' plugins/usage-dashboard/latest.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'latest.js already matches alpha.3.24'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.24 UI stall probe'
          git push
