name: Release Local Usage Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-local-usage-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch alpha.3.38 to alpha.3.39 resume merge diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha339_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha339_patch.py
          node --check plugins/usage-dashboard/latest.js
          git diff --check
          grep -q '^//@version 3.0.0-alpha.3.39$' plugins/usage-dashboard/latest.js
          grep -q "const VERSION = '3.0.0-alpha.3.39';" plugins/usage-dashboard/latest.js
          grep -q "activeRefreshReason:''" plugins/usage-dashboard/latest.js
          grep -q "lastResumeRequestedReason:''" plugins/usage-dashboard/latest.js
          grep -q "lastResumeActualReason:''" plugins/usage-dashboard/latest.js
          grep -q 'lastResumeRefreshWasCoalesced:false' plugins/usage-dashboard/latest.js
          grep -q "lastResumeCoalescedIntoReason:''" plugins/usage-dashboard/latest.js
          grep -q "normalizedReason === 'visibility' && performanceRuntime.resumeMeasurePending" plugins/usage-dashboard/latest.js
          grep -q "performanceRuntime.lastResumeRefreshWasCoalesced = true;" plugins/usage-dashboard/latest.js
          grep -q 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -q 'Resume Route · requested' plugins/usage-dashboard/latest.js
          grep -q 'Resume refresh: started' plugins/usage-dashboard/latest.js
          grep -q 'Stall/render coincidence:' plugins/usage-dashboard/latest.js
          grep -q 'Bridge detail:' plugins/usage-dashboard/latest.js
          grep -q 'Performance settings:' plugins/usage-dashboard/latest.js
          grep -q 'Runtime state:' plugins/usage-dashboard/latest.js
          grep -q 'Resume input:' plugins/usage-dashboard/latest.js
          grep -q 'Panel render scheduler:' plugins/usage-dashboard/latest.js
          grep -q 'Render spike:' plugins/usage-dashboard/latest.js
          grep -q 'Scheduler: pending' plugins/usage-dashboard/latest.js
          grep -q 'Resume grace:' plugins/usage-dashboard/latest.js
          grep -q 'UI stall probe:' plugins/usage-dashboard/latest.js
          grep -q "Risuai.registerButton({name:'Usage',icon:'📊',iconType:'html',location:'chat'" plugins/usage-dashboard/latest.js
          grep -q 'Analytics · 24h / 7d / 30d' plugins/usage-dashboard/latest.js
          grep -q '24h Usage Scope' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Commit staged release to main
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- plugins/usage-dashboard/latest.js; then
            test "$(git diff --name-only)" = 'plugins/usage-dashboard/latest.js'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add plugins/usage-dashboard/latest.js
            git commit -m 'release: Local Usage Dashboard v3.0.0-alpha.3.39 resume merge diagnostics'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'main latest.js already matches alpha.3.39'
          fi

      - name: Publish alpha.3.39 to release-usage-dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -q '^//@version 3.0.0-alpha.3.39$' plugins/usage-dashboard/latest.js
          grep -q 'Resume route: requested' plugins/usage-dashboard/latest.js
          grep -q '^//@update-url https://raw.githubusercontent.com/hanmiyoo10-alt/-/release-usage-dashboard/plugins/usage-dashboard/latest.js$' plugins/usage-dashboard/latest.js
          git diff --check
          if git diff --quiet -- plugins/usage-dashboard/latest.js; then
            echo 'release-usage-dashboard already matches alpha.3.39'
            exit 0
          fi
          test "$(git diff --name-only)" = 'plugins/usage-dashboard/latest.js'
          git add plugins/usage-dashboard/latest.js
          git commit -m 'release: publish Local Usage Dashboard v3.0.0-alpha.3.39'
          git push origin HEAD:release-usage-dashboard
