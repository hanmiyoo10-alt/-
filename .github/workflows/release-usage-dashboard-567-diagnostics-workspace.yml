name: Stage Usage Dashboard 3.0.0-alpha.5.67 Diagnostics Workspace Overhaul

on:
  push:
    branches: [main]
    paths: &release_paths
      - '.github/workflows/release-usage-dashboard-567-diagnostics-workspace.yml'
      - '.github/workflows/reusable-usage-dashboard-release.yml'
      - '.github/usage-dashboard/releases/5.67.json'
      - 'plugins/usage-dashboard/tools/diagnostics_workspace_567.part.js'
      - 'plugins/usage-dashboard/tools/release_diagnostics_workspace_567.py'
      - 'plugins/usage-dashboard/tools/validate_release_candidate.py'
      - 'plugins/usage-dashboard/tools/sync_project_guidelines.py'
      - 'plugins/usage-dashboard/tests/**'
  pull_request:
    branches: [main]
    paths: *release_paths

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.67.json
      publish: false
