name: Stage Usage Dashboard 3.0.0-alpha.5.68 Diagnostics Capture Identity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-usage-dashboard-568-diagnostics-capture-identity.yml'
      - '.github/workflows/reusable-usage-dashboard-release.yml'
      - '.github/usage-dashboard/releases/5.68.json'
      - '.github/workflows/release-command-usage-dashboard-568.yml'
      - 'plugins/usage-dashboard/tools/release_diagnostics_capture_identity_568.py'
      - 'plugins/usage-dashboard/tools/validate_release_candidate.py'
      - 'plugins/usage-dashboard/tools/sync_project_guidelines.py'
      - 'plugins/usage-dashboard/tests/**'
      - 'docs/USAGE_DASHBOARD_DEVICE_EVIDENCE_567.md'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.68.json
      publish: false
