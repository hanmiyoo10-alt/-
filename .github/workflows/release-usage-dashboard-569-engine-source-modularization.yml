name: Stage Usage Dashboard 3.0.0-alpha.5.69 Engine Development Source Modularization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-usage-dashboard-569-engine-source-modularization.yml'
      - '.github/workflows/reusable-usage-dashboard-release.yml'
      - '.github/usage-dashboard/releases/5.69.json'
      - '.github/usage-dashboard/archived-release-workflows.json'
      - '.github/workflows/release-command-usage-dashboard-569.yml'
      - 'plugins/usage-dashboard/runtime-src/**'
      - 'plugins/usage-dashboard/tools/build_bridge_engine.cjs'
      - 'plugins/usage-dashboard/tools/release_engine_source_modularization_569.py'
      - 'plugins/usage-dashboard/tools/validate_release_candidate.py'
      - 'plugins/usage-dashboard/tools/sync_project_guidelines.py'
      - 'plugins/usage-dashboard/tests/**'
      - 'docs/USAGE_DASHBOARD_ENGINE_SOURCE_MODULARIZATION_569.md'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.69.json
      publish: false

  materialize-command:
    if: github.repository == 'hanmiyoo10-alt/-' && github.head_ref == 'release/usage-dashboard-569-publish-command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout command branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize verified 5.69 candidate onto branch
        shell: bash
        run: |
          set -euo pipefail
          python3 plugins/usage-dashboard/tools/release_engine_source_modularization_569.py
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          git diff --check

          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/release-usage-dashboard-569-engine-source-modularization.yml \
            .github/workflows/release-command-usage-dashboard-569.yml \
            plugins/usage-dashboard/tests/release-infrastructure-foundation.cjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/release-usage-dashboard-569-engine-source-modularization.yml \
            .github/workflows/release-command-usage-dashboard-569.yml \
            plugins/usage-dashboard/tests/release-infrastructure-foundation.cjs \
            plugins/usage-dashboard/src \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime \
            plugins/usage-dashboard/runtime-src \
            docs/USAGE_DASHBOARD_GUIDELINES.md
          git commit -m 'release: materialize Local Usage Dashboard 3.0.0-alpha.5.69 candidate'
          git push origin HEAD:${GITHUB_HEAD_REF}
