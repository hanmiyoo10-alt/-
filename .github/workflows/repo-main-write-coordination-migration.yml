name: Repository Main Write Coordination Migration

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: repo-main-write-coordination-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.title == 'Repository main-write coordination migration command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure implementation branch
        uses: actions/checkout@v4
        with:
          ref: repo-main-write-coordination-implementation
          fetch-depth: 0

      - name: Verify implementation parent and tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 -m py_compile scripts/repo-main-write.py scripts/test-repo-main-write.py scripts/repo-main-write-migration.py
          python3 scripts/test-repo-main-write.py

      - name: Migrate current product main writers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repo-main-write-migration.py
          git diff --check

      - name: Validate bounded infrastructure-only diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/simcore-release-state-sync.yml',
              '.github/workflows/simcore-release-command.yml',
              '.github/workflows/reusable-usage-dashboard-release.yml',
              '.github/workflows/usage-dashboard-project-memory.yml',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration diff: {sorted(changed)} != {sorted(expected)}')
          for path in sorted(expected):
              text = open(path, encoding='utf-8').read()
              if 'git push origin HEAD:main' in text:
                  raise SystemExit(f'direct main push remains in migrated current writer: {path}')
              if 'scripts/repo-main-write.py' not in text:
                  raise SystemExit(f'common helper missing from migrated current writer: {path}')
              if 'group: repo-main-write' in text:
                  raise SystemExit(f'cross-product shared concurrency remains: {path}')
          assert 'group: simcore-main-state-sync' in open('.github/workflows/simcore-release-state-sync.yml', encoding='utf-8').read()
          assert 'group: simcore-main-state-sync' in open('.github/workflows/simcore-release-command.yml', encoding='utf-8').read()
          assert 'group: usage-dashboard-release' in open('.github/workflows/reusable-usage-dashboard-release.yml', encoding='utf-8').read()
          assert 'group: usage-dashboard-project-memory' in open('.github/workflows/usage-dashboard-project-memory.yml', encoding='utf-8').read()
          print('bounded current-writer migration: PASS')
          PY

      - name: Commit validated infrastructure migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/simcore-release-state-sync.yml \
            .github/workflows/simcore-release-command.yml \
            .github/workflows/reusable-usage-dashboard-release.yml \
            .github/workflows/usage-dashboard-project-memory.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Main-write coordination migration already applied.'
            exit 0
          fi
          git commit -m 'build(repo): serialize product main writes without cross-product cancellation'
          git push origin HEAD:repo-main-write-coordination-implementation

  rs2-4-shadow-prepare:
    if: github.event.pull_request.number == 208
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.ids.outputs.candidate }}
      parent: ${{ steps.ids.outputs.parent }}
      fetch_ref: ${{ steps.ids.outputs.fetch_ref }}
    steps:
      - id: ids
        shell: bash
        run: |
          echo 'candidate=08af3d2aac63b85c699bf264ebb2c207018a1e22' >> "$GITHUB_OUTPUT"
          echo 'parent=47969d24771f6cc188df6e32150fc6fde519182d' >> "$GITHUB_OUTPUT"
          echo 'fetch_ref=refs/heads/shadow/simcore-rs2-4-noop-proof' >> "$GITHUB_OUTPUT"

  rs2-4-shadow-candidate-required:
    if: github.event.pull_request.number == 208
    needs: rs2-4-shadow-prepare
    uses: ./.github/workflows/simcore-ci.yml
    with:
      profile: CANDIDATE_REQUIRED
      candidate_commit: ${{ needs.rs2-4-shadow-prepare.outputs.candidate }}
      candidate_fetch_ref: ${{ needs.rs2-4-shadow-prepare.outputs.fetch_ref }}
      expected_production_commit: ${{ needs.rs2-4-shadow-prepare.outputs.parent }}

  rs2-4-shadow-plan:
    if: github.event.pull_request.number == 208
    needs: [rs2-4-shadow-prepare, rs2-4-shadow-candidate-required]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove live shadow plan without production mutation
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git ls-remote origin refs/heads/release-simcore | awk '{print $1}')"
          test "$BEFORE" = '47969d24771f6cc188df6e32150fc6fde519182d'
          git fetch --no-tags origin refs/heads/shadow/simcore-rs2-4-noop-proof
          git fetch --no-tags origin release-simcore
          mkdir -p .simcore-release
          node products/simcore/tooling/release-shadow.mjs \
            --spec products/simcore/releases/specs/simcore-v0.64.6-noop-99.json \
            --ci-conclusion PASS \
            --report .simcore-release/live-shadow-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open('.simcore-release/live-shadow-plan.json'))
          assert p['releaseAuthority']=='SHADOW_ONLY'
          assert p['publicationDisposition']=='WOULD_NOOP'
          assert p['productionMutation']=='NONE'
          assert p['candidate']['commit']=='08af3d2aac63b85c699bf264ebb2c207018a1e22'
          assert p['production']['commit']=='47969d24771f6cc188df6e32150fc6fde519182d'
          print('RS2_4_LIVE_SHADOW_PLAN_PASS')
          PY
          AFTER="$(git ls-remote origin refs/heads/release-simcore | awk '{print $1}')"
          test "$AFTER" = "$BEFORE"
          echo "RS2_4_RELEASE_SIMCORE_UNCHANGED=$AFTER"
