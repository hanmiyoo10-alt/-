name: Repository Actions Compatibility Proof

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/repository-actions-compat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-actions-compat-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove Current Actions Runtime
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proof ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.x'
          cache: ''

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.x'
          cache: ''

      - name: Enforce proof workflow contract
        run: node tools/repository-actions-compat/contract.mjs

      - name: Materialize deterministic proof payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p actions-compat-proof
          {
            echo 'schema=repository-actions-compat-proof:v1'
            echo "repository=$GITHUB_REPOSITORY"
            echo "event=$GITHUB_EVENT_NAME"
            echo "head=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "python=$(python3 --version 2>&1)"
          } > actions-compat-proof/payload.txt
          digest="$(sha256sum actions-compat-proof/payload.txt | awk '{print $1}')"
          test -n "$digest"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload bounded proof payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-actions-compat-proof-${{ github.run_id }}
          path: actions-compat-proof/payload.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove local proof payload
        shell: bash
        run: rm -rf actions-compat-proof

      - name: Download exact same-run proof payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repository-actions-compat-proof-${{ github.run_id }}
          path: actions-compat-proof-downloaded

      - name: Verify proof payload byte identity
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.payload.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -f actions-compat-proof-downloaded/payload.txt
          actual="$(sha256sum actions-compat-proof-downloaded/payload.txt | awk '{print $1}')"
          test "$actual" = "$EXPECTED_DIGEST"
          grep -Fx "head=$EXPECTED_SHA" actions-compat-proof-downloaded/payload.txt
          echo "REPOSITORY_ACTIONS_COMPAT_PROOF_PASS head=$EXPECTED_SHA sha256=$actual"
