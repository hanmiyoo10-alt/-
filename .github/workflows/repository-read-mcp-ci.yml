name: Repository Read MCP CI

on:
  pull_request:
    paths:
      - 'tools/repo-ci-mcp/**'
      - '.github/workflows/repository-read-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/repo-ci-mcp/**'
      - '.github/workflows/repository-read-mcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Repository Read MCP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e tools/repo-ci-mcp

      - name: Compile Repository Read MCP Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/repo-ci-mcp/repo_ci_mcp tools/repo-ci-mcp/tests

      - name: Run Repository Read MCP unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/repo-ci-mcp/tests -p 'test_*.py' -v
