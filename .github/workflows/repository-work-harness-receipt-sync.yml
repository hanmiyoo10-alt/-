name: Repository Work Harness — Receipt Sync

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: repository-work-harness-receipt-sync-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  receipt-sync:
    if: github.actor != 'github-actions[bot]' && contains(github.event.issue.body, '<!-- repository-coordination-receipt-request:v1 -->')
    runs-on: ubuntu-latest
    outputs:
      handoff_ready: ${{ steps.handoff.outputs.handoff_ready }}
      handoff_issue: ${{ steps.handoff.outputs.handoff_issue }}
    steps:
      - name: Checkout trusted default branch controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and sync requested receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ github.event.issue.number }}
        run: |
          mkdir -p .harness-output
          set +e
          node .github/plugin-control-plane/canonical-main/work-harness/receipt-sync.cjs --work-issue "$TARGET_ISSUE" > .harness-output/receipt-sync.json
          code=$?
          set -e
          {
            echo '### Repository Work Harness — Receipt Sync'
            echo '```json'
            cat .harness-output/receipt-sync.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Evaluate opt-in authoritative handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_ISSUE: ${{ github.event.issue.number }}
        run: |
          set +e
          node .github/plugin-control-plane/canonical-main/work-harness/authoritative-handoff.cjs --work-issue "$TARGET_ISSUE" > .harness-output/authoritative-handoff.json
          code=$?
          set -e
          status="$(node -e "const x=require('./.harness-output/authoritative-handoff.json'); process.stdout.write(String(x.status || ''))")"
          {
            echo '### Repository Work Harness — Authoritative Handoff'
            echo '```json'
            cat .harness-output/authoritative-handoff.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 'AUTHORITATIVE_HANDOFF_READY' ]; then
            echo 'handoff_ready=true' >> "$GITHUB_OUTPUT"
            echo "handoff_issue=$TARGET_ISSUE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'handoff_ready=false' >> "$GITHUB_OUTPUT"
          echo "handoff_issue=$TARGET_ISSUE" >> "$GITHUB_OUTPUT"
          if [ "$status" = 'AUTHORITATIVE_HANDOFF_NOT_REQUESTED' ]; then
            exit 0
          fi
          exit "$code"
      - name: Upload exact receipt-sync and handoff results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-work-harness-receipt-sync-${{ github.run_id }}
          path: .harness-output/*.json
          if-no-files-found: error
          retention-days: 14

  authoritative-handoff:
    needs: receipt-sync
    if: needs.receipt-sync.outputs.handoff_ready == 'true'
    uses: ./.github/workflows/canonical-main-ops.yml
    with:
      coordination_work_issue: ${{ needs.receipt-sync.outputs.handoff_issue }}
