name: Repository Work Harness — Receipt Sync

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-work-harness-receipt-sync-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  receipt-sync:
    if: github.actor != 'github-actions[bot]' && contains(github.event.issue.body, '<!-- repository-coordination-receipt-request:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and sync requested receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ github.event.issue.number }}
        run: |
          mkdir -p .harness-output
          set +e
          node .github/plugin-control-plane/canonical-main/work-harness/receipt-sync.cjs --work-issue "$TARGET_ISSUE" > .harness-output/receipt-sync.json
          code=$?
          set -e
          {
            echo '### Repository Work Harness — Receipt Sync'
            echo '```json'
            cat .harness-output/receipt-sync.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload exact receipt-sync result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-work-harness-receipt-sync-${{ github.run_id }}
          path: .harness-output/receipt-sync.json
          if-no-files-found: error
          retention-days: 14
