name: Repository Work Harness — Shadow Scan

on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: repository-work-harness-shadow-${{ github.repository }}
  cancel-in-progress: true

jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run advisory shadow scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .harness-output
          node .github/plugin-control-plane/canonical-main/work-harness/scan.cjs > .harness-output/scan.json
          node .github/plugin-control-plane/canonical-main/work-harness/report.cjs .harness-output/scan.json > .harness-output/summary.md
          cat .harness-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact shadow result
        uses: actions/upload-artifact@v4
        with:
          name: repository-work-harness-shadow-${{ github.run_id }}
          path: .harness-output/scan.json
          if-no-files-found: error
          retention-days: 14
