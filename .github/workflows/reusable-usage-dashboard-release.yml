name: Reusable Usage Dashboard Release

on:
  workflow_call:
    inputs:
      release_spec:
        description: Repository-relative release specification path
        required: true
        type: string
      publish:
        description: Publish already-materialized main artifacts to the release channel
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: usage-dashboard-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Usage Dashboard candidate
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SPEC='${{ inputs.release_spec }}'
          export UD_RELEASE_SPEC="$RELEASE_SPEC"
          case "$RELEASE_SPEC" in
            .github/usage-dashboard/releases/*.json) ;;
            *) echo "release spec path denied: $RELEASE_SPEC" >&2; exit 1 ;;
          esac
          test -f "$RELEASE_SPEC"

          UD_MATERIALIZER="$(python3 - "$RELEASE_SPEC" <<'PY'
          import json, re, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          required = ['releaseTitle','productVersion','engineVersion','managerVersion','snapshotContract','recentRequestContract','materializer']
          missing = [key for key in required if key not in spec]
          if missing:
              raise SystemExit(f'release spec missing: {", ".join(missing)}')
          path = str(spec['materializer'])
          if not re.fullmatch(r'plugins/usage-dashboard/tools/[A-Za-z0-9_.-]+\.py', path):
              raise SystemExit('materializer path denied')
          print(path)
          PY
          )"

          python3 - "$RELEASE_SPEC" "$UD_MATERIALIZER" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          values = {
              'UD_RELEASE_SPEC': sys.argv[1],
              'UD_RELEASE_TITLE': str(spec['releaseTitle']),
              'UD_PRODUCT_VERSION': str(spec['productVersion']),
              'UD_ENGINE_VERSION': str(spec['engineVersion']),
              'UD_MANAGER_VERSION': str(spec['managerVersion']),
              'UD_MATERIALIZER': sys.argv[2],
          }
          for key, value in values.items():
              if '\n' in value or '\r' in value:
                  raise SystemExit(f'invalid newline in {key}')
              print(f'{key}={value}')
          PY

          python3 -m py_compile \
            plugins/usage-dashboard/tools/check_release_monotonic.py \
            plugins/usage-dashboard/tools/validate_release_candidate.py \
            "$UD_MATERIALIZER"

          assert_test_tree_clean() {
            local status
            status="$(git status --porcelain --untracked-files=all -- plugins/usage-dashboard/tests)"
            if [[ -n "$status" ]]; then
              printf '%s\n' "$status"
              echo 'TEST_TREE_MUTATED'
              return 1
            fi
          }

          python3 "$UD_MATERIALIZER"
          assert_test_tree_clean
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --write
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          bash -n scripts/bootstrap-usage-dashboard.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check

          tests=(
            foundation.cjs release-infrastructure-foundation.cjs current-release-contract.cjs legacy-release-workflow-archive.cjs
            behavior-harness-contract.cjs behavior-cli-launcher.cjs behavior-cache-runtime.cjs behavior-snapshot-scheduler.cjs
            behavior-snapshot-attribution.cjs behavior-organization-capture.cjs behavior-cache-observer.cjs behavior-state-contract.cjs behavior-runtime-recovery.cjs behavior-service-tier-outcome.cjs
            p1-contract.cjs p2-build.cjs p3-ui.cjs p3-recent.cjs
            p4-render.cjs p4-partial.cjs p4-hourly-drilldown.cjs p4-hourly-detail.cjs p4-request-fidelity.cjs
            p5-unified-runtime.cjs p5-bridge-manager.cjs p5-engine-adoption.cjs p5-bundled-engine.cjs
            p5-lifecycle-race.cjs p5-bridge-control-sync.cjs p5-service-tier-fidelity.cjs p5-devpass-account-parity.cjs
            p5-floating-widget-ux.cjs p5-module-layout.cjs p5-structural-parity.cjs p5-state-compatibility.cjs
            p6-rc-migration.cjs p6-rc-contract.cjs p6-release-hardening.cjs p7-cache-observability.cjs
            p11-cache-fidelity.cjs p12-gh-bootstrap.cjs p13-cache-provenance-diagnostics.cjs p14-project-guidelines-memory.cjs
            p15-runtime-recovery-fidelity.cjs p16-snapshot-performance-attribution.cjs p17-bounded-cli-parallelism.cjs
            p18-organization-discovery-dedup.cjs p19-organization-empty-fallback-fidelity.cjs p20-shared-24h-capture.cjs
            p21-snapshot-scheduling-attribution.cjs p22-monotonic-release-integrity.cjs p23-credits-usage-early-start.cjs
            p24-snapshot-decision-attribution.cjs p25-long-window-critical-path-decoupling.cjs p26-foreground-cli-launcher-attribution.cjs
            p27-npx-cache-first-launcher.cjs p28-managed-direct-cli-runtime.cjs p29-diagnostics-workspace-separation.cjs p30-diagnostics-capture-identity.cjs
            p31-engine-source-modularization-parity.cjs
          )
          for test in "${tests[@]}"; do node "plugins/usage-dashboard/tests/$test"; done
          assert_test_tree_clean

          python3 plugins/usage-dashboard/tools/validate_release_candidate.py --spec "$RELEASE_SPEC"
          git diff --check
          EXPECTED_PARTS="$(node -e "console.log(require('./plugins/usage-dashboard/src/parts.cjs').PARTS.length)")"
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq "$EXPECTED_PARTS"
          ENGINE_EXPECTED_PARTS="$(node -e "console.log(require('./plugins/usage-dashboard/runtime-src/bridge-engine/parts.json').parts.length)")"
          test "$(find plugins/usage-dashboard/runtime-src/bridge-engine -maxdepth 1 -name '*.part.mjs' | wc -l)" -eq "$ENGINE_EXPECTED_PARTS"
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          grep -Fq 'STALE_CANDIDATE_MAIN' plugins/usage-dashboard/tools/check_release_monotonic.py
          grep -Fq 'SAME_VERSION_ARTIFACT_DIVERGENCE' plugins/usage-dashboard/tools/check_release_monotonic.py

      - name: Publish candidate monotonically to release channel
        if: github.event_name == 'push' && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/usage-dashboard-candidate /tmp/usage-dashboard-release
          mkdir -p /tmp/usage-dashboard-candidate/plugins/usage-dashboard
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-candidate/plugins/usage-dashboard/latest.js
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime
          cp plugins/usage-dashboard/tools/check_release_monotonic.py /tmp/check_release_monotonic.py
          cp "$UD_RELEASE_SPEC" /tmp/usage-dashboard-release-spec.json

          git fetch origin main release-usage-dashboard
          git show origin/main:plugins/usage-dashboard/runtime/product-manifest.json > /tmp/usage-dashboard-main-manifest.json
          mkdir -p /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime
          git show origin/release-usage-dashboard:plugins/usage-dashboard/latest.js > /tmp/usage-dashboard-release/plugins/usage-dashboard/latest.js
          for file in bridge-engine.mjs bridge-manager.cjs bootstrap-bridge-manager.sh product-manifest.json; do
            git show "origin/release-usage-dashboard:plugins/usage-dashboard/runtime/$file" > "/tmp/usage-dashboard-release/plugins/usage-dashboard/runtime/$file"
          done

          set +e
          GUARD_OUTPUT="$(python3 /tmp/check_release_monotonic.py \
            --candidate-manifest /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime/product-manifest.json \
            --main-manifest /tmp/usage-dashboard-main-manifest.json \
            --release-manifest /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime/product-manifest.json \
            --candidate-runtime /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime \
            --release-runtime /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime \
            --check-artifacts 2>&1)"
          GUARD_RC=$?
          set -e
          echo "$GUARD_OUTPUT"
          if [ "$GUARD_RC" -eq 2 ]; then echo 'STALE_CANDIDATE: publish skipped without touching release-usage-dashboard'; exit 0; fi
          if [ "$GUARD_RC" -ne 0 ]; then echo "monotonic release guard failed closed with rc=$GUARD_RC" >&2; exit "$GUARD_RC"; fi
          if printf '%s\n' "$GUARD_OUTPUT" | grep -Fq 'NOOP_IDENTICAL:'; then echo "release-usage-dashboard already contains identical $UD_PRODUCT_VERSION artifacts"; exit 0; fi

          RELEASE_BASE="$(git rev-parse origin/release-usage-dashboard)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard "$RELEASE_BASE"
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-candidate/plugins/usage-dashboard/latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime plugins/usage-dashboard/runtime

          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "//@version $UD_PRODUCT_VERSION" plugins/usage-dashboard/latest.js
          grep -Fq "const REQUIRED_BRIDGE_VERSION = '$UD_ENGINE_VERSION';" plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '$UD_ENGINE_VERSION';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '$UD_MANAGER_VERSION';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '$UD_PRODUCT_VERSION';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          python3 - /tmp/usage-dashboard-release-spec.json plugins/usage-dashboard/runtime/product-manifest.json <<'PY'
          import json, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          manifest = json.loads(Path(sys.argv[2]).read_text())
          actual = (
              manifest['productVersion'],
              manifest['components']['bridge']['requiredVersion'],
              manifest['components']['bridgeManager']['version'],
              manifest['contracts']['snapshot'],
              manifest['contracts']['recentRequest'],
          )
          expected = (
              spec['productVersion'], spec['engineVersion'], spec['managerVersion'],
              spec['snapshotContract'], spec['recentRequestContract'],
          )
          if actual != expected:
              raise SystemExit(f'release tuple mismatch after branch switch: {actual} != {expected}')
          PY

          git fetch origin main release-usage-dashboard
          test "$(git rev-parse origin/release-usage-dashboard)" = "$RELEASE_BASE" || { echo 'RELEASE_REF_MOVED: refusing stale release base' >&2; exit 1; }
          git show origin/main:plugins/usage-dashboard/runtime/product-manifest.json > /tmp/usage-dashboard-main-manifest-final.json
          cmp /tmp/usage-dashboard-main-manifest.json /tmp/usage-dashboard-main-manifest-final.json || { echo 'MAIN_MANIFEST_MOVED: refusing publish after main release state changed' >&2; exit 1; }

          git add -- plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git diff --cached --check
          if git diff --cached --quiet; then echo "release-usage-dashboard already matches $UD_PRODUCT_VERSION"; exit 0; fi
          git commit -m "release: publish Local Usage Dashboard $UD_PRODUCT_VERSION product artifacts"
          git push origin HEAD:release-usage-dashboard
