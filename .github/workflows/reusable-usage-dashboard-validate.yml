name: Reusable Usage Dashboard Validate

on:
  workflow_call:
    inputs:
      release_spec:
        description: Optional repository-relative release specification path; when empty resolve from candidate manifest tuple
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate already-materialized Usage Dashboard candidate
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/usage-dashboard-pycache
        run: |
          set -euo pipefail
          RELEASE_SPEC='${{ inputs.release_spec }}'
          if [[ -z "$RELEASE_SPEC" ]]; then
            RELEASE_SPEC="$(node plugins/usage-dashboard/tools/resolve_release_spec.cjs --manifest plugins/usage-dashboard/runtime/product-manifest.json)"
          fi
          export UD_RELEASE_SPEC="$RELEASE_SPEC"
          case "$RELEASE_SPEC" in
            .github/usage-dashboard/releases/*.json) ;;
            *) echo "release spec path denied: $RELEASE_SPEC" >&2; exit 1 ;;
          esac
          test -f "$RELEASE_SPEC"
          UD_MATERIALIZER="$(python3 - "$RELEASE_SPEC" <<'PY'
          import json, re, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          required = ['releaseTitle','productVersion','engineVersion','managerVersion','snapshotContract','recentRequestContract','materializer']
          missing = [key for key in required if key not in spec]
          if missing: raise SystemExit(f'release spec missing: {", ".join(missing)}')
          path = str(spec['materializer'])
          if not re.fullmatch(r'plugins/usage-dashboard/tools/[A-Za-z0-9_.-]+\.py', path): raise SystemExit('materializer path denied')
          print(path)
          PY
          )"
          python3 - "$RELEASE_SPEC" "$UD_MATERIALIZER" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          values = {'UD_RELEASE_SPEC':sys.argv[1],'UD_RELEASE_TITLE':str(spec['releaseTitle']),'UD_PRODUCT_VERSION':str(spec['productVersion']),'UD_ENGINE_VERSION':str(spec['engineVersion']),'UD_MANAGER_VERSION':str(spec['managerVersion']),'UD_MATERIALIZER':sys.argv[2]}
          for key, value in values.items():
              if '\n' in value or '\r' in value: raise SystemExit(f'invalid newline in {key}')
              print(f'{key}={value}')
          PY
          python3 -m py_compile plugins/usage-dashboard/tools/check_release_monotonic.py plugins/usage-dashboard/tools/validate_release_candidate.py "$UD_MATERIALIZER"
          assert_test_tree_clean() {
            local status; status="$(git status --porcelain --untracked-files=all -- plugins/usage-dashboard/tests)"
            if [[ -n "$status" ]]; then printf '%s\n' "$status"; echo 'TEST_TREE_MUTATED'; return 1; fi
          }
          assert_candidate_materialized() {
            local status; status="$(git status --porcelain --untracked-files=all -- plugins/usage-dashboard/src plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime plugins/usage-dashboard/runtime-src docs/USAGE_DASHBOARD_GUIDELINES.md)"
            if [[ -n "$status" ]]; then printf '%s\n' "$status"; echo 'CANDIDATE_NOT_MATERIALIZED'; return 1; fi
          }
          python3 "$UD_MATERIALIZER"
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --write
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          assert_candidate_materialized
          assert_test_tree_clean
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          bash -n scripts/bootstrap-usage-dashboard.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check
          tests=(
            foundation.cjs release-infrastructure-foundation.cjs current-release-contract.cjs legacy-release-workflow-archive.cjs
            behavior-harness-contract.cjs behavior-cli-launcher.cjs behavior-cache-runtime.cjs behavior-snapshot-scheduler.cjs behavior-snapshot-attribution.cjs behavior-organization-capture.cjs behavior-cache-observer.cjs behavior-state-contract.cjs behavior-runtime-recovery.cjs behavior-service-tier-outcome.cjs behavior-request-duration.cjs
            p1-contract.cjs p2-build.cjs p3-ui.cjs p3-recent.cjs p4-render.cjs p4-partial.cjs p4-hourly-drilldown.cjs p4-hourly-detail.cjs p4-request-fidelity.cjs
            p5-unified-runtime.cjs p5-bridge-manager.cjs p5-engine-adoption.cjs p5-bundled-engine.cjs p5-lifecycle-race.cjs p5-bridge-control-sync.cjs p5-service-tier-fidelity.cjs p5-devpass-account-parity.cjs p5-floating-widget-ux.cjs p5-module-layout.cjs p5-structural-parity.cjs p5-state-compatibility.cjs
            p6-rc-migration.cjs p6-rc-contract.cjs p6-release-hardening.cjs p7-cache-observability.cjs p11-cache-fidelity.cjs p12-gh-bootstrap.cjs p13-cache-provenance-diagnostics.cjs p14-project-guidelines-memory.cjs
            p15-runtime-recovery-fidelity.cjs p16-snapshot-performance-attribution.cjs p17-bounded-cli-parallelism.cjs p18-organization-discovery-dedup.cjs p19-organization-empty-fallback-fidelity.cjs p20-shared-24h-capture.cjs
            p21-snapshot-scheduling-attribution.cjs p22-monotonic-release-integrity.cjs p23-credits-usage-early-start.cjs p24-snapshot-decision-attribution.cjs p25-long-window-critical-path-decoupling.cjs p26-foreground-cli-launcher-attribution.cjs p27-npx-cache-first-launcher.cjs p28-managed-direct-cli-runtime.cjs p29-diagnostics-workspace-separation.cjs p30-diagnostics-capture-identity.cjs p31-engine-source-modularization-parity.cjs p32-exact-byte-release-promotion.cjs p33-generic-release-controller.cjs p34-request-duration-fidelity.cjs
          )
          for test in "${tests[@]}"; do node "plugins/usage-dashboard/tests/$test"; done
          assert_test_tree_clean
          python3 plugins/usage-dashboard/tools/validate_release_candidate.py --spec "$RELEASE_SPEC"
          git diff --check
          assert_candidate_materialized
          EXPECTED_PARTS="$(node -e "console.log(require('./plugins/usage-dashboard/src/parts.cjs').PARTS.length)")"
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq "$EXPECTED_PARTS"
          ENGINE_EXPECTED_PARTS="$(node -e "console.log(require('./plugins/usage-dashboard/runtime-src/bridge-engine/parts.json').parts.length)")"
          test "$(find plugins/usage-dashboard/runtime-src/bridge-engine -maxdepth 1 -name '*.part.mjs' | wc -l)" -eq "$ENGINE_EXPECTED_PARTS"
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          grep -Fq 'STALE_CANDIDATE_MAIN' plugins/usage-dashboard/tools/check_release_monotonic.py
          grep -Fq 'SAME_VERSION_ARTIFACT_DIVERGENCE' plugins/usage-dashboard/tools/check_release_monotonic.py
