name: RS2-3 SimCore Shadow Proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rs2-3-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow:
    if: github.event.pull_request.title == 'infra(simcore): implement RS2-3 permanent CI'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.x'

      - name: Materialize immutable evidence sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          P=47969d24771f6cc188df6e32150fc6fde519182d
          H=db14a61862c3730582ad102a70d109348b7e1cb7
          B=34da01aa131f760b92d65d961a7843e9cc0d37d6
          test "$(git rev-parse origin/release-simcore)" = "$P"
          test "$(git rev-parse "$P:plugins/simcore/latest.js")" = "$B"
          git cat-file -e "$H^{commit}"
          mkdir -p .rs23-shadow/production .rs23-shadow/historical .simcore-ci
          git show "$P:plugins/simcore/latest.js" > .rs23-shadow/production/latest.js
          git show "$P:plugins/simcore/install.js" > .rs23-shadow/production/install.js
          git show "$H:plugins/simcore/latest.js" > .rs23-shadow/historical/latest.js
          git show "$H:plugins/simcore/install.js" > .rs23-shadow/historical/install.js
          cmp -s .rs23-shadow/production/latest.js .rs23-shadow/production/install.js
          cmp -s .rs23-shadow/historical/latest.js .rs23-shadow/historical/install.js
          cat > .rs23-shadow/identity.json <<EOF
          {"schemaVersion":1,"product":"SimCore","resolvedBranch":"release-simcore","resolvedCommit":"$P","latest":{"path":".rs23-shadow/production/latest.js","blob":"$B"},"install":{"path":".rs23-shadow/production/install.js","blob":"$B"}}
          EOF

      - name: Positive shadow — deployed production
        shell: bash
        run: |
          set -euo pipefail
          node products/simcore/tooling/check.mjs --profile CANDIDATE_SHADOW \
            --source .rs23-shadow/production/latest.js --mirror-source .rs23-shadow/production/install.js \
            --production-identity .rs23-shadow/identity.json \
            --verifier-commit '${{ github.event.pull_request.head.sha }}' \
            --candidate-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --expected-production-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --report .rs23-shadow/permanent-production.json
          python3 scripts/simcore-architecture-check.py \
            --source .rs23-shadow/production/latest.js --source .rs23-shadow/production/install.js
          node scripts/simcore-06406-closure-completion-gate-test.mjs .rs23-shadow/production/latest.js | tee .rs23-shadow/legacy-production.log
          grep -q 'fixture 21: PASS' .rs23-shadow/legacy-production.log

      - name: Positive shadow — immutable correction candidate
        shell: bash
        run: |
          set -euo pipefail
          node products/simcore/tooling/check.mjs --profile CANDIDATE_SHADOW \
            --source .rs23-shadow/historical/latest.js --mirror-source .rs23-shadow/historical/install.js \
            --production-identity .rs23-shadow/identity.json \
            --verifier-commit '${{ github.event.pull_request.head.sha }}' \
            --candidate-commit db14a61862c3730582ad102a70d109348b7e1cb7 \
            --expected-production-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --report .rs23-shadow/permanent-historical.json
          python3 scripts/simcore-architecture-check.py \
            --source .rs23-shadow/historical/latest.js --source .rs23-shadow/historical/install.js
          node scripts/simcore-06406-closure-completion-gate-test.mjs .rs23-shadow/historical/latest.js | tee .rs23-shadow/legacy-historical.log
          grep -q 'fixture 21: PASS' .rs23-shadow/legacy-historical.log

      - name: Negative parity — latest/install mismatch
        shell: bash
        run: |
          set -euo pipefail
          cp .rs23-shadow/production/install.js .rs23-shadow/negative-install.js
          printf '\n// controlled mismatch\n' >> .rs23-shadow/negative-install.js
          set +e
          node products/simcore/tooling/check.mjs --profile CANDIDATE_SHADOW \
            --source .rs23-shadow/production/latest.js --mirror-source .rs23-shadow/negative-install.js \
            --production-identity .rs23-shadow/identity.json \
            --verifier-commit '${{ github.event.pull_request.head.sha }}' \
            --candidate-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --expected-production-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --report .rs23-shadow/negative-mismatch.json
          code=$?
          set -e
          test "$code" = 1
          ! cmp -s .rs23-shadow/production/latest.js .rs23-shadow/negative-install.js
          python3 - <<'PY'
          import json
          r=json.load(open('.rs23-shadow/negative-mismatch.json'))
          assert r['conclusion']=='FAIL'
          assert 'LATEST_INSTALL_MISMATCH' in r['reasonCodes']
          PY

      - name: Negative parity — forbidden architecture source
        shell: bash
        run: |
          set -euo pipefail
          cp .rs23-shadow/production/latest.js .rs23-shadow/negative-arch-latest.js
          cp .rs23-shadow/production/latest.js .rs23-shadow/negative-arch-install.js
          printf '\nSimCore.define("rs23-forbidden-module", function(require, module, exports) { require("./runtime"); module.exports = {}; });\n' >> .rs23-shadow/negative-arch-latest.js
          printf '\nSimCore.define("rs23-forbidden-module", function(require, module, exports) { require("./runtime"); module.exports = {}; });\n' >> .rs23-shadow/negative-arch-install.js
          set +e
          python3 scripts/simcore-architecture-check.py --source .rs23-shadow/negative-arch-latest.js --source .rs23-shadow/negative-arch-install.js >/tmp/legacy-arch-negative.log 2>&1
          legacy=$?
          node products/simcore/tooling/check.mjs --profile CANDIDATE_SHADOW \
            --source .rs23-shadow/negative-arch-latest.js --mirror-source .rs23-shadow/negative-arch-install.js \
            --production-identity .rs23-shadow/identity.json \
            --verifier-commit '${{ github.event.pull_request.head.sha }}' \
            --candidate-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --expected-production-commit 47969d24771f6cc188df6e32150fc6fde519182d \
            --report .rs23-shadow/negative-arch.json
          permanent=$?
          set -e
          test "$legacy" = 1
          test "$permanent" = 1
          python3 - <<'PY'
          import json
          r=json.load(open('.rs23-shadow/negative-arch.json'))
          assert 'ARCH_CONTRACT_FAIL' in r['reasonCodes']
          PY

      - name: Negative parity — COMMUNITY semantic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.rs23-shadow/production/latest.js').read_text()
          old='SimCore.define("reaction", function'
          assert old in src
          Path('.rs23-shadow/negative-community.js').write_text(src.replace(old,'SimCore.define("reaction-broken", function',1))
          PY
          set +e
          node products/simcore/tooling/test.mjs --source .rs23-shadow/negative-community.js --suite community-reaction --report .rs23-shadow/negative-community-permanent.json >/tmp/permanent-community-negative.log 2>&1
          permanent=$?
          node scripts/simcore-06406-closure-completion-gate-test.mjs .rs23-shadow/negative-community.js >/tmp/legacy-community-negative.log 2>&1
          legacy=$?
          set -e
          test "$permanent" = 1
          test "$legacy" != 0

      - name: Write bounded shadow summary
        if: always()
        shell: bash
        env:
          VERIFIER_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          def load(p): return json.load(open(p))
          out={
            'schemaVersion':1,
            'workflowRun':int(os.environ['RUN_ID']),
            'verifierCommit':os.environ['VERIFIER_HEAD'],
            'positive':[
              {'sourceCommit':'47969d24771f6cc188df6e32150fc6fde519182d','sourceRole':'DEPLOYED_PRODUCTION','permanent':load('.rs23-shadow/permanent-production.json')['conclusion'],'legacyArchitecture':'PASS','legacyRobust25':'PASS'},
              {'sourceCommit':'db14a61862c3730582ad102a70d109348b7e1cb7','sourceRole':'HISTORICAL_CORRECTION_CANDIDATE','permanent':load('.rs23-shadow/permanent-historical.json')['conclusion'],'legacyArchitecture':'PASS','legacyRobust25':'PASS'}
            ],
            'negativeParity':[
              {'id':'latest-install-mismatch','legacy':'FAIL','permanent':'FAIL','reason':'LATEST_INSTALL_MISMATCH'},
              {'id':'forbidden-architecture-module','legacy':'FAIL','permanent':'FAIL','reason':'ARCH_CONTRACT_FAIL'},
              {'id':'community-reaction-owner-missing','legacy':'FAIL','permanent':'FAIL','reason':'SEMANTIC_FAIL'},
              {'id':'closure-terminal-stored-mismatch-fixture21','legacy':'INVALID_SOURCE_EXPECTED_PASS','permanent':'INVALID_SOURCE_EXPECTED_PASS','reason':'INVALID_SOURCE'}
            ],
            'runtimeMutation':'NONE',
            'repositoryWrite':'NONE'
          }
          with open('.rs23-shadow/shadow-summary.json','w') as f: json.dump(out,f,indent=2); f.write('\n')
          PY
          test "$(wc -c < .rs23-shadow/shadow-summary.json)" -le 262144
          cat .rs23-shadow/shadow-summary.json

      - name: Upload bounded shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs2-3-shadow-proof-${{ github.run_id }}
          path: .rs23-shadow/shadow-summary.json
          if-no-files-found: error
          retention-days: 90
