name: Screen On Android Companion

on:
  pull_request:
    paths:
      - 'products/standalone/termux/screen-on/**'
      - '.github/workflows/screen-on-android-companion.yml'
  push:
    branches: [main]
    paths:
      - 'products/standalone/termux/screen-on/**'
      - '.github/workflows/screen-on-android-companion.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python wrapper tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s products/standalone/termux/screen-on/tests -p 'test_*.py' -v
      - name: Assert Python validation leaves no bytecode
        run: |
          if find products/standalone/termux/screen-on \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print -quit | grep -q .; then
            echo 'Screen-on Python validation left source-tree bytecode' >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Android unit tests
        run: gradle -p products/standalone/termux/screen-on/android-companion :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle -p products/standalone/termux/screen-on/android-companion :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: termux-screen-on-companion-debug-apk
          path: products/standalone/termux/screen-on/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
