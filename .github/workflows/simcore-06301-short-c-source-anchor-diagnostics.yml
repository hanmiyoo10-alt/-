name: SimCore 0.63.1 Short-C Source Lock + Diagnostic Copy

on:
  push:
    branches:
      - simcore-06301-short-c-source-anchor-diagnostics

permissions:
  contents: write

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simcore-06301-short-c-source-anchor-diagnostics
          fetch-depth: 2

      - name: Freeze baseline artifact
        run: cp plugins/simcore/latest.js /tmp/simcore-06301-baseline.js

      - name: Patch 0.63.1 artifacts
        run: python3 plugins/simcore/tools/release_06301_short_c_source_anchor_diagnostics.py

      - name: Syntax check
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js

      - name: Source-lock semantic and cache-floor gates
        run: node plugins/simcore/tools/test_06301_short_c_source_anchor_diagnostics.js

      - name: Frozen-module and runtime-scope gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = Path('/tmp/simcore-06301-baseline.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')

          def module_block(text, name):
              marker = f'SimCore.define("{name}", function (require, module, exports) {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'module missing: {name}')
              nxt = text.find('\nSimCore.define("', start + len(marker))
              if nxt < 0:
                  nxt = text.find('\n(async () => {', start + len(marker))
              if nxt < 0:
                  raise SystemExit(f'module end missing: {name}')
              return text[start:nxt]

          frozen = [
              'contracts', 'store', 'community', 'recurrence', 'lineage', 'handoff',
              'kernel', 'time', 'lifecycle', 'reaction', 'structure', 'recovery',
              'session', 'ops',
          ]
          for name in frozen:
              if module_block(old, name) != module_block(new, name):
                  raise SystemExit(f'boundary regression: frozen module {name} changed')

          if old.count('Risuai.pluginStorage.') != new.count('Risuai.pluginStorage.'):
              raise SystemExit('pluginStorage call-site drift')
          for token in [
              "addRisuReplacer('beforeRequest'",
              "addRisuScriptHandler('output'",
              'function canonicalizeResponseEnvelope',
              'function isKnownThoughtsPreamble',
              'function isThoughtsCompatibilityPreamble',
              '응답 envelope 앞 비정상 preamble',
              'Thoughts 호환 preamble',
          ]:
              if old.count(token) != new.count(token):
                  raise SystemExit(f'protected runtime sentinel drift: {token}')

          prompt = module_block(new, 'prompt')
          for token in [
              'short_community_source_selector=current_lineage_root_turn',
              'short_community_source_root_mode=',
              'short_community_source_root_index=',
              'short_community_source_is_authoritative=1',
              'do_not_substitute_prior_similar_source_or_prior_community_answer=1',
          ]:
              if token not in prompt:
                  raise SystemExit(f'source-lock prompt token missing: {token}')

          for token in [
              'function buildLastTurnDiagnosticReport(chat, state)',
              'navigator.clipboard?.writeText',
              'ROOT SOURCE TURN (RAW)',
              'PARENT TURN (RAW)',
              'CURRENT TURN (RAW)',
              'copy-turn-diag',
          ]:
              if token not in new:
                  raise SystemExit(f'diagnostic-copy token missing: {token}')

          if '//@version 0.63.1' not in new:
              raise SystemExit('0.63.1 metadata missing')
          if '// v0.63.1 Short-C Source Lock + Turn Diagnostic Copy:' not in new:
              raise SystemExit('0.63.1 changelog missing')
          print('frozen modules / recovery / storage / event hooks OK')
          PY

      - name: Artifact parity and diff hygiene
        run: |
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          allowed = {'plugins/simcore/latest.js', 'plugins/simcore/install.js'}
          changed = {row[3:] for row in rows if row.strip()}
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected working-tree changes: {sorted(extra)}')
          if changed != allowed:
              raise SystemExit(f'expected exactly SimCore artifacts, got: {sorted(changed)}')
          print('scope OK:', sorted(changed))
          PY

      - name: Commit tested artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'release: SimCore v0.63.1 short-C source lock and turn diagnostic copy'
          git push origin HEAD:simcore-06301-short-c-source-anchor-diagnostics
