name: SimCore 0.63.9 Diagnostics UI Polish II

on:
  push:
    branches:
      - simcore-06309-diagnostics-ui-polish-ii

permissions:
  contents: write

jobs:
  release-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simcore-06309-diagnostics-ui-polish-ii
          fetch-depth: 2

      - name: Freeze 0.63.8 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-06309-baseline.js

      - name: Patch 0.63.9 artifacts
        run: python3 plugins/simcore/tools/release_06309_diagnostics_ui_polish_ii.py

      - name: Syntax check
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js

      - name: UI-only and frozen-runtime gates
        run: python3 plugins/simcore/tools/test_06309_diagnostics_ui_polish_ii.py

      - name: Artifact parity and diff hygiene
        run: |
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          allowed = {'plugins/simcore/latest.js', 'plugins/simcore/install.js'}
          changed = {row[3:] for row in rows if row.strip()}
          if changed != allowed:
              raise SystemExit(f'expected exactly tested SimCore artifacts, got: {sorted(changed)}')
          print('scope OK:', sorted(changed))
          PY

      - name: Commit tested artifacts to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'test: SimCore v0.63.9 diagnostics UI II artifacts'
          git push origin HEAD:simcore-06309-diagnostics-ui-polish-ii
