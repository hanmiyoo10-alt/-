name: SimCore 0.63.11 Short-C Evidence Boundary

on:
  push:
    branches:
      - simcore-06311-short-c-evidence-boundary

permissions:
  contents: write

jobs:
  release-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simcore-06311-short-c-evidence-boundary
          fetch-depth: 2

      - name: Freeze 0.63.10 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-06311-baseline.js

      - name: Patch 0.63.11 artifacts
        run: python3 plugins/simcore/tools/release_06311_short_c_evidence_boundary.py

      - name: Syntax check
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js

      - name: Evidence boundary, frozen scope, and cache gates
        run: node plugins/simcore/tools/test_06311_short_c_evidence_boundary.js

      - name: Artifact parity and diff hygiene
        run: |
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          allowed = {'plugins/simcore/latest.js', 'plugins/simcore/install.js'}
          changed = {row[3:] for row in rows if row.strip()}
          if changed != allowed:
              raise SystemExit(f'expected exactly tested SimCore artifacts, got: {sorted(changed)}')
          print('scope OK:', sorted(changed))
          PY

      - name: Commit tested artifacts to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'test: SimCore v0.63.11 Short-C evidence-boundary artifacts'
          git push origin HEAD:simcore-06311-short-c-evidence-boundary
