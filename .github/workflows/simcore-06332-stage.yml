name: Stage SimCore v0.63.32 Snapshot Write Attribution

on:
  push:
    paths:
      - '.simcore-06332-trigger'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Capture v0.63.31 baseline
        run: |
          cp plugins/simcore/latest.js /tmp/simcore-before.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.63.31' /tmp/simcore-before.js

      - name: Apply Snapshot Write Cost Attribution patch
        run: python plugins/simcore/patch_simcore_06332.py

      - name: Syntax and artifact parity
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.63.32' plugins/simcore/latest.js
          grep -q 'Pre snapshot:' plugins/simcore/latest.js
          grep -q 'Turn storage:' plugins/simcore/latest.js
          grep -q 'hook cleanup NAMED' plugins/simcore/latest.js

      - name: Snapshot attribution fixtures
        run: node plugins/simcore/test_simcore_06332.js

      - name: Frozen-module and host-call invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          before = Path('/tmp/simcore-before.js').read_text(encoding='utf-8')
          after = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')

          def modules(src):
              hits = list(re.finditer(r'SimCore\.define\("([^"]+)", function \(require, module, exports\) \{', src))
              out = {}
              for i, hit in enumerate(hits):
                  end = hits[i + 1].start() if i + 1 < len(hits) else src.index('\n\n(async () => {', hit.start())
                  out[hit.group(1)] = src[hit.start():end]
              return out

          bmods = modules(before)
          amods = modules(after)
          expected = {'contracts','store','community','recurrence','lineage','handoff','evidence','kernel','time','lifecycle','reaction','frame','structure','recovery','prompt','session','ops'}
          assert set(bmods) == expected, set(bmods)
          assert set(amods) == expected, set(amods)
          changed = [name for name in sorted(expected) if bmods[name] != amods[name]]
          assert changed == ['session', 'store'], changed
          frozen = expected - {'session', 'store'}
          frozen_bytes = sum(len(amods[name].encode('utf-8')) for name in frozen)
          print('frozen modules:', len(frozen), 'bytes:', frozen_bytes, 'changed:', changed)

          for name in frozen:
              assert bmods[name] == amods[name], name

          call_tokens = [
              'Risuai.getCurrentCharacterIndex(',
              'Risuai.getCurrentChatIndex(',
              'Risuai.getChatFromIndex(',
              'Risuai.getCharacter(',
              'Risuai.setChatToIndex(',
              "Risuai.addRisuReplacer('beforeRequest'",
              "Risuai.removeRisuReplacer('beforeRequest'",
              "Risuai.addRisuScriptHandler('output'",
              "Risuai.removeRisuScriptHandler('output'",
              'Risuai.registerButton(',
              'Risuai.registerSetting(',
              'Risuai.unregisterUIPart(',
              'pluginStorage.getItem(',
              'pluginStorage.setItem(',
              'pluginStorage.removeItem(',
              'pluginStorage.keys(',
              'setTimeout(',
          ]
          for token in call_tokens:
              assert before.count(token) == after.count(token), (token, before.count(token), after.count(token))

          payload = 'JSON.stringify({ snapshotVersion: 1, pre: preState, send: sendState })'
          assert before.count(payload) == 1 and after.count(payload) == 1
          assert before.count("await this.b.set(this._k('turn', index), payload)") == 1
          assert after.count("await this.b.set(this._k('turn', index), payload)") == 1
          assert before.count('TextEncoder') == after.count('TextEncoder') == 0
          assert before.count('new Blob(') == after.count('new Blob(') == 0
          assert after.count('metric.payloadChars = payload.length;') == 1
          assert after.count('detail.turnPayloadChars = Number(turnMetric.payloadChars || 0);') == 1
          assert after.count('Pre snapshot:') == 1
          assert after.count('Turn storage:') == 1
          assert after.count('//@version 0.63.32') == 1
          assert after.count("'Version: 0.63.32'") == 1
          assert after.count('⚙️ SimCore v0.63.32') == 1
          assert bmods['prompt'] == amods['prompt']
          assert bmods['recovery'] == amods['recovery']
          assert bmods['time'] == amods['time']
          assert bmods['structure'] == amods['structure']
          assert bmods['frame'] == amods['frame']
          assert bmods['evidence'] == amods['evidence']
          print('module freeze + storage/host invariants: PASS')
          PY

      - name: Commit staged plugin artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --quiet && { echo 'No plugin changes produced'; exit 1; }
          git commit -m 'Stage SimCore v0.63.32 snapshot write cost attribution'
          git push origin HEAD:${GITHUB_REF_NAME}
