name: Stage SimCore v0.63.34 Deferred Chat Mirror

on:
  push:
    paths:
      - '.simcore-06334-trigger'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Capture v0.63.33 baseline
        run: |
          cp plugins/simcore/latest.js /tmp/simcore-before.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.63.33' /tmp/simcore-before.js

      - name: Apply Deferred Chat Mirror patch
        run: python plugins/simcore/patch_simcore_06334.py

      - name: Syntax and artifact parity
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.63.34' plugins/simcore/latest.js
          grep -q 'Output mirror:.*DEFERRED' plugins/simcore/latest.js
          grep -q 'Deferred mirror:' plugins/simcore/latest.js
          grep -q 'hook cleanup NAMED' plugins/simcore/latest.js

      - name: Deferred mirror fixtures
        run: node plugins/simcore/test_simcore_06334.js

      - name: Frozen modules and lifecycle invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          before = Path('/tmp/simcore-before.js').read_text(encoding='utf-8')
          after = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')

          def modules(src):
              hits = list(re.finditer(r'SimCore\.define\("([^"]+)", function \(require, module, exports\) \{', src))
              out = {}
              for i, hit in enumerate(hits):
                  end = hits[i + 1].start() if i + 1 < len(hits) else src.index('\n\n(async () => {', hit.start())
                  out[hit.group(1)] = src[hit.start():end]
              return out

          bmods = modules(before)
          amods = modules(after)
          expected = {'contracts','store','community','recurrence','lineage','handoff','evidence','kernel','time','lifecycle','reaction','frame','structure','recovery','prompt','session','ops'}
          assert set(bmods) == expected, set(bmods)
          assert set(amods) == expected, set(amods)
          changed = [name for name in sorted(expected) if bmods[name] != amods[name]]
          assert changed == [], changed
          frozen_bytes = sum(len(amods[name].encode('utf-8')) for name in expected)
          print('frozen modules:', len(expected), 'bytes:', frozen_bytes, 'changed:', changed)

          def between(src, start, end):
              a = src.index(start)
              b = src.index(end, a)
              return src[a:b]

          # Request path must remain byte-identical.
          assert between(before, '  const beforeRequestHandler = async (messages, type) => {', "\n  await Risuai.addRisuReplacer('beforeRequest', beforeRequestHandler);") == between(after, '  const beforeRequestHandler = async (messages, type) => {', "\n  await Risuai.addRisuReplacer('beforeRequest', beforeRequestHandler);")

          # Authoritative Session processOutput/save semantics remain inside the frozen Session module.
          assert bmods['session'] == amods['session']
          assert "await this.store.save('out', outIndex, result.state" in amods['session']
          assert 'this.currentOutputIndex = outIndex;' in amods['session']

          call_tokens_same = [
              'Risuai.getCurrentCharacterIndex(',
              'Risuai.getCurrentChatIndex(',
              'Risuai.getChatFromIndex(',
              'Risuai.getCharacter(',
              'Risuai.setChatToIndex(',
              "Risuai.addRisuReplacer('beforeRequest'",
              "Risuai.removeRisuReplacer('beforeRequest'",
              "Risuai.addRisuScriptHandler('output'",
              "Risuai.removeRisuScriptHandler('output'",
              'Risuai.registerButton(',
              'Risuai.registerSetting(',
              'Risuai.unregisterUIPart(',
              'pluginStorage.getItem(',
              'pluginStorage.setItem(',
              'pluginStorage.removeItem(',
              'pluginStorage.keys(',
              'setInterval(',
              'requestAnimationFrame(',
          ]
          for token in call_tokens_same:
              assert before.count(token) == after.count(token), (token, before.count(token), after.count(token))

          # Exactly one new zero-delay task schedules the mirror after handler commit.
          assert after.count('setTimeout(') == before.count('setTimeout(') + 1
          assert after.count("setTimeout(() => { void runDeferredMirror(); }, 0)") == 1

          # The synchronous mirror await is removed; the write API itself remains one call site.
          assert 'await mirrorCoreState(chaIdx, chatIdx, chat, mirrorDetail);' in before
          assert 'await mirrorCoreState(chaIdx, chatIdx, chat, mirrorDetail);' not in after
          assert after.count('scheduleDeferredCoreMirror(chaIdx, chatIdx, chat, outIndex, result.state)') == 1
          assert before.count('Risuai.setChatToIndex(') == after.count('Risuai.setChatToIndex(')

          # Safety gates: exact location, output fingerprint, epoch/latest guard, unload cleanup.
          for token in [
              "detail.status = 'LOCATION_MISMATCH'",
              "detail.status = 'OUTPUT_NOT_READY'",
              "detail.status = 'OUTPUT_MISMATCH'",
              "detail.status = 'GUARD_DROPPED'",
              'runtimeIsCurrent(epoch)',
              'deferredMirrorLatestByLocation.get(locationKey) === sequence',
              'deferredMirrorLatestByLocation.clear();',
          ]:
              assert token in after, token

          assert after.count('//@version 0.63.34') == 1
          assert after.count("'Version: 0.63.34'") == 1
          assert after.count('⚙️ SimCore v0.63.34') == 1
          print('module freeze + request/storage/lifecycle invariants: PASS')
          PY

      - name: Commit staged plugin artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --quiet && { echo 'No plugin changes produced'; exit 1; }
          git commit -m 'Stage SimCore v0.63.34 deferred chat mirror'
          git push origin HEAD:${GITHUB_REF_NAME}
