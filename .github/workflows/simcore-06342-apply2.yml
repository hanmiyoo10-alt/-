name: SimCore 0.63.42 apply2

on:
  push:
    branches: [simcore-06342-cache-integrity-cost]
    paths: [.github/workflows/simcore-06342-apply2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simcore-06342-cache-integrity-cost
          fetch-depth: 0
      - name: Apply and report
        shell: bash
        run: |
          set +e
          REPORT=simcore-06342-apply-report.txt
          : > "$REPORT"
          python3 simcore-06342-patch.py >> "$REPORT" 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            node --check plugins/simcore/latest.js >> "$REPORT" 2>&1 || STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            cmp -s plugins/simcore/latest.js plugins/simcore/install.js || STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            node simcore-06342-test.js >> "$REPORT" 2>&1 || STATUS=$?
          fi
          echo "FINAL_STATUS=$STATUS" >> "$REPORT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -eq 0 ]; then
            git add plugins/simcore/latest.js plugins/simcore/install.js
          fi
          git add "$REPORT"
          git commit -m "chore: report SimCore 0.63.42 apply status" || exit 0
          git push origin HEAD:simcore-06342-cache-integrity-cost
