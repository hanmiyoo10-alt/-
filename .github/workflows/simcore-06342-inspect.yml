name: SimCore 0.63.42 apply

on:
  push:
    branches: [simcore-06342-cache-integrity-cost]
    paths: [.github/workflows/simcore-06342-inspect.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simcore-06342-cache-integrity-cost
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 simcore-06342-patch.py
      - name: Validate syntax and frozen contracts
        run: |
          node --check plugins/simcore/latest.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.63.42' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.63.42';" plugins/simcore/latest.js
          grep -q "runtimePromptPlacement: 'TAIL_AFTER_CURRENT_USER'" plugins/simcore/latest.js
          grep -q "providerCache: 'UNVERIFIED'" plugins/simcore/latest.js
          grep -q 'narrative_calendar_target=' plugins/simcore/latest.js
          grep -q 'root_explicit_facts_highest_authority=1' plugins/simcore/latest.js
          grep -q 'expectedChatindex' plugins/simcore/latest.js
      - name: Focused cache regression
        run: node simcore-06342-test.js
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m "feat: SimCore v0.63.42 Cache Integrity & Cost Stabilization"
          git push origin HEAD:simcore-06342-cache-integrity-cost
