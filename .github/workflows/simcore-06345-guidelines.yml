name: Sync SimCore 0.63.45 guidelines

on:
  push:
    paths:
      - '.github/workflows/simcore-06345-guidelines.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch living guideline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/SIMCORE_GUIDELINES.md')
          s = p.read_text(encoding='utf-8')

          def rep(src, old, new, label):
              n = src.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              return src.replace(old, new, 1)

          s = rep(
              s,
              'SimCore v0.63.44 — History Mutation Attribution',
              'SimCore v0.63.45 — History Rebuild Frontier Attribution',
              'production baseline',
          )

          old_chain = '''History mutation\n↓\nRepresentation correlation\n↓\nHistory rebuild / propagation attribution\n↓\nPrompt prefix stabilization\n↓\nGateway/provider cache verification'''
          new_chain = '''History mutation\n↓\nRepresentation correlation\n↓\nHistory rebuild frontier attribution  ← CURRENT (v0.63.45)\n↓\nPrompt prefix stabilization\n↓\nGateway/provider cache verification'''
          s = rep(s, old_chain, new_chain, 'investigation chain')

          hard_freeze_anchor = '''## 47. Current Hard Freeze\n'''
          live_gate = '''### Current v0.63.45 Live Gate\n\nThe current diagnostic release is intended to resolve one causal question before any repair:\n\n> Did the current CHAT_HISTORY first-break representation already exist before manual-edit reconcile, or did it change during/later in SimCore request preparation?\n\nRecommended natural-turn validation sequence:\n\n```text\nB_START\n→ B_CONTINUE\n→ B_END\n→ C\n```\n\nDo not reload or regenerate between these turns when collecting the primary comparison set.\n\nDecisive attribution labels:\n\n```text\nPREEXISTING_REQUEST_MUTATION · HIGH\nRECONCILE_MUTATED_REQUEST · HIGH\nPOST_RECONCILE_REQUEST_MUTATION · HIGH\n```\n\n`OUT_OF_WINDOW`, `MULTISTAGE_REQUEST_MUTATION`, or lower-confidence results require more evidence and are not repair authorization. Provider cache remains `UNVERIFIED` without gateway/provider telemetry.\n\n'''
          s = rep(s, hard_freeze_anchor, live_gate + hard_freeze_anchor, 'live gate insertion')

          changelog_anchor = '''# Guideline Changelog\n\n'''
          changelog_entry = '''# Guideline Changelog\n\n## 2026-08-19 — v0.63.45 History Rebuild Frontier Attribution\n\n- Advanced the production baseline from v0.63.44 to v0.63.45.\n- Made bounded PRE_RECONCILE / POST_RECONCILE / FINAL request-representation attribution the current cache investigation.\n- Added the four-turn `B_START → B_CONTINUE → B_END → C` live validation gate.\n- Kept Prompt Prefix Stability as the primary optimization goal and retained provider-cache status as `UNVERIFIED`.\n- Preserved Broadcast, compiler tier semantics, Continuity/Evidence, Deferred Mirror strict mismatch safety, persistent storage schema, network policy, and timer policy under the current hard freeze.\n\n'''
          s = rep(s, changelog_anchor, changelog_entry, 'changelog')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate guideline
        run: |
          set -euo pipefail
          grep -q 'SimCore v0.63.45 — History Rebuild Frontier Attribution' docs/SIMCORE_GUIDELINES.md
          grep -q 'PREEXISTING_REQUEST_MUTATION' docs/SIMCORE_GUIDELINES.md
          grep -q 'RECONCILE_MUTATED_REQUEST' docs/SIMCORE_GUIDELINES.md
          grep -q 'POST_RECONCILE_REQUEST_MUTATION' docs/SIMCORE_GUIDELINES.md
          grep -q 'provider cache remains `UNVERIFIED`' docs/SIMCORE_GUIDELINES.md
          git diff --check

      - name: Commit guideline sync
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add docs/SIMCORE_GUIDELINES.md
          git commit -m 'docs: sync SimCore v0.63.45 guidance'
          git push origin HEAD:main
