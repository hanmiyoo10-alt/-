name: SimCore 0.63.46 release

on:
  push:
    paths:
      - '.github/workflows/simcore-06346-release.yml'

permissions:
  contents: write

concurrency:
  group: simcore-06346-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production release branch
        uses: actions/checkout@v4
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Verify exact v0.63.45 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eeec4a58417d32acd8161844e8c2d071e17e212f"
          grep -q '^//@version 0.63.45$' plugins/simcore/latest.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js

      - name: Patch v0.63.46 Prompt Prefix Stabilization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('plugins/simcore/latest.js')
          s = p.read_text(encoding='utf-8')

          def rep(src, old, new, label):
              n = src.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              return src.replace(old, new, 1)

          s = rep(s, '//@version 0.63.45', '//@version 0.63.46', 'metadata version')
          s = rep(s, "const SIMCORE_RUNTIME_VERSION = '0.63.45';", "const SIMCORE_RUNTIME_VERSION = '0.63.46';", 'runtime version')

          release_anchor = '// v0.63.45 History Rebuild Frontier Attribution:\n'
          release_note = '''// v0.63.46 Prompt Prefix Stabilization:\n// - Adds a conservative request-only History Materialization Gate for the repeatedly verified compact historical assistant signature `assistant/text 21:4a852496`; the gate runs only on active SimCore model requests and never writes visible chat or persistent storage\n// - Aligns the final request conversation suffix to authoritative raw chat from the current user backward, requires exact user-anchor agreement plus at least one exact full-assistant calibration, and replaces compact slots only when every bounded candidate maps deterministically to a substantial raw `# 응답` assistant body; any ambiguity fails open with the original request untouched\n// - Stabilizes all verified compact slots in the aligned suffix in one pass (hard cap 12) so the rolling CHAT_HISTORY frontier can stop advancing one assistant at a time; no semantic similarity, provider-cache claim, new network/storage call, timer, or second request-history scan is added\n// - Adds explicit materialization telemetry (APPLIED/NOOP/SKIPPED reason, slot range, anchor/calibration counts, added chars, cost, persistent mutation NONE) while retaining v0.63.45 attribution probes for regression comparison\n// - Repair scope only: request history projection may change under the strict gate; TAIL_AFTER_CURRENT_USER, Broadcast End Authority, Frame/Continuity/Evidence/Lineage/Handoff/Recurrence/Structure, compiler tiers, Recovery, Deferred Mirror acceptance/scheduling, persistent state schema and provider-cache policy remain frozen\n//\n'''
          s = rep(s, release_anchor, release_note + release_anchor, 'release note')

          state_anchor = '''  let lastFrontierMovementProbe = null;\n  const repeatedBreakLedger = [];\n'''
          state_new = '''  let lastFrontierMovementProbe = null;\n  let lastHistoryStabilizationProbe = null;\n  const repeatedBreakLedger = [];\n  const KNOWN_COMPACT_ASSISTANT_CHARS = 21;\n  const KNOWN_COMPACT_ASSISTANT_HASH = '4a852496';\n  const HISTORY_STABILIZATION_MAX_SLOTS = 12;\n  const HISTORY_STABILIZATION_MIN_RAW_CHARS = 128;\n  const HISTORY_STABILIZATION_MAX_RAW_CHARS = 100000;\n'''
          s = rep(s, state_anchor, state_new, 'stabilization state')

          helper_anchor = '''  function correlateHistoryMutation(topologyProbe, ledger) {\n'''
          helper_code = r'''  function stabilizationConversationRole(message) {
    const role = String(message?.role || '').toLowerCase();
    if (role === 'user') return 'user';
    if (role === 'assistant' || role === 'char') return 'assistant';
    return null;
  }

  function stabilizationComparableText(message) {
    return String(textMessageContent(message) || '').replace(/\r\n/g, '\n').trim();
  }

  function isKnownCompactAssistant(message) {
    const sig = runtimeTopologyRules.messageSignature(message);
    return sig?.role === 'assistant'
      && sig?.kind === 'text'
      && Number(sig?.chars) === KNOWN_COMPACT_ASSISTANT_CHARS
      && String(sig?.hash || '') === KNOWN_COMPACT_ASSISTANT_HASH;
  }

  function stabilizationResult(status, detail = null, started = null) {
    const d = detail && typeof detail === 'object' ? detail : {};
    return Object.freeze({
      status: String(status || 'n/a'),
      source: String(d.source || 'HOST_RAW_ALIGNED_SUFFIX'),
      candidates: Number(d.candidates || 0),
      applied: Number(d.applied || 0),
      firstIndex: Number.isInteger(Number(d.firstIndex)) ? Number(d.firstIndex) : null,
      lastIndex: Number.isInteger(Number(d.lastIndex)) ? Number(d.lastIndex) : null,
      userAnchors: Number(d.userAnchors || 0),
      assistantCalibrators: Number(d.assistantCalibrators || 0),
      addedChars: Number(d.addedChars || 0),
      persistentMutation: 'NONE',
      costMs: started == null ? Number(d.costMs || 0) : perfMs(started),
    });
  }

  function stabilizeHistoryProjection(messages, rawMessages, sendIndex) {
    const started = perfNow();
    const request = Array.isArray(messages) ? messages : [];
    const raw = Array.isArray(rawMessages) ? rawMessages : [];
    const rawUserIndex = Number(sendIndex);
    if (!request.length || !raw.length || !Number.isInteger(rawUserIndex) || rawUserIndex < 0 || rawUserIndex >= raw.length) {
      return stabilizationResult('SKIPPED_NO_CONTEXT', null, started);
    }

    let currentRequestUser = -1;
    for (let i = request.length - 1; i >= 0; i -= 1) {
      if (stabilizationConversationRole(request[i]) === 'user') { currentRequestUser = i; break; }
    }
    if (currentRequestUser < 0 || stabilizationConversationRole(raw[rawUserIndex]) !== 'user') {
      return stabilizationResult('SKIPPED_CURRENT_USER', null, started);
    }
    if (stabilizationComparableText(request[currentRequestUser]) !== stabilizationComparableText(raw[rawUserIndex])) {
      return stabilizationResult('SKIPPED_CURRENT_USER_MISMATCH', null, started);
    }

    const stubIndices = [];
    for (let i = 0; i < currentRequestUser; i += 1) {
      if (isKnownCompactAssistant(request[i])) stubIndices.push(i);
    }
    if (!stubIndices.length) return stabilizationResult('NOOP_NO_KNOWN_COMPACT', { userAnchors: 1 }, started);
    if (stubIndices.length > HISTORY_STABILIZATION_MAX_SLOTS) {
      return stabilizationResult('SKIPPED_TOO_MANY_COMPACT', { candidates: stubIndices.length, userAnchors: 1 }, started);
    }

    const wanted = new Set(stubIndices);
    const mapped = new Map();
    const oldestWanted = stubIndices[0];
    let requestIndex = currentRequestUser;
    let rawIndex = rawUserIndex;
    let userAnchors = 0;
    let assistantCalibrators = 0;
    let guard = 0;

    while (requestIndex >= oldestWanted && rawIndex >= 0 && guard < 256) {
      while (requestIndex >= oldestWanted && !stabilizationConversationRole(request[requestIndex])) requestIndex -= 1;
      while (rawIndex >= 0 && !stabilizationConversationRole(raw[rawIndex])) rawIndex -= 1;
      if (requestIndex < oldestWanted || rawIndex < 0) break;
      const requestRole = stabilizationConversationRole(request[requestIndex]);
      const rawRole = stabilizationConversationRole(raw[rawIndex]);
      if (requestRole !== rawRole) {
        return stabilizationResult('SKIPPED_ROLE_ALIGNMENT', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
      }
      if (requestRole === 'user') {
        if (stabilizationComparableText(request[requestIndex]) !== stabilizationComparableText(raw[rawIndex])) {
          return stabilizationResult('SKIPPED_USER_ANCHOR_MISMATCH', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
        }
        userAnchors += 1;
      } else if (wanted.has(requestIndex)) {
        mapped.set(requestIndex, rawIndex);
      } else {
        const requestText = stabilizationComparableText(request[requestIndex]);
        const rawText = stabilizationComparableText(raw[rawIndex]);
        if (requestText.length >= HISTORY_STABILIZATION_MIN_RAW_CHARS && requestText === rawText) assistantCalibrators += 1;
      }
      requestIndex -= 1;
      rawIndex -= 1;
      guard += 1;
    }

    if (mapped.size !== stubIndices.length) {
      return stabilizationResult('SKIPPED_INCOMPLETE_ALIGNMENT', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
    }
    if (userAnchors < 2 || assistantCalibrators < 1) {
      return stabilizationResult('SKIPPED_UNVERIFIED_REPRESENTATION', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
    }

    const replacements = [];
    for (const requestSlot of stubIndices) {
      const rawSlot = mapped.get(requestSlot);
      const rawText = String(textMessageContent(raw[rawSlot]) || '');
      const normalizedRaw = rawText.replace(/\r\n/g, '\n').trim();
      if (normalizedRaw.length < HISTORY_STABILIZATION_MIN_RAW_CHARS
          || normalizedRaw.length > HISTORY_STABILIZATION_MAX_RAW_CHARS
          || !normalizedRaw.includes('# 응답')) {
        return stabilizationResult('SKIPPED_UNSAFE_RAW_CANDIDATE', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
      }
      const slot = request[requestSlot];
      if (!slot || typeof slot.content !== 'string') {
        return stabilizationResult('SKIPPED_NONSTRING_SLOT', { candidates: stubIndices.length, userAnchors, assistantCalibrators }, started);
      }
      replacements.push({ requestSlot, rawText, beforeChars: String(slot.content || '').length });
    }

    let addedChars = 0;
    for (const replacement of replacements) {
      request[replacement.requestSlot].content = replacement.rawText;
      addedChars += replacement.rawText.length - replacement.beforeChars;
    }
    return stabilizationResult('APPLIED', {
      candidates: stubIndices.length,
      applied: replacements.length,
      firstIndex: stubIndices[0],
      lastIndex: stubIndices[stubIndices.length - 1],
      userAnchors,
      assistantCalibrators,
      addedChars,
    }, started);
  }

'''
          s = rep(s, helper_anchor, helper_code + helper_anchor, 'stabilization helpers')

          runtime_probe_anchor = '''function representationCorrelation(probe) {\n'''
          runtime_probe_code = '''function historyStabilization(probe) {\n  if (!probe) return 'n/a';\n  const range = probe.firstIndex == null ? 'n/a' : (probe.firstIndex === probe.lastIndex ? `@${Number(probe.firstIndex)}` : `@${Number(probe.firstIndex)}..@${Number(probe.lastIndex)}`);\n  const delta = Number(probe.addedChars || 0);\n  return `${probe.status || 'n/a'} · slots ${Number(probe.applied || 0)}/${Number(probe.candidates || 0)} · range ${range} · source ${probe.source || 'n/a'} · anchors ${Number(probe.userAnchors || 0)} · calibrators ${Number(probe.assistantCalibrators || 0)} · Δchars ${delta >= 0 ? '+' : ''}${delta.toLocaleString('en-US')} · persistent ${probe.persistentMutation || 'NONE'} · cost ${Number(probe.costMs || 0).toFixed(1)} ms`;\n}\n'''
          s = rep(s, runtime_probe_anchor, runtime_probe_code + runtime_probe_anchor, 'probe formatter')

          export_old = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, representationCorrelation, mutationAttribution, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"
          export_new = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, historyStabilization, representationCorrelation, mutationAttribution, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"
          s = rep(s, export_old, export_new, 'runtime-probe export')

          apply_anchor = '''    const postOnSendStart = perfNow();\n    if (result.active && result.promptBlock) {\n'''
          apply_new = '''    const postOnSendStart = perfNow();\n    if (result.active && result.promptBlock) {\n      lastHistoryStabilizationProbe = stabilizeHistoryProjection(messages, chat?.message || [], sendIndex);\n'''
          s = rep(s, apply_anchor, apply_new, 'stabilization call')

          diag_anchor = '''      `History mutation: ${probeFresh ? runtimeProbeRules.historyMutation(topologyProbe) : 'n/a'}`,\n'''
          diag_new = diag_anchor + '''      `History stabilization: ${probeFresh ? runtimeProbeRules.historyStabilization(lastHistoryStabilizationProbe) : 'n/a'}`,\n'''
          s = rep(s, diag_anchor, diag_new, 'diagnostic line')

          inactive_anchor = '''      lastFrontierMovementProbe = null;\n      lastCacheTrajectoryProbe = null;\n'''
          inactive_new = '''      lastFrontierMovementProbe = null;\n      lastHistoryStabilizationProbe = null;\n      lastCacheTrajectoryProbe = null;\n'''
          s = rep(s, inactive_anchor, inactive_new, 'inactive reset')

          unload_anchor = '''    lastRequestTopologyProbe = null;\n    lastCacheTrajectoryProbe = null;\n'''
          unload_new = '''    lastRequestTopologyProbe = null;\n    lastHistoryStabilizationProbe = null;\n    lastCacheTrajectoryProbe = null;\n'''
          s = rep(s, unload_anchor, unload_new, 'unload reset')

          p.write_text(s, encoding='utf-8')
          Path('plugins/simcore/install.js').write_text(s, encoding='utf-8')
          PY

      - name: Validate v0.63.46
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.63.46$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.63.46';" plugins/simcore/latest.js
          grep -q 'v0.63.46 Prompt Prefix Stabilization' plugins/simcore/latest.js
          grep -q "KNOWN_COMPACT_ASSISTANT_HASH = '4a852496'" plugins/simcore/latest.js
          grep -q "SKIPPED_UNVERIFIED_REPRESENTATION" plugins/simcore/latest.js
          grep -q "persistentMutation: 'NONE'" plugins/simcore/latest.js
          grep -q 'History stabilization:' plugins/simcore/latest.js
          git diff --check

      - name: Release v0.63.46
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'release: SimCore v0.63.46 Prompt Prefix Stabilization'
          git push origin HEAD:release-simcore
