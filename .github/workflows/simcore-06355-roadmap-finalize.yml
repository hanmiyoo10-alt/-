name: SimCore v0.63.55 roadmap finalize

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.title == 'SimCore v0.63.55 release command'
    runs-on: ubuntu-latest
    concurrency:
      group: repo-main-write
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify production v0.63.55
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          VERSION="$(git show origin/release-simcore:plugins/simcore/latest.js | sed -n 's#^//@version[[:space:]]*##p' | head -n 1)"
          test "$VERSION" = '0.63.55'

      - name: Finalize roadmap and permanent sync priority
        run: |
          set -euo pipefail
          python3 scripts/simcore-06355-roadmap-finalize.py
          git diff --check

      - name: Commit finalization
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add docs/CURRENT_DEVELOPMENT.md scripts/simcore-sync-memory.py
          if git diff --cached --quiet; then
            echo 'Roadmap already finalized.'
          else
            git commit -m 'docs: finalize SimCore v0.63.55 roadmap state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
