name: SimCore v0.64.0 admin finalize

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simcore-06400-admin-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.title == 'SimCore v0.64.0 admin finalize command')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main administrative state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate production v0.64.0
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js
          grep -q '^//@version 0.64.0$' /tmp/simcore-latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.64.0';" /tmp/simcore-latest.js
          grep -q 'SimCore.define("representation"' /tmp/simcore-latest.js
          grep -q 'Representation ownership: REPRESENTATION' /tmp/simcore-latest.js
          test "$RELEASE_COMMIT" = 'd0407c5cd7441a978f815db068344219f8c15027'
          test "$LATEST_BLOB" = '6d7ed75b14ad042cc8bfab1be16fc3c97069f5bb'

      - name: Finalize M2-2 administrative language and ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/simcore-06400-admin-finalize.py

      - name: Validate final administrative state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool product-manifest.json >/dev/null
          python3 -m json.tool config/simcore-architecture-v2.json >/dev/null
          python3 scripts/simcore-architecture-check.py \
            --contract config/simcore-architecture-v2.json \
            --source /tmp/simcore-latest.js \
            --source /tmp/simcore-install.js

          grep -q '"production_version": "0.64.0"' product-manifest.json
          grep -q '"major_update_checkpoint": "M2-2"' product-manifest.json
          grep -q '"status": "M2_2_RELEASED_PENDING_LIVE_VALIDATION"' config/simcore-architecture-v2.json
          grep -q '"status": "narrowed_m2_2"' config/simcore-architecture-v2.json
          grep -q '"status": "m2_next_after_representation_live_gate"' config/simcore-architecture-v2.json

          grep -q '## v0.64.0 — M2-2 Representation Ownership Split' docs/CURRENT_DEVELOPMENT.md
          grep -q '## v0.63.59 — Broadcast End Closure Contract' docs/CURRENT_DEVELOPMENT.md
          grep -q 'SUPERSEDED BY v0.64.0 · HISTORICAL CONTRACT / REGRESSION EVIDENCE' docs/CURRENT_DEVELOPMENT.md
          grep -q 'SUPERSEDED BY M2-2 · SUPPORTED REAL LONG-CHAT REGRESSION BASELINE' docs/CURRENT_DEVELOPMENT.md
          ! grep -q 'M2-1 remains the active architectural baseline under `v0.63.57`' docs/CURRENT_DEVELOPMENT.md

          grep -q 'output-compat / bootstrap-migration (physical since M2-1)' docs/SIMCORE_CONTRACTS_V2.md
          grep -q '### Physical `output-compat` — since M2-1' docs/SIMCORE_CONTRACTS_V2.md
          grep -q '### Physical `bootstrap-migration` — since M2-1' docs/SIMCORE_CONTRACTS_V2.md
          grep -q '## 16. M2-2 Physical Checkpoint — Representation Ownership Split' docs/SIMCORE_CONTRACTS_V2.md

          grep -q '## Pre-M2-2 mini patch — v0.63.59 Broadcast End Closure Contract' docs/SIMCORE_M2_LIVE_EVIDENCE.md
          grep -q 'Production: v0.64.0 — M2-2 Representation Ownership Split' docs/SIMCORE_DEFERRED_LEDGER.md
          grep -q 'Next physical move: Edit Reconcile extraction only after M2-2 live gate' docs/SIMCORE_DEFERRED_LEDGER.md
          grep -q 'current M2-2 live-validation checkpoint and any parallel cache observation' docs/SIMCORE_GUIDELINES.md
          grep -q 'Runtime prompt placement' docs/SIMCORE_GUIDELINES.md

          git diff --check

      - name: Remove one-shot administrative workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/simcore-06400-admin-sync.yml \
            .github/workflows/simcore-06400-admin-finalize.yml
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add \
            docs/CURRENT_DEVELOPMENT.md \
            docs/SIMCORE_GUIDELINES.md \
            docs/SIMCORE_CONTRACTS_V2.md \
            docs/SIMCORE_M2_LIVE_EVIDENCE.md \
            docs/SIMCORE_DEFERRED_LEDGER.md
          git diff --cached --check
          git commit -m 'docs: finalize SimCore v0.64.0 M2-2 administrative state'
          git pull --rebase origin main
          git push origin HEAD:main
