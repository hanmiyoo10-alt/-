name: SimCore v0.64.0 admin sync

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simcore-06400-admin-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.title == 'SimCore v0.64.0 admin sync command')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main administrative state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate production v0.64.0
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js
          grep -q '^//@version 0.64.0$' /tmp/simcore-latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.64.0';" /tmp/simcore-latest.js
          grep -q 'SimCore.define("representation"' /tmp/simcore-latest.js
          grep -q 'Representation ownership: REPRESENTATION' /tmp/simcore-latest.js
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_blob=$LATEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Synchronize M2-2 administrative state
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          python3 scripts/simcore-06400-admin-sync.py

      - name: Validate synchronized contracts and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool product-manifest.json >/dev/null
          python3 -m json.tool config/simcore-architecture-v2.json >/dev/null
          python3 scripts/simcore-architecture-check.py \
            --contract config/simcore-architecture-v2.json \
            --source /tmp/simcore-latest.js \
            --source /tmp/simcore-install.js
          grep -q '"production_version": "0.64.0"' product-manifest.json
          grep -q '"major_update_checkpoint": "M2-2"' product-manifest.json
          grep -q '"status": "M2_2_RELEASED_PENDING_LIVE_VALIDATION"' config/simcore-architecture-v2.json
          grep -q '"physical": "required"' config/simcore-architecture-v2.json
          grep -q '## v0.64.0 — M2-2 Representation Ownership Split' docs/CURRENT_DEVELOPMENT.md
          grep -q '## 47A. Representation Ownership Boundary' docs/SIMCORE_GUIDELINES.md
          grep -q '## 16. M2-2 Physical Checkpoint — Representation Ownership Split' docs/SIMCORE_CONTRACTS_V2.md
          grep -q '## M2-2 — v0.64.0 Representation Ownership Split' docs/SIMCORE_M2_LIVE_EVIDENCE.md
          git diff --check

      - name: Commit synchronized administrative state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add \
            product-manifest.json \
            config/simcore-architecture-v2.json \
            docs/CURRENT_DEVELOPMENT.md \
            docs/SIMCORE_GUIDELINES.md \
            docs/SIMCORE_CONTRACTS_V2.md \
            docs/SIMCORE_M2_LIVE_EVIDENCE.md
          if git diff --cached --quiet; then
            echo 'SimCore v0.64.0 administrative state already synchronized.'
          else
            git commit -m 'docs: sync SimCore v0.64.0 M2-2 administrative state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
