name: SimCore v0.64.1 stale-memory cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simcore-06401-docfix.yml'

permissions:
  contents: write

concurrency:
  group: simcore-06401-docfix
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct stale active-version wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_DEVELOPMENT.md')
          text = p.read_text(encoding='utf-8')
          old = 'v0.63.55 validated this **next-turn false manual-edit rebuild** fix in natural long chat and now serves as a frozen regression control. The active checkpoint is M2-2 (`v0.64.0`); the current task is to validate the new Representation ownership boundary while preserving the validated fast path, genuine-user-edit behavior, and ordinary A/B/C operation.'
          new = 'v0.63.55 validated this **next-turn false manual-edit rebuild** fix in natural long chat and now serves as a frozen regression control. The active major checkpoint remains M2-2, while current production is the v0.64.1 Summary Scope Authority correctness insert; preserve the validated Representation fast path and genuine-user-edit behavior while completing summary-scope live validation and the final M2-2 positive control.'
          if text.count(old) != 1:
              raise SystemExit(f'stale current-version sentence match count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'current production is the v0.64.1 Summary Scope Authority correctness insert' docs/CURRENT_DEVELOPMENT.md
          if grep -q 'active checkpoint is M2-2 (`v0.64.0`)' docs/CURRENT_DEVELOPMENT.md; then
            echo 'stale v0.64.0 active-version wording remains' >&2
            exit 1
          fi
          git diff --check

      - name: Self-remove and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/simcore-06401-docfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_DEVELOPMENT.md
          git diff --cached --check
          git commit -m 'docs: remove stale v0.64.0 active-version wording'
          git pull --rebase origin main
          git push origin HEAD:main
