name: SimCore v0.64.3 B_END Diagnostic Builder Binding Repair

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: simcore-06403-builder-binding
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.title == 'SimCore v0.64.3 B_END Diagnostic Builder Binding Repair release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production release branch
        uses: actions/checkout@v4
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Load scoped patch and architecture tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/simcore-06403-b-end-builder-binding.py > /tmp/simcore-06403.py
          git show origin/main:scripts/simcore-architecture-check.py > /tmp/simcore-architecture-check.py
          git show origin/main:config/simcore-architecture-v2.json > /tmp/simcore-architecture-v2.json
          python3 -m py_compile /tmp/simcore-06403.py /tmp/simcore-architecture-check.py

      - name: Capture frozen pre-patch surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          text = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          start = text.index('  function buildLastTurnDiagnosticReport(')
          end = text.index('\n  function diagnosticCopyErrorName(', start)
          counts = {needle: text.count(needle) for needle in (
              'pluginStorage.', 'setChat(', 'fetch(', 'setInterval(', 'setTimeout(',
          )}
          Path('/tmp/simcore-06403-builder.sha').write_text(
              hashlib.sha256(text[start:end].encode()).hexdigest(), encoding='utf-8')
          Path('/tmp/simcore-06403-surface-counts.json').write_text(
              json.dumps(counts, sort_keys=True), encoding='utf-8')
          if text.count("? time.narrativeTimestampSequence(kernel.textOfMessage(messages[latestAssistantIndex]))") != 1:
              raise SystemExit('expected B_END builder expression missing before patch')
          print('pre-patch frozen surfaces captured')
          PY

      - name: Apply v0.64.3 scoped mini patch
        run: python3 /tmp/simcore-06403.py

      - name: Validate production source and frozen controls
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.64.3$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.64.3';" plugins/simcore/latest.js
          grep -q 'v0.64.3 B_END Diagnostic Builder Binding Repair' plugins/simcore/latest.js
          grep -q "const kernel = SimCore.require('kernel');" plugins/simcore/latest.js
          grep -q "const time = SimCore.require('time');" plugins/simcore/latest.js
          grep -q 'Representation ownership: REPRESENTATION' plugins/simcore/latest.js
          grep -q 'REPRESENTATION_FAST_RECONCILED' plugins/simcore/latest.js
          grep -q 'USER_EDIT_CANDIDATE' plugins/simcore/latest.js
          grep -q 'MANUAL_EDIT_REBUILT' plugins/simcore/latest.js
          grep -q 'Broadcast closure:' plugins/simcore/latest.js
          grep -q 'Narrative tail coverage:' plugins/simcore/latest.js
          grep -q 'summary_scope=ANNUAL_ONLY' plugins/simcore/latest.js
          grep -q 'summary_scope=CUMULATIVE_YOY' plugins/simcore/latest.js
          grep -q "diagnosticCopyResult('REPORT_BUILD_FAILED'" plugins/simcore/latest.js
          grep -q "diagnosticCopyResult('CLIPBOARD_WRITE_FAILED'" plugins/simcore/latest.js
          python3 /tmp/simcore-architecture-check.py \
            --contract /tmp/simcore-architecture-v2.json \
            --source plugins/simcore/latest.js \
            --source plugins/simcore/install.js
          git diff --check

      - name: Confirm builder body and side-effect surfaces are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          text = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          start = text.index('  function buildLastTurnDiagnosticReport(')
          end = text.index('\n  function diagnosticCopyErrorName(', start)
          before_hash = Path('/tmp/simcore-06403-builder.sha').read_text(encoding='utf-8')
          after_hash = hashlib.sha256(text[start:end].encode()).hexdigest()
          if before_hash != after_hash:
              raise SystemExit('buildLastTurnDiagnosticReport body changed')
          before_counts = json.loads(Path('/tmp/simcore-06403-surface-counts.json').read_text(encoding='utf-8'))
          after_counts = {needle: text.count(needle) for needle in before_counts}
          if before_counts != after_counts:
              raise SystemExit(f'protected side-effect surface changed: {before_counts} -> {after_counts}')
          print('builder byte identity and protected side-effect counts: PASS')
          PY

      - name: Run B_END report-builder binding fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('plugins/simcore/latest.js', 'utf8');
          const iife = text.indexOf('(async () => {');
          const kernelBind = text.indexOf("const kernel = SimCore.require('kernel');", iife);
          const timeBind = text.indexOf("const time = SimCore.require('time');", iife);
          const builder = text.indexOf('function buildLastTurnDiagnosticReport(', iife);
          const builderEnd = text.indexOf('\n  function diagnosticCopyErrorName(', builder);
          if (!(iife >= 0 && kernelBind > iife && timeBind > iife && kernelBind < builder && timeBind < builder && builderEnd > builder)) {
            throw new Error('outer diagnostic dependency bindings are not in builder closure scope');
          }
          const builderBody = text.slice(builder, builderEnd);
          const expr = "? time.narrativeTimestampSequence(kernel.textOfMessage(messages[latestAssistantIndex]))";
          if (!builderBody.includes(expr)) throw new Error('B_END terminal expression missing from report builder');

          const calls = [];
          const SimCore = { require(name) {
            if (name === 'kernel') return { textOfMessage(message) { calls.push(['kernel', message]); return message.content; } };
            if (name === 'time') return { narrativeTimestampSequence(content) { calls.push(['time', content]); return { tailStatus: 'MONOTONIC', candidate: '2030-12-31 09:00 PM' }; } };
            throw new Error(`unexpected require ${name}`);
          }};
          const fixture = new Function('SimCore', `
            const kernel = SimCore.require('kernel');
            const time = SimCore.require('time');
            const messages = [{ role: 'assistant', content: '2030-12-31 09:00 PM' }];
            const latestAssistantIndex = 0;
            const outputFresh = true;
            const runtimeMode = 'B_END';
            const broadcastTerminal = outputFresh && runtimeMode === 'B_END' && latestAssistantIndex >= 0
              ? time.narrativeTimestampSequence(kernel.textOfMessage(messages[latestAssistantIndex]))
              : null;
            return broadcastTerminal;
          `);
          const result = fixture(SimCore);
          if (!result || result.tailStatus !== 'MONOTONIC' || result.candidate !== '2030-12-31 09:00 PM') throw new Error('B_END binding fixture failed');
          if (calls.length !== 2 || calls[0][0] !== 'kernel' || calls[1][0] !== 'time') throw new Error('B_END dependency call sequence failed');
          console.log('B_END report-builder binding fixture: PASS');
          NODE

      - name: Re-run diagnostic-copy stage fixtures
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('plugins/simcore/latest.js', 'utf8');
          const start = text.indexOf('  function diagnosticCopyErrorName(');
          const end = text.indexOf('\n  function diagnosticCopyButtonText(', start);
          if (start < 0 || end <= start) throw new Error('copy helper extraction failed');
          const helpers = new Function(`${text.slice(start, end)}\nreturn { runDiagnosticCopy };`)();
          const { runDiagnosticCopy } = helpers;
          (async () => {
            let builds = 0;
            let primary = 0;
            let fallback = 0;
            const build = () => { builds += 1; return 'EXACT REPORT'; };
            let got = await runDiagnosticCopy(build, async () => { primary += 1; }, async () => { fallback += 1; return true; });
            if (got.status !== 'COPIED' || builds !== 1 || primary !== 1 || fallback !== 0) throw new Error('COPIED fixture failed');
            builds = primary = fallback = 0;
            got = await runDiagnosticCopy(build, null, async () => { fallback += 1; return true; });
            if (got.status !== 'COPIED_FALLBACK' || builds !== 1 || primary !== 0 || fallback !== 1) throw new Error('COPIED_FALLBACK fixture failed');
            builds = primary = fallback = 0;
            got = await runDiagnosticCopy(() => { builds += 1; throw new Error('builder'); }, async () => { primary += 1; }, async () => { fallback += 1; return true; });
            if (got.status !== 'REPORT_BUILD_FAILED' || builds !== 1 || primary !== 0 || fallback !== 0) throw new Error('REPORT_BUILD_FAILED fixture failed');
            got = await runDiagnosticCopy(build, async () => { throw new Error('primary'); }, async () => false);
            if (got.status !== 'CLIPBOARD_WRITE_FAILED') throw new Error('CLIPBOARD_WRITE_FAILED fixture failed');
            console.log('diagnostic-copy stage fixtures: PASS');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and deploy production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --check
          git commit -m 'SimCore v0.64.3 B_END Diagnostic Builder Binding Repair'
          git push origin HEAD:release-simcore
