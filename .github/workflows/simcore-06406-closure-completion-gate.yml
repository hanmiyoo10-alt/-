name: SimCore v0.64.6 Closure Completion Gate Build

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: simcore-06406-closure-completion-gate
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.title == 'SimCore v0.64.6 closure-completion gate build command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.64.6 closure work branch
        uses: actions/checkout@v4
        with:
          ref: simcore-06406-closure-completion-gate
          fetch-depth: 0

      - name: Load scoped correction and architecture tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/simcore-06406-closure-completion-gate.py > /tmp/simcore-06406-closure.py
          git show origin/main:scripts/simcore-architecture-check.py > /tmp/simcore-architecture-check.py
          git show origin/main:config/simcore-architecture-v2.json > /tmp/simcore-architecture-v2.json
          python3 -m py_compile /tmp/simcore-06406-closure.py /tmp/simcore-architecture-check.py

      - name: Capture pre-correction frozen surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          text = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          if '//@version 0.64.6' not in text:
              raise SystemExit('expected initial v0.64.6 candidate parent')
          def region(a,b):
              s=text.index(a); e=text.index(b,s); return hashlib.sha256(text[s:e].encode()).hexdigest()
          frozen={
              'community_family':region('SimCore.define("community"','SimCore.define("time"'),
              'reaction':region('SimCore.define("reaction"','SimCore.define("frame"'),
              'representation':region('SimCore.define("representation"','SimCore.define("runtime-mirror"'),
              'output_compat':region('SimCore.define("output-compat"','SimCore.define("bootstrap-migration"'),
          }
          Path('/tmp/frozen.json').write_text(json.dumps(frozen,sort_keys=True),encoding='utf-8')
          counts={x:text.count(x) for x in ('pluginStorage.','setChat(','fetch(','setInterval(','setTimeout(')}
          Path('/tmp/counts.json').write_text(json.dumps(counts,sort_keys=True),encoding='utf-8')
          for marker in (
              'function commentUnits(commentScope)',
              'REPRESENTATION_FAST_RECONCILED',
              'USER_EDIT_CANDIDATE',
              'MANUAL_EDIT_REBUILT',
              'ANNUAL_ONLY',
              'CUMULATIVE_YOY',
          ):
              if marker not in text: raise SystemExit(f'missing frozen control {marker}')
          print('pre-correction frozen surfaces captured')
          PY

      - name: Apply v0.64.6 closure-completion correction
        run: python3 /tmp/simcore-06406-closure.py

      - name: Static architecture and identity gate
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.64.6$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.64.6';" plugins/simcore/latest.js
          grep -q 'function inspectPreviousBEndOutput' plugins/simcore/latest.js
          grep -q 'previous-b-end-closure-incomplete' plugins/simcore/latest.js
          grep -q 'terminal-stored-airtime-mismatch' plugins/simcore/latest.js
          grep -q 'eligible-direct-complete-post-b-end-c' plugins/simcore/latest.js
          python3 /tmp/simcore-architecture-check.py --contract /tmp/simcore-architecture-v2.json --source plugins/simcore/latest.js --source plugins/simcore/install.js
          git diff --check

      - name: Run clock and closure regression fixtures 1-25
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('plugins/simcore/latest.js','utf8');
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};
          function moduleSlice(name,nextName){
            const s=text.indexOf(`SimCore.define("${name}"`), e=text.indexOf(`SimCore.define("${nextName}"`,s);
            if(s<0||e<=s) throw new Error(`module extraction failed ${name}`);
            return text.slice(s,e);
          }
          function loadModule(name,nextName,deps={}){
            let out=null;
            const SimCore={define(n,factory){
              if(n!==name) return;
              const module={exports:{}};
              factory((id)=>deps[id]||{},module,module.exports);
              out=module.exports;
            }};
            new Function('SimCore',moduleSlice(name,nextName))(SimCore);
            if(!out) throw new Error(`requested module not loaded ${name}`);
            return out;
          }

          const kernel=loadModule('kernel','store');
          const community=loadModule('community','time');
          const time=loadModule('time','lifecycle');
          const lifecycle=loadModule('lifecycle','reaction',{'./kernel':kernel,'./time':time,'./recurrence':{},'./lineage':{},'./handoff':{}});
          const reaction=loadModule('reaction','frame',{'./community':community});
          const structure=loadModule('structure','output-compat',{'./kernel':kernel,'./lifecycle':lifecycle,'./time':time,'./community':community,'./reaction':reaction});
          const representation=loadModule('representation','runtime-mirror');
          const session=loadModule('session','ops',{
            './store':{SnapshotStore:class SnapshotStore{}}, './kernel':kernel, './lifecycle':lifecycle, './time':time,
            './frame':{}, './community':community, './reaction':reaction, './structure':structure, './recovery':{}, './recurrence':{},
            './prompt':{renderRuntimePrompt(){return ''},compileRuntimePromptParts(){return {text:'',identityTiers:{},endAuthority:{}}}},
          });

          const oldNarr='⏱️[2031-03-14 (Fri) 11:30 PM]';
          const terminal='⏱️[2031-03-28 (Fri) 10:15 PM]';
          const laterNarr='⏱️[2031-03-28 (Fri) 10:50 PM]';
          const sendIndex=2;
          const lineageB={lastRequestMode:'B',lastRequestIndex:0};
          const state={broadcastLocked:false,broadcastAirtime:terminal};
          const facts={available:true,outIndex:1,closureComplete:true,terminalExplicit:true,terminalTimestamp:terminal,structureClean:true,issueCount:0,reason:'complete'};
          const eligibility=()=>lifecycle.derivePostBEndClockEligibility('C','B_END',state,lineageB,facts,sendIndex);

          // 1 stale Narrative immediate direct complete C -> APPLIED
          let e=eligibility(), f=time.resolvePostBEndCurrentTimeFloor(oldNarr,e);
          assert(e.eligible&&f.disposition==='APPLIED'&&f.effectiveFloor===terminal,`1 ${JSON.stringify({e,f})}`);
          // 2 Narrative already later -> ALREADY_SATISFIED
          f=time.resolvePostBEndCurrentTimeFloor(laterNarr,e);
          assert(f.disposition==='ALREADY_SATISFIED'&&f.effectiveFloor===laterNarr,`2 ${JSON.stringify(f)}`);
          // 3 Source Handoff independent
          assert(!lifecycle.derivePostBEndClockEligibility.toString().includes('handoff'),'3 Source Handoff dependency');
          // 4 first C only
          assert(!lifecycle.derivePostBEndClockEligibility('C','C',state,{lastRequestMode:'C',lastRequestIndex:2},facts,4).eligible,'4 second C bridged');
          // 5-7 unrelated transitions
          assert(!lifecycle.derivePostBEndClockEligibility('C','B_CONTINUE',state,lineageB,facts,sendIndex).eligible,'5 B_CONTINUE->C');
          assert(!lifecycle.derivePostBEndClockEligibility('C','B_START',state,lineageB,facts,sendIndex).eligible,'6 B_START->C');
          assert(!lifecycle.derivePostBEndClockEligibility('A','B_END',state,lineageB,facts,sendIndex).eligible,'7 B_END->A');
          // 8 invalid terminal source -> fail closed
          const invalidFacts={...facts,terminalTimestamp:'bad timestamp'};
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',state,lineageB,invalidFacts,sendIndex);
          f=time.resolvePostBEndCurrentTimeFloor(oldNarr,e);
          assert(f.disposition==='INVALID_SOURCE'&&f.effectiveFloor===oldNarr,`8 ${JSON.stringify(f)}`);
          // 9 explicit historical scene preserved; only first current frame token clamps
          const historical=[oldNarr,'현재 반응 프레임','과거 회상:','⏱️[2017-06-01 (Thu) 08:00 PM]'].join('\n');
          const clamped=time.enforceNarrativeCurrentTimeFloor(historical,terminal);
          assert(clamped.changed&&clamped.content.includes(terminal),'9 current frame floor');
          assert(clamped.content.includes('⏱️[2017-06-01 (Thu) 08:00 PM]'),'9 historical timestamp rewritten');
          // 10 later Narrative tail wins
          const laterTail=[terminal,'현재 반응','⏱️[2031-03-28 (Fri) 11:00 PM]'].join('\n');
          const floorPass=time.enforceNarrativeCurrentTimeFloor(laterTail,terminal);
          assert(!floorPass.changed,'10 later tail clamped');
          const nstate={narrativeTimestamp:oldNarr};
          const ncommit=time.commitNarrativeTimestamp(nstate,{mode:'C',narrativeTimestampPrevious:oldNarr},floorPass.content);
          assert(ncommit.timestamp==='⏱️[2031-03-28 (Fri) 11:00 PM]',`10 ${JSON.stringify(ncommit)}`);
          // 11 current-era rollback first frame blocked
          const rollback=['⏱️[2017-06-01 (Thu) 08:00 PM]','현재라고 잘못 렌더','⏱️[2016-01-01 (Fri) 01:00 PM]'].join('\n');
          const rollbackFixed=time.enforceNarrativeCurrentTimeFloor(rollback,terminal);
          assert(rollbackFixed.changed&&rollbackFixed.content.startsWith(terminal),'11 rollback not blocked');
          assert(rollbackFixed.content.includes('⏱️[2016-01-01 (Fri) 01:00 PM]'),'11 historical token rewritten');
          // 12 B_END terminal commit unchanged
          const bstate={broadcastAirtime:'⏱️[2031-03-28 (Fri) 09:45 PM]',broadcastAirtimeStart:'⏱️[2031-03-28 (Fri) 09:45 PM]'};
          const bout=['⏱️[2031-03-28 (Fri) 09:45 PM]','방송 진행',terminal].join('\n');
          const bcommit=time.commitBroadcastAirtime(bstate,{mode:'B_END',broadcastAirtimePrevious:bstate.broadcastAirtime},bout);
          assert(bcommit.timestamp===terminal&&bstate.broadcastAirtime===terminal,`12 ${JSON.stringify(bcommit)}`);
          // 13 v0.64.5 multiline reaction unit
          const bilingual=['- @a: English top','(번역) [RT 1,001]','ㄴ @b: reply','(답글) [RT 1,002]','- @c: top','(번역) [RT 1,003]','- @d: top','(번역) [RT 1,004]','- @e: top','(번역) [RT 1,005]'].join('\n');
          const units=community.commentUnits(bilingual);
          assert(units.length===5&&units.filter(x=>x.kind==='TOP').length===4&&units.filter(x=>x.kind==='REPLY').length===1,'13 cardinality');
          assert(units.every(x=>reaction.inspectCommentReactionLine(x.text).ok),'13 reaction');
          // 14 exact/SAME_FAST control
          const exactRow={fingerprintMatch:'CANONICAL',canonicalFingerprint:'10:aaa',freshFingerprint:'10:aaa',hostRawFingerprint:'10:aaa'};
          let rel=representation.inspectCarryover('10:aaa',exactRow);
          assert(rel.priorRepresentation==='EXACT'&&rel.currentMatch==='FRESH_CHAT'&&text.includes('SAME_FAST'),`14 ${JSON.stringify(rel)}`);
          // 15 Fresh representation fast relation
          const driftRow={fingerprintMatch:'OUTPUT_MISMATCH',canonicalFingerprint:'11:canon',freshFingerprint:'10:fresh',hostRawFingerprint:''};
          rel=representation.inspectCarryover('10:fresh',driftRow);
          assert(rel.priorRepresentation==='OUTPUT_MISMATCH'&&rel.currentMatch==='FRESH_CHAT'&&rel.deltaShape==='FRESH_EXACT_CARRYOVER','15 relation');
          assert(text.includes('REPRESENTATION_FAST_RECONCILED')&&text.includes("reason: 'representation-fast-reconciled'"),'15 fast marker');
          // 16 genuine edit relation
          rel=representation.inspectCarryover('10:edited',exactRow);
          assert(rel.priorRepresentation==='EXACT'&&rel.currentMatch==='NONE'&&rel.deltaShape==='NEW_VISIBLE_REPRESENTATION','16 edit relation');
          assert(text.includes('USER_EDIT_CANDIDATE')&&text.includes('MANUAL_EDIT_REBUILT'),'16 edit markers');
          // 17 Summary Scope remains executable
          const annual=lifecycle.classifySummaryScope('2030년 연말 결산을 해줘','C');
          const yoy=lifecycle.classifySummaryScope('2029년과 2030년 연말 누적 수치를 비교해줘','C');
          assert(annual&&typeof annual.scope==='string'&&yoy&&typeof yoy.scope==='string','17 Summary Scope');
          assert(text.includes('ANNUAL_ONLY')&&text.includes('CUMULATIVE_YOY'),'17 Summary markers');
          // 18 second ordinary C retains no B_END floor
          const secondFacts={...facts,outIndex:3};
          assert(!lifecycle.derivePostBEndClockEligibility('C','C',state,{lastRequestMode:'C',lastRequestIndex:2},secondFacts,4).eligible,'18 retained floor');

          function section(platform,n){
            return [`[${platform}]`,`제목: test ${n}`,`body ${n}`,'[베댓]',`- @a${n}: top [RT ${n}01]`,`ㄴ @b${n}: reply [RT ${n}02]`,`- @c${n}: top [RT ${n}03]`,`- @d${n}: top [RT ${n}04]`,`- @e${n}: top [RT ${n}05]`].join('\n');
          }
          const c1=`<COMMUNITY>\n${[section('X(EN)',1),section('네이버 카페',2),section('에브리타임',3)].join('\n---\n')}\n</COMMUNITY>`;
          const c2=`<COMMUNITY>\n${[section('블라인드',4),section('유튜브',5),section('더쿠',6)].join('\n---\n')}\n</COMMUNITY>`;
          const validBEnd=['# 응답','## 볼륨 1: Test','### 챕터 1: Test','#### Chatindex: 100 ∮','⏱️[2031-03-28 (Fri) 09:45 PM]','방송 마무리',terminal,c1,c2,'<Knowledge>test</Knowledge>'].join('\n');
          const rows=[{role:'user',content:'[방송 종료]'},{role:'assistant',content:validBEnd},{role:'user',content:'[커뮤니티]'}];
          const realFacts=session.inspectPreviousBEndOutput(rows,2);
          // 19 real Structure + Time inspection: invalid previous output must fail closure
          const invalidRows=[rows[0],{role:'assistant',content:validBEnd.replace(c2,'')},rows[2]];
          const badFacts=session.inspectPreviousBEndOutput(invalidRows,2);
          assert(badFacts.available&&!badFacts.closureComplete&&(!badFacts.structureClean||!badFacts.terminalExplicit),`19 ${JSON.stringify(badFacts)}`);
          // A valid bounded B_END fixture must produce complete prior-output facts
          assert(realFacts.available&&realFacts.structureClean&&realFacts.terminalExplicit&&realFacts.closureComplete&&realFacts.terminalTimestamp===terminal,`19-valid ${JSON.stringify(realFacts)}`);
          // 20 closure incomplete -> Lifecycle fail closed
          const incomplete={...facts,closureComplete:false,structureClean:false,reason:'structure-not-clean'};
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',state,lineageB,incomplete,sendIndex);
          assert(!e.eligible&&e.reason==='previous-b-end-closure-incomplete',`20 ${JSON.stringify(e)}`);
          // 21 visible terminal != stored airtime -> Time INVALID_SOURCE
          const mismatchState={broadcastLocked:false,broadcastAirtime:'⏱️[2031-03-28 (Fri) 10:10 PM]'};
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',mismatchState,lineageB,facts,sendIndex);
          f=time.resolvePostBEndCurrentTimeFloor(oldNarr,e);
          assert(e.eligible&&f.disposition==='INVALID_SOURCE'&&f.reason==='terminal-stored-airtime-mismatch'&&f.effectiveFloor===oldNarr,`21 ${JSON.stringify({e,f})}`);
          // 22 previous B request not directly two slots back
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',state,{lastRequestMode:'B',lastRequestIndex:-2},facts,sendIndex);
          assert(!e.eligible&&e.reason==='previous-request-not-direct-b',`22 ${JSON.stringify(e)}`);
          // 23 prior visible assistant output not directly one slot back
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',state,lineageB,{...facts,outIndex:0},sendIndex);
          assert(!e.eligible&&e.reason==='previous-output-not-direct',`23 ${JSON.stringify(e)}`);
          // 24 complete/direct/matching stored + stale Narrative -> APPLIED
          e=lifecycle.derivePostBEndClockEligibility('C','B_END',state,lineageB,realFacts,sendIndex);
          f=time.resolvePostBEndCurrentTimeFloor(oldNarr,e);
          assert(e.eligible&&e.reason==='eligible-direct-complete-post-b-end-c'&&f.disposition==='APPLIED'&&f.effectiveFloor===terminal,`24 ${JSON.stringify({e,f})}`);
          // 25 complete/direct/matching stored + later Narrative -> ALREADY_SATISFIED
          f=time.resolvePostBEndCurrentTimeFloor(laterNarr,e);
          assert(f.disposition==='ALREADY_SATISFIED'&&f.effectiveFloor===laterNarr,`25 ${JSON.stringify(f)}`);

          console.log('v0.64.6 closure + timeline regression fixtures 1-25: PASS');
          NODE

      - name: Frozen surfaces and forbidden side effects gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          text=Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          def region(a,b):
              s=text.index(a); e=text.index(b,s); return hashlib.sha256(text[s:e].encode()).hexdigest()
          before=json.loads(Path('/tmp/frozen.json').read_text())
          after={
              'community_family':region('SimCore.define("community"','SimCore.define("time"'),
              'reaction':region('SimCore.define("reaction"','SimCore.define("frame"'),
              'representation':region('SimCore.define("representation"','SimCore.define("runtime-mirror"'),
              'output_compat':region('SimCore.define("output-compat"','SimCore.define("bootstrap-migration"'),
          }
          if before!=after: raise SystemExit(f'frozen owner drift {before}->{after}')
          before_counts=json.loads(Path('/tmp/counts.json').read_text())
          after_counts={x:text.count(x) for x in before_counts}
          if before_counts!=after_counts: raise SystemExit(f'side-effect surface drift {before_counts}->{after_counts}')
          if 'state.narrativeTimestamp = state.broadcastAirtime' in text: raise SystemExit('persistent Broadcast/Narrative coupling')
          helper=text.split('function derivePostBEndClockEligibility',1)[1].split('function prepareTurn',1)[0]
          if 'handoff' in helper.lower(): raise SystemExit('Source Handoff dependency in clock eligibility')
          if re.search(r'postBEnd\w*\s*:', text.split('function initialState',1)[1].split('function clone',1)[0] if 'function initialState' in text and 'function clone' in text else ''):
              raise SystemExit('unexpected persistent post-B_END state field')
          for marker in ('function commentUnits(commentScope)','REACTION_AT_END_RE','REPRESENTATION_FAST_RECONCILED','USER_EDIT_CANDIDATE','MANUAL_EDIT_REBUILT','stale_scale_fallback'):
              if marker not in text: raise SystemExit(f'frozen marker missing {marker}')
          print('frozen surfaces + no new persistent/host side effects: PASS')
          PY

      - name: Commit corrected v0.64.6 candidate to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --check
          git commit -m 'SimCore v0.64.6 closure-completion eligibility hardening'
          git push origin HEAD:simcore-06406-closure-completion-gate
