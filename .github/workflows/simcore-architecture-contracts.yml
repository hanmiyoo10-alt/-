name: SimCore Architecture Contracts

on:
  push:
    branches: [main]
    paths:
      - 'config/simcore-architecture-v2.json'
      - 'scripts/simcore-architecture-check.py'
      - 'docs/SIMCORE_CONTRACTS_V2.md'
      - 'docs/SIMCORE_2M_ARCHITECTURE_AUDIT.md'
      - '.github/workflows/simcore-architecture-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/simcore-architecture-v2.json'
      - 'scripts/simcore-architecture-check.py'
      - 'docs/SIMCORE_CONTRACTS_V2.md'
      - 'docs/SIMCORE_2M_ARCHITECTURE_AUDIT.md'
      - '.github/workflows/simcore-architecture-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-v2:
    name: Contracts v2 drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main architecture contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize production release source
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js

      - name: Validate architecture contract against production
        run: |
          python3 scripts/simcore-architecture-check.py \
            --source /tmp/simcore-latest.js \
            --source /tmp/simcore-install.js
