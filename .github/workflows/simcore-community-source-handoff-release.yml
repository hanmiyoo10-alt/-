name: Release SimCore v0.62.25 Community New-Source Guard ABC

on:
  push:
    paths:
      - plugins/simcore/community-source-handoff-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build community new-source guard plugin
        run: |
          cp plugins/simcore/latest.js /tmp/simcore-base.js
          python plugins/simcore/patch_simcore_06225.py
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js

      - name: Verify prompt and storage invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('/tmp/simcore-base.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')

          for token in [
              'pluginStorage.getItem(',
              'pluginStorage.setItem(',
              'pluginStorage.removeItem(',
              'pluginStorage.keys(',
          ]:
              a, b = base.count(token), new.count(token)
              assert a == b, (token, a, b)

          def render_fn(text):
              start = text.index('function renderRuntimePrompt(state) {')
              end = text.index('\n\nfunction finalizePreparedOutput', start)
              return text[start:end]

          old_fn = render_fn(base)
          new_fn = render_fn(new)
          block = """  if (p.communitySourceHandoffNewSource) {
              lines.push(`short_community_request_reused_with_new_source=${p.communitySourceHandoffRootMode || 'unknown'}`);
              lines.push('derive_reaction_from_current_source_not_prior_answer=1');
            }
          """
          assert block in new_fn
          assert new_fn.replace(block, '') == old_fn
          assert 'short_community_request_reused_with_new_source=' not in old_fn
          assert new_fn.count('short_community_request_reused_with_new_source=') == 1
          assert new_fn.count('derive_reaction_from_current_source_not_prior_answer=1') == 1

          # No history scan/bootstrap was added for this feature.
          h0 = new.index('SimCore.define("handoff"')
          h1 = new.index('\n\nSimCore.define("kernel"', h0)
          handoff = new[h0:h1]
          assert 'historyMessages' not in handoff
          assert 'messages' not in handoff
          assert 'pluginStorage' not in handoff
          print('storage calls unchanged; runtime prompt differs only by the 2-line conditional handoff block')
          PY

      - name: Test ABC source handoff behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('plugins/simcore/latest.js', 'utf8');
          const start = src.indexOf('SimCore.define("handoff"');
          const end = src.indexOf('\n\nSimCore.define("kernel"', start);
          if (start < 0 || end < 0) throw new Error('handoff module not found');
          const defs = {};
          const SimCore = { define(name, fn) { defs[name] = fn; } };
          eval(src.slice(start, end));
          const module = { exports: {} };
          defs.handoff(() => { throw new Error('handoff has no dependencies'); }, module, module.exports);
          const h = module.exports;
          const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
          const recShort = { eligible: false };
          const recLong = { eligible: true };
          const line = (rootMode, rootIndex, sourceKind = 'CHAIN') => ({ rootMode, rootIndex, sourceKind });
          const state = {};

          let r = h.observe(state, '[커뮤니티] 라이브 반응', 'C', line('A', 10), recShort);
          assert(r.eligible && !r.seen && !r.newSource && r.rootMode === 'A', 'A first');
          r = h.observe(state, '[커뮤니티] 라이브 반응', 'C', line('A', 20), recShort);
          assert(r.eligible && r.seen && r.newSource && r.priorRootIndex === 10, 'A new source');
          r = h.observe(state, '[커뮤니티] 라이브 반응', 'C', line('A', 20), recShort);
          assert(r.seen && !r.newSource, 'same A source must stay quiet');

          r = h.observe(state, '[커뮤니티] 라이브 반응', 'C', line('B', 30), recShort);
          assert(r.newSource && r.rootMode === 'B', 'B source');
          r = h.observe(state, '새 기사 내용이 공개됨 [커뮤니티] 라이브 반응', 'C', line('INLINE_C', 40, 'INLINE'), recShort);
          assert(r.newSource && r.rootMode === 'C', 'inline C source');

          r = h.observe(state, '[커뮤니티] 아주 길고 상세한 요청으로서 기존 템플릿 리커런스 가드가 소유해야 하는 충분히 긴 요청 문장을 작성한다', 'C', line('A', 50), recLong);
          assert(!r.eligible && r.reason === 'template-recurrence-owned', 'long recurrence ownership');
          r = h.observe(state, '[커뮤니티] 기사 반응', 'C', { rootMode: null, rootIndex: -1, sourceKind: 'UNSEEDED' }, recShort);
          assert(!r.eligible && r.reason === 'unseeded-source', 'unseeded must not guess');
          r = h.observe(state, '[커뮤니티] 기사 반응', 'A', line('A', 60), recShort);
          assert(!r.eligible && r.reason === 'not-community', 'A consumer must stay untouched');

          assert(state.communitySourceRegistry.length <= h.HANDOFF_REGISTRY_LIMIT, 'registry bound');
          console.log('A/B/C-root short Community handoff tests passed');
          NODE

      - name: Verify release metadata
        run: |
          grep -q '^//@version 0.62.25$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore v0.62.25 Community New-Source Guard ABC$' plugins/simcore/latest.js
          grep -q 'normal requests add zero prompt tokens' plugins/simcore/latest.js
          grep -q 'short_community_request_reused_with_new_source=' plugins/simcore/latest.js
          grep -q 'derive_reaction_from_current_source_not_prior_answer=1' plugins/simcore/latest.js

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-backup
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          out = Path('/tmp/simcore-backup/simcore.plugin.v0.62.25.zip')
          files = [Path('plugins/simcore/latest.js'), Path('plugins/simcore/install.js')]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.name)
          info = []
          for p in files:
              info.append(f'{p.name} bytes={p.stat().st_size} sha256={hashlib.sha256(p.read_bytes()).hexdigest()}')
          info.append(f'{out.name} bytes={out.stat().st_size} sha256={hashlib.sha256(out.read_bytes()).hexdigest()}')
          Path('/tmp/simcore-backup/release-info.txt').write_text('\n'.join(info) + '\n', encoding='utf-8')
          print('\n'.join(info))
          PY

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.25-backup
          path: /tmp/simcore-backup/

      - name: Publish plugin files
        run: |
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.25 Community New-Source Guard ABC'
          git push
