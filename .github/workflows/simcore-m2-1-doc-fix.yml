name: SimCore M2-1 continuity repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/simcore-m2-1-doc-fix.py'
      - '.github/workflows/simcore-m2-1-doc-fix.yml'

permissions:
  contents: write

concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair continuity text
        run: |
          set -euo pipefail
          python3 scripts/simcore-m2-1-doc-fix.py
          grep -q '`v0.63.56` is the current production release' docs/CURRENT_DEVELOPMENT.md
          grep -q 'SUPERSEDED BY v0.63.56' docs/CURRENT_DEVELOPMENT.md
          grep -q '2M_MAJOR_M2_1_LIVE_VALIDATION' docs/CURRENT_DEVELOPMENT.md
          git diff --check

      - name: Commit continuity repair
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add docs/CURRENT_DEVELOPMENT.md
          if git diff --cached --quiet; then
            echo 'Continuity text already repaired.'
          else
            git commit -m 'docs: align SimCore M2-1 current production verdict'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
