name: SimCore v0.63.57 memory sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/simcore-06357-memory.py'
      - '.github/workflows/simcore-memory-sync-06357.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply durable memory updates
        run: python scripts/simcore-06357-memory.py

      - name: Commit memory state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_M2_LIVE_EVIDENCE.md docs/SIMCORE_ANOMALY_WATCH.md docs/SIMCORE_GUIDELINES.md
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No memory changes to commit.'
            exit 1
          fi
          git commit -m 'docs: sync SimCore v0.63.57 release state'
          git push origin HEAD:main
