name: Publish SimCore v0.62.20 narrative clock diagnostics

on:
  push:
    paths:
      - 'plugins/simcore/narrative-clock-diagnostics.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrative clock diagnostics
        run: python plugins/simcore/patch_simcore_06220.py
      - name: Validate plugin
        run: |
          node --check plugins/simcore/latest.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.62.20' plugins/simcore/latest.js
      - name: Commit update channel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --quiet && exit 0
          git commit -m 'Publish SimCore v0.62.20 narrative clock diagnostics'
          git push
