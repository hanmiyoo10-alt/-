name: Publish SimCore v0.62.19 narrative clock guard

on:
  push:
    paths:
      - 'plugins/simcore/narrative-clock-guard.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrative clock guard phase 1
        shell: bash
        run: |
          set -euo pipefail
          python plugins/simcore/patch_simcore_06219.py
          node --check plugins/simcore/latest.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -m1 '^//@version ' plugins/simcore/latest.js
          grep -m1 '^//@display-name ' plugins/simcore/latest.js
          grep -q 'narrative_timestamp_must_not_precede_previous=1' plugins/simcore/latest.js
          grep -q 'embedded_preview_flashback_or_event_time_does_not_replace_current_timestamp=1' plugins/simcore/latest.js
      - name: Commit update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Publish SimCore v0.62.19 narrative clock guard phase 1'
          git pull --rebase origin main
          git push origin HEAD:main
