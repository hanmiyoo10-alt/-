name: Release SimCore v0.62.24 Narrative Current-Time Floor

on:
  push:
    paths:
      - plugins/simcore/narrative-floor-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build narrative current-time floor plugin
        run: |
          cp plugins/simcore/latest.js /tmp/simcore-before.js
          python plugins/simcore/patch_simcore_06224.py
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.62.24' plugins/simcore/latest.js
          grep -q 'Narrative Current-Time Floor' plugins/simcore/latest.js
          grep -q 'NARRATIVE_CLOCK_VERSION = 2' plugins/simcore/latest.js
          grep -q 'enforceNarrativeCurrentTimeFloor' plugins/simcore/latest.js

      - name: Verify prompt and storage invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/simcore-before.js').read_text(encoding='utf-8')
          after = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')

          def runtime_prompt(src):
              a = src.index('function renderRuntimePrompt(state) {')
              b = src.index('\n}\n\nfunction finalizePreparedOutput', a) + 2
              return src[a:b]

          assert runtime_prompt(before) == runtime_prompt(after), 'runtime prompt changed; token +0 invariant broken'
          for token in ('pluginStorage.getItem', 'pluginStorage.setItem', 'pluginStorage.removeItem', 'pluginStorage.keys'):
              assert before.count(token) == after.count(token), (token, before.count(token), after.count(token))
          print('runtime prompt byte-identical; pluginStorage API call sites unchanged')
          PY

      - name: Test narrative current-time floor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('plugins/simcore/latest.js', 'utf8');
          const start = src.indexOf('SimCore.define("time"');
          const end = src.indexOf('SimCore.define("lifecycle"', start);
          if (start < 0 || end < 0) throw new Error('time module not found');
          const mods = {};
          const SimCore = { define(name, fn) { mods[name] = fn; } };
          eval(src.slice(start, end));
          const module = { exports: {} };
          mods.time(() => { throw new Error('unexpected require'); }, module, module.exports);
          const t = module.exports;

          const floor = '⏱️[2027-04-27 (화) 08:30 PM]';
          const backward = '# 응답\n⏱️[2027-04-27 (화) 07:10 PM]\n스페셜 무대 반응\n본문 속 과거 시각 ⏱️[2027-04-27 (화) 06:00 PM]';
          const fixed = t.enforceNarrativeCurrentTimeFloor(backward, floor);
          if (!fixed.changed || fixed.reason !== 'clamped-backward') throw new Error('backward timestamp was not clamped');
          if (!fixed.content.includes(floor)) throw new Error('floor timestamp missing');
          if (!fixed.content.includes('⏱️[2027-04-27 (화) 06:00 PM]')) throw new Error('embedded source-event timestamp was altered');
          if (fixed.content.includes('⏱️[2027-04-27 (화) 07:10 PM]')) throw new Error('backward current timestamp survived');

          const state = { narrativeTimestamp: floor };
          const committed = t.commitNarrativeTimestamp(state, { mode: 'C', narrativeTimestampPrevious: floor }, fixed.content);
          if (committed.reason !== 'committed' || state.narrativeTimestamp !== floor) throw new Error('clamped floor did not commit safely');

          const future = '# 응답\n⏱️[2027-04-27 (화) 09:05 PM]\n다음 장면';
          const forward = t.enforceNarrativeCurrentTimeFloor(future, floor);
          if (forward.changed) throw new Error('forward timestamp should not be altered');
          const state2 = { narrativeTimestamp: floor };
          const advanced = t.commitNarrativeTimestamp(state2, { mode: 'A', narrativeTimestampPrevious: floor }, forward.content);
          if (advanced.reason !== 'committed' || state2.narrativeTimestamp !== '⏱️[2027-04-27 (화) 09:05 PM]') throw new Error('forward timestamp did not advance');

          const state3 = { narrativeTimestamp: floor };
          if (t.syncNarrativeTimestamp(state3, backward, 'C') !== false) throw new Error('manual sync accepted backward timestamp');
          if (state3.narrativeTimestamp !== floor) throw new Error('manual sync regressed anchor');

          const state4 = { narrativeTimestamp: floor };
          const b = t.commitNarrativeTimestamp(state4, { mode: 'B_CONTINUE' }, backward);
          if (b.reason !== 'broadcast' || state4.narrativeTimestamp !== floor) throw new Error('Mode B narrative path changed');

          console.log('narrative floor tests ok');
          NODE

      - name: Verify migration wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          assert 'narrativeClockVersion: 2,' in s
          assert 'migrateNarrativeCurrentTimeFloorIfNeeded' in s
          assert 'await this.store.loadTurn(sendIndex);' in s
          assert 'await this.migrateNarrativeCurrentTimeFloorIfNeeded(latestOutIndex);' in s
          assert 'await this.migrateNarrativeCurrentTimeFloorIfNeeded(found.index);' in s
          assert 'FLOOR CLAMPED' in s
          print('one-turn migration and diagnostics wired')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p artifact
          cp plugins/simcore/latest.js artifact/latest.js
          cp plugins/simcore/install.js artifact/install.js
          (cd artifact && zip -9 simcore.plugin.v0.62.24.zip latest.js install.js)
          sha256sum plugins/simcore/latest.js artifact/simcore.plugin.v0.62.24.zip | tee artifact/SHA256SUMS.txt
          wc -c plugins/simcore/latest.js plugins/simcore/install.js | tee artifact/SIZES.txt

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.24-backup
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Publish SimCore v0.62.24 narrative current-time floor'
          git push
