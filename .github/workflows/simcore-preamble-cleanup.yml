name: Publish SimCore v0.62.16 preamble diagnostic cleanup

on:
  push:
    paths:
      - 'plugins/simcore/preamble-cleanup.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostic-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_old = '''// v0.62.16 Auto Update Detection Test:\n// - Runtime/state/storage behavior is unchanged from v0.62.12\n// - Preserves v0.62.11 Broadcast Airtime Guard and v0.62.12 Community Alias Guard unchanged\n// - Panel shows live Broadcast airtime + Airtime start only while Broadcast is LOCKED\n// - After broadcast end, the stale start field is hidden and the retained value is labeled Last broadcast airtime\n// - No Core prompt changes, no lifecycle changes, no state/storage reset, no new I/O'''
          release_new = '''// v0.62.16 Preamble Diagnostic Cleanup:\n// - Runtime/state/storage/output canonicalization behavior remains unchanged\n// - Safe recoverable <Thoughts> preambles are compatibility diagnostics, not structure warnings\n// - Unknown non-Thoughts preambles remain warnings\n// - No Core prompt/lifecycle/reaction/community changes, no state reset, no new storage I/O'''

          helper_old = '''// Known host/model metadata compatibility. Only one complete standalone Thoughts wrapper\n// is silent; malformed/mixed preambles remain observable through the generic warning.\nfunction isKnownThoughtsPreamble(rawPrefix) {\n  const trimmed = String(rawPrefix || '').trim();\n  if (!trimmed) return false;\n  const open = trimmed.match(/^<Thoughts>/i);\n  if (!open) return false;\n  const close = trimmed.match(/<\\/Thoughts>$/i);\n  if (!close) return false;\n  const body = trimmed.slice(open[0].length, trimmed.length - close[0].length);\n  return !/<\\/?Thoughts>/i.test(body);\n}\n\nfunction preambleIssue(action) {\n  return `응답 envelope 앞 비정상 preamble ${action}`;\n}\n'''
          helper_new = '''// Known host/model metadata compatibility. A complete standalone Thoughts wrapper is silent.\n// A partial Thoughts-shaped prefix is downgraded to compatibility telemetry only when a safe\n// canonical # 응답 envelope is successfully selected; otherwise it stays a warning.\nfunction isKnownThoughtsPreamble(rawPrefix) {\n  const trimmed = String(rawPrefix || '').trim();\n  if (!trimmed) return false;\n  const open = trimmed.match(/^<Thoughts>/i);\n  if (!open) return false;\n  const close = trimmed.match(/<\\/Thoughts>$/i);\n  if (!close) return false;\n  const body = trimmed.slice(open[0].length, trimmed.length - close[0].length);\n  return !/<\\/?Thoughts>/i.test(body);\n}\n\n// PocketRisu/model gateways can expose a partial reasoning wrapper before the real # 응답\n// envelope. If the canonical envelope itself is safe, treat a Thoughts-shaped prefix as\n// host/model compatibility telemetry rather than a structural failure.\nfunction isThoughtsCompatibilityPreamble(rawPrefix) {\n  return /^<Thoughts\\b[^>]*>/i.test(String(rawPrefix || '').trim());\n}\n\nfunction preambleIssue(action) {\n  return `응답 envelope 앞 비정상 preamble ${action}`;\n}\n\nfunction preambleDiagnostic(action) {\n  return `Thoughts 호환 preamble ${action}`;\n}\n'''

          safe_old = '''  const safe = candidates.filter((x) => x.integrity.safe).sort((a, b) => b.score - a.score || b.index - a.index);\n  if (!safe.length) {\n    const issues = [];\n    if (matches.length > 1) issues.push(`응답 envelope 중복 ${matches.length}개 - 안전한 후보를 확정하지 못해 자동 병합하지 않음`);\n    if (prefix && !knownThoughtsPrefix) issues.push(preambleIssue('감지'));\n    return { content: raw.trim(), repaired: false, issues, candidateCount: matches.length, selectedIndex: -1, resolved: matches.length === 1 && !prefix };\n  }\n\n  const selected = safe[0];\n  const repaired = matches.length > 1 || !!prefix;\n  const issues = [];\n  if (matches.length > 1) issues.push(`응답 envelope 중복 ${matches.length}개 → 완전한 후보 ${selected.index + 1}번만 유지`);\n  if (prefix && !knownThoughtsPrefix) issues.push(preambleIssue('제거'));\n  return { content: selected.text, repaired, issues, candidateCount: matches.length, selectedIndex: selected.index, resolved: true };'''
          safe_new = '''  const safe = candidates.filter((x) => x.integrity.safe).sort((a, b) => b.score - a.score || b.index - a.index);\n  if (!safe.length) {\n    const issues = [];\n    const diagnostics = [];\n    if (matches.length > 1) issues.push(`응답 envelope 중복 ${matches.length}개 - 안전한 후보를 확정하지 못해 자동 병합하지 않음`);\n    if (prefix && !knownThoughtsPrefix) issues.push(preambleIssue('감지'));\n    return { content: raw.trim(), repaired: false, issues, diagnostics, candidateCount: matches.length, selectedIndex: -1, resolved: matches.length === 1 && !prefix };\n  }\n\n  const selected = safe[0];\n  const repaired = matches.length > 1 || !!prefix;\n  const issues = [];\n  const diagnostics = [];\n  if (matches.length > 1) issues.push(`응답 envelope 중복 ${matches.length}개 → 완전한 후보 ${selected.index + 1}번만 유지`);\n  if (prefix && !knownThoughtsPrefix) {\n    if (isThoughtsCompatibilityPreamble(prefix)) diagnostics.push(preambleDiagnostic('제거'));\n    else issues.push(preambleIssue('제거'));\n  }\n  return { content: selected.text, repaired, issues, diagnostics, candidateCount: matches.length, selectedIndex: selected.index, resolved: true };'''

          for name in ['plugins/simcore/latest.js', 'plugins/simcore/install.js']:
              p = Path(name)
              s = p.read_text()
              assert '//@version 0.62.15' in s, name
              s = s.replace('0.62.15', '0.62.16')
              s = s.replace('//@display-name SimCore v0.62.16 Auto Update Test', '//@display-name SimCore v0.62.16 Preamble Diagnostic Cleanup')
              assert release_old in s, name
              s = s.replace(release_old, release_new)
              assert helper_old in s, name
              s = s.replace(helper_old, helper_new)
              s = s.replace("if (!pending?.active) return { content: raw, repaired: false, issues: [], candidateCount: 0, selectedIndex: -1, resolved: true };", "if (!pending?.active) return { content: raw, repaired: false, issues: [], diagnostics: [], candidateCount: 0, selectedIndex: -1, resolved: true };")
              s = s.replace("return { content: raw.trim(), repaired: false, issues: ['응답 envelope: # 응답 시작점 없음'], candidateCount: 0, selectedIndex: -1, resolved: false };", "return { content: raw.trim(), repaired: false, issues: ['응답 envelope: # 응답 시작점 없음'], diagnostics: [], candidateCount: 0, selectedIndex: -1, resolved: false };")
              assert safe_old in s, name
              s = s.replace(safe_old, safe_new)
              s = s.replace("const envelope = prepared?.envelope || { resolved: true, issues: [], repaired: false };", "const envelope = prepared?.envelope || { resolved: true, issues: [], diagnostics: [], repaired: false };")
              s = s.replace("    envelopeIssues: envelope.issues || [],\n    envelopeRepaired:", "    envelopeIssues: envelope.issues || [],\n    envelopeDiagnostics: envelope.diagnostics || [],\n    envelopeRepaired:")
              s = s.replace("    result.issues = issues;\n    return result;", "    result.issues = issues;\n    result.envelopeDiagnostics = prepared.envelope.diagnostics || [];\n    return result;")
              s = s.replace("let lastCore = { active: false, mode: null, issues: [] };", "let lastCore = { active: false, mode: null, issues: [], diagnostics: [] };")
              s = s.replace("lastCore = { active: true, mode: result.state.pending?.mode || null, issues: [] };", "lastCore = { active: true, mode: result.state.pending?.mode || null, issues: [], diagnostics: [] };")
              s = s.replace("lastCore = { active: false, mode: null, issues: [] };", "lastCore = { active: false, mode: null, issues: [], diagnostics: [] };")
              s = s.replace("    const issues = result.issues || [];\n    if (issues.length) console.log('[simcore/v0.62.16] structure warnings:', issues.join(' / '));", "    const issues = result.issues || [];\n    const diagnostics = result.envelopeDiagnostics || [];\n    if (issues.length) console.log('[simcore/v0.62.16] structure warnings:', issues.join(' / '));\n    if (diagnostics.length) console.log('[simcore/v0.62.16] compatibility diagnostics:', diagnostics.join(' / '));")
              s = s.replace("      issues: [...issues, ...quarantineIssues, ...normalizationIssues],\n    };", "      issues: [...issues, ...quarantineIssues, ...normalizationIssues],\n      diagnostics,\n    };")
              s = s.replace('<div><div class="k">Warnings</div><div class="v">${lastCore.issues.length}</div></div>\n</div>', '<div><div class="k">Warnings</div><div class="v">${lastCore.issues.length}</div></div>\n<div><div class="k">Compatibility diagnostics</div><div class="v">${(lastCore.diagnostics || []).length}</div></div>\n</div>')
              s = s.replace("${lastCore.issues.length ? `<div class=\"card\"><div class=\"k\" style=\"margin-bottom:8px\">Latest warnings</div><div>${lastCore.issues.map((x) => `• ${escapeHtml(x)}`).join('<br>')}</div></div>` : ''}", "${lastCore.issues.length ? `<div class=\"card\"><div class=\"k\" style=\"margin-bottom:8px\">Latest warnings</div><div>${lastCore.issues.map((x) => `• ${escapeHtml(x)}`).join('<br>')}</div></div>` : ''}\n${(lastCore.diagnostics || []).length ? `<div class=\"card\"><div class=\"k\" style=\"margin-bottom:8px\">Compatibility diagnostics</div><div>${lastCore.diagnostics.map((x) => `• ${escapeHtml(x)}`).join('<br>')}</div></div>` : ''}")
              s = s.replace('v0.62.16 Auto Update Test · runtime unchanged · GitHub channel detection check', 'v0.62.16 Preamble Diagnostic Cleanup · Thoughts compatibility is informational · runtime unchanged')
              p.write_text(s)
          PY
          node --check plugins/simcore/latest.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -m1 '^//@version ' plugins/simcore/latest.js
          grep -m1 '^//@display-name ' plugins/simcore/latest.js
          grep -q 'Thoughts 호환 preamble' plugins/simcore/latest.js
      - name: Commit update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Publish SimCore v0.62.16 preamble diagnostic cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
