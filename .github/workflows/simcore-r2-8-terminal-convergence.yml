name: SimCore R2.8 Human-Evidence Terminal Convergence

on:
  push:
    branches: [main]
    paths:
      - 'products/simcore/releases/live-evidence/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: simcore-main-state-sync
  cancel-in-progress: false

jobs:
  converge:
    name: Converge Human-Evidence Terminal State
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_MAIN_WRITE_PROTECTED_MODE: '1'
    steps:
      - name: Checkout exact human-evidence main head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact terminal evidence transaction
        id: evidence
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$BEFORE_SHA"
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "$AFTER_SHA^1")"
          fi
          mapfile -t EVIDENCE_PATHS < <(git diff --name-only "$BASE" "$AFTER_SHA" -- 'products/simcore/releases/live-evidence/*.json')
          test "${#EVIDENCE_PATHS[@]}" -eq 1
          EVIDENCE="${EVIDENCE_PATHS[0]}"
          test -f "$EVIDENCE"

          RELEASE_ID="$(EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json, os, re
          p=os.environ['EVIDENCE']
          e=json.load(open(p,encoding='utf-8'))
          rid=str(e.get('releaseId') or '')
          if not re.fullmatch(r'simcore-v[0-9]+\.[0-9]+\.[0-9]+-(?:new|correction|rollback|noop)-[0-9]{2,}',rid):
              raise SystemExit('R2_8_TERMINAL_EVIDENCE_RELEASE_ID_INVALID')
          if p != f'products/simcore/releases/live-evidence/{rid}.json':
              raise SystemExit('R2_8_TERMINAL_EVIDENCE_PATH_INVALID')
          print(rid)
          PY
          )"
          EVIDENCE_BLOB="$(git rev-parse "$AFTER_SHA:$EVIDENCE")"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "evidence_blob=$EVIDENCE_BLOB" >> "$GITHUB_OUTPUT"

      - name: Materialize exact observed production
        id: production
        shell: bash
        env:
          EVIDENCE: ${{ steps.evidence.outputs.evidence }}
        run: |
          set -euo pipefail
          mkdir -p .simcore-r2-8-terminal
          readarray -t VALUES < <(EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json, os
          e=json.load(open(os.environ['EVIDENCE'],encoding='utf-8'))
          print(e['productionCommit'])
          print(e['productionBlob'])
          PY
          )
          EXPECTED_C="${VALUES[0]}"
          EXPECTED_BLOB="${VALUES[1]}"
          [[ "$EXPECTED_C" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BLOB" =~ ^[0-9a-f]{40}$ ]]

          git fetch --no-tags origin release-simcore
          test "$(git rev-parse origin/release-simcore)" = "$EXPECTED_C"
          git show "$EXPECTED_C:plugins/simcore/latest.js" > .simcore-r2-8-terminal/latest.js
          git show "$EXPECTED_C:plugins/simcore/install.js" > .simcore-r2-8-terminal/install.js
          node --check .simcore-r2-8-terminal/latest.js
          node --check .simcore-r2-8-terminal/install.js
          cmp -s .simcore-r2-8-terminal/latest.js .simcore-r2-8-terminal/install.js
          LATEST_BLOB="$(git rev-parse "$EXPECTED_C:plugins/simcore/latest.js")"
          INSTALL_BLOB="$(git rev-parse "$EXPECTED_C:plugins/simcore/install.js")"
          test "$LATEST_BLOB" = "$EXPECTED_BLOB"
          test "$INSTALL_BLOB" = "$EXPECTED_BLOB"

          cat > .simcore-r2-8-terminal/identity.json <<EOF
          {
            "schemaVersion": 1,
            "product": "SimCore",
            "resolvedBranch": "release-simcore",
            "resolvedCommit": "$EXPECTED_C",
            "latest": {"path": ".simcore-r2-8-terminal/latest.js", "blob": "$LATEST_BLOB"},
            "install": {"path": ".simcore-r2-8-terminal/install.js", "blob": "$INSTALL_BLOB"}
          }
          EOF
          echo "production_commit=$EXPECTED_C" >> "$GITHUB_OUTPUT"
          echo "production_blob=$EXPECTED_BLOB" >> "$GITHUB_OUTPUT"

      - name: Resolve evidence-derived terminal transition
        id: resolve
        shell: bash
        env:
          EVIDENCE: ${{ steps.evidence.outputs.evidence }}
          RELEASE_ID: ${{ steps.evidence.outputs.release_id }}
        run: |
          set -euo pipefail
          RECORD="products/simcore/releases/records/${RELEASE_ID}.json"
          RECEIPT="products/simcore/releases/state-receipts/${RELEASE_ID}.json"
          test -f "$RECORD"
          test -f "$RECEIPT"

          node products/simcore/tooling/release-terminal-transition.mjs \
            --root . \
            --evidence "$EVIDENCE" \
            --record "$RECORD" \
            --receipt "$RECEIPT" \
            --manifest product-manifest.json \
            --development docs/CURRENT_DEVELOPMENT.md \
            --production-identity .simcore-r2-8-terminal/identity.json \
            --transition-out .simcore-r2-8-terminal/derived-transition.json \
            --report .simcore-r2-8-terminal/resolver-report.json

          DISPOSITION="$(node -e "const r=require('./.simcore-r2-8-terminal/resolver-report.json');process.stdout.write(String(r.disposition||''))")"
          case "$DISPOSITION" in
            ALREADY_DURABLE)
              echo 'SIMCORE_R2_8_TERMINAL_NOOP already-durable'
              ;;
            ELIGIBLE_TO_PROJECT)
              test -f .simcore-r2-8-terminal/derived-transition.json
              ;;
            *)
              echo "R2_8_TERMINAL_DISPOSITION_INVALID:$DISPOSITION" >&2
              exit 2
              ;;
          esac
          echo "disposition=$DISPOSITION" >> "$GITHUB_OUTPUT"

      - name: Project terminal state through existing authorities
        if: steps.resolve.outputs.disposition == 'ELIGIBLE_TO_PROJECT'
        shell: bash
        env:
          RELEASE_ID: ${{ steps.evidence.outputs.release_id }}
          EVIDENCE: ${{ steps.evidence.outputs.evidence }}
          EVIDENCE_BLOB: ${{ steps.evidence.outputs.evidence_blob }}
        run: |
          set -euo pipefail

          node products/simcore/tooling/admin-state-transition.mjs \
            --root . \
            --transition .simcore-r2-8-terminal/derived-transition.json \
            --manifest product-manifest.json \
            --write \
            --report .simcore-r2-8-terminal/admin-transition-report.json

          node products/simcore/tooling/sync-state.mjs \
            --write \
            --root . \
            --manifest product-manifest.json \
            --production-identity .simcore-r2-8-terminal/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report .simcore-r2-8-terminal/sync-write-report.json

          node products/simcore/tooling/sync-state.mjs \
            --check \
            --root . \
            --manifest product-manifest.json \
            --production-identity .simcore-r2-8-terminal/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report .simcore-r2-8-terminal/sync-check-report.json

          git diff --check
          mapfile -t CHANGED < <(git diff --name-only --)
          test "${#CHANGED[@]}" -ge 2
          for path in "${CHANGED[@]}"; do
            case "$path" in
              product-manifest.json|docs/CURRENT_DEVELOPMENT.md|docs/SIMCORE_GUIDELINES.md) ;;
              *) echo "R2_8_TERMINAL_UNBOUNDED_PATH:$path" >&2; exit 2 ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "state(simcore): converge terminal evidence ${RELEASE_ID}"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"

          python3 scripts/repo-main-write.py \
            --commit "$PAYLOAD_COMMIT" \
            --allow product-manifest.json \
            --allow docs/CURRENT_DEVELOPMENT.md \
            --allow docs/SIMCORE_GUIDELINES.md \
            --required-workflow simcore-ci.yml \
            --required-profile MAIN_HEALTH \
            --required-job Required \
            --staging-prefix simcore-r2-8-terminal-convergence

          git fetch --no-tags origin main
          test "$(git rev-parse "origin/main:$EVIDENCE")" = "$EVIDENCE_BLOB"
          git reset --hard origin/main

          RECORD="products/simcore/releases/records/${RELEASE_ID}.json"
          RECEIPT="products/simcore/releases/state-receipts/${RELEASE_ID}.json"
          node products/simcore/tooling/release-terminal-transition.mjs \
            --root . \
            --evidence "$EVIDENCE" \
            --record "$RECORD" \
            --receipt "$RECEIPT" \
            --manifest product-manifest.json \
            --development docs/CURRENT_DEVELOPMENT.md \
            --production-identity .simcore-r2-8-terminal/identity.json \
            --transition-out .simcore-r2-8-terminal/durable-transition.json \
            --report .simcore-r2-8-terminal/durable-report.json
          test "$(node -e "const r=require('./.simcore-r2-8-terminal/durable-report.json');process.stdout.write(String(r.disposition||''))")" = 'ALREADY_DURABLE'
          echo "SIMCORE_R2_8_TERMINAL_CONVERGENCE_PASS release=$RELEASE_ID payload=$PAYLOAD_COMMIT durable=$(git rev-parse origin/main)"

      - name: Confirm clean terminal no-op
        if: steps.resolve.outputs.disposition == 'ALREADY_DURABLE'
        shell: bash
        run: |
          set -euo pipefail
          echo 'SIMCORE_R2_8_TERMINAL_CONVERGENCE_NOOP'
