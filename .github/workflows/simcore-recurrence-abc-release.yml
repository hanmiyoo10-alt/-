name: Release SimCore v0.62.22 ABC recurrence

on:
  push:
    paths:
      - plugins/simcore/recurrence-abc-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ABC recurrence plugin
        run: |
          cp plugins/simcore/latest.js /tmp/simcore-before.js
          python plugins/simcore/patch_simcore_06222.py
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.62.22' plugins/simcore/latest.js
          grep -q 'TEMPLATE_RECURRENCE_VERSION = 2' plugins/simcore/latest.js
          grep -q "recurrence.observe(state, input, c.mode)" plugins/simcore/latest.js
          grep -q 'request_template_mode_family=' plugins/simcore/latest.js

      - name: Verify no new storage API calls
        run: |
          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/simcore-before.js').read_text(encoding='utf-8')
          after = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          for token in ('pluginStorage.getItem', 'pluginStorage.setItem', 'pluginStorage.removeItem', 'pluginStorage.keys'):
              assert before.count(token) == after.count(token), (token, before.count(token), after.count(token))
          print('storage API call counts unchanged')
          PY

      - name: Test A B C recurrence behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('plugins/simcore/latest.js', 'utf8');
          const start = src.indexOf('SimCore.define("recurrence"');
          const end = src.indexOf('SimCore.define("kernel"', start);
          if (start < 0 || end < 0) throw new Error('recurrence module not found');
          const mods = {};
          const SimCore = { define(name, fn) { mods[name] = fn; } };
          eval(src.slice(start, end));
          const module = { exports: {} };
          mods.recurrence(() => { throw new Error('unexpected require'); }, module, module.exports);
          const r = module.exports;
          const state = { templateRecurrenceVersion: 2, templateRegistry: [] };

          const c1 = '한편 11월이 되고 첫 그래미 후보 공개. [커뮤니티] 차시우 그래미 후보 총정리(후보 부문/후보작·곡/총 후보 개수/주요 본상 여부/최초·최연소 등 개인 기록/후보 지명의 의미와 글로벌 화제성까지 세세하게 정리해줘) + 국내외 반응';
          const c2 = '한편 1년 뒤 11월이 되고 두번째 그래미 후보 공개. [커뮤니티] 올해 후보 총정리(후보 부문/후보작·곡/총 후보 개수/주요 본상 여부/최초·최연소 등 개인 기록/후보 지명의 의미와 글로벌 화제성까지 세세하게 정리해줘) + 국내외 반응';
          if (r.observe(state, c1, 'C').repeated) throw new Error('C first falsely repeated');
          if (!r.observe(state, c2, 'C').repeated) throw new Error('C recurrence missed');

          const a1 = '한편 2025년 11월이 되고 시우의 새 기록이 공개되었고 누적 조회수는 1200000회, 판매량은 320000장이 되었으며 업계와 팬들의 평가도 크게 달라졌음';
          const a2 = '한편 2026년 11월이 되고 시우의 새 기록이 공개되었고 누적 조회수는 1800000회, 판매량은 510000장이 되었으며 업계와 팬들의 평가도 크게 달라졌음';
          if (r.observe(state, a1, 'A').repeated) throw new Error('A first falsely repeated');
          if (!r.observe(state, a2, 'A').repeated) throw new Error('A recurrence missed');

          const b1 = '[방송 시작] 이번 무대는 3곡 구성으로 진행되고 12000명의 관객 앞에서 오프닝과 토크, 메인 무대, 엔딩 순서로 이어지며 현장 반응을 세세하게 보여줘';
          const b2 = '[방송 중] 이번 무대는 5곡 구성으로 진행되고 18000명의 관객 앞에서 오프닝과 토크, 메인 무대, 엔딩 순서로 이어지며 현장 반응을 세세하게 보여줘';
          if (r.observe(state, b1, 'B_START').repeated) throw new Error('B first falsely repeated');
          if (!r.observe(state, b2, 'B_CONTINUE').repeated) throw new Error('B recurrence missed');

          const isolated = { templateRecurrenceVersion: 2, templateRegistry: [] };
          r.observe(isolated, a1, 'A');
          if (r.observe(isolated, '[방송 시작] ' + a2, 'B_START').repeated) throw new Error('A/B cross-mode contamination');

          const legacy = { templateRecurrenceVersion: 1, templateRegistry: [123456] };
          const hist = [
            { role: 'user', data: a1 }, { role: 'assistant', data: 'x' },
            { role: 'user', data: c1 }, { role: 'assistant', data: 'x' },
            { role: 'user', data: b1 }, { role: 'assistant', data: 'x' },
          ];
          const boot = r.bootstrapState(legacy, hist, hist.length, x => x.data || '');
          if (boot.stats.version !== 2) throw new Error('bootstrap version');
          if (!boot.stats.modeEligible.A || !boot.stats.modeEligible.B || !boot.stats.modeEligible.C) throw new Error('ABC bootstrap coverage');
          console.log('ABC recurrence tests ok', boot.stats);
          NODE

      - name: Build backup before publish
        run: |
          mkdir -p artifact
          cp plugins/simcore/latest.js artifact/latest.js
          cp plugins/simcore/install.js artifact/install.js
          (cd artifact && zip -9 simcore.plugin.v0.62.22.zip latest.js install.js)
          sha256sum plugins/simcore/latest.js artifact/simcore.plugin.v0.62.22.zip | tee artifact/SHA256SUMS.txt
          wc -c plugins/simcore/latest.js plugins/simcore/install.js | tee artifact/SIZES.txt

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.22-backup
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Publish SimCore v0.62.22 ABC template recurrence guard'
          git push
