name: SimCore v0.63.56 M2-1 release command

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.title == 'SimCore v0.63.56 release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production release branch
        uses: actions/checkout@v4
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Resolve production state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' plugins/simcore/latest.js | head -n1)"
          if [[ "$VERSION" == "0.63.55" ]]; then
            echo 'mode=patch' >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == "0.63.56" ]]; then
            echo 'mode=already-current' >> "$GITHUB_OUTPUT"
          else
            echo "unexpected SimCore production version: $VERSION" >&2
            exit 1
          fi
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js

      - name: Load M2-1 patch and Contracts v2 from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/simcore-06356-release.py > /tmp/simcore-06356-release.py
          git show origin/main:scripts/simcore-architecture-check.py > /tmp/simcore-architecture-check.py
          git show origin/main:config/simcore-architecture-v2.json > /tmp/simcore-architecture-v2.json
          python3 -m py_compile /tmp/simcore-06356-release.py /tmp/simcore-architecture-check.py

      - name: Patch production source mechanically
        if: steps.state.outputs.mode == 'patch'
        run: |
          set -euo pipefail
          cp plugins/simcore/latest.js /tmp/simcore-before-m2-1.js
          python3 /tmp/simcore-06356-release.py

      - name: Build transition Contracts v2
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/simcore-architecture-v2.json')
          c = json.loads(p.read_text())
          def add(seq, value):
              if value not in seq:
                  seq.append(value)
          r = c['modules']['recovery']
          add(r['allowed_dependencies'], 'output-compat')
          add(r['allowed_dependencies'], 'bootstrap-migration')
          b = c['modules']['bootstrap-migration']
          add(b['allowed_dependencies'], 'output-compat')
          p.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate M2-1 production candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.63.56$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.63.56';" plugins/simcore/latest.js
          grep -q 'v0.63.56 M2-1 Recovery Boundary Split' plugins/simcore/latest.js
          grep -q 'SimCore.define("output-compat"' plugins/simcore/latest.js
          grep -q 'SimCore.define("bootstrap-migration"' plugins/simcore/latest.js
          grep -q 'SimCore.define("recovery"' plugins/simcore/latest.js
          grep -q "const outputCompat = require('./output-compat');" plugins/simcore/latest.js
          grep -q "const bootstrapMigration = require('./bootstrap-migration');" plugins/simcore/latest.js
          grep -q 'REPRESENTATION_FAST_RECONCILED' plugins/simcore/latest.js
          grep -q 'USER_EDIT_CANDIDATE' plugins/simcore/latest.js
          grep -q 'MANUAL_EDIT_REBUILT' plugins/simcore/latest.js
          grep -q "return stabilizationResult('OBSERVE_ONLY'" plugins/simcore/latest.js
          grep -q 'provider UNVERIFIED' plugins/simcore/latest.js
          python3 /tmp/simcore-architecture-check.py \
            --contract /tmp/simcore-architecture-v2.json \
            --source plugins/simcore/latest.js \
            --source plugins/simcore/install.js
          git diff --check

      - name: Push v0.63.56 production
        if: steps.state.outputs.mode == 'patch'
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'release: SimCore v0.63.56 M2-1 Recovery Boundary Split'
          git push origin HEAD:release-simcore

      - name: Confirm idempotent release
        if: steps.state.outputs.mode == 'already-current'
        run: echo 'SimCore v0.63.56 already current; all validation gates still ran.'

  memory-sync:
    needs: release
    if: github.event.pull_request.title == 'SimCore v0.63.56 release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve released production identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' /tmp/simcore-latest.js | head -n1)"
          test "$VERSION" = '0.63.56'
          RELEASE_NAME="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/simcore-latest.js').read_text()
          m = re.search(r'^// v0\.63\.56\s+(.+?):\s*$', text, re.M)
          if not m:
              raise SystemExit('release name missing')
          print(m.group(1).strip())
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_blob=$LATEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Synchronize production memory and M2-1 contract
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          python3 scripts/simcore-sync-memory.py
          python3 scripts/simcore-06356-memory.py
          python3 scripts/simcore-architecture-check.py \
            --source /tmp/simcore-latest.js \
            --source /tmp/simcore-install.js
          git diff --check

      - name: Commit durable M2-1 state
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add \
            product-manifest.json \
            config/simcore-architecture-v2.json \
            docs/CURRENT_DEVELOPMENT.md \
            docs/SIMCORE_CONTRACTS_V2.md \
            docs/SIMCORE_GUIDELINES.md \
            scripts/simcore-sync-memory.py
          if git diff --cached --quiet; then
            echo 'M2-1 durable state already synchronized.'
          else
            git commit -m 'docs: sync SimCore v0.63.56 M2-1 production state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build project-source snapshot
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          mkdir -p dist/project-source
          cp product-manifest.json dist/project-source/
          cp config/simcore-architecture-v2.json dist/project-source/
          cp docs/SIMCORE_GUIDELINES.md dist/project-source/
          cp docs/CURRENT_DEVELOPMENT.md dist/project-source/
          cp docs/SIMCORE_CONTRACTS_V2.md dist/project-source/
          cp docs/SIMCORE_GOVERNANCE.md dist/project-source/
          cp docs/SIMCORE_2M_ARCHITECTURE_AUDIT.md dist/project-source/
          cat > dist/project-source/SOURCE_METADATA.json <<EOF
          {
            "product": "SimCore",
            "version": "${VERSION}",
            "release_name": "${RELEASE_NAME}",
            "release_branch": "release-simcore",
            "release_commit": "${RELEASE_COMMIT}",
            "release_blob": "${RELEASE_BLOB}",
            "major_update": "2.0M",
            "checkpoint": "M2-1"
          }
          EOF
          (cd dist/project-source && zip -q -r "../SimCore-v${VERSION}-project-source.zip" .)

      - name: Upload project-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: simcore-project-source-v${{ steps.release.outputs.version }}
          path: dist/SimCore-v${{ steps.release.outputs.version }}-project-source.zip
          if-no-files-found: error
          retention-days: 90
