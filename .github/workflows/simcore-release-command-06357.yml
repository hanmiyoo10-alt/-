name: SimCore v0.63.57 release command

on:
  push:
    branches: [main]
    paths:
      - 'scripts/simcore-06357-release.py'
      - '.github/workflows/simcore-release-command-06357.yml'

permissions:
  contents: write

env:
  RELEASE_BRANCH: release-simcore

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          path: release
          fetch-depth: 0

      - name: Patch and validate v0.63.57
        run: python control/scripts/simcore-06357-release.py release

      - name: Commit production release
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 1
          fi
          git commit -m 'SimCore v0.63.57 Current Timeline Authority Guard'
          git push origin HEAD:${RELEASE_BRANCH}
