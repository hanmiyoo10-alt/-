name: SimCore release command

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: simcore-release-command
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.title == 'SimCore v0.63.54 release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Resolve release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' plugins/simcore/latest.js | head -n 1)"
          if [[ "$HEAD_SHA" == "3659464f17b60a0ba200172d7b49c8af32075706" && "$VERSION" == "0.63.53" ]]; then
            echo 'mode=patch' >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == "0.63.54" ]]; then
            echo 'mode=already-current' >> "$GITHUB_OUTPUT"
          else
            echo "unexpected release state: head=$HEAD_SHA version=$VERSION" >&2
            exit 1
          fi

      - name: Load release patch from main
        if: steps.state.outputs.mode == 'patch'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/simcore-06354-release-v2.py > /tmp/simcore-06354-release-v2.py
          python3 -m py_compile /tmp/simcore-06354-release-v2.py

      - name: Patch production source
        if: steps.state.outputs.mode == 'patch'
        run: python3 /tmp/simcore-06354-release-v2.py

      - name: Validate v0.63.54 production source
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.63.54$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.63.54';" plugins/simcore/latest.js
          grep -q 'v0.63.54 Safe-Envelope Structural Boundary Reconcile' plugins/simcore/latest.js
          grep -q 'buildSafeEnvelopeBoundaryConfirmation' plugins/simcore/latest.js
          grep -q "SAFE_BOUNDARY_CONFIRMED" plugins/simcore/latest.js
          grep -q "CANONICAL_BOUNDARY" plugins/simcore/latest.js
          grep -q "COMMUNITY_TO_KNOWLEDGE" plugins/simcore/latest.js
          grep -q 'Safe-envelope reconcile:' plugins/simcore/latest.js
          grep -q 'Safe-envelope boundary:' plugins/simcore/latest.js
          grep -q 'v0.63.53 Boundary-Normalized Envelope Recovery' plugins/simcore/latest.js
          grep -q "BOUNDARY_CONFIRMED_SUFFIX" plugins/simcore/latest.js
          grep -q "REPRESENTATION_DRIFT_CORRELATED" plugins/simcore/latest.js
          grep -q "USER_EDIT_CANDIDATE" plugins/simcore/latest.js
          grep -q 'FRESH_CONFIRMED_SUFFIX' plugins/simcore/latest.js
          grep -q "return stabilizationResult('OBSERVE_ONLY'" plugins/simcore/latest.js
          grep -q "source: 'REQUEST_SIGNATURE_OBSERVER'" plugins/simcore/latest.js
          grep -q 'Host prefix attribution:' plugins/simcore/latest.js
          grep -q 'provider UNVERIFIED' plugins/simcore/latest.js
          grep -q "persistentMutation: 'NONE'" plugins/simcore/latest.js
          if grep -q "slot.content = replacement.canonicalRaw" plugins/simcore/latest.js; then
            echo 'active request-history mutator assignment remains' >&2
            exit 1
          fi
          if grep -q "return stabilizationResult('APPLIED'" plugins/simcore/latest.js; then
            echo 'active APPLIED stabilization path remains' >&2
            exit 1
          fi
          git diff --check

      - name: Push release
        if: steps.state.outputs.mode == 'patch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'release: SimCore v0.63.54 Safe-Envelope Structural Boundary Reconcile'
          git push origin HEAD:release-simcore

      - name: Confirm idempotent current state
        if: steps.state.outputs.mode == 'already-current'
        run: echo 'SimCore v0.63.54 is already the current production release; validation still ran.'

  memory-sync:
    needs: release
    if: github.event.pull_request.title == 'SimCore v0.63.54 release command'
    runs-on: ubuntu-latest
    concurrency:
      group: simcore-main-state-sync
      cancel-in-progress: false
    steps:
      - name: Checkout main memory branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate production
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' /tmp/simcore-latest.js | head -n 1)"
          test -n "$VERSION"
          RELEASE_NAME="$(VERSION="$VERSION" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('/tmp/simcore-latest.js').read_text(encoding='utf-8')
          m = re.search(r'^// v' + re.escape(os.environ['VERSION']) + r'\s+(.+?):\s*$', text, re.M)
          if not m:
              raise SystemExit('release name not found')
          print(m.group(1).strip())
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_blob=$LATEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Synchronize durable memory
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          python3 scripts/simcore-sync-memory.py
          git diff --check

      - name: Commit durable memory
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md
          if git diff --cached --quiet; then
            echo 'Durable memory already synchronized.'
          else
            git commit -m "docs: sync SimCore v${VERSION} production memory"
            PAYLOAD_COMMIT="$(git rev-parse HEAD)"
            python3 scripts/repo-main-write.py --commit "$PAYLOAD_COMMIT" \
              --allow product-manifest.json \
              --allow docs/CURRENT_DEVELOPMENT.md \
              --allow docs/SIMCORE_GUIDELINES.md
          fi

      - name: Build project-source snapshot
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          mkdir -p dist/project-source
          cp product-manifest.json dist/project-source/
          cp docs/SIMCORE_GUIDELINES.md dist/project-source/
          cp docs/CURRENT_DEVELOPMENT.md dist/project-source/
          cat > dist/project-source/SOURCE_METADATA.json <<EOF
          {
            "product": "SimCore",
            "version": "${VERSION}",
            "release_name": "${RELEASE_NAME}",
            "release_branch": "release-simcore",
            "release_commit": "${RELEASE_COMMIT}",
            "release_blob": "${RELEASE_BLOB}",
            "canonical_manifest": "product-manifest.json",
            "canonical_guideline": "docs/SIMCORE_GUIDELINES.md",
            "canonical_development_memory": "docs/CURRENT_DEVELOPMENT.md"
          }
          EOF
          (cd dist/project-source && zip -q -r "../SimCore-v${VERSION}-project-source.zip" .)

      - name: Upload project-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: simcore-project-source-v${{ steps.release.outputs.version }}
          path: dist/SimCore-v${{ steps.release.outputs.version }}-project-source.zip
          if-no-files-found: error
          retention-days: 90
