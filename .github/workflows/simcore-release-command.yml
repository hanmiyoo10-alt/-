name: SimCore release command

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: simcore-release-command
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.title == 'SimCore v0.63.46 release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-simcore
          fetch-depth: 0

      - name: Resolve release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' plugins/simcore/latest.js | head -n 1)"
          if [[ "$HEAD_SHA" == "b8d7a00f7f97c4ff08a414c4e7664a98907ba33d" && "$VERSION" == "0.63.46" ]]; then
            echo 'mode=already-current' >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_SHA" == "eeec4a58417d32acd8161844e8c2d071e17e212f" && "$VERSION" == "0.63.45" ]]; then
            echo 'mode=patch' >> "$GITHUB_OUTPUT"
          else
            echo "unexpected release state: head=$HEAD_SHA version=$VERSION" >&2
            exit 1
          fi

      - name: Load release patch from main
        if: steps.state.outputs.mode == 'patch'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/simcore-06346-release.py > /tmp/simcore-06346-release.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/simcore-06346-release.py')
          s = p.read_text(encoding='utf-8')
          old_line = 'export_old = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, representationCorrelation, mutationAttribution, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"'
          new_old_line = 'export_old = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, representationCorrelation, mutationAttribution, reconcileFrontier, rebuildAttribution, repeatedBreak, frontierMovement, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"'
          old_new_line = 'export_new = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, historyStabilization, representationCorrelation, mutationAttribution, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"'
          new_new_line = 'export_new = "module.exports = { cachePosture, cadence, topology, cacheIntegrity, breakInfo, historyMutation, historyStabilization, representationCorrelation, mutationAttribution, reconcileFrontier, rebuildAttribution, repeatedBreak, frontierMovement, exposure, runtimeIdentity, simcoreContribution, trajectory, continuity, representation };"'
          if s.count(old_line) != 1 or s.count(old_new_line) != 1:
              raise SystemExit(f'release patch export rewrite anchors missing: old={s.count(old_line)} new={s.count(old_new_line)}')
          s = s.replace(old_line, new_old_line, 1).replace(old_new_line, new_new_line, 1)

          old_inactive_anchor = "inactive_anchor = '''      lastFrontierMovementProbe = null;\\n      lastCacheTrajectoryProbe = null;\\n'''"
          new_inactive_anchor = "inactive_anchor = '''      lastFrontierMovementProbe = null;\\n      repeatedBreakLedger.length = 0;\\n      lastCacheTrajectoryProbe = null;\\n'''"
          old_inactive_new = "inactive_new = '''      lastFrontierMovementProbe = null;\\n      lastHistoryStabilizationProbe = null;\\n      lastCacheTrajectoryProbe = null;\\n'''"
          new_inactive_new = "inactive_new = '''      lastFrontierMovementProbe = null;\\n      lastHistoryStabilizationProbe = null;\\n      repeatedBreakLedger.length = 0;\\n      lastCacheTrajectoryProbe = null;\\n'''"
          if s.count(old_inactive_anchor) != 1 or s.count(old_inactive_new) != 1:
              raise SystemExit(f'release patch inactive rewrite anchors missing: old={s.count(old_inactive_anchor)} new={s.count(old_inactive_new)}')
          s = s.replace(old_inactive_anchor, new_inactive_anchor, 1).replace(old_inactive_new, new_inactive_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch production source
        if: steps.state.outputs.mode == 'patch'
        run: python3 /tmp/simcore-06346-release.py

      - name: Validate v0.63.46 production source
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.63.46$' plugins/simcore/latest.js
          grep -q "const SIMCORE_RUNTIME_VERSION = '0.63.46';" plugins/simcore/latest.js
          grep -q 'v0.63.46 Prompt Prefix Stabilization' plugins/simcore/latest.js
          grep -q "KNOWN_COMPACT_ASSISTANT_HASH = '4a852496'" plugins/simcore/latest.js
          grep -q "SKIPPED_UNVERIFIED_REPRESENTATION" plugins/simcore/latest.js
          grep -q "persistentMutation: 'NONE'" plugins/simcore/latest.js
          grep -q 'History stabilization:' plugins/simcore/latest.js
          git diff --check

      - name: Push release
        if: steps.state.outputs.mode == 'patch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'release: SimCore v0.63.46 Prompt Prefix Stabilization'
          git push origin HEAD:release-simcore

      - name: Confirm idempotent current state
        if: steps.state.outputs.mode == 'already-current'
        run: echo 'SimCore v0.63.46 is already the exact current production release.'

  memory-sync:
    needs: release
    if: github.event.pull_request.title == 'SimCore v0.63.46 release command'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main memory branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate production
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"
          git show origin/release-simcore:plugins/simcore/latest.js > /tmp/simcore-latest.js
          git show origin/release-simcore:plugins/simcore/install.js > /tmp/simcore-install.js
          node --check /tmp/simcore-latest.js
          node --check /tmp/simcore-install.js
          cmp -s /tmp/simcore-latest.js /tmp/simcore-install.js
          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' /tmp/simcore-latest.js | head -n 1)"
          test -n "$VERSION"
          RELEASE_NAME="$(VERSION="$VERSION" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('/tmp/simcore-latest.js').read_text(encoding='utf-8')
          m = re.search(r'^// v' + re.escape(os.environ['VERSION']) + r'\s+(.+?):\s*$', text, re.M)
          if not m:
              raise SystemExit('release name not found')
          print(m.group(1).strip())
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_blob=$LATEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Synchronize durable memory
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          python3 scripts/simcore-sync-memory.py
          git diff --check

      - name: Commit durable memory
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'hanmiyoo10-alt'
          git config user.email 'hanmiyoo10@gmail.com'
          git add product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md
          if git diff --cached --quiet; then
            echo 'Durable memory already synchronized.'
          else
            git commit -m "docs: sync SimCore v${VERSION} production memory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build project-source snapshot
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          mkdir -p dist/project-source
          cp product-manifest.json dist/project-source/
          cp docs/SIMCORE_GUIDELINES.md dist/project-source/
          cp docs/CURRENT_DEVELOPMENT.md dist/project-source/
          cat > dist/project-source/SOURCE_METADATA.json <<EOF
          {
            "product": "SimCore",
            "version": "${VERSION}",
            "release_name": "${RELEASE_NAME}",
            "release_branch": "release-simcore",
            "release_commit": "${RELEASE_COMMIT}",
            "release_blob": "${RELEASE_BLOB}",
            "canonical_manifest": "product-manifest.json",
            "canonical_guideline": "docs/SIMCORE_GUIDELINES.md",
            "canonical_development_memory": "docs/CURRENT_DEVELOPMENT.md"
          }
          EOF
          (cd dist/project-source && zip -q -r "../SimCore-v${VERSION}-project-source.zip" .)

      - name: Upload project-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: simcore-project-source-v${{ steps.release.outputs.version }}
          path: dist/SimCore-v${{ steps.release.outputs.version }}-project-source.zip
          if-no-files-found: error
          retention-days: 90
