name: SimCore Exact Approval Activation

# Legacy CI self-test migration sentinels only; these are comments, not active trigger paths.
# products/simcore/releases/activations/**
# SimCore permanent release activation:

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'products/simcore/releases/approvals/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: simcore-release-activation
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Permanent Caller
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      permanent_run_id: ${{ steps.dispatch.outputs.permanent_run_id }}
    steps:
      - name: Checkout exact approval merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact delegated approval transaction
        id: approval
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          PARENT="$(git rev-parse "$MERGE_SHA^1")"
          git diff --name-only "$PARENT" "$MERGE_SHA" > /tmp/simcore-approval-changed.txt
          mapfile -t CHANGED < /tmp/simcore-approval-changed.txt
          test "${#CHANGED[@]}" -eq 2

          mapfile -t APPROVALS < <(printf '%s\n' "${CHANGED[@]}" | grep -E '^products/simcore/releases/approvals/[^/]+\.json$' || true)
          test "${#APPROVALS[@]}" -eq 1
          APPROVAL="${APPROVALS[0]}"
          SPEC=''
          for p in "${CHANGED[@]}"; do
            [[ "$p" == "$APPROVAL" ]] || SPEC="$p"
          done
          test -n "$SPEC"

          for p in "$APPROVAL" "$SPEC"; do
            mapfile -t TOUCHES < <(git log --first-parent --format=%H "$MERGE_SHA" -- "$p")
            test "${#TOUCHES[@]}" -eq 1
            test "${TOUCHES[0]}" = "$MERGE_SHA"
          done

          APPROVAL="$APPROVAL" SPEC="$SPEC" node --input-type=module - <<'NODE' > /tmp/simcore-approval-bootstrap.json
          import { loadApprovalEnvelopeFiles } from './products/simcore/tooling/release-approval-envelope.mjs';
          const x = loadApprovalEnvelopeFiles({ root:'.', approvalPath:process.env.APPROVAL, specPath:process.env.SPEC });
          process.stdout.write(JSON.stringify({ candidateFetchRef:x.candidateReceipt.candidateFetchRef }));
          NODE

          FETCH_REF="$(python3 - <<'PY'
          import json,re
          x=json.load(open('/tmp/simcore-approval-bootstrap.json'))
          ref=str(x.get('candidateFetchRef') or '')
          if not re.fullmatch(r'candidate/simcore/[A-Za-z0-9._/-]+',ref):
              raise SystemExit('SIMCORE_RELEASE_APPROVAL_CANDIDATE_REF_INVALID')
          print(ref)
          PY
          )"
          REF_HEAD="$(git ls-remote origin "refs/heads/$FETCH_REF" 2>/dev/null | awk '{print $1}')"
          PROD_HEAD="$(git ls-remote origin refs/heads/release-simcore 2>/dev/null | awk '{print $1}')"
          [[ "$REF_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROD_HEAD" =~ ^[0-9a-f]{40}$ ]]

          node products/simcore/tooling/release-approval-envelope.mjs \
            --mode POSTMERGE \
            --approval "$APPROVAL" \
            --spec "$SPEC" \
            --observed-candidate "$REF_HEAD" \
            --observed-production "$PROD_HEAD" \
            --changed-paths /tmp/simcore-approval-changed.txt \
            --report /tmp/simcore-release-approval-envelope.json

          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          r=json.load(open('/tmp/simcore-release-approval-envelope.json'))
          if r.get('result') != 'PASS': raise SystemExit('SIMCORE_RELEASE_APPROVAL_ENVELOPE_NOT_PASS')
          if r.get('validationMode') != 'POSTMERGE': raise SystemExit('SIMCORE_RELEASE_APPROVAL_ENVELOPE_MODE_INVALID')
          if r.get('releaseAuthority') != 'APPROVAL_ENVELOPE_VALIDATION_ONLY': raise SystemExit('SIMCORE_RELEASE_APPROVAL_ENVELOPE_AUTHORITY_INVALID')
          if r.get('productionMutation') != 'NONE': raise SystemExit('SIMCORE_RELEASE_APPROVAL_ENVELOPE_MUTATION_INVALID')
          if r.get('publicationDispatch') != 'NONE_VALIDATION_ONLY': raise SystemExit('SIMCORE_RELEASE_APPROVAL_ENVELOPE_DISPATCH_INVALID')
          print('release_id='+str(r['releaseId']))
          print('release_spec_path='+str(r['specPath']))
          print('candidate_fetch_ref='+str(r['candidateFetchRef']))
          print('authority_confirmation='+str(r['authorityConfirmation']))
          print('SIMCORE_EXACT_APPROVAL_BOUNDARY_PASS')
          PY

      - name: Dispatch and observe permanent caller
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_PATH: ${{ steps.approval.outputs.release_spec_path }}
          FETCH_REF: ${{ steps.approval.outputs.candidate_fetch_ref }}
          CONFIRM: ${{ steps.approval.outputs.authority_confirmation }}
        run: |
          set -euo pipefail
          STARTED_EPOCH="$(date -u +%s)"
          DISPATCH_HEAD="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run simcore-release-permanent.yml \
            --ref main \
            -f release_spec_path="$SPEC_PATH" \
            -f candidate_fetch_ref="$FETCH_REF" \
            -f authority_confirmation="$CONFIRM"
          RUN_ID=''
          for _ in $(seq 1 30); do
            gh run list \
              --workflow simcore-release-permanent.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headSha,status,conclusion > /tmp/simcore-permanent-runs.json
            RUN_ID="$(STARTED_EPOCH="$STARTED_EPOCH" DISPATCH_HEAD="$DISPATCH_HEAD" python3 - <<'PY'
          import datetime, json, os
          started=int(os.environ['STARTED_EPOCH'])
          head=os.environ['DISPATCH_HEAD']
          rows=json.load(open('/tmp/simcore-permanent-runs.json'))
          matches=[]
          for r in rows:
              if str(r.get('headSha') or '') != head: continue
              ts=str(r.get('createdAt') or '').replace('Z','+00:00')
              try: epoch=int(datetime.datetime.fromisoformat(ts).timestamp())
              except Exception: continue
              if epoch >= started-2: matches.append((epoch,int(r['databaseId'])))
          if matches: print(sorted(matches)[-1][1])
          PY
            )"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "permanent_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "SIMCORE_PERMANENT_RELEASE_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 5
          gh run view "$RUN_ID" --json databaseId,event,headSha,status,conclusion,name > /tmp/simcore-permanent-result.json
          RUN_ID="$RUN_ID" DISPATCH_HEAD="$DISPATCH_HEAD" python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/simcore-permanent-result.json'))
          assert int(r['databaseId']) == int(os.environ['RUN_ID'])
          assert r['event'] == 'workflow_dispatch'
          assert r['headSha'] == os.environ['DISPATCH_HEAD']
          assert r['status'] == 'completed'
          assert r['conclusion'] == 'success'
          print('SIMCORE_PERMANENT_RELEASE_DISPATCH_PASS')
          PY

  required:
    name: Approval Activation Required
    if: always()
    needs: dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce adapter result
        shell: bash
        env:
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          PERMANENT_RUN_ID: ${{ needs.dispatch.outputs.permanent_run_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_RESULT" = success
          [[ "$PERMANENT_RUN_ID" =~ ^[0-9]+$ ]]
          echo "SIMCORE_EXACT_APPROVAL_ACTIVATION_PASS run=$PERMANENT_RUN_ID"
