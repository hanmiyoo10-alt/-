name: SimCore release state sync

on:
  push:
    branches:
      - release-simcore
    paths:
      - 'plugins/simcore/latest.js'
      - 'plugins/simcore/install.js'
  workflow_run:
    workflows:
      - 'SimCore release command'
    types: [completed]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: simcore-main-state-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.pull_request.title == 'SimCore durable memory sync command')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main memory branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and materialize production identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          RELEASE_COMMIT="$(git rev-parse origin/release-simcore)"
          LATEST_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)"
          INSTALL_BLOB="$(git rev-parse origin/release-simcore:plugins/simcore/install.js)"
          test "$LATEST_BLOB" = "$INSTALL_BLOB"

          mkdir -p .simcore-state-sync
          git show origin/release-simcore:plugins/simcore/latest.js > .simcore-state-sync/latest.js
          git show origin/release-simcore:plugins/simcore/install.js > .simcore-state-sync/install.js
          node --check .simcore-state-sync/latest.js
          node --check .simcore-state-sync/install.js
          cmp -s .simcore-state-sync/latest.js .simcore-state-sync/install.js

          VERSION="$(sed -n 's#^//@version[[:space:]]*##p' .simcore-state-sync/latest.js | head -n 1)"
          test -n "$VERSION"
          RELEASE_NAME="$(VERSION="$VERSION" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('.simcore-state-sync/latest.js').read_text(encoding='utf-8')
          m = re.search(r'^// v' + re.escape(os.environ['VERSION']) + r'\s+(.+?):\s*$', text, re.M)
          if not m:
              raise SystemExit('release name not found')
          print(m.group(1).strip())
          PY
          )"

          cat > .simcore-state-sync/identity.json <<EOF
          {
            "schemaVersion": 1,
            "product": "SimCore",
            "resolvedBranch": "release-simcore",
            "resolvedCommit": "$RELEASE_COMMIT",
            "latest": {"path": ".simcore-state-sync/latest.js", "blob": "$LATEST_BLOB"},
            "install": {"path": ".simcore-state-sync/install.js", "blob": "$INSTALL_BLOB"}
          }
          EOF

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_blob=$LATEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Update transitional release declaration only
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          python3 scripts/simcore-sync-memory.py --manifest-only

      - name: Apply registered administrative transition
        shell: bash
        run: |
          set -euo pipefail
          TRANSITION='products/simcore/state-sync/active-admin-transition.json'
          if test -f "$TRANSITION"; then
            node products/simcore/tooling/admin-state-transition.mjs \
              --root . \
              --transition "$TRANSITION" \
              --manifest product-manifest.json \
              --write \
              --report .simcore-state-sync/admin-transition-report.json
          else
            echo 'No registered SimCore administrative transition.'
          fi

      - name: Render registered document state
        shell: bash
        run: |
          set -euo pipefail
          node products/simcore/tooling/sync-state.mjs \
            --write \
            --root . \
            --manifest product-manifest.json \
            --production-identity .simcore-state-sync/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report .simcore-state-sync/write-report.json
          git diff --check

      - name: Clean materialized source and commit bounded state
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .simcore-state-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md
          if git diff --cached --quiet; then
            echo 'Durable state already synchronized.'
          else
            git commit -m "docs: sync SimCore v${VERSION} production state"
            PAYLOAD_COMMIT="$(git rev-parse HEAD)"
            python3 scripts/repo-main-write.py --commit "$PAYLOAD_COMMIT" \
              --allow product-manifest.json \
              --allow docs/CURRENT_DEVELOPMENT.md \
              --allow docs/SIMCORE_GUIDELINES.md \
              --required-workflow simcore-ci.yml \
              --required-profile MAIN_HEALTH \
              --required-job Required \
              --staging-prefix simcore-main-write-gate
          fi

      - name: Build project-source snapshot
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BLOB: ${{ steps.release.outputs.release_blob }}
        run: |
          set -euo pipefail
          mkdir -p dist/project-source
          cp product-manifest.json dist/project-source/
          cp docs/SIMCORE_GUIDELINES.md dist/project-source/
          cp docs/CURRENT_DEVELOPMENT.md dist/project-source/
          cat > dist/project-source/SOURCE_METADATA.json <<EOF
          {
            "product": "SimCore",
            "version": "${VERSION}",
            "release_name": "${RELEASE_NAME}",
            "release_branch": "release-simcore",
            "release_commit": "${RELEASE_COMMIT}",
            "release_blob": "${RELEASE_BLOB}",
            "canonical_manifest": "product-manifest.json",
            "canonical_guideline": "docs/SIMCORE_GUIDELINES.md",
            "canonical_development_memory": "docs/CURRENT_DEVELOPMENT.md"
          }
          EOF
          (cd dist/project-source && zip -q -r "../SimCore-v${VERSION}-project-source.zip" .)

      - name: Upload project-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: simcore-project-source-v${{ steps.release.outputs.version }}
          path: dist/SimCore-v${{ steps.release.outputs.version }}-project-source.zip
          if-no-files-found: error
          retention-days: 90
