name: SimCore Release

on:
  push:
    branches: [main]
    paths:
      - 'products/simcore/releases/specs/*.json'
  workflow_dispatch:
    inputs:
      authorization_commit:
        description: Immutable main authorization commit R
        required: true
        type: string
      release_spec_path:
        description: Exact release spec path Q
        required: true
        type: string
      expected_release_id:
        description: Optional release ID cross-check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: simcore-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Shadow Authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorization_commit: ${{ steps.resolve.outputs.authorization_commit }}
      release_spec_path: ${{ steps.resolve.outputs.release_spec_path }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      release_spec_sha256: ${{ steps.resolve.outputs.release_spec_sha256 }}
      candidate_commit: ${{ steps.resolve.outputs.candidate_commit }}
      expected_production_commit: ${{ steps.resolve.outputs.expected_production_commit }}
      candidate_release_blob: ${{ steps.resolve.outputs.candidate_release_blob }}
      candidate_fetch_ref: ${{ steps.resolve.outputs.candidate_fetch_ref }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
    steps:
      - name: Checkout trusted permanent release system
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable authorization and candidate transport
        id: resolve
        shell: bash
        env:
          INPUT_AUTHORIZATION_COMMIT: ${{ inputs.authorization_commit }}
          INPUT_RELEASE_SPEC_PATH: ${{ inputs.release_spec_path }}
          INPUT_EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'RELEASE_WORKFLOW_UNTRUSTED_REF'; exit 2; }
          git fetch --no-tags origin release-simcore

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            R="$GITHUB_SHA"
            Q="$(python3 - "$R" <<'PY'
          import re, subprocess, sys
          r=sys.argv[1]
          parent=subprocess.check_output(['git','rev-parse',f'{r}^1'], text=True).strip()
          rows=[]
          raw=subprocess.check_output(['git','diff','--name-status',parent,r], text=True)
          for line in raw.splitlines():
              if not line.strip():
                  continue
              parts=line.split('\t')
              rows.append((parts[0], parts[-1]))
          if len(rows)!=1 or rows[0][0] != 'A' or not re.fullmatch(r'products/simcore/releases/specs/[A-Za-z0-9_.-]+\.json', rows[0][1]):
              raise SystemExit(f'RELEASE_AUTHORIZATION_SCOPE_MIXED:{rows}')
          print(rows[0][1])
          PY
          )"
            EXPECTED_RELEASE_ID=""
          else
            R="${INPUT_AUTHORIZATION_COMMIT:-}"
            Q="${INPUT_RELEASE_SPEC_PATH:-}"
            EXPECTED_RELEASE_ID="${INPUT_EXPECTED_RELEASE_ID:-}"
          fi

          [[ "$R" =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_AUTHORIZATION_IDENTITY_INVALID'; exit 2; }
          [[ "$Q" =~ ^products/simcore/releases/specs/[A-Za-z0-9_.-]+\.json$ ]] || { echo 'RELEASE_SPEC_ID_INVALID'; exit 2; }
          git cat-file -e "$R^{commit}"

          readarray -t SPEC_META < <(python3 - "$R" "$Q" <<'PY'
          import json, subprocess, sys
          r,q=sys.argv[1:]
          spec=json.loads(subprocess.check_output(['git','show',f'{r}:{q}'], text=True))
          print(spec.get('releaseId',''))
          print(spec.get('candidateCommit',''))
          PY
          )
          RELEASE_ID="${SPEC_META[0]:-}"
          CANDIDATE="${SPEC_META[1]:-}"
          [[ "$RELEASE_ID" =~ ^simcore-v[0-9]+\.[0-9]+\.[0-9]+-(new|correction|rollback|noop)-[0-9]{2,}$ ]] || { echo 'RELEASE_SPEC_ID_INVALID'; exit 2; }
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || { echo 'CANDIDATE_IDENTITY_INVALID'; exit 2; }

          CANDIDATE_REF="refs/heads/simcore-release-candidate/$RELEASE_ID"
          FETCH_HINT=""
          if ! git cat-file -e "$CANDIDATE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$CANDIDATE_REF"
          fi
          if git ls-remote --exit-code --heads origin "$CANDIDATE_REF" >/dev/null 2>&1; then
            FETCH_HINT="$CANDIDATE_REF"
            git fetch --no-tags origin "$CANDIDATE_REF"
          fi
          git cat-file -e "$CANDIDATE^{commit}"

          mkdir -p .simcore-release
          CMD=(node products/simcore/tooling/release/controller.mjs
            --phase resolve
            --authority SHADOW_ONLY
            --authorization-commit "$R"
            --release-spec-path "$Q"
            --production-ref origin/release-simcore
            --report .simcore-release/resolved.json)
          if [[ -n "$EXPECTED_RELEASE_ID" ]]; then
            CMD+=(--expected-release-id "$EXPECTED_RELEASE_ID")
          fi
          "${CMD[@]}"

          python3 - .simcore-release/resolved.json "$FETCH_HINT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1]))
          t=report['transaction']
          values={
            'authorization_commit':t['authorizationCommit'],
            'release_spec_path':t['releaseSpecPath'],
            'release_id':t['releaseId'],
            'release_spec_sha256':t['releaseSpecSha256'],
            'candidate_commit':t['candidateCommit'],
            'expected_production_commit':t['expectedProductionCommit'],
            'candidate_release_blob':t['candidateReleaseBlob'],
            'candidate_fetch_ref':sys.argv[2],
            'release_mode':t['releaseMode'],
          }
          for k,v in values.items():
              print(f'{k}={v}')
          PY

      - name: Assert shadow-only write surface
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.resolve.outputs.authorization_commit }}" != ""
          test "${{ steps.resolve.outputs.candidate_commit }}" != ""
          if grep -nE 'git push .*release-simcore|force-with-lease|--force|update-ref .*release-simcore' \
              products/simcore/tooling/release/controller.mjs .github/workflows/simcore-release.yml; then
            echo 'RELEASE_SHADOW_WRITE_PRIMITIVE_PRESENT'
            exit 1
          fi

  candidate-required:
    name: Candidate Required Shadow
    needs: [resolve]
    permissions:
      contents: read
    uses: ./.github/workflows/simcore-ci.yml
    with:
      profile: CANDIDATE_REQUIRED
      candidate_commit: ${{ needs.resolve.outputs.candidate_commit }}
      candidate_fetch_ref: ${{ needs.resolve.outputs.candidate_fetch_ref }}
      expected_production_commit: ${{ needs.resolve.outputs.expected_production_commit }}
      candidate_required_authority: SHADOW_ONLY
      release_spec_sha256: ${{ needs.resolve.outputs.release_spec_sha256 }}

  finalize:
    name: Finalize Shadow Publication Plan
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, candidate-required]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted permanent release system
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-resolve transaction and consume verifier receipt
        shell: bash
        env:
          R: ${{ needs.resolve.outputs.authorization_commit }}
          Q: ${{ needs.resolve.outputs.release_spec_path }}
          EXPECTED_RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          CANDIDATE_REF: ${{ needs.resolve.outputs.candidate_fetch_ref }}
          CI_JOB_RESULT: ${{ needs.candidate-required.result }}
          CI_CONCLUSION: ${{ needs.candidate-required.outputs.conclusion }}
          VERIFIED_CANDIDATE: ${{ needs.candidate-required.outputs.verified_candidate_commit }}
          VERIFIED_PRODUCTION: ${{ needs.candidate-required.outputs.verified_production_commit }}
          VERIFIED_LATEST_BLOB: ${{ needs.candidate-required.outputs.verified_candidate_latest_blob }}
          VERIFIED_INSTALL_BLOB: ${{ needs.candidate-required.outputs.verified_candidate_install_blob }}
          VERIFIER_COMMIT: ${{ needs.candidate-required.outputs.verifier_commit }}
          REPORT_SHA256: ${{ needs.candidate-required.outputs.report_sha256 }}
          VERIFIER_AUTHORITY: ${{ needs.candidate-required.outputs.authority }}
          VERIFIED_SPEC_SHA256: ${{ needs.candidate-required.outputs.release_spec_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          if [[ -n "${CANDIDATE_REF:-}" ]]; then
            git fetch --no-tags origin "$CANDIDATE_REF"
          fi
          mkdir -p .simcore-release
          node products/simcore/tooling/release/controller.mjs \
            --phase resolve \
            --authority SHADOW_ONLY \
            --authorization-commit "$R" \
            --release-spec-path "$Q" \
            --expected-release-id "$EXPECTED_RELEASE_ID" \
            --production-ref origin/release-simcore \
            --report .simcore-release/resolved.json

          python3 - .simcore-release/verifier-receipt.json <<'PY'
          import json, os, sys
          conclusion=os.environ.get('CI_CONCLUSION','')
          if os.environ.get('CI_JOB_RESULT') != 'success' and conclusion not in ('FAIL','INFRA_ERROR'):
              conclusion='FAIL'
          data={
            'schemaVersion':1,
            'authority':os.environ.get('VERIFIER_AUTHORITY') or 'SHADOW_ONLY',
            'profile':'CANDIDATE_REQUIRED',
            'ciConclusion':conclusion or 'FAIL',
            'verifiedCandidateCommit':os.environ.get('VERIFIED_CANDIDATE') or None,
            'verifiedProductionCommit':os.environ.get('VERIFIED_PRODUCTION') or None,
            'verifiedCandidateLatestBlob':os.environ.get('VERIFIED_LATEST_BLOB') or None,
            'verifiedCandidateInstallBlob':os.environ.get('VERIFIED_INSTALL_BLOB') or None,
            'verifierCommit':os.environ.get('VERIFIER_COMMIT') or None,
            'reportSha256':os.environ.get('REPORT_SHA256') or None,
            'releaseSpecSha256':os.environ.get('VERIFIED_SPEC_SHA256') or None,
          }
          with open(sys.argv[1],'w') as f:
              json.dump(data,f,indent=2)
              f.write('\n')
          PY

          node products/simcore/tooling/release/controller.mjs \
            --phase finalize \
            --authority SHADOW_ONLY \
            --resolved-transaction .simcore-release/resolved.json \
            --verifier-receipt .simcore-release/verifier-receipt.json \
            --production-ref origin/release-simcore \
            --report .simcore-release/final.json

          python3 - <<'PY'
          import json
          x=json.load(open('.simcore-release/final.json'))
          if x.get('productionMutation') != 'NONE':
              raise SystemExit('RELEASE_SHADOW_PRODUCTION_MUTATION_CLAIMED')
          if x.get('publicationDisposition') not in ('WOULD_PUBLISH','WOULD_NOOP','WOULD_ALREADY_PROMOTED'):
              raise SystemExit(f"RELEASE_SHADOW_UNEXPECTED_DISPOSITION:{x.get('publicationDisposition')}")
          print(json.dumps({
            'releaseId':x.get('releaseId'),
            'publicationDisposition':x.get('publicationDisposition'),
            'productionMutation':x.get('productionMutation'),
            'observedProductionCommit':x.get('observedProductionCommit'),
            'verifierCommit':x.get('verifierCommit'),
            'verificationReportSha256':x.get('verificationReportSha256'),
          }, separators=(',',':')))
          PY
