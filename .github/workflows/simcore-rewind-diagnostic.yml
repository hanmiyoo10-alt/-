name: Publish SimCore v0.62.17 rewind restore diagnostic

on:
  push:
    paths:
      - 'plugins/simcore/rewind-diagnostic.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime-only rewind diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_old = '''// v0.62.16 Preamble Diagnostic Cleanup:\n// - Runtime/state/storage/output canonicalization behavior remains unchanged\n// - Safe recoverable <Thoughts> preambles are compatibility diagnostics, not structure warnings\n// - Unknown non-Thoughts preambles remain warnings\n// - No Core prompt/lifecycle/reaction/community changes, no state reset, no new storage I/O'''
          release_new = '''// v0.62.17 Rewind Restore Diagnostic:\n// - Runtime/state/storage/output behavior remains unchanged\n// - Adds runtime-only visibility for successful pre-snapshot restores after rewind/retry\n// - Records restore index/reason/previous output index in memory for the panel only\n// - No snapshot format/state schema/Core prompt/lifecycle/community/reaction changes, no new storage I/O'''

          detail_old = '''      detail.mustRestorePre = false;\n      detail.existingPre = false;\n    }\n\n    const mustRestorePre = sendIndex <= this.currentOutputIndex || sendIndex === this.lastPreparedSendIndex;\n    if (detail) detail.mustRestorePre = mustRestorePre;'''
          detail_new = '''      detail.mustRestorePre = false;\n      detail.existingPre = false;\n      detail.previousOutputIndex = this.currentOutputIndex;\n      detail.restoreReason = 'forward';\n    }\n\n    const previousOutputIndex = this.currentOutputIndex;\n    const mustRestorePre = sendIndex <= previousOutputIndex || sendIndex === this.lastPreparedSendIndex;\n    if (detail) {\n      detail.mustRestorePre = mustRestorePre;\n      detail.previousOutputIndex = previousOutputIndex;\n      detail.restoreReason = !mustRestorePre\n        ? 'forward'\n        : (sendIndex < previousOutputIndex ? 'rewind' : (sendIndex === previousOutputIndex ? 'same-index' : 'repeat-send'));\n    }'''

          vars_old = '''  let lastCore = { active: false, mode: null, issues: [], diagnostics: [] };\n  let lastPerf = null;\n  let lastOutputPerf = null;'''
          vars_new = '''  let lastCore = { active: false, mode: null, issues: [], diagnostics: [] };\n  let lastPerf = null;\n  let lastOutputPerf = null;\n  let lastHistoryRestore = null;'''

          send_old = '''    const result = await cs.onSend(sendIndex, userText, promptProbe, snapshotDetail);\n    if (perf) {\n      perf.onSendMs = perfMs(t);\n      perf.snapshotDetail = snapshotDetail;\n    }\n\n    if (result.active && result.promptBlock) {'''
          send_new = '''    const result = await cs.onSend(sendIndex, userText, promptProbe, snapshotDetail);\n    if (perf) {\n      perf.onSendMs = perfMs(t);\n      perf.snapshotDetail = snapshotDetail;\n    }\n    if (snapshotDetail?.mustRestorePre && snapshotDetail?.existingPre) {\n      lastHistoryRestore = {\n        sendIndex,\n        previousOutputIndex: Number(snapshotDetail.previousOutputIndex),\n        reason: snapshotDetail.restoreReason || 'restore',\n        at: Date.now(),\n      };\n    }\n\n    if (result.active && result.promptBlock) {'''

          card_old = '''${(lastCore.diagnostics || []).length ? `<div class="card"><div class="k" style="margin-bottom:8px">Compatibility diagnostics</div><div>${lastCore.diagnostics.map((x) => `• ${escapeHtml(x)}`).join('<br>')}</div></div>` : ''}\n${lastPerf ? `<div class="card"><div class="k" style="margin-bottom:8px">beforeRequest performance (latest)</div><table>'''
          card_new = '''${(lastCore.diagnostics || []).length ? `<div class="card"><div class="k" style="margin-bottom:8px">Compatibility diagnostics</div><div>${lastCore.diagnostics.map((x) => `• ${escapeHtml(x)}`).join('<br>')}</div></div>` : ''}\n${lastHistoryRestore ? `<div class="card"><div class="k" style="margin-bottom:8px">Last history restore (runtime)</div><div>RESTORED · ${escapeHtml(lastHistoryRestore.reason)} · send index ${Number(lastHistoryRestore.sendIndex)}</div><div class="muted" style="margin-top:5px">previous output index ${Number.isFinite(lastHistoryRestore.previousOutputIndex) ? Number(lastHistoryRestore.previousOutputIndex) : 'unknown'} · ${escapeHtml(new Date(lastHistoryRestore.at).toLocaleString())}</div></div>` : ''}\n${lastPerf ? `<div class="card"><div class="k" style="margin-bottom:8px">beforeRequest performance (latest)</div><table>'''

          perf_old = '''${lastPerf.snapshotDetail ? `<tr><td>&nbsp;&nbsp;Pre restore/load</td><td>${Number(lastPerf.snapshotDetail.preLoadMs || 0).toFixed(1)} ms${lastPerf.snapshotDetail.mustRestorePre ? ` (${lastPerf.snapshotDetail.existingPre ? 'restored' : 'miss'})` : ' (forward skip)'}</td></tr>'''
          perf_new = '''${lastPerf.snapshotDetail ? `<tr><td>&nbsp;&nbsp;Pre restore/load</td><td>${Number(lastPerf.snapshotDetail.preLoadMs || 0).toFixed(1)} ms${lastPerf.snapshotDetail.mustRestorePre ? ` (${lastPerf.snapshotDetail.existingPre ? `restored:${escapeHtml(lastPerf.snapshotDetail.restoreReason || 'restore')}` : `miss:${escapeHtml(lastPerf.snapshotDetail.restoreReason || 'restore')}`})` : ' (forward skip)'}</td></tr>'''

          for name in ['plugins/simcore/latest.js', 'plugins/simcore/install.js']:
              p = Path(name)
              s = p.read_text()
              assert '//@version 0.62.16' in s, name
              s = s.replace('//@version 0.62.16', '//@version 0.62.17', 1)
              s = s.replace('//@display-name SimCore v0.62.16 Preamble Diagnostic Cleanup', '//@display-name SimCore v0.62.17 Rewind Restore Diagnostic', 1)
              for old, new in [(release_old, release_new), (detail_old, detail_new), (vars_old, vars_new), (send_old, send_new), (card_old, card_new), (perf_old, perf_new)]:
                  assert old in s, (name, old[:60])
                  s = s.replace(old, new, 1)
              s = s.replace('[simcore/v0.62.16]', '[simcore/v0.62.17]')
              s = s.replace('⚙️ SimCore v0.62.16', '⚙️ SimCore v0.62.17')
              s = s.replace('v0.62.16 Preamble Diagnostic Cleanup · Thoughts compatibility is informational · runtime unchanged', 'v0.62.17 Rewind Restore Diagnostic · runtime-only restore visibility · core behavior unchanged')
              s = s.replace("'SimCore v0.62.16'", "'SimCore v0.62.17'")
              p.write_text(s)
          PY
          node --check plugins/simcore/latest.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -m1 '^//@version ' plugins/simcore/latest.js
          grep -q 'Last history restore (runtime)' plugins/simcore/latest.js
          grep -q "restoreReason = 'forward'" plugins/simcore/latest.js
      - name: Commit update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Publish SimCore v0.62.17 rewind restore diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
