name: SimCore RS2-2 Canonical Main Clean Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simcore-rs2-2-clean-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANONICAL_MAIN: 0e9bb560bf1b52983dbf37c5adbdc39468a79912
  PRODUCTION_COMMIT: 47969d24771f6cc188df6e32150fc6fde519182d
  PRODUCTION_BLOB: 34da01aa131f760b92d65d961a7843e9cc0d37d6

jobs:
  clean1:
    runs-on: ubuntu-24.04
    steps:
      - name: Fresh checkout exact landed canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_MAIN }}
          fetch-depth: 0
      - name: Materialize exact production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          git fetch --no-tags origin release-simcore
          test "$(git rev-parse origin/release-simcore)" = "$PRODUCTION_COMMIT"
          test "$(git rev-parse origin/release-simcore:plugins/simcore/latest.js)" = "$PRODUCTION_BLOB"
          test "$(git rev-parse origin/release-simcore:plugins/simcore/install.js)" = "$PRODUCTION_BLOB"
          mkdir -p .rs22-prod
          git show origin/release-simcore:plugins/simcore/latest.js > .rs22-prod/latest.js
          git show origin/release-simcore:plugins/simcore/install.js > .rs22-prod/install.js
          cmp -s .rs22-prod/latest.js .rs22-prod/install.js
          cat > .rs22-prod/identity.json <<EOF
          {"schemaVersion":1,"product":"SimCore","resolvedBranch":"release-simcore","resolvedCommit":"$PRODUCTION_COMMIT","latest":{"path":".rs22-prod/latest.js","blob":"$PRODUCTION_BLOB"},"install":{"path":".rs22-prod/install.js","blob":"$PRODUCTION_BLOB"}}
          EOF
      - name: CLEAN-1
        shell: bash
        run: |
          set -euo pipefail
          node products/simcore/tooling/sync-state.mjs \
            --check --root . --manifest product-manifest.json \
            --production-identity .rs22-prod/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report /tmp/clean1.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/clean1.json'))
          assert r['result'] in ('CHECK_CLEAN','CHECK_CLEAN_WITH_OBSERVATIONS')
          assert r['counts']['blockers']==0
          assert r['counts']['drifts']==0
          assert r['writerPolicy']=='WRITER_POLICY_CLEAN'
          assert all(t['state']=='CLEAN' for t in r['targets'])
          print('CLEAN-1', r['result'], r['counts'])
          PY

  clean2:
    runs-on: ubuntu-24.04
    steps:
      - name: Independent fresh checkout exact landed canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_MAIN }}
          fetch-depth: 0
      - name: Materialize exact production independently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          git fetch --no-tags origin release-simcore
          test "$(git rev-parse origin/release-simcore)" = "$PRODUCTION_COMMIT"
          mkdir -p .rs22-prod
          git show origin/release-simcore:plugins/simcore/latest.js > .rs22-prod/latest.js
          git show origin/release-simcore:plugins/simcore/install.js > .rs22-prod/install.js
          cmp -s .rs22-prod/latest.js .rs22-prod/install.js
          cat > .rs22-prod/identity.json <<EOF
          {"schemaVersion":1,"product":"SimCore","resolvedBranch":"release-simcore","resolvedCommit":"$PRODUCTION_COMMIT","latest":{"path":".rs22-prod/latest.js","blob":"$PRODUCTION_BLOB"},"install":{"path":".rs22-prod/install.js","blob":"$PRODUCTION_BLOB"}}
          EOF
      - name: CLEAN-2 idempotence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md > /tmp/before.sha
          node products/simcore/tooling/sync-state.mjs \
            --write --root . --manifest product-manifest.json \
            --production-identity .rs22-prod/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report /tmp/write.json
          sha256sum product-manifest.json docs/CURRENT_DEVELOPMENT.md docs/SIMCORE_GUIDELINES.md > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          node products/simcore/tooling/sync-state.mjs \
            --check --root . --manifest product-manifest.json \
            --production-identity .rs22-prod/identity.json \
            --targets products/simcore/state-sync/target-registry.json \
            --probes products/simcore/state-sync/current-claim-probes.json \
            --writer-policy products/simcore/state-sync/writer-policy.json \
            --report /tmp/clean2.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/clean2.json'))
          assert r['result'] in ('CHECK_CLEAN','CHECK_CLEAN_WITH_OBSERVATIONS')
          assert r['counts']['blockers']==0
          assert r['counts']['drifts']==0
          assert all(t['state']=='CLEAN' for t in r['targets'])
          w=json.load(open('/tmp/write.json'))
          assert w['writes']==[]
          print('CLEAN-2', r['result'], r['counts'], 'writes=0')
          PY
