name: Release SimCore v0.62.28 Runtime Prompt Budget Probe

on:
  push:
    paths:
      - plugins/simcore/runtime-prompt-budget-probe-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve v0.62.27 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-v0.62.27.js

      - name: Build runtime prompt budget probe plugin
        run: python3 plugins/simcore/patch_simcore_06228.py

      - name: Verify syntax and identical install channel
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.62.28$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore v0.62.28 Runtime Prompt Budget Probe$' plugins/simcore/latest.js

      - name: Verify runtime prompt byte identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def extract(text):
              start = text.index('function renderRuntimePrompt(state) {')
              end = text.index('\n\nfunction finalizePreparedOutput', start)
              return text[start:end]
          old = Path('/tmp/simcore-v0.62.27.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          assert extract(old) == extract(new), 'renderRuntimePrompt changed'
          print('renderRuntimePrompt byte-identical to v0.62.27')
          PY

      - name: Verify diagnostics-only and I/O invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/simcore-v0.62.27.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          for token in [
              'Risuai.pluginStorage.getItem',
              'Risuai.pluginStorage.setItem',
              'Risuai.pluginStorage.removeItem',
              'Risuai.pluginStorage.keys',
              'Risuai.getCharacter()',
              'globalLore',
              "messages.push({ role: 'system', content: result.promptBlock });",
          ]:
              assert old.count(token) == new.count(token), f'call/reference count changed: {token}'
          assert 'let lastRuntimePromptBudget = null;' in new
          assert 'Runtime prompt budget (current request)' in new
          assert "runtimeBudgetText.split('\\n')" in new
          assert "runtimeBudgetReactionLine" in new
          assert 'diagnostics only · prompt unchanged' in new
          print('diagnostics-only invariants verified')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-v0.62.28-backup/plugins/simcore
          cp plugins/simcore/latest.js /tmp/simcore-v0.62.28-backup/plugins/simcore/latest.js
          cp plugins/simcore/install.js /tmp/simcore-v0.62.28-backup/plugins/simcore/install.js
          sha256sum plugins/simcore/latest.js | awk '{print $1}' > /tmp/simcore-v0.62.28-backup/plugin-sha256.txt
          printf '%s\n' 'SimCore v0.62.28 Runtime Prompt Budget Probe' 'Diagnostics only; runtime prompt byte-identical to v0.62.27.' > /tmp/simcore-v0.62.28-backup/release-info.txt
          cd /tmp/simcore-v0.62.28-backup && zip -qr /tmp/simcore.plugin.v0.62.28.zip .
          sha256sum /tmp/simcore.plugin.v0.62.28.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.28-backup
          path: /tmp/simcore.plugin.v0.62.28.zip
          if-no-files-found: error

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.28 Runtime Prompt Budget Probe'
          git push
