name: Release SimCore v0.62.29 Short Community Lineage Anchor

on:
  push:
    paths:
      - plugins/simcore/short-community-lineage-anchor-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve v0.62.28 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-v0.62.28.js

      - name: Build short community lineage anchor plugin
        run: python3 plugins/simcore/patch_simcore_06229.py

      - name: Verify syntax and identical install channel
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.62.29$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore v0.62.29 Short Community Lineage Anchor$' plugins/simcore/latest.js

      - name: Verify exact runtime prompt delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def extract(text):
              start = text.index('function renderRuntimePrompt(state) {')
              end = text.index('\n\nfunction finalizePreparedOutput', start)
              return text[start:end]
          old = Path('/tmp/simcore-v0.62.28.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          old_render = extract(old)
          new_render = extract(new)
          block = "  else if (p.mode === 'C' && p.communitySourceHandoffEligible) {\n    lines.push('short_community_request_context_is_current_lineage=1');\n  }\n"
          assert new_render.count("short_community_request_context_is_current_lineage=1") == 1
          assert new_render.replace(block, '', 1) == old_render, 'unexpected renderRuntimePrompt delta'
          print('renderRuntimePrompt delta = exactly one conditional one-line anchor')
          PY

      - name: Verify short-C anchor behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const { performance } = require('perf_hooks');
          function load(path) {
            let src = fs.readFileSync(path, 'utf8');
            src = src.slice(0, src.indexOf('\n(async () =>'));
            const ctx = { console, performance, Date, JSON, Math, Number, String, Array, Object, RegExp, Set, Map, Promise };
            vm.createContext(ctx);
            vm.runInContext(src + '\n;globalThis.__SimCore = SimCore;', ctx);
            return { session: ctx.__SimCore.require('session'), kernel: ctx.__SimCore.require('kernel') };
          }
          function prompt(core, mode, eligible, newSource) {
            const s = core.kernel.initialState();
            s.broadcastLocked = /^B_/.test(mode);
            s.pending = {
              active: true,
              sendIndex: 100,
              mode,
              secondaryConfigured: false,
              secondaryActive: false,
              narrativeProgressionActive: false,
              narrativeClockGuard: false,
              templateRecurrenceRepeated: false,
              communitySourceHandoffEligible: !!eligible,
              communitySourceHandoffNewSource: !!newSource,
              communitySourceHandoffRootMode: 'A',
              broadcastAirtimePrevious: null,
              broadcastAirtimeStart: null,
            };
            return core.session.renderRuntimePrompt(s);
          }
          const oldCore = load('/tmp/simcore-v0.62.28.js');
          const newCore = load('plugins/simcore/latest.js');
          const line = 'short_community_request_context_is_current_lineage=1';

          const oldFirst = prompt(oldCore, 'C', true, false);
          const newFirst = prompt(newCore, 'C', true, false);
          if ((newFirst.split('\n').filter(x => x === line)).length !== 1) throw new Error('eligible short C missing/duplicate lineage anchor');
          if (newFirst.replace(line + '\n', '') !== oldFirst) throw new Error('eligible short C changed beyond one line');

          for (const [name, mode, eligible, newSource] of [
            ['ineligible-C', 'C', false, false],
            ['new-source-C', 'C', true, true],
            ['A', 'A', true, false],
            ['B', 'B_START', true, false],
          ]) {
            const a = prompt(oldCore, mode, eligible, newSource);
            const b = prompt(newCore, mode, eligible, newSource);
            if (a !== b) throw new Error(name + ' should be byte-identical to v0.62.28');
            if (b.includes(line)) throw new Error(name + ' must not receive lineage anchor');
          }
          const ns = prompt(newCore, 'C', true, true);
          if (!ns.includes('short_community_request_reused_with_new_source=A') || !ns.includes('derive_reaction_from_current_source_not_prior_answer=1')) {
            throw new Error('existing NEW SOURCE guidance regressed');
          }
          console.log('short-C lineage anchor behavior verified');
          NODE

      - name: Verify state and I/O invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/simcore-v0.62.28.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          for token in [
              'Risuai.pluginStorage.getItem',
              'Risuai.pluginStorage.setItem',
              'Risuai.pluginStorage.removeItem',
              'Risuai.pluginStorage.keys',
              'Risuai.getCharacter()',
              'globalLore',
              "messages.push({ role: 'system', content: result.promptBlock });",
          ]:
              assert old.count(token) == new.count(token), f'call/reference count changed: {token}'
          def block(text, start_token, end_token):
              a = text.index(start_token)
              b = text.index(end_token, a)
              return text[a:b]
          assert block(old, 'function initialState() {', '\n\nfunction reconcileState') == block(new, 'function initialState() {', '\n\nfunction reconcileState')
          assert block(old, 'function prepareTurn(baseState, userText, promptProbe, sendIndex) {', '\n\nfunction expectedCommunityBlocks') == block(new, 'function prepareTurn(baseState, userText, promptProbe, sendIndex) {', '\n\nfunction expectedCommunityBlocks')
          assert "lineageAnchor: runtimeBudgetLines.some" in new
          assert "1-line current-lineage hint injected" in new
          print('state schema, lifecycle, host I/O, lore access invariants verified')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-v0.62.29-backup/plugins/simcore
          cp plugins/simcore/latest.js /tmp/simcore-v0.62.29-backup/plugins/simcore/latest.js
          cp plugins/simcore/install.js /tmp/simcore-v0.62.29-backup/plugins/simcore/install.js
          sha256sum plugins/simcore/latest.js | awk '{print $1}' > /tmp/simcore-v0.62.29-backup/plugin-sha256.txt
          printf '%s\n' 'SimCore v0.62.29 Short Community Lineage Anchor' 'Eligible FIRST/SAME SOURCE short-C gets exactly one current-lineage hint; NEW SOURCE remains unchanged.' > /tmp/simcore-v0.62.29-backup/release-info.txt
          cd /tmp/simcore-v0.62.29-backup && zip -qr /tmp/simcore.plugin.v0.62.29.zip .
          sha256sum /tmp/simcore.plugin.v0.62.29.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.29-backup
          path: /tmp/simcore.plugin.v0.62.29.zip
          if-no-files-found: error

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.29 Short Community Lineage Anchor'
          git push
