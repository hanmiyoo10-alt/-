name: Release SimCore v0.62.32 Stable Menu Label

on:
  push:
    paths:
      - plugins/simcore/stable-menu-label-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve v0.62.31 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-v0.62.31.js

      - name: Build stable menu label plugin
        run: python3 plugins/simcore/patch_simcore_06232.py

      - name: Verify syntax and identical install channel
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.62.32$' plugins/simcore/latest.js
          grep -q '^//@name simcore$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore$' plugins/simcore/latest.js

      - name: Verify runtime behavior identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/simcore-v0.62.31.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          def extract(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]
          old_prompt = extract(old, 'function renderRuntimePrompt(state) {', '\n\nfunction finalizePreparedOutput')
          new_prompt = extract(new, 'function renderRuntimePrompt(state) {', '\n\nfunction finalizePreparedOutput')
          assert old_prompt == new_prompt, 'runtime prompt changed'
          for token in [
              'Risuai.pluginStorage.getItem',
              'Risuai.pluginStorage.setItem',
              'Risuai.pluginStorage.removeItem',
              'Risuai.pluginStorage.keys',
              'Risuai.getCharacter()',
              'globalLore',
              'const STATE_VERSION =',
              'const CORE_STATE_VERSION =',
          ]:
              assert old.count(token) == new.count(token), f'call/state reference count changed: {token}'
          assert '//@display-name SimCore\n' in new
          assert '//@name simcore\n' in new
          print('UI/metadata-only invariants verified')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-v0.62.32-backup/plugins/simcore
          cp plugins/simcore/latest.js /tmp/simcore-v0.62.32-backup/plugins/simcore/latest.js
          cp plugins/simcore/install.js /tmp/simcore-v0.62.32-backup/plugins/simcore/install.js
          sha256sum plugins/simcore/latest.js | awk '{print $1}' > /tmp/simcore-v0.62.32-backup/plugin-sha256.txt
          printf '%s\n' 'SimCore v0.62.32 Stable Menu Label' 'UI/metadata only; stable versionless display-name; runtime prompt unchanged.' > /tmp/simcore-v0.62.32-backup/release-info.txt
          cd /tmp/simcore-v0.62.32-backup && zip -qr /tmp/simcore.plugin.v0.62.32.zip .
          sha256sum /tmp/simcore.plugin.v0.62.32.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.32-backup
          path: /tmp/simcore.plugin.v0.62.32.zip
          if-no-files-found: error

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.32 Stable Menu Label'
          git push
