name: Release SimCore v0.62.33 Stable Settings Label

on:
  push:
    paths:
      - plugins/simcore/stable-settings-label-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve v0.62.32 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-v0.62.32.js

      - name: Build stable settings label plugin
        run: python3 plugins/simcore/patch_simcore_06233.py

      - name: Verify syntax and identical install channel
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.62.33$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore$' plugins/simcore/latest.js
          grep -q "registerSetting('SimCore', openPanel, '⚙️', 'html')" plugins/simcore/latest.js
          ! grep -q "registerSetting('SimCore v0.62.20'" plugins/simcore/latest.js

      - name: Verify runtime prompt identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def extract(text):
              start = text.index('function renderRuntimePrompt(state) {')
              end = text.index('\n\nfunction finalizePreparedOutput', start)
              return text[start:end]
          old = extract(Path('/tmp/simcore-v0.62.32.js').read_text(encoding='utf-8'))
          new = extract(Path('plugins/simcore/latest.js').read_text(encoding='utf-8'))
          assert old == new, 'renderRuntimePrompt changed in UI-only release'
          print('runtime prompt byte-identical')
          PY

      - name: Verify state and I/O invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/simcore-v0.62.32.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          for token in [
              'Risuai.pluginStorage.getItem',
              'Risuai.pluginStorage.setItem',
              'Risuai.pluginStorage.removeItem',
              'Risuai.pluginStorage.keys',
              'Risuai.getCharacter()',
              'globalLore',
              'const STATE_VERSION =',
              'const CORE_STATE_VERSION =',
          ]:
              assert old.count(token) == new.count(token), f'invariant changed: {token}'
          assert new.count("Risuai.registerSetting('SimCore', openPanel, '⚙️', 'html')") == 1
          assert "Risuai.registerSetting('SimCore v0.62.20'" not in new
          print('state/I/O and settings-label invariants verified')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-v0.62.33-backup/plugins/simcore
          cp plugins/simcore/latest.js /tmp/simcore-v0.62.33-backup/plugins/simcore/latest.js
          cp plugins/simcore/install.js /tmp/simcore-v0.62.33-backup/plugins/simcore/install.js
          sha256sum plugins/simcore/latest.js | awk '{print $1}' > /tmp/simcore-v0.62.33-backup/plugin-sha256.txt
          printf '%s\n' 'SimCore v0.62.33 Stable Settings Label' 'UI-only: PocketRisu registerSetting label changed from hardcoded SimCore v0.62.20 to SimCore.' > /tmp/simcore-v0.62.33-backup/release-info.txt
          cd /tmp/simcore-v0.62.33-backup && zip -qr /tmp/simcore.plugin.v0.62.33.zip .
          sha256sum /tmp/simcore.plugin.v0.62.33.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.33-backup
          path: /tmp/simcore.plugin.v0.62.33.zip
          if-no-files-found: error

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.33 Stable Settings Label'
          git push
