name: Stage SimCore v0.62.21 template recurrence guard

on:
  push:
    paths:
      - 'plugins/simcore/template-recurrence-stage.trigger'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply template recurrence patch
        run: |
          python plugins/simcore/patch_simcore_06221.py
          python plugins/simcore/patch_simcore_06221_fresh_bootstrap.py
      - name: Validate plugin
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '//@version 0.62.21' plugins/simcore/latest.js
          grep -q 'request_template_recurs_from_prior_history=1' plugins/simcore/latest.js
          grep -q 'TEMPLATE_RECURRENCE_VERSION = 1' plugins/simcore/latest.js
          grep -q 'TEMPLATE_REGISTRY_LIMIT = 384' plugins/simcore/latest.js
          grep -q 'templateRecurrenceVersion: 0' plugins/simcore/latest.js
      - name: Static recurrence invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          s = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          assert "c.mode === 'C'\n    ? recurrence.observe(state, input)" in s
          assert "bootstrapState(base, historyMessages, sendIndex" in s
          assert "prior_answer_is_not_a_content_template=1" in s
          assert "do_not_mechanically_reuse_prior_answer_composition_or_wording=1" in s
          assert "existing outputs are never rewritten" in s.lower()
          assert "templateRecurrenceVersion: 0" in s
          diff = subprocess.check_output(['git', 'diff', '--unified=0', '--', 'plugins/simcore/latest.js'], text=True)
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          assert not any('pluginStorage.' in line for line in added), 'new pluginStorage API call added'
          print('recurrence invariants ok')
          PY
      - name: Build backup zip
        run: |
          mkdir -p artifact
          cp plugins/simcore/latest.js artifact/latest.js
          cp plugins/simcore/install.js artifact/install.js
          (cd artifact && zip -9 simcore.plugin.v0.62.21.zip latest.js install.js)
          sha256sum plugins/simcore/latest.js artifact/simcore.plugin.v0.62.21.zip | tee artifact/SHA256SUMS.txt
          wc -c plugins/simcore/latest.js plugins/simcore/install.js | tee artifact/SIZES.txt
      - name: Upload staged backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.21-staged-final
          path: |
            artifact/simcore.plugin.v0.62.21.zip
            artifact/SHA256SUMS.txt
            artifact/SIZES.txt
            artifact/latest.js
            artifact/install.js
          if-no-files-found: error
          retention-days: 30
