name: Release SimCore v0.62.34 UI Label Consolidation

on:
  push:
    paths:
      - plugins/simcore/ui-label-consolidation-release.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve v0.62.33 baseline
        run: cp plugins/simcore/latest.js /tmp/simcore-v0.62.33.js

      - name: Build UI label consolidation plugin
        run: python3 plugins/simcore/patch_simcore_06234.py

      - name: Verify syntax and identical install channel
        run: |
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -q '^//@version 0.62.34$' plugins/simcore/latest.js
          grep -q '^//@display-name SimCore$' plugins/simcore/latest.js
          grep -q "registerButton({ name: 'SimCore', icon: '⚙️', iconType: 'html', location: 'chat' }, openPanel)" plugins/simcore/latest.js
          grep -q "registerSetting('SimCore', openPanel, '⚙️', 'html')" plugins/simcore/latest.js
          ! grep -q "name: 'SimCore Lite'" plugins/simcore/latest.js
          ! grep -q 'v0.62.29 Short Community Lineage Anchor' plugins/simcore/latest.js
          grep -q 'Short Community Lineage Anchor · FIRST/SAME SOURCE seeded short-C gets one current-lineage hint' plugins/simcore/latest.js

      - name: Verify runtime prompt identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def extract(text):
              start = text.index('function renderRuntimePrompt(state) {')
              end = text.index('\n\nfunction finalizePreparedOutput', start)
              return text[start:end]
          old = extract(Path('/tmp/simcore-v0.62.33.js').read_text(encoding='utf-8'))
          new = extract(Path('plugins/simcore/latest.js').read_text(encoding='utf-8'))
          assert old == new, 'renderRuntimePrompt changed in UI-only release'
          print('runtime prompt byte-identical')
          PY

      - name: Verify state and I/O invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/simcore-v0.62.33.js').read_text(encoding='utf-8')
          new = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          for token in [
              'Risuai.pluginStorage.getItem',
              'Risuai.pluginStorage.setItem',
              'Risuai.pluginStorage.removeItem',
              'Risuai.pluginStorage.keys',
              'Risuai.getCharacter()',
              'globalLore',
              'const STATE_VERSION =',
              'const CORE_STATE_VERSION =',
          ]:
              assert old.count(token) == new.count(token), f'invariant changed: {token}'
          assert new.count("Risuai.registerButton({ name: 'SimCore', icon: '⚙️', iconType: 'html', location: 'chat' }, openPanel)") == 1
          assert new.count("Risuai.registerSetting('SimCore', openPanel, '⚙️', 'html')") == 1
          print('state/I/O and UI-label invariants verified')
          PY

      - name: Build backup before publish
        run: |
          mkdir -p /tmp/simcore-v0.62.34-backup/plugins/simcore
          cp plugins/simcore/latest.js /tmp/simcore-v0.62.34-backup/plugins/simcore/latest.js
          cp plugins/simcore/install.js /tmp/simcore-v0.62.34-backup/plugins/simcore/install.js
          sha256sum plugins/simcore/latest.js | awk '{print $1}' > /tmp/simcore-v0.62.34-backup/plugin-sha256.txt
          printf '%s\n' 'SimCore v0.62.34 UI Label Consolidation' 'UI-only: chat button and panel footer labels consolidated to versionless SimCore/function names.' > /tmp/simcore-v0.62.34-backup/release-info.txt
          cd /tmp/simcore-v0.62.34-backup && zip -qr /tmp/simcore.plugin.v0.62.34.zip .
          sha256sum /tmp/simcore.plugin.v0.62.34.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: simcore-v0.62.34-backup
          path: /tmp/simcore.plugin.v0.62.34.zip
          if-no-files-found: error

      - name: Publish plugin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/simcore/latest.js plugins/simcore/install.js
          git commit -m 'Release SimCore v0.62.34 UI Label Consolidation'
          git push
