name: SimCore v0.70.3 legacy compat fix qualification

on:
  push:
    branches:
      - fix/simcore-v07003-legacy-compat-session-reexport-fixture-20260903

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation fix authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact production authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin release-simcore
          test "$(git rev-parse FETCH_HEAD)" = "861100f4771967aa5b8ab8811d06f11702c0d3ff"

      - name: Materialize production into isolated temp root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simcore-v07003-legacy-fix"
          rm -rf "$root"
          mkdir -p "$root/plugins/simcore"
          git show FETCH_HEAD:plugins/simcore/latest.js > "$root/plugins/simcore/latest.js"
          git show FETCH_HEAD:plugins/simcore/install.js > "$root/plugins/simcore/install.js"
          cmp -s "$root/plugins/simcore/latest.js" "$root/plugins/simcore/install.js"
          grep -q '^//@version 0.70.1$' "$root/plugins/simcore/latest.js"

      - name: Prove legacy adapter still passes exact production
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simcore-v07003-legacy-fix"
          node scripts/simcore-06406-closure-completion-gate-test.mjs "$root/plugins/simcore/latest.js"

      - name: Materialize deterministic S7 candidate in temp root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simcore-v07003-legacy-fix"
          (
            cd "$root"
            python "$GITHUB_WORKSPACE/products/simcore/tooling/build-s7-post-m2-simplification-convergence.py"
          )
          grep -q '^//@version 0.70.3$' "$root/plugins/simcore/latest.js"
          cmp -s "$root/plugins/simcore/latest.js" "$root/plugins/simcore/install.js"

      - name: Prove retired-export fallback against S7 bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simcore-v07003-legacy-fix"
          node scripts/simcore-06406-closure-completion-gate-test.mjs "$root/plugins/simcore/latest.js"

      - name: Assert no repository runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- plugins/simcore/latest.js plugins/simcore/install.js
