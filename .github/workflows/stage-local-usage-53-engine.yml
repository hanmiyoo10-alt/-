name: Stage Local Usage 5.3 Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-local-usage-53-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct exact Bridge 1.6.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins/usage-dashboard/runtime
          {
            head -c 15000 .github/lud53/bridge.b64.00
            head -c 15000 .github/lud53/bridge.b64.01
            head -c 15000 .github/lud53/bridge.b64.02
            head -c 15000 .github/lud53/bridge.b64.03
            head -c 15000 .github/lud53/bridge.b64.04
            head -c 15000 .github/lud53/bridge.b64.05
            head -c 15000 .github/lud53/bridge.b64.06
            head -c 6632 .github/lud53/bridge.b64.07
          } > /tmp/bridge.b64
          base64 -d /tmp/bridge.b64 > plugins/usage-dashboard/runtime/bridge-engine.mjs
          test "$(wc -c < plugins/usage-dashboard/runtime/bridge-engine.mjs)" -eq 83723
          test "$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const VERSION = '1.6.1';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const HOST = '127.0.0.1';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const PORT = Number(process.env.DEVPASS_BRIDGE_PORT || 39117);" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "if (!isAuthorized(req))" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "error: 'Not found'" plugins/usage-dashboard/runtime/bridge-engine.mjs

      - name: Commit exact bundled engine to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/runtime/bridge-engine.mjs
          if git diff --cached --quiet; then
            echo 'bridge engine already staged'
            exit 0
          fi
          git commit -m 'feat: bundle exact Bridge 1.6.1 engine source'
          git push origin HEAD:main
