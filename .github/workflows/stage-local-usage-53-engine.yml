name: Stage Local Usage 5.3 Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-local-usage-53-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct exact Bridge 1.6.1
        shell: bash
        run: |
          set -euo pipefail
          check() { test "$(sha256sum "$1" | awk '{print $1}')" = "$2" || { echo "hash mismatch: $1"; exit 1; }; }
          check .github/lud53/fix00.0 c8a015eb906b544229bbb8d9e8f5a8bfa872622840e12a0307e0bbcc973160f2
          check .github/lud53/fix00.1 c6d39a66c2eec44bff38c4729f7c611ae2173b5cee8a4f2481c86715ac88bcce
          check .github/lud53/fix00.2 6eab38bd206912912420c30a69a1ccfe3e1739783e7c192f4cbb8e4000eb214a
          check .github/lud53/fix04.0 2077dcf0bee0cb34b7538ba6949ad3f01647d8adc9e7eca6bb5ac198a7ae5586
          check .github/lud53/fix04.1 16c9d32cd4406aef1b4257ae8fe9c4350e79fe1828219db25231b668c3d5d0e6
          check .github/lud53/fix04.2a 69b1e615d7eda803920b3edf22883ab50ccd9a5900e1351719670c6b6044ba33
          check .github/lud53/fix04.2b a632cc327d3e355cb2415e2b9e1eaed151c6729ce2c8aae2d713eedf4a0600ba
          cat .github/lud53/fix00.0 .github/lud53/fix00.1 .github/lud53/fix00.2 > /tmp/00
          cat .github/lud53/fix04.0 .github/lud53/fix04.1 .github/lud53/fix04.2a .github/lud53/fix04.2b > /tmp/04
          check /tmp/00 472b576f9ee36ddd09fd5522d80dd4d876f2de7cf0d46dc54136755468f0b3c1
          check /tmp/04 7c368576501e0f42b960a98c48abb7b60d8ee6b7545faafeed48d992d487c89d
          mkdir -p plugins/usage-dashboard/runtime
          {
            cat /tmp/00
            head -c 15000 .github/lud53/bridge.b64.01
            head -c 15000 .github/lud53/bridge.b64.02
            head -c 15000 .github/lud53/bridge.b64.03
            cat /tmp/04
            head -c 15000 .github/lud53/bridge.b64.05
            head -c 15000 .github/lud53/bridge.b64.06
            head -c 6632 .github/lud53/bridge.b64.07
          } > /tmp/bridge.b64
          check /tmp/bridge.b64 e0b48fcd5bc816185251c2039a063b1a75f91bb3c71f9e61eed7a4baf38a9bb9
          base64 -d /tmp/bridge.b64 > plugins/usage-dashboard/runtime/bridge-engine.mjs
          test "$(wc -c < plugins/usage-dashboard/runtime/bridge-engine.mjs)" -eq 83723
          check plugins/usage-dashboard/runtime/bridge-engine.mjs fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const VERSION = '1.6.1';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const HOST = '127.0.0.1';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const PORT = Number(process.env.DEVPASS_BRIDGE_PORT || 39117);" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "if (!isAuthorized(req))" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "error: 'Not found'" plugins/usage-dashboard/runtime/bridge-engine.mjs

      - name: Commit exact bundled engine to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/runtime/bridge-engine.mjs
          if git diff --cached --quiet; then
            echo 'bridge engine already staged'
            exit 0
          fi
          git commit -m 'feat: bundle exact Bridge 1.6.1 engine source'
          git push origin HEAD:main
