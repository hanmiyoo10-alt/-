name: Publish Usage Dashboard 5.33 Five Tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-533-five-tabs.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate five-tab 5.33 build
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          git diff --check
          grep -Fq '//@version 3.0.0-alpha.5.33' plugins/usage-dashboard/latest.js
          grep -Fq 'Navigation: tabbed · overview/devpass/credits/analytics/settings' plugins/usage-dashboard/latest.js
          grep -Fq "['credits','Credits']" plugins/usage-dashboard/latest.js
          grep -Fq ".shell[data-dashboard-view=\"credits\"]" plugins/usage-dashboard/latest.js
          grep -Fq "if (next === 'devpass' || next === 'credits') state.usageScopeView = next;" plugins/usage-dashboard/latest.js
          grep -Fq "dashboardView === 'devpass' ? 'DevPass Usage' : dashboardView === 'credits' ? 'Credits Usage'" plugins/usage-dashboard/latest.js
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js

      - name: Publish five-tab 5.33 to release channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/latest.js
          grep -Fq '//@version 3.0.0-alpha.5.33' plugins/usage-dashboard/latest.js
          grep -Fq 'Navigation: tabbed · overview/devpass/credits/analytics/settings' plugins/usage-dashboard/latest.js
          git diff --check
          git add plugins/usage-dashboard/latest.js
          if git diff --cached --quiet; then
            echo 'release channel already matches five-tab 5.33'
            exit 0
          fi
          git commit -m 'release: refine Local Usage Dashboard 5.33 five-tab navigation'
          git push origin HEAD:release-usage-dashboard
