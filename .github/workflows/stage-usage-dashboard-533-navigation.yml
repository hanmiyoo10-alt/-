name: Publish Usage Dashboard 5.33 Navigation Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-533-navigation.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revalidate 5.33 navigation build
        shell: bash
        run: |
          set -euo pipefail
          ROOT='plugins/usage-dashboard'
          VERSION='3.0.0-alpha.5.33'
          node "$ROOT/tools/build_usage_dashboard.cjs" --check
          node --check "$ROOT/latest.js"
          node --check "$ROOT/runtime/bridge-manager.cjs"
          node --check "$ROOT/runtime/bridge-engine.mjs"
          bash -n "$ROOT/runtime/bootstrap-bridge-manager.sh"
          node "$ROOT/tests/foundation.cjs"
          node "$ROOT/tests/p1-contract.cjs"
          node "$ROOT/tests/p2-build.cjs"
          node "$ROOT/tests/p3-ui.cjs"
          node "$ROOT/tests/p3-recent.cjs"
          node "$ROOT/tests/p4-render.cjs"
          node "$ROOT/tests/p4-partial.cjs"
          node "$ROOT/tests/p4-hourly-drilldown.cjs"
          node "$ROOT/tests/p4-hourly-detail.cjs"
          node "$ROOT/tests/p4-request-fidelity.cjs"
          node "$ROOT/tests/p5-unified-runtime.cjs"
          node "$ROOT/tests/p5-bridge-manager.cjs"
          node "$ROOT/tests/p5-engine-adoption.cjs"
          node "$ROOT/tests/p5-bundled-engine.cjs"
          grep -Fq "//@version $VERSION" "$ROOT/latest.js"
          grep -Fq "dashboardView: 'overview'" "$ROOT/latest.js"
          grep -Fq 'data-dashboard-nav=' "$ROOT/latest.js"
          grep -Fq 'Navigation: tabbed · overview/devpass/analytics/settings' "$ROOT/latest.js"
          grep -Fq "\"productVersion\": \"$VERSION\"" "$ROOT/runtime/product-manifest.json"
          ENGINE_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridge?.sha256||""))' "$ROOT/runtime/product-manifest.json")"
          test "$ENGINE_SHA" = "$(sha256sum "$ROOT/runtime/bridge-engine.mjs" | awk '{print $1}')"
          MANAGER_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridgeManager?.sha256||""))' "$ROOT/runtime/product-manifest.json")"
          test "$MANAGER_SHA" = "$(sha256sum "$ROOT/runtime/bridge-manager.cjs" | awk '{print $1}')"
          git diff --check
          cp "$ROOT/latest.js" /tmp/usage-dashboard-533-latest.js
          rm -rf /tmp/usage-dashboard-533-runtime
          cp -R "$ROOT/runtime" /tmp/usage-dashboard-533-runtime

      - name: Publish 5.33 to release channel
        shell: bash
        run: |
          set -euo pipefail
          ROOT='plugins/usage-dashboard'
          VERSION='3.0.0-alpha.5.33'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf "$ROOT/runtime"
          mkdir -p "$ROOT"
          cp /tmp/usage-dashboard-533-latest.js "$ROOT/latest.js"
          cp -R /tmp/usage-dashboard-533-runtime "$ROOT/runtime"
          node --check "$ROOT/latest.js"
          node --check "$ROOT/runtime/bridge-manager.cjs"
          node --check "$ROOT/runtime/bridge-engine.mjs"
          grep -Fq "//@version $VERSION" "$ROOT/latest.js"
          grep -Fq 'data-dashboard-nav=' "$ROOT/latest.js"
          grep -Fq "\"productVersion\": \"$VERSION\"" "$ROOT/runtime/product-manifest.json"
          git diff --check
          git add "$ROOT/latest.js" "$ROOT/runtime"
          if git diff --cached --quiet; then
            echo "release-usage-dashboard already matches $VERSION"
            exit 0
          fi
          git commit -m "release: publish Local Usage Dashboard $VERSION product artifacts"
          git push origin HEAD:release-usage-dashboard
