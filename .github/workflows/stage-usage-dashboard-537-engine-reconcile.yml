name: Stage Usage Dashboard 5.37 Engine Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-537-engine-reconcile.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch stale running engine reconciliation and bump to 5.37
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha537_engine_reconcile.py
          python3 plugins/usage-dashboard/tools/release_alpha537_engine_reconcile.py
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          git diff --check
          grep -Fq '//@version 3.0.0-alpha.5.37' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.37';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.4';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "current.engineBundled && String(current.engineVersion || '') === BUNDLED_ENGINE_VERSION" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'runningEngineVersion === bundledEngineVersion' plugins/usage-dashboard/latest.js
          grep -Fq '"productVersion": "3.0.0-alpha.5.37"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"version": "1.2.6"' plugins/usage-dashboard/runtime/product-manifest.json

      - name: Commit validated 5.37 hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/src plugins/usage-dashboard/latest.js plugins/usage-dashboard/tests/p5-bridge-manager.cjs plugins/usage-dashboard/tests/p5-bundled-engine.cjs plugins/usage-dashboard/runtime/bridge-manager.cjs plugins/usage-dashboard/runtime/product-manifest.json
          git diff --cached --check
          git commit -m 'release: Local Usage Dashboard 5.37 reconcile bundled engine runtime'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish 5.37 product artifacts to release channel
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq '//@version 3.0.0-alpha.5.37' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.4';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.37"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.37 product artifacts'
          git push origin HEAD:release-usage-dashboard
