name: Stage Usage Dashboard 5.44 Structural Modularization final r2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-541-service-tier-fidelity.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch structural modularization
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha544_patch.py
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha544_patch_r3.py
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha544_patch_r4.py
          python3 -m py_compile plugins/usage-dashboard/tools/release_alpha544_patch_r5.py
          python3 plugins/usage-dashboard/tools/release_alpha544_patch.py
          python3 plugins/usage-dashboard/tools/release_alpha544_patch_r3.py
          python3 plugins/usage-dashboard/tools/release_alpha544_patch_r4.py
          python3 plugins/usage-dashboard/tools/release_alpha544_patch_r5.py
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          node plugins/usage-dashboard/tests/foundation.cjs
          node plugins/usage-dashboard/tests/p1-contract.cjs
          node plugins/usage-dashboard/tests/p2-build.cjs
          node plugins/usage-dashboard/tests/p3-ui.cjs
          node plugins/usage-dashboard/tests/p3-recent.cjs
          node plugins/usage-dashboard/tests/p4-render.cjs
          node plugins/usage-dashboard/tests/p4-partial.cjs
          node plugins/usage-dashboard/tests/p4-hourly-drilldown.cjs
          node plugins/usage-dashboard/tests/p4-hourly-detail.cjs
          node plugins/usage-dashboard/tests/p4-request-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-unified-runtime.cjs
          node plugins/usage-dashboard/tests/p5-bridge-manager.cjs
          node plugins/usage-dashboard/tests/p5-engine-adoption.cjs
          node plugins/usage-dashboard/tests/p5-bundled-engine.cjs
          node plugins/usage-dashboard/tests/p5-lifecycle-race.cjs
          node plugins/usage-dashboard/tests/p5-bridge-control-sync.cjs
          node plugins/usage-dashboard/tests/p5-service-tier-fidelity.cjs
          node plugins/usage-dashboard/tests/p5-devpass-account-parity.cjs
          node plugins/usage-dashboard/tests/p5-floating-widget-ux.cjs
          node plugins/usage-dashboard/tests/p5-module-layout.cjs
          node plugins/usage-dashboard/tests/p5-structural-parity.cjs
          node plugins/usage-dashboard/tests/p5-state-compatibility.cjs
          git diff --check
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 22
          grep -Fq '//@version 3.0.0-alpha.5.44' plugins/usage-dashboard/latest.js
          grep -Fq "const REQUIRED_BRIDGE_VERSION = '1.6.5';" plugins/usage-dashboard/latest.js
          grep -Fq "file:'06-runtime-stability.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq "file:'08-runtime-product.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq "file:'12-service-tier.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq "file:'14-request-ledger.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq "file:'52-analytics-context.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq "file:'74-widget-gestures.part.js'" plugins/usage-dashboard/src/parts.cjs
          grep -Fq 'data-widget-toggle="1"' plugins/usage-dashboard/latest.js
          grep -Fq 'Floating widget UX:' plugins/usage-dashboard/latest.js
          grep -Fq 'Service tier fidelity:' plugins/usage-dashboard/latest.js
          grep -Fq 'DevPass account detail:' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.5';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.44';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.5';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.44"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.5"' plugins/usage-dashboard/runtime/product-manifest.json

      - name: Commit validated 5.44 modular source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A plugins/usage-dashboard/src \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/tests \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json \
            .github/workflows/release-local-usage-dashboard.yml
          git diff --cached --check
          git commit -m 'release: Local Usage Dashboard 5.44 structural modularization'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish 5.44 product artifacts to release channel
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq '//@version 3.0.0-alpha.5.44' plugins/usage-dashboard/latest.js
          grep -Fq 'data-widget-toggle="1"' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.5';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.44';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.44"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.5"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release-usage-dashboard already matches 5.44'
            exit 0
          fi
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.44 product artifacts'
          git push origin HEAD:release-usage-dashboard
