name: Stage Usage Dashboard 3.0.0-alpha.5.55 Snapshot Performance Attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-555-snapshot-performance-attribution.yml'
      - 'plugins/usage-dashboard/tools/release_snapshot_performance_attribution_555.py'
      - 'plugins/usage-dashboard/tests/p16-snapshot-performance-attribution.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-555-snapshot-performance-attribution.yml'
      - 'plugins/usage-dashboard/tools/release_snapshot_performance_attribution_555.py'
      - 'plugins/usage-dashboard/tests/p16-snapshot-performance-attribution.cjs'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate 5.55 Snapshot Performance Attribution candidate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage-555.log) 2>&1
          python3 -m py_compile plugins/usage-dashboard/tools/release_snapshot_performance_attribution_555.py
          if grep -Fq "const VERSION = '3.0.0-alpha.5.55';" plugins/usage-dashboard/src/00-runtime-core.part.js; then
            echo '5.55 candidate already materialized; skipping 5.54 -> 5.55 patch step'
          else
            python3 plugins/usage-dashboard/tools/release_snapshot_performance_attribution_555.py
          fi

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          bash -n scripts/bootstrap-usage-dashboard.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check

          for test in \
            foundation.cjs \
            p1-contract.cjs \
            p2-build.cjs \
            p3-ui.cjs \
            p3-recent.cjs \
            p4-render.cjs \
            p4-partial.cjs \
            p4-hourly-drilldown.cjs \
            p4-hourly-detail.cjs \
            p4-request-fidelity.cjs \
            p5-unified-runtime.cjs \
            p5-bridge-manager.cjs \
            p5-engine-adoption.cjs \
            p5-bundled-engine.cjs \
            p5-lifecycle-race.cjs \
            p5-bridge-control-sync.cjs \
            p5-service-tier-fidelity.cjs \
            p5-devpass-account-parity.cjs \
            p5-floating-widget-ux.cjs \
            p5-module-layout.cjs \
            p5-structural-parity.cjs \
            p5-state-compatibility.cjs \
            p6-rc-migration.cjs \
            p6-rc-contract.cjs \
            p6-release-hardening.cjs \
            p7-cache-observability.cjs \
            p11-cache-fidelity.cjs \
            p12-gh-bootstrap.cjs \
            p13-cache-provenance-diagnostics.cjs \
            p14-project-guidelines-memory.cjs \
            p15-runtime-recovery-fidelity.cjs \
            p16-snapshot-performance-attribution.cjs; do
            node "plugins/usage-dashboard/tests/$test"
          done

          git diff --check
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 22
          grep -Fq '//@version 3.0.0-alpha.5.55' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.55';" plugins/usage-dashboard/latest.js
          grep -Fq "const REQUIRED_BRIDGE_VERSION = '1.6.9';" plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.9';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.55';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.9';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.55"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.9"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq "import { AsyncLocalStorage } from 'node:async_hooks';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'result.diagnostics.snapshotPerformance = snapshotAttributionSummary(attribution);' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'Bridge snapshot attribution:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge CLI timing:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot cache:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot circuit:' plugins/usage-dashboard/latest.js
          grep -Fq 'parser provider-usage-v3' plugins/usage-dashboard/latest.js
          grep -Fq 'write unknown-on-cache' plugins/usage-dashboard/latest.js
          grep -Fq 'unknown stays unknown' plugins/usage-dashboard/latest.js
          grep -Fq 'active local errors' plugins/usage-dashboard/latest.js
          grep -Fq 'Current release implementation: `3.0.0-alpha.5.55 — Snapshot Performance Attribution`' docs/USAGE_DASHBOARD_GUIDELINES.md
          grep -Fq 'Next candidate after the 5.55 real-device diagnostic: `3.0.0-alpha.5.56 — Snapshot Performance Repair`' docs/USAGE_DASHBOARD_GUIDELINES.md

      - name: Persist staging failure log
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins/usage-dashboard
          if [ -f /tmp/stage-555.log ]; then
            cp /tmp/stage-555.log plugins/usage-dashboard/stage-555-failure.log
          else
            printf '5.55 staging failed before the candidate log was created.\n' > plugins/usage-dashboard/stage-555-failure.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard/stage-555-failure.log
          git diff --cached --quiet && exit 0
          git commit -m 'ci: capture 5.55 staging failure'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit validated 5.55 candidate to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A plugins/usage-dashboard/src \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/tests \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json \
            docs/USAGE_DASHBOARD_GUIDELINES.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'main already matches 3.0.0-alpha.5.55'
          else
            git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.5.55 Snapshot Performance Attribution'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish 5.55 candidate to release channel
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq '//@version 3.0.0-alpha.5.55' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot attribution:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge CLI timing:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot cache:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot circuit:' plugins/usage-dashboard/latest.js
          grep -Fq 'parser provider-usage-v3' plugins/usage-dashboard/latest.js
          grep -Fq 'write unknown-on-cache' plugins/usage-dashboard/latest.js
          grep -Fq 'unknown stays unknown' plugins/usage-dashboard/latest.js
          grep -Fq 'active local errors' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.9';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.55';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.9';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.55"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.9"' plugins/usage-dashboard/runtime/product-manifest.json
          git diff --check
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release-usage-dashboard already matches 3.0.0-alpha.5.55'
            exit 0
          fi
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.55 product artifacts'
          git push origin HEAD:release-usage-dashboard
