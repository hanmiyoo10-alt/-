name: Stage Usage Dashboard 3.0.0-alpha.5.59 Snapshot Scheduling Attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-559-scheduling-attribution.yml'
      - 'plugins/usage-dashboard/tools/release_snapshot_scheduling_attribution_559.py'
      - 'plugins/usage-dashboard/tests/p21-snapshot-scheduling-attribution.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-559-scheduling-attribution.yml'
      - 'plugins/usage-dashboard/tools/release_snapshot_scheduling_attribution_559.py'
      - 'plugins/usage-dashboard/tests/p21-snapshot-scheduling-attribution.cjs'

permissions:
  contents: write

# This repository has multiple independently released products on one main.
# All jobs that can mutate main share this lock with SimCore/main-state writers.
concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate 5.59 scheduling attribution candidate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage-559.log) 2>&1
          python3 -m py_compile plugins/usage-dashboard/tools/release_snapshot_scheduling_attribution_559.py
          if grep -Fq "const VERSION = '3.0.0-alpha.5.59';" plugins/usage-dashboard/src/00-runtime-core.part.js; then
            echo '5.59 candidate already materialized; skipping 5.58 -> 5.59 patch step'
          else
            python3 plugins/usage-dashboard/tools/release_snapshot_scheduling_attribution_559.py
          fi

          # Historical regressions keep the release they were born on. Adapt
          # only version/current-memory assertions in this CI workspace, then
          # restore them before materialization so old workflows are not retriggered.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('plugins/usage-dashboard/tests')

          for name in [
              'p11-cache-fidelity.cjs',
              'p13-cache-provenance-diagnostics.cjs',
              'p15-runtime-recovery-fidelity.cjs',
              'p16-snapshot-performance-attribution.cjs',
          ]:
              path = root / name
              text = path.read_text()
              text = text.replace('3.0.0-alpha.5.55', '3.0.0-alpha.5.59')
              text = text.replace('1.6.9', '1.6.13')
              path.write_text(text)

          p16 = root / 'p16-snapshot-performance-attribution.cjs'
          text = p16.read_text()
          text = text.replace(
              "const CLI_CONCURRENCY = Math.max(1, Math.min(2, Number(process.env.DEVPASS_BRIDGE_CLI_CONCURRENCY || 1)));",
              "const CLI_CONCURRENCY = Math.max(1, Math.min(2, Number(process.env.DEVPASS_BRIDGE_CLI_CONCURRENCY || 2)));",
          )
          text = text.replace(
              "const summaryContext = { Date: { now: () => 2000 } };",
              "const summaryContext = { Date: { now: () => 2000 }, CLI_CONCURRENCY: 2, Object, Array };",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Performance Attribution`'));",
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`'));",
          )
          p16.write_text(text)

          p17 = root / 'p17-bounded-cli-parallelism.cjs'
          text = p17.read_text()
          text = text.replace('3.0.0-alpha.5.56', '3.0.0-alpha.5.59')
          text = text.replace('1.6.10', '1.6.13')
          text = text.replace(
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.55 — Snapshot Performance Attribution`'));",
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.58 — Shared 24h Capture Coalescing`'));",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Performance Repair: Bounded CLI Parallelism`'));",
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`'));",
          )
          p17.write_text(text)

          p18 = root / 'p18-organization-discovery-dedup.cjs'
          text = p18.read_text()
          text = text.replace('3.0.0-alpha.5.57', '3.0.0-alpha.5.59')
          text = text.replace('1.6.11', '1.6.13')
          text = text.replace(
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.56 — Snapshot Performance Repair: Bounded CLI Parallelism`'));",
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.58 — Shared 24h Capture Coalescing`'));",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Organization Discovery Deduplication`'));",
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`'));",
          )
          p18.write_text(text)

          p19 = root / 'p19-organization-empty-fallback-fidelity.cjs'
          text = p19.read_text()
          text = text.replace('3.0.0-alpha.5.57', '3.0.0-alpha.5.59')
          text = text.replace('1.6.11', '1.6.13')
          p19.write_text(text)

          p20 = root / 'p20-shared-24h-capture.cjs'
          text = p20.read_text()
          text = text.replace('3.0.0-alpha.5.58', '3.0.0-alpha.5.59')
          text = text.replace('1.6.12', '1.6.13')
          text = text.replace(
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.57 — Organization Discovery Deduplication`'));",
              "assert.ok(guidelines.includes('Last verified real-device baseline: `3.0.0-alpha.5.58 — Shared 24h Capture Coalescing`'));",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Shared 24h Capture Coalescing`'));",
              "assert.ok(guidelines.includes('Current release implementation: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`'));",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('one queued for about 5.87s'));",
              "assert.ok(guidelines.includes('Bridge ran 3 CLI operations'));",
          )
          text = text.replace(
              "assert.ok(guidelines.includes('accountCapture` cache key, 30s TTL, no-stale behavior'));",
              "assert.ok(guidelines.includes('Keep 5.58 shared 24h capture coalescing unchanged'));",
          )
          p20.write_text(text)
          PY

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          bash -n scripts/bootstrap-usage-dashboard.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check

          for test in \
            foundation.cjs \
            p1-contract.cjs \
            p2-build.cjs \
            p3-ui.cjs \
            p3-recent.cjs \
            p4-render.cjs \
            p4-partial.cjs \
            p4-hourly-drilldown.cjs \
            p4-hourly-detail.cjs \
            p4-request-fidelity.cjs \
            p5-unified-runtime.cjs \
            p5-bridge-manager.cjs \
            p5-engine-adoption.cjs \
            p5-bundled-engine.cjs \
            p5-lifecycle-race.cjs \
            p5-bridge-control-sync.cjs \
            p5-service-tier-fidelity.cjs \
            p5-devpass-account-parity.cjs \
            p5-floating-widget-ux.cjs \
            p5-module-layout.cjs \
            p5-structural-parity.cjs \
            p5-state-compatibility.cjs \
            p6-rc-migration.cjs \
            p6-rc-contract.cjs \
            p6-release-hardening.cjs \
            p7-cache-observability.cjs \
            p11-cache-fidelity.cjs \
            p12-gh-bootstrap.cjs \
            p13-cache-provenance-diagnostics.cjs \
            p14-project-guidelines-memory.cjs \
            p15-runtime-recovery-fidelity.cjs \
            p16-snapshot-performance-attribution.cjs \
            p17-bounded-cli-parallelism.cjs \
            p18-organization-discovery-dedup.cjs \
            p19-organization-empty-fallback-fidelity.cjs \
            p20-shared-24h-capture.cjs \
            p21-snapshot-scheduling-attribution.cjs; do
            node "plugins/usage-dashboard/tests/$test"
          done

          git diff --check
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 22
          grep -Fq '//@version 3.0.0-alpha.5.59' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.59';" plugins/usage-dashboard/latest.js
          grep -Fq "const REQUIRED_BRIDGE_VERSION = '1.6.13';" plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.13';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.59';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.13';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.59"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.13"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq "DEVPASS_BRIDGE_CLI_CONCURRENCY || 2" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "cached('accountCapture', async () => captureAccountDetailsViaCliSession('24h'))" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'taskTimeline: Object.create(null)' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'cliOperations: []' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'noteSnapshotCliOperation(label, queuedAt, executionStartedAt, endedAt)' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'Bridge snapshot timeline:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge CLI operations:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge 24h capture reuse:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge organization discovery:' plugins/usage-dashboard/latest.js
          grep -Fq 'peak active' plugins/usage-dashboard/latest.js
          grep -Fq 'parser provider-usage-v3' plugins/usage-dashboard/latest.js
          grep -Fq 'unknown stays unknown' plugins/usage-dashboard/latest.js
          grep -Fq 'active local errors' plugins/usage-dashboard/latest.js
          grep -Fq 'Current release implementation: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`' docs/USAGE_DASHBOARD_GUIDELINES.md
          grep -Fq 'Last verified real-device baseline: `3.0.0-alpha.5.58 — Shared 24h Capture Coalescing`' docs/USAGE_DASHBOARD_GUIDELINES.md

          git checkout -- \
            plugins/usage-dashboard/tests/p11-cache-fidelity.cjs \
            plugins/usage-dashboard/tests/p13-cache-provenance-diagnostics.cjs \
            plugins/usage-dashboard/tests/p15-runtime-recovery-fidelity.cjs \
            plugins/usage-dashboard/tests/p16-snapshot-performance-attribution.cjs \
            plugins/usage-dashboard/tests/p17-bounded-cli-parallelism.cjs \
            plugins/usage-dashboard/tests/p18-organization-discovery-dedup.cjs \
            plugins/usage-dashboard/tests/p19-organization-empty-fallback-fidelity.cjs \
            plugins/usage-dashboard/tests/p20-shared-24h-capture.cjs

      - name: Persist staging failure log
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins/usage-dashboard
          if [ -f /tmp/stage-559.log ]; then
            cp /tmp/stage-559.log plugins/usage-dashboard/stage-559-failure.log
          else
            printf '5.59 staging failed before the candidate log was created.\n' > plugins/usage-dashboard/stage-559-failure.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins/usage-dashboard/stage-559-failure.log
          git diff --cached --quiet && exit 0
          git commit -m 'ci: capture 5.59 staging failure'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit validated 5.59 candidate to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            plugins/usage-dashboard/src \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json \
            docs/USAGE_DASHBOARD_GUIDELINES.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'main already matches 3.0.0-alpha.5.59'
          else
            git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.5.59 Snapshot Scheduling Attribution'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish 5.59 candidate to release channel
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-latest.js
          rm -rf /tmp/usage-dashboard-runtime
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard
          cp /tmp/usage-dashboard-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/usage-dashboard-runtime plugins/usage-dashboard/runtime
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq '//@version 3.0.0-alpha.5.59' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot timeline:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge CLI operations:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge 24h capture reuse:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge organization discovery:' plugins/usage-dashboard/latest.js
          grep -Fq 'peak active' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.13';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "DEVPASS_BRIDGE_CLI_CONCURRENCY || 2" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'taskTimeline: Object.create(null)' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'cliOperations: []' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "cached('accountCapture', async () => captureAccountDetailsViaCliSession('24h'))" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "No organizations found in CLI output" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.59';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.13';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.59"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.13"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq 'parser provider-usage-v3' plugins/usage-dashboard/latest.js
          grep -Fq 'unknown stays unknown' plugins/usage-dashboard/latest.js
          grep -Fq 'active local errors' plugins/usage-dashboard/latest.js
          git diff --check
          git add -- plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if git diff --cached --quiet; then
            echo 'release-usage-dashboard already matches 3.0.0-alpha.5.59'
            exit 0
          fi
          git commit -m 'release: publish Local Usage Dashboard 3.0.0-alpha.5.59 product artifacts'
          git push origin HEAD:release-usage-dashboard
