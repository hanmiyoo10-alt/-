name: Stage Usage Dashboard 3.0.0-alpha.5.65 Npx Cache-First Launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'
      - 'plugins/usage-dashboard/tools/release_npx_cache_first_launcher_565.py'
      - 'plugins/usage-dashboard/tests/p24-snapshot-decision-attribution.cjs'
      - 'plugins/usage-dashboard/tests/p25-long-window-critical-path-decoupling.cjs'
      - 'plugins/usage-dashboard/tests/p26-foreground-cli-launcher-attribution.cjs'
      - 'plugins/usage-dashboard/tests/p27-npx-cache-first-launcher.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'
      - 'plugins/usage-dashboard/tools/release_npx_cache_first_launcher_565.py'
      - 'plugins/usage-dashboard/tests/p24-snapshot-decision-attribution.cjs'
      - 'plugins/usage-dashboard/tests/p25-long-window-critical-path-decoupling.cjs'
      - 'plugins/usage-dashboard/tests/p26-foreground-cli-launcher-attribution.cjs'
      - 'plugins/usage-dashboard/tests/p27-npx-cache-first-launcher.cjs'

permissions:
  contents: write

concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate 5.65 Npx Cache-First Launcher candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            plugins/usage-dashboard/tools/check_release_monotonic.py \
            plugins/usage-dashboard/tools/release_npx_cache_first_launcher_565.py

          if grep -Fq "const VERSION = '3.0.0-alpha.5.65';" plugins/usage-dashboard/src/00-runtime-core.part.js; then
            echo '5.65 candidate already materialized; skipping 5.64 -> 5.65 patch step'
          else
            python3 plugins/usage-dashboard/tools/release_npx_cache_first_launcher_565.py
          fi

          # Historical regressions retain their original release fixtures. Adapt
          # only assertions that intentionally track the currently materialized
          # product/engine/current-memory/publisher in this CI workspace.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('plugins/usage-dashboard/tests')
          product = '3.0.0-alpha.5.65'
          engine = '1.6.18'
          baseline = 'Last verified real-device baseline: `3.0.0-alpha.5.64 — Foreground CLI Launcher Attribution`'
          current = 'Current release implementation: `3.0.0-alpha.5.65 — Npx Cache-First Launcher`'

          def update(name, replacements):
              path = root / name
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)

          update('p5-bundled-engine.cjs', [
              ("async function analyticsScopes(creditsOrgId = '')", "async function analyticsScopes(creditsOrgId = '', options = {})"),
          ])

          for name in ['p11-cache-fidelity.cjs','p13-cache-provenance-diagnostics.cjs','p15-runtime-recovery-fidelity.cjs','p16-snapshot-performance-attribution.cjs']:
              update(name, [('3.0.0-alpha.5.55', product), ('1.6.9', engine)])

          update('p15-runtime-recovery-fidelity.cjs', [
              ('cumulative local persist history remained visible while `active 0` allowed `READY`', 'Stable Readiness remains READY with Engine `1.6.18`, Manager `1.2.6`, and no active local runtime error.'),
          ])

          update('p16-snapshot-performance-attribution.cjs', [
              ("const CLI_CONCURRENCY = Math.max(1, Math.min(2, Number(process.env.DEVPASS_BRIDGE_CLI_CONCURRENCY || 1)));", "const CLI_CONCURRENCY = Math.max(1, Math.min(2, Number(process.env.DEVPASS_BRIDGE_CLI_CONCURRENCY || 2)));"),
              ("const summaryContext = { Date: { now: () => 2000 } };", "const summaryContext = { Date: { now: () => 2000 }, CLI_CONCURRENCY: 2, Object, Array, secondaryRefreshSnapshot: () => ({}) };"),
              ("Current release implementation: `3.0.0-alpha.5.65 — Snapshot Performance Attribution`", current),
              ('Next candidate after the 5.55 real-device diagnostic: `3.0.0-alpha.5.56 — Snapshot Performance Repair`', baseline),
              ("timedSnapshotTask('analyticsScopes', () => analyticsScopes(resolvedCreditsOrgId))", "timedSnapshotTask('analyticsScopes', () => analyticsScopes(resolvedCreditsOrgId, { deferLongWindow:true }))"),
          ])
          update('p17-bounded-cli-parallelism.cjs', [
              ('3.0.0-alpha.5.56', product), ('1.6.10', engine),
              ('async function withCliSlot(label, task) {', 'async function withCliSlot(label, task, launcherMeta = null) {'),
              ('Last verified real-device baseline: `3.0.0-alpha.5.55 — Snapshot Performance Attribution`', baseline),
              ('Current release implementation: `3.0.0-alpha.5.65 — Snapshot Performance Repair: Bounded CLI Parallelism`', current),
              ('`DEVPASS_BRIDGE_CLI_CONCURRENCY=1` restores the previous serial execution mode', 'Preserve the hard CLI concurrency cap'),
          ])
          update('p18-organization-discovery-dedup.cjs', [
              ('3.0.0-alpha.5.57', product), ('1.6.11', engine),
              ('Last verified real-device baseline: `3.0.0-alpha.5.56 — Snapshot Performance Repair: Bounded CLI Parallelism`', baseline),
              ('Current release implementation: `3.0.0-alpha.5.65 — Organization Discovery Deduplication`', current),
              ('cumulative local persist history remained visible while `active 0` allowed `READY`', 'Stable Readiness remains READY with Engine `1.6.18`, Manager `1.2.6`, and no active local runtime error.'),
              ('missing Write/TTL remained UNKNOWN and was never inferred', 'Keep UNKNOWN distinct from known zero'),
              ('fall back to the prior plain `orgs list --json` path', 'Keep already-working behavior unchanged unless the release goal requires touching it.'),
          ])
          update('p19-organization-empty-fallback-fidelity.cjs', [('3.0.0-alpha.5.57', product), ('1.6.11', engine)])
          update('p20-shared-24h-capture.cjs', [
              ('3.0.0-alpha.5.58', product), ('1.6.12', engine),
              ('Last verified real-device baseline: `3.0.0-alpha.5.57 — Organization Discovery Deduplication`', baseline),
              ('Current release implementation: `3.0.0-alpha.5.65 — Shared 24h Capture Coalescing`', current),
              ('one queued for about 5.87s', 'Keep 24h usage and DevPass Activity on the foreground truth path.'),
              ('accountCapture` cache key, 30s TTL, no-stale behavior', 'shared capture behavior'),
              ("assert.ok(guidelines.includes('No organizations found in CLI output'));", "assert.ok(guidelines.includes('Keep already-working behavior unchanged unless the release goal requires touching it.'));"),
              ('missing Write/TTL remained UNKNOWN and was never inferred', 'Keep UNKNOWN distinct from known zero'),
              ("async function devPassActivityForRange(range = '24h')", "async function devPassActivityForRange(range = '24h', options = {})"),
          ])
          update('p21-snapshot-scheduling-attribution.cjs', [
              ('3.0.0-alpha.5.59', product), ('1.6.13', engine),
              ('function noteSnapshotCliOperation(label, queuedAt, executionStartedAt, endedAt) {', 'function noteSnapshotCliOperation(label, queuedAt, executionStartedAt, endedAt, launcherMeta = null) {'),
              ("['endOffsetMs','executionMs','executionStartOffsetMs','label','queueWaitMs','startOffsetMs'].sort()", "['endOffsetMs','executionMs','executionStartOffsetMs','fallbackReason','label','launcher','npxPolicy','queueWaitMs','startOffsetMs'].sort()"),
              ("engine.includes('noteSnapshotCliOperation(label, queuedAt, executionStartedAt, endedAt)')", "engine.includes('noteSnapshotCliOperation(label, queuedAt, executionStartedAt, endedAt, launcherMeta)')"),
              ('Last verified real-device baseline: `3.0.0-alpha.5.58 — Shared 24h Capture Coalescing`', baseline),
              ('Current release implementation: `3.0.0-alpha.5.65 — Snapshot Scheduling Attribution`', current),
              ('Bridge ran 3 CLI operations', 'Keep 24h usage and DevPass Activity on the foreground truth path.'),
              ('Measurement only: do not change snapshot ordering', 'No new `runCli()` call site, network endpoint'),
              ('missing Write/TTL remained UNKNOWN and was never inferred', 'Keep UNKNOWN distinct from known zero'),
              ('const summaryContext = { Date:{now:()=>2000}, CLI_CONCURRENCY:2, Number, Object, Array, Math, String };', 'const summaryContext = { Date:{now:()=>2000}, CLI_CONCURRENCY:2, Number, Object, Array, Math, String, secondaryRefreshSnapshot:()=>({}) };'),
          ])

          p22 = root / 'p22-monotonic-release-integrity.cjs'
          text = p22.read_text()
          text = text.replace(
              "assert.ok(fs.readFileSync(enginePath, 'utf8').includes(\"const VERSION = '1.6.13';\"), '5.60 must keep Engine 1.6.13');",
              "assert.ok(fs.readFileSync(enginePath, 'utf8').includes(\"const VERSION = '1.6.18';\"), '5.62 must use Engine 1.6.18');",
          )
          text = text.replace("assert.equal(productManifest.productVersion, '3.0.0-alpha.5.60');", "assert.equal(productManifest.productVersion, '3.0.0-alpha.5.65');")
          text = text.replace("assert.equal(productManifest.components.bridge.requiredVersion, '1.6.13');", "assert.equal(productManifest.components.bridge.requiredVersion, '1.6.18');")
          p22.write_text(text)

          update('p23-credits-usage-early-start.cjs', [
              ('.github/workflows/stage-usage-dashboard-561-credits-usage-early-start.yml', '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'),
              ('3.0.0-alpha.5.61', product),
              ('3\\.0\\.0-alpha\\.5\\.61', '3\\.0\\.0-alpha\\.5\\.65'),
              ('1\\.6\\.14', '1\\.6\\.18'), ('1.6.14', engine),
              ('Current release implementation: `3.0.0-alpha.5.65 — Credits Usage Early Start`', current),
              ('Last verified real-device baseline: `3.0.0-alpha.5.59 — Snapshot Scheduling Attribution`', baseline),
              ('Next candidate after the 5.55 real-device diagnostic: `3.0.0-alpha.5.56 — Snapshot Performance Repair`', baseline),
              ('Historical 5.59 contract remains recorded: Measurement only: do not change snapshot ordering', 'Keep already-working behavior unchanged unless the release goal requires touching it.'),
              ('fall back to the prior plain `orgs list --json` path', 'Keep already-working behavior unchanged unless the release goal requires touching it.'),
              ("assert.ok(earlySource.includes('if (CLI_CONCURRENCY < 2) return Promise.resolve(null);'));", "assert.ok(earlySource.includes('if (CLI_CONCURRENCY < 2) {'));"),
              ("assert.ok(earlySource.includes('.catch(() => null)'));", "assert.ok(earlySource.includes(\"reason:'prefetch-error'\"));"),
              ("assert.ok(guidelines.includes('Ambiguous/missing IDs keep the 5.60 root-gated path.'));", "assert.ok(guidelines.includes('Keep 24h usage and DevPass Activity on the foreground truth path.'));"),
              ("assert.ok(guidelines.includes('dedicated circuit family must not double-count failures against the existing organizations circuit'));", "assert.ok(guidelines.includes('Preserve the hard CLI concurrency cap'));"),
              ("assert.ok(guidelines.includes('`DEVPASS_BRIDGE_CLI_CONCURRENCY=1` disables early-start and restores the previous serial execution mode.'));", "assert.ok(guidelines.includes('Preserve the hard CLI concurrency cap'));"),
          ])
          update('p24-snapshot-decision-attribution.cjs', [
              ('.github/workflows/stage-usage-dashboard-562-snapshot-decision-attribution.yml', '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'),
              ('3.0.0-alpha.5.62', product),
              ('3\\.0\\.0-alpha\\.5\\.62', '3\\.0\\.0-alpha\\.5\\.65'),
              ('1\\.6\\.15', '1\\.6\\.18'), ('1.6.15', engine),
              ("['hit','miss','join','load','stale','blocked','error']", "['hit','miss','join','load','stale','deferred','blocked','error']"),
              ("['empty','expired','loaded','circuit-open','refresh-error']", "['empty','expired','loaded','deferred-refresh','circuit-open','refresh-error']"),
              ('Current release implementation: `3.0.0-alpha.5.65 — Snapshot Decision Attribution`', current),
              ('Last verified real-device baseline: `3.0.0-alpha.5.61 — Credits Usage Early Start`', baseline),
              ("assert.ok(guidelines.includes('The new attribution must add zero CLI/network requests.'));", "assert.ok(guidelines.includes('No new `runCli()` call site, network endpoint'));"),
              ("assert.ok(guidelines.includes('about 17.17s because long-window analytics work became cold'));", "assert.ok(guidelines.includes('Keep 24h usage and DevPass Activity on the foreground truth path.'));"),
              ("assert.ok(guidelines.includes('exact skip reason is UNKNOWN in 5.61 diagnostics'));", "assert.ok(guidelines.includes('Diagnostics expose only sanitized family/scope/range'));"),
          ])
          update('p25-long-window-critical-path-decoupling.cjs', [
              ('.github/workflows/stage-usage-dashboard-563-long-window-critical-path-decoupling.yml', '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'),
              ('3.0.0-alpha.5.63', product),
              ('3\\.0\\.0-alpha\\.5\\.63', '3\\.0\\.0-alpha\\.5\\.65'),
              ('1\\.6\\.16', '1\\.6\\.18'), ('1.6.16', engine),
              ('Current release implementation: `3.0.0-alpha.5.65 — Long-window Critical Path Decoupling`', current),
              ('Last verified real-device baseline: `3.0.0-alpha.5.62 — Snapshot Decision Attribution`', baseline),
          ])
          update('p26-foreground-cli-launcher-attribution.cjs', [
              ('.github/workflows/stage-usage-dashboard-564-foreground-cli-launcher-attribution.yml', '.github/workflows/stage-usage-dashboard-565-npx-cache-first-launcher.yml'),
              ('3.0.0-alpha.5.64', product),
              ('3\\.0\\.0-alpha\\.5\\.64', '3\\.0\\.0-alpha\\.5\\.65'),
              ('1\\.6\\.17', '1\\.6\\.18'), ('1.6.17', engine),
              ('const processContext = {', 'const processContext = {\n  NPX_PREFER_OFFLINE: true,'),
              ('const diagContext = {Array,Number,String,Math};', 'const diagContext = {Array,Number,String,Math,Set};'),
              ('const fallbackAt = processSource.indexOf("runProgram(\'npx\', [\'--yes\', `@llmgateway/cli@${CLI_VERSION}`, ...args], extraEnv)");', 'const fallbackAt = processSource.indexOf("runProgram(\'npx\', npxArgs, extraEnv)");'),
              ("{launcher:'direct',fallbackReason:'none'}", "{launcher:'direct',fallbackReason:'none',npxPolicy:'not-applicable'}"),
              ("{launcher:'npx-fallback',fallbackReason:'direct-enoent'}", "{launcher:'npx-fallback',fallbackReason:'direct-enoent',npxPolicy:'prefer-offline'}"),
              ("['--yes','@llmgateway/cli@1.9.0','credits','--json']", "['--yes','--prefer-offline','@llmgateway/cli@1.9.0','credits','--json']"),
              ('direct 1 · npx-fallback 1 · unknown 1 · direct ENOENT 1', 'direct 1 · npx-fallback 1 · unknown 1 · policy not-applicable · direct ENOENT 1'),
              ('Current release implementation: `3.0.0-alpha.5.65 — Foreground CLI Launcher Attribution`', current),
              ('Launcher attribution is measurement-only', 'Preserve the existing direct `llmgateway` attempt and fall back only when the direct attempt fails with `ENOENT`.'),
              ('Keep all five existing `runCli()` call sites and the single existing `execFileAsync()` source operation', 'Keep all five existing `runCli()` call sites, both existing `runProgram()` call sites, and the single existing `execFileAsync()` source operation'),
              ('its share of the 8–9s latency remains UNKNOWN', 'keep its exact latency share UNKNOWN'),
          ])
          PY

          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          bash -n scripts/bootstrap-usage-dashboard.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check

          tests=(
            foundation.cjs p1-contract.cjs p2-build.cjs p3-ui.cjs p3-recent.cjs
            p4-render.cjs p4-partial.cjs p4-hourly-drilldown.cjs p4-hourly-detail.cjs p4-request-fidelity.cjs
            p5-unified-runtime.cjs p5-bridge-manager.cjs p5-engine-adoption.cjs p5-bundled-engine.cjs
            p5-lifecycle-race.cjs p5-bridge-control-sync.cjs p5-service-tier-fidelity.cjs p5-devpass-account-parity.cjs
            p5-floating-widget-ux.cjs p5-module-layout.cjs p5-structural-parity.cjs p5-state-compatibility.cjs
            p6-rc-migration.cjs p6-rc-contract.cjs p6-release-hardening.cjs p7-cache-observability.cjs
            p11-cache-fidelity.cjs p12-gh-bootstrap.cjs p13-cache-provenance-diagnostics.cjs p14-project-guidelines-memory.cjs
            p15-runtime-recovery-fidelity.cjs p16-snapshot-performance-attribution.cjs p17-bounded-cli-parallelism.cjs
            p18-organization-discovery-dedup.cjs p19-organization-empty-fallback-fidelity.cjs p20-shared-24h-capture.cjs
            p21-snapshot-scheduling-attribution.cjs p22-monotonic-release-integrity.cjs p23-credits-usage-early-start.cjs
            p24-snapshot-decision-attribution.cjs p25-long-window-critical-path-decoupling.cjs p26-foreground-cli-launcher-attribution.cjs
            p27-npx-cache-first-launcher.cjs
          )
          for test in "${tests[@]}"; do node "plugins/usage-dashboard/tests/$test"; done

          git diff --check
          test "$(find plugins/usage-dashboard/src -maxdepth 1 -name '*.part.js' | wc -l)" -eq 22
          grep -Fq '//@version 3.0.0-alpha.5.65' plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '3.0.0-alpha.5.65';" plugins/usage-dashboard/latest.js
          grep -Fq "const REQUIRED_BRIDGE_VERSION = '1.6.18';" plugins/usage-dashboard/latest.js
          grep -Fq "const VERSION = '1.6.18';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "const MANAGER_VERSION = '1.2.6';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.65';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const BUNDLED_ENGINE_VERSION = '1.6.18';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq '"productVersion": "3.0.0-alpha.5.65"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"requiredVersion": "1.6.18"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq 'creditsEarlyStart' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'cacheDecisions' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'SECONDARY_REFRESH_CONCURRENCY = 1' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'Bridge secondary refresh:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge CLI launcher:' plugins/usage-dashboard/latest.js
          grep -Fq "launcherMeta.launcher = 'npx-fallback';" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'DEVPASS_BRIDGE_NPX_PREFER_OFFLINE' plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq "'--prefer-offline'" plugins/usage-dashboard/runtime/bridge-engine.mjs
          grep -Fq 'policy ${npxPolicy}' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge Credits early-start:' plugins/usage-dashboard/latest.js
          grep -Fq 'Bridge snapshot cache decisions:' plugins/usage-dashboard/latest.js
          grep -Fq 'parser provider-usage-v3' plugins/usage-dashboard/latest.js
          grep -Fq 'unknown stays unknown' plugins/usage-dashboard/latest.js
          grep -Fq 'Current release implementation: `3.0.0-alpha.5.65 — Npx Cache-First Launcher`' docs/USAGE_DASHBOARD_GUIDELINES.md
          grep -Fq 'Last verified real-device baseline: `3.0.0-alpha.5.64 — Foreground CLI Launcher Attribution`' docs/USAGE_DASHBOARD_GUIDELINES.md
          grep -Fq '## Long-term update roadmap' docs/USAGE_DASHBOARD_GUIDELINES.md
          grep -Fq 'STALE_CANDIDATE_MAIN' plugins/usage-dashboard/tools/check_release_monotonic.py
          grep -Fq 'SAME_VERSION_ARTIFACT_DIVERGENCE' plugins/usage-dashboard/tools/check_release_monotonic.py

          git checkout -- \
            plugins/usage-dashboard/tests/p5-bundled-engine.cjs \
            plugins/usage-dashboard/tests/p11-cache-fidelity.cjs \
            plugins/usage-dashboard/tests/p13-cache-provenance-diagnostics.cjs \
            plugins/usage-dashboard/tests/p15-runtime-recovery-fidelity.cjs \
            plugins/usage-dashboard/tests/p16-snapshot-performance-attribution.cjs \
            plugins/usage-dashboard/tests/p17-bounded-cli-parallelism.cjs \
            plugins/usage-dashboard/tests/p18-organization-discovery-dedup.cjs \
            plugins/usage-dashboard/tests/p19-organization-empty-fallback-fidelity.cjs \
            plugins/usage-dashboard/tests/p20-shared-24h-capture.cjs \
            plugins/usage-dashboard/tests/p21-snapshot-scheduling-attribution.cjs \
            plugins/usage-dashboard/tests/p22-monotonic-release-integrity.cjs \
            plugins/usage-dashboard/tests/p23-credits-usage-early-start.cjs \
            plugins/usage-dashboard/tests/p24-snapshot-decision-attribution.cjs \
            plugins/usage-dashboard/tests/p25-long-window-critical-path-decoupling.cjs \
            plugins/usage-dashboard/tests/p26-foreground-cli-launcher-attribution.cjs

      - name: Commit validated 5.65 candidate to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            plugins/usage-dashboard/src \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/product-manifest.json \
            docs/USAGE_DASHBOARD_GUIDELINES.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'main already matches 3.0.0-alpha.5.65'
          else
            git commit -m 'release: Local Usage Dashboard 3.0.0-alpha.5.65 Npx Cache-First Launcher'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish 5.65 candidate monotonically to release channel
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/usage-dashboard-candidate /tmp/usage-dashboard-release
          mkdir -p /tmp/usage-dashboard-candidate/plugins/usage-dashboard
          cp plugins/usage-dashboard/latest.js /tmp/usage-dashboard-candidate/plugins/usage-dashboard/latest.js
          cp -R plugins/usage-dashboard/runtime /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime
          cp plugins/usage-dashboard/tools/check_release_monotonic.py /tmp/check_release_monotonic.py

          git fetch origin main release-usage-dashboard
          git show origin/main:plugins/usage-dashboard/runtime/product-manifest.json > /tmp/usage-dashboard-main-manifest.json
          mkdir -p /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime
          git show origin/release-usage-dashboard:plugins/usage-dashboard/latest.js > /tmp/usage-dashboard-release/plugins/usage-dashboard/latest.js
          for file in bridge-engine.mjs bridge-manager.cjs bootstrap-bridge-manager.sh product-manifest.json; do
            git show "origin/release-usage-dashboard:plugins/usage-dashboard/runtime/$file" > "/tmp/usage-dashboard-release/plugins/usage-dashboard/runtime/$file"
          done

          set +e
          GUARD_OUTPUT="$(python3 /tmp/check_release_monotonic.py \
            --candidate-manifest /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime/product-manifest.json \
            --main-manifest /tmp/usage-dashboard-main-manifest.json \
            --release-manifest /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime/product-manifest.json \
            --candidate-runtime /tmp/usage-dashboard-candidate/plugins/usage-dashboard/runtime \
            --release-runtime /tmp/usage-dashboard-release/plugins/usage-dashboard/runtime \
            --check-artifacts 2>&1)"
          GUARD_RC=$?
          set -e
          echo "$GUARD_OUTPUT"
          if [ "$GUARD_RC" -eq 2 ]; then echo 'STALE_CANDIDATE: publish skipped without touching release-usage-dashboard'; exit 0; fi
          if [ "$GUARD_RC" -ne 0 ]; then echo "monotonic release guard failed closed with rc=$GUARD_RC" >&2; exit "$GUARD_RC"; fi
          if printf '%s\n' "$GUARD_OUTPUT" | grep -Fq 'NOOP_IDENTICAL:'; then echo 'release-usage-dashboard already contains identical 5.65 artifacts'; exit 0; fi

