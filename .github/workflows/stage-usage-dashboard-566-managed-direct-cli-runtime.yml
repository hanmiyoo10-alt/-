name: Stage Usage Dashboard 3.0.0-alpha.5.66 Managed Direct CLI Runtime

on:
  push:
    branches: [main]
    paths: &release_paths
      - '.github/workflows/stage-usage-dashboard-566-managed-direct-cli-runtime.yml'
      - '.github/workflows/reusable-usage-dashboard-release.yml'
      - '.github/usage-dashboard/releases/5.66.json'
      - 'plugins/usage-dashboard/tools/prepare_release_regressions.py'
      - 'plugins/usage-dashboard/tools/validate_release_candidate.py'
      - 'plugins/usage-dashboard/tools/release_managed_direct_cli_runtime_566.py'
      - 'plugins/usage-dashboard/tests/release-infrastructure-foundation.cjs'
      - 'plugins/usage-dashboard/tests/p28-managed-direct-cli-runtime.cjs'
  pull_request:
    branches: [main]
    paths: *release_paths

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-usage-dashboard-release.yml
    with:
      release_spec: .github/usage-dashboard/releases/5.66.json
      publish: false
