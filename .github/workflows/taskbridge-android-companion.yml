name: TaskBridge Android Companion

on:
  pull_request:
    paths:
      - 'products/standalone/termux/taskbridge/android-companion/**'
      - '.github/workflows/taskbridge-android-companion.yml'
  push:
    branches: [main]
    paths:
      - 'products/standalone/termux/taskbridge/android-companion/**'
      - '.github/workflows/taskbridge-android-companion.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle -p products/standalone/termux/taskbridge/android-companion :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle -p products/standalone/termux/taskbridge/android-companion :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: taskbridge-chatgpt-signal-debug-apk
          path: products/standalone/termux/taskbridge/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
