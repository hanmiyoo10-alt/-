name: Termux Large Doc Prototype

on:
  pull_request:
    paths:
      - 'plugins/termux/large-doc-editor/**'
      - 'docs/TERMUX_LARGE_DOC_PROTOTYPE.md'
      - '.github/workflows/termux-large-doc-prototype.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/termux/large-doc-editor/**'
      - 'docs/TERMUX_LARGE_DOC_PROTOTYPE.md'
      - '.github/workflows/termux-large-doc-prototype.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/termux/large-doc-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile chunk_store.py server.py tools/generate_fixture.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
