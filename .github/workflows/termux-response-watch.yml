name: Termux Response Watch

on:
  pull_request:
    paths:
      - 'plugins/termux/response-watch/**'
      - 'docs/TERMUX_RESPONSE_WATCH.md'
      - '.github/workflows/termux-response-watch.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/termux/response-watch/**'
      - 'docs/TERMUX_RESPONSE_WATCH.md'
      - '.github/workflows/termux-response-watch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile plugins/termux/response-watch/response_watch.py
      - name: Unit tests
        run: python -m unittest discover -s plugins/termux/response-watch/tests -v
