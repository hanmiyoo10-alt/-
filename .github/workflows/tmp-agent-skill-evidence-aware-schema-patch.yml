name: Temporary Agent Skill Evidence-Aware Schema Patcher

on:
  push:
    branches:
      - 'design/agent-skill-scout-evidence-aware-authority-schema-20260903'
    paths:
      - '.agent-skill-dev/evidence-aware-schema-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: design/agent-skill-scout-evidence-aware-authority-schema-20260903
          fetch-depth: 0

      - name: Apply exact bounded live-runtime substitutions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/agent-skill-orchestrator/runtime/run_scout_pilot.py'): [
                  (
                      'from roles.scout import build_scout_prompt, scout_response_schema',
                      'from roles.scout import build_scout_prompt\nfrom roles.scout_evidence_schema import scout_response_schema_for_evidence',
                  ),
                  (
                      '                    scout_response_schema(),',
                      '                    scout_response_schema_for_evidence(control["evidence_package"]),',
                  ),
              ],
              Path('tools/agent-skill-orchestrator/runtime/run_sequential_pilot.py'): [
                  (
                      'from roles.scout import build_scout_prompt, scout_response_schema',
                      'from roles.scout import build_scout_prompt\nfrom roles.scout_evidence_schema import scout_response_schema_for_evidence',
                  ),
                  (
                      '        port, scout_prompt, scout_response_schema()\n    )',
                      '        port, scout_prompt, scout_response_schema_for_evidence(evidence_package)\n    )',
                  ),
              ],
              Path('tools/agent-skill-orchestrator/runtime/run_parallel_pilot.py'): [
                  (
                      'from roles.scout import build_scout_prompt, scout_response_schema',
                      'from roles.scout import build_scout_prompt\nfrom roles.scout_evidence_schema import scout_response_schema_for_evidence',
                  ),
                  (
                      '        schema=scout_response_schema(),',
                      '        schema=scout_response_schema_for_evidence(evidence_package),',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one replacement for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          historical = [
              Path('tools/agent-skill-orchestrator/benchmarks/run_scout_cell.py'),
              Path('tools/agent-skill-orchestrator/benchmarks/run_scout_cell_timeout_recovery.py'),
              Path('tools/agent-skill-orchestrator/benchmarks/run_o4d_scout_cell.py'),
              Path('tools/agent-skill-orchestrator/benchmarks/run_o4d_scout_schema_validation.py'),
          ]
          for path in historical:
              text = path.read_text(encoding='utf-8')
              if 'scout_response_schema_for_evidence' in text:
                  raise SystemExit(f'historical benchmark unexpectedly changed: {path}')
              if 'scout_response_schema()' not in text:
                  raise SystemExit(f'historical static schema call missing: {path}')
          PY

      - name: Run focused evidence-aware schema regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/agent-skill-orchestrator/roles/scout_evidence_schema.py \
            tools/agent-skill-orchestrator/runtime/run_scout_pilot.py \
            tools/agent-skill-orchestrator/runtime/run_sequential_pilot.py \
            tools/agent-skill-orchestrator/runtime/run_parallel_pilot.py \
            tools/agent-skill-orchestrator/tests/test_scout_evidence_aware_authority_schema.py
          python -m unittest \
            tools.agent-skill-orchestrator.tests.test_scout_evidence_aware_authority_schema

      - name: Remove one-shot control surface and commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .agent-skill-dev/evidence-aware-schema-trigger.txt
          rmdir .agent-skill-dev 2>/dev/null || true
          rm -f .github/workflows/tmp-agent-skill-evidence-aware-schema-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(agent-skill): adopt evidence-aware Scout authority schema'
          git push origin HEAD:design/agent-skill-scout-evidence-aware-authority-schema-20260903
