name: Temporary Agent Skill O4-E Harness Generator

on:
  push:
    branches:
      - 'feat/agent-skill-orchestrator-o4e-authority-schema-validation-r2-20260903'
    paths:
      - '.agent-skill-dev/o4e-generate.txt'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout O4-E branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/agent-skill-orchestrator-o4e-authority-schema-validation-r2-20260903
          fetch-depth: 0

      - name: Generate bounded O4-E harness from proven O4-D structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          copies = {
              'tools/agent-skill-orchestrator/benchmarks/resolve_o4d_request.py':
                  'tools/agent-skill-orchestrator/benchmarks/resolve_o4e_request.py',
              'tools/agent-skill-orchestrator/benchmarks/run_o4d_scout_cell.py':
                  'tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_cell.py',
              'tools/agent-skill-orchestrator/benchmarks/run_o4d_scout_schema_validation.py':
                  'tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_schema_validation.py',
              'tools/agent-skill-orchestrator/tests/test_o4d_scout_schema_validation.py':
                  'tools/agent-skill-orchestrator/tests/test_o4e_scout_schema_validation.py',
              '.github/workflows/agent-skill-orchestrator-o4d-scout-schema-validation.yml':
                  '.github/workflows/agent-skill-orchestrator-o4e-scout-schema-validation.yml',
          }
          for source, target in copies.items():
              text = Path(source).read_text(encoding='utf-8')
              text = text.replace('O4-D', 'O4-E').replace('O4D', 'O4E').replace('o4d', 'o4e')
              Path(target).write_text(text, encoding='utf-8')

          matrix_old = 'MATRIX_ID = "o4e-scout-schema-hardening-validation-v1"'
          matrix_new = 'MATRIX_ID = "o4e-scout-authority-schema-validation-v1"'

          path = Path('tools/agent-skill-orchestrator/benchmarks/resolve_o4e_request.py')
          text = path.read_text(encoding='utf-8')
          if text.count(matrix_old) != 1:
              raise SystemExit('O4-E resolver matrix id shape drifted')
          text = text.replace(matrix_old, matrix_new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_cell.py')
          text = path.read_text(encoding='utf-8')
          old = 'from roles.scout import build_scout_prompt, scout_response_schema\n'
          new = ('from roles.scout import build_scout_prompt\n'
                 'from roles.scout_evidence_schema import scout_response_schema_for_evidence\n')
          if text.count(old) != 1:
              raise SystemExit('O4-E runner Scout import shape drifted')
          text = text.replace(old, new, 1)
          if text.count('response_schema = scout_response_schema()') != 1:
              raise SystemExit('O4-E runner static schema call shape drifted')
          text = text.replace('response_schema = scout_response_schema()', 'response_schema = scout_response_schema_for_evidence(evidence)', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_schema_validation.py')
          text = path.read_text(encoding='utf-8')
          if text.count(matrix_old) != 1:
              raise SystemExit('O4-E matrix id shape drifted')
          text = text.replace(matrix_old, matrix_new, 1)
          old = 'from roles.scout import build_scout_prompt, prompt_sha256, scout_response_schema\n'
          new = ('from roles.scout import build_scout_prompt, prompt_sha256\n'
                 'from roles.scout_evidence_schema import scout_response_schema_for_evidence\n')
          if text.count(old) != 1:
              raise SystemExit('O4-E matrix Scout import shape drifted')
          text = text.replace(old, new, 1)
          if text.count('response_schema = scout_response_schema()') != 1:
              raise SystemExit('O4-E matrix build static schema call drifted')
          text = text.replace('response_schema = scout_response_schema()', 'response_schema = scout_response_schema_for_evidence(evidence)', 1)
          old_prepare = '''    _write_json(frozen / "scout-response-schema.json", scout_response_schema())\n    case, evidence = load_case_and_evidence()\n    del case\n'''
          new_prepare = '''    case, evidence = load_case_and_evidence()\n    _write_json(\n        frozen / "scout-response-schema.json",\n        scout_response_schema_for_evidence(evidence),\n    )\n    del case\n'''
          if text.count(old_prepare) != 1:
              raise SystemExit('O4-E matrix prepare static schema shape drifted')
          text = text.replace(old_prepare, new_prepare, 1)
          needle = '        "historical_o4c_result_sha256": deepcopy(HISTORICAL_O4C_RESULTS),\n'
          replacement = needle + '        "predecessor_o4d_summary_sha256": "24474cca92045afc8590dd828927b0ab62f7db657b4671603d9d3aa496960171",\n'
          if text.count(needle) != 1:
              raise SystemExit('O4-E predecessor insertion point drifted')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tools/agent-skill-orchestrator/tests/test_o4e_scout_schema_validation.py')
          text = path.read_text(encoding='utf-8')
          old = 'from roles.scout import build_scout_prompt, prompt_sha256, scout_response_schema\n'
          new = ('from roles.scout import build_scout_prompt, prompt_sha256, scout_response_schema\n'
                 'from roles.scout_evidence_schema import scout_response_schema_for_evidence\n')
          if text.count(old) != 1:
              raise SystemExit('O4-E test Scout import shape drifted')
          text = text.replace(old, new, 1)
          old_assert = 'self.assertEqual(manifest["response_schema_sha256"], canonical_sha256(scout_response_schema()))'
          new_assert = '''self.assertEqual(\n            manifest["response_schema_sha256"],\n            canonical_sha256(scout_response_schema_for_evidence(evidence)),\n        )\n        self.assertNotEqual(manifest["response_schema_sha256"], canonical_sha256(scout_response_schema()))'''
          if text.count(old_assert) != 1:
              raise SystemExit('O4-E manifest schema assertion drifted')
          text = text.replace(old_assert, new_assert, 1)
          old_meta = '"response_schema_sha256": canonical_sha256(scout_response_schema()),'
          new_meta = '"response_schema_sha256": canonical_sha256(scout_response_schema_for_evidence(evidence)),'
          if text.count(old_meta) != 1:
              raise SystemExit('O4-E test metadata schema assertion drifted')
          text = text.replace(old_meta, new_meta, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/agent-skill-orchestrator-o4e-scout-schema-validation.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("SERVER_PORT: '39139'", "SERVER_PORT: '39141'", 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/agent-skills-ci.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - '.github/workflows/agent-skill-orchestrator-o4d-scout-schema-validation.yml'\n"
          addition = anchor + "      - '.github/workflows/agent-skill-orchestrator-o4e-scout-schema-validation.yml'\n"
          if text.count(anchor) != 2:
              raise SystemExit('Agent Skills CI O4-D path coverage shape drifted')
          text = text.replace(anchor, addition)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run O4-E focused mechanical regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest discover -s tools/agent-skill-orchestrator/tests -p 'test_o4e_scout_schema_validation.py' -v
          python -m unittest discover -s tools/agent-skill-orchestrator/tests -p 'test_scout_evidence_aware_authority_schema.py' -v
          find tools/agent-skill-orchestrator -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools/agent-skill-orchestrator -type f -name '*.pyc' -delete

      - name: Package generated O4-E payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .o4e-payload o4e-payload.tar.gz
          mkdir -p .o4e-payload/.github/workflows
          mkdir -p .o4e-payload/tools/agent-skill-orchestrator/benchmarks
          mkdir -p .o4e-payload/tools/agent-skill-orchestrator/tests
          cp .github/workflows/agent-skills-ci.yml .o4e-payload/.github/workflows/
          cp .github/workflows/agent-skill-orchestrator-o4e-scout-schema-validation.yml .o4e-payload/.github/workflows/
          cp tools/agent-skill-orchestrator/benchmarks/resolve_o4e_request.py .o4e-payload/tools/agent-skill-orchestrator/benchmarks/
          cp tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_cell.py .o4e-payload/tools/agent-skill-orchestrator/benchmarks/
          cp tools/agent-skill-orchestrator/benchmarks/run_o4e_scout_schema_validation.py .o4e-payload/tools/agent-skill-orchestrator/benchmarks/
          cp tools/agent-skill-orchestrator/tests/test_o4e_scout_schema_validation.py .o4e-payload/tools/agent-skill-orchestrator/tests/
          find .o4e-payload -type f -print | sort
          tar -czf o4e-payload.tar.gz -C .o4e-payload .
          test -s o4e-payload.tar.gz

      - name: Upload generated O4-E payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o4e-generated-payload-${{ github.run_id }}
          path: o4e-payload.tar.gz
          if-no-files-found: error
          retention-days: 1
