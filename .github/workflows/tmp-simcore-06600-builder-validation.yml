name: Temporary SimCore 06600 Builder Validation

on:
  push:
    branches:
      - runtime/simcore-v0.66.0-m2-4-boundary-completion

permissions:
  contents: read

concurrency:
  group: tmp-simcore-06600-builder-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/simcore-v0.66.0-m2-4-boundary-completion
          fetch-depth: 0

      - name: Materialize exact v0.65.0 production runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release-simcore
          expected_commit='c6659296c68b4322d0ed43f7d8a3339e57f1cbf1'
          expected_blob='1b38e2b2874f2581edae8f1080edc39558febefa'
          actual_commit="$(git rev-parse origin/release-simcore)"
          test "$actual_commit" = "$expected_commit"
          git checkout "$expected_commit" -- plugins/simcore/latest.js plugins/simcore/install.js
          test "$(git hash-object plugins/simcore/latest.js)" = "$expected_blob"
          test "$(git hash-object plugins/simcore/install.js)" = "$expected_blob"
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js

      - name: Verify frozen builder identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum products/simcore/tooling/build-06600-m2-4-session-runtime-mirror-boundary-completion.py | awk '{print $1}')" = 'd87afb81ef5f80e95f8e80a7b62492578b35a239d1519ab06979021128495024'
          python3 -m py_compile products/simcore/tooling/build-06600-m2-4-session-runtime-mirror-boundary-completion.py

      - name: Build candidate from exact production
        shell: bash
        run: |
          set -euo pipefail
          python3 products/simcore/tooling/build-06600-m2-4-session-runtime-mirror-boundary-completion.py

      - name: Candidate syntax and identity
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/simcore/latest.js
          node --check plugins/simcore/install.js
          cmp -s plugins/simcore/latest.js plugins/simcore/install.js
          grep -Fq '//@version 0.66.0' plugins/simcore/latest.js
          grep -Fq "const SIMCORE_RUNTIME_VERSION = '0.66.0';" plugins/simcore/latest.js
          grep -Fq "const HOST_COMPAT_VERSION = '0.66.0';" plugins/simcore/latest.js
          echo "candidate_blob=$(git hash-object plugins/simcore/latest.js)"
          echo "candidate_sha256=$(sha256sum plugins/simcore/latest.js | awk '{print $1}')"

      - name: Slice ownership static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('plugins/simcore/latest.js').read_text(encoding='utf-8')
          def module(name):
              token = f'SimCore.define("{name}", function (require, module, exports) {{'
              s = text.index(token)
              e = text.find('\nSimCore.define("', s + len(token))
              return text[s:e if e >= 0 else len(text)]
          session = module('session')
          store = module('store')
          final = module('output-finalize')
          edit = module('edit-reconcile')
          mirror = module('runtime-mirror')
          compat = module('output-compat')
          rep = module('representation')
          recovery = module('recovery')
          assert 'function finalizePreparedOutput(' not in session
          assert 'function finalizePreparedOutput(' in final
          assert 'scheduleDeferredPrune(outIndex)' in store
          assert 'deferredPruneIndex' not in session
          assert "require('./recovery')" not in session and 'recovery.' not in session
          assert "require('./recovery')" not in edit and 'recovery.' not in edit
          assert 'module.exports = {' in recovery
          for label in ('FRESH_CONFIRMED_SUFFIX','BOUNDARY_CONFIRMED_SUFFIX','SAFE_BOUNDARY_CONFIRMED'):
              assert label not in mirror
              assert label not in rep
              assert label in compat
          assert 'acceptedCanonicalEquivalent' in rep
          assert 'buildFreshObservationPlan' in compat
          assert 'interpretFreshObservation' in compat
          assert mirror.count('host.getChat(') == 1
          print('06600_STATIC_SLICE_CHECK_PASS')
          PY
