name: Usage Dashboard 5.32 Source Parity Seal R4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usage-dashboard-532-source-parity-r4.yml'

permissions:
  contents: write

jobs:
  seal-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute reviewed R2 seal script against current main
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/usage-dashboard-532-source-parity-r2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line == '        run: |') + 1
          script = []
          for line in source[start:]:
              if line.startswith('          '):
                  script.append(line[10:])
              elif not line.strip():
                  script.append('')
              else:
                  break
          if not script:
              raise SystemExit('R2 run block not found')
          Path('/tmp/usage-532-r2.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/usage-532-r2.sh
