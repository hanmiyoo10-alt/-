name: Usage Dashboard 5.32 Source Parity Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usage-dashboard-532-source-parity.yml'

permissions:
  contents: write

jobs:
  seal-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync 5.31 release back to modular source and seal build v2
        shell: bash
        run: |
          set -euo pipefail
          ROOT='plugins/usage-dashboard'
          OLD='3.0.0-alpha.5.31'
          NEW='3.0.0-alpha.5.32'

          git fetch origin release-usage-dashboard
          git show origin/release-usage-dashboard:${ROOT}/latest.js > /tmp/release-531-latest.js
          git show origin/release-usage-dashboard:${ROOT}/runtime/bridge-manager.cjs > /tmp/release-531-manager.cjs
          git show origin/release-usage-dashboard:${ROOT}/runtime/bridge-engine.mjs > /tmp/release-531-engine.mjs
          git show origin/release-usage-dashboard:${ROOT}/runtime/bootstrap-bridge-manager.sh > /tmp/release-531-bootstrap.sh
          git show origin/release-usage-dashboard:${ROOT}/runtime/product-manifest.json > /tmp/release-531-product-manifest.json

          git checkout origin/release-usage-dashboard -- ${ROOT}/latest.js ${ROOT}/runtime
          grep -Fq "//@version ${OLD}" ${ROOT}/latest.js
          grep -Fq "\"productVersion\": \"${OLD}\"" ${ROOT}/runtime/product-manifest.json
          grep -Fq "const MANAGER_VERSION = '1.2.5';" ${ROOT}/runtime/bridge-manager.cjs
          grep -Fq "const ENGINE_VERSION = '1.6.3';" ${ROOT}/runtime/bridge-engine.mjs

          # Recover the exact proven 5.31 bundle into the existing ten source modules first.
          node ${ROOT}/tools/split_usage_dashboard.cjs

          cat > ${ROOT}/tools/usage_dashboard_parts.cjs <<'EOF'
          'use strict';

          const PARTS = Object.freeze([
            {file:'00-runtime-core.part.js', marker:null, label:'runtime/core'},
            {file:'10-usage-data.part.js', marker:'  function recentRequestValue(row, keys, fallback = null) {', label:'usage normalization'},
            {file:'20-bridge-io.part.js', marker:'  async function fetchSnapshot() {', label:'bridge I/O'},
            {file:'30-refresh-runtime.part.js', marker:"  async function refresh(reason = 'manual', silent = false) {", label:'refresh runtime'},
            {file:'40-diagnostics.part.js', marker:'  function diagText() {', label:'diagnostics'},
            {file:'50-settings-ui.part.js', marker:'  function settingsHtml() {', label:'settings UI'},
            {file:'60-settings-runtime.part.js', marker:'  function renderSettings() {', label:'settings runtime'},
            {file:'70-floating-widget.part.js', marker:'  function widgetHtml() {', label:'floating widget'},
            {file:'80-lifecycle.part.js', marker:'  function scheduleRefresh() {', label:'lifecycle/scheduling'},
            {file:'90-bootstrap.part.js', marker:"  try {\n    store=await Risuai.getLocalPluginStorage();", label:'bootstrap/unload'}
          ].map((part) => Object.freeze({...part})));

          module.exports = {PARTS};
          EOF

          cat > ${ROOT}/tools/build_usage_dashboard.cjs <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const {PARTS} = require('./usage_dashboard_parts.cjs');

          const ROOT = path.resolve(__dirname, '..');
          const SRC = path.join(ROOT, 'src');
          const MANIFEST = path.join(SRC, 'manifest.json');
          const LATEST = path.join(ROOT, 'latest.js');

          const hash = (content) => crypto.createHash('sha256').update(content).digest('hex');
          const partStates = PARTS.map((part) => {
            const file = path.join(SRC, part.file);
            if (!fs.existsSync(file)) throw new Error(`missing source part: ${part.file}`);
            const content = fs.readFileSync(file, 'utf8');
            if (!content.length) throw new Error(`empty source part: ${part.file}`);
            if (part.marker && !content.startsWith(part.marker)) throw new Error(`boundary drift: ${part.file}`);
            return {...part, content, bytes:Buffer.byteLength(content), sha256:hash(content)};
          });

          const built = partStates.map((part) => part.content).join('');
          const version = (built.match(/^\/\/@version (.+)$/m) || [])[1] || 'unknown';
          if (version === 'unknown') throw new Error('bundle version marker is missing');

          const generatedManifest = {
            format:1,
            plugin:'Local Usage Dashboard',
            version,
            source:'plugins/usage-dashboard/latest.js',
            sourceOfTruth:'modules',
            layout:'plugins/usage-dashboard/tools/usage_dashboard_parts.cjs',
            artifactSha256:hash(built),
            parts:partStates.map(({content, marker, ...part}) => part)
          };
          const manifestText = JSON.stringify(generatedManifest, null, 2) + '\n';

          if (process.argv.includes('--check')) {
            if (!fs.existsSync(MANIFEST)) throw new Error('usage-dashboard src/manifest.json is missing');
            if (!fs.existsSync(LATEST)) throw new Error('usage-dashboard latest.js is missing');
            if (fs.readFileSync(MANIFEST, 'utf8') !== manifestText) throw new Error('manifest.json differs from generated modular manifest');
            if (fs.readFileSync(LATEST, 'utf8') !== built) throw new Error('latest.js differs from deterministic modular source bundle');
            console.log(`usage-dashboard source parity: OK · ${PARTS.length} modules · ${version}`);
            process.exit(0);
          }

          if (process.argv.includes('--write')) {
            fs.writeFileSync(LATEST, built);
            fs.writeFileSync(MANIFEST, manifestText);
            console.log(`usage-dashboard bundle written from modules: ${PARTS.length} modules · ${version}`);
            process.exit(0);
          }

          process.stdout.write(built);
          EOF

          cat > ${ROOT}/tools/split_usage_dashboard.cjs <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const {PARTS} = require('./usage_dashboard_parts.cjs');

          const ROOT = path.resolve(__dirname, '..');
          const LATEST = path.join(ROOT, 'latest.js');
          const SRC = path.join(ROOT, 'src');
          const source = fs.readFileSync(LATEST, 'utf8');

          const positions = [0];
          let previous = 0;
          for (const part of PARTS.slice(1)) {
            const count = source.split(part.marker).length - 1;
            if (count !== 1) throw new Error(`${part.file}: marker count=${count}`);
            const index = source.indexOf(part.marker);
            if (index <= previous) throw new Error(`${part.file}: marker out of order`);
            positions.push(index);
            previous = index;
          }
          positions.push(source.length);

          fs.mkdirSync(SRC, {recursive:true});
          for (let i = 0; i < PARTS.length; i += 1) {
            const content = source.slice(positions[i], positions[i + 1]);
            if (!content.length) throw new Error(`${PARTS[i].file}: empty part`);
            fs.writeFileSync(path.join(SRC, PARTS[i].file), content);
          }

          execFileSync(process.execPath, [path.join(__dirname, 'build_usage_dashboard.cjs'), '--write'], {stdio:'inherit'});
          console.log(`usage-dashboard recovery split: ${PARTS.length} modules`);
          EOF

          cat > ${ROOT}/tests/p2-build.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const {PARTS} = require('../tools/usage_dashboard_parts.cjs');

          const ROOT = path.resolve(__dirname, '..');
          const SRC = path.join(ROOT, 'src');
          const latest = fs.readFileSync(path.join(ROOT, 'latest.js'), 'utf8');
          const manifest = JSON.parse(fs.readFileSync(path.join(SRC, 'manifest.json'), 'utf8'));
          const hash = (content) => crypto.createHash('sha256').update(content).digest('hex');

          assert.equal(manifest.format, 1);
          assert.equal(manifest.plugin, 'Local Usage Dashboard');
          assert.equal(manifest.sourceOfTruth, 'modules');
          assert.equal(manifest.layout, 'plugins/usage-dashboard/tools/usage_dashboard_parts.cjs');
          assert.equal(manifest.parts.length, PARTS.length);
          assert.equal(new Set(PARTS.map((part) => part.file)).size, PARTS.length);

          const chunks = [];
          for (let i = 0; i < PARTS.length; i += 1) {
            const definition = PARTS[i];
            const declared = manifest.parts[i];
            assert.equal(declared.file, definition.file, `manifest order drift: ${definition.file}`);
            assert.equal(declared.label, definition.label, `manifest label drift: ${definition.file}`);
            const content = fs.readFileSync(path.join(SRC, definition.file), 'utf8');
            assert.ok(content.length > 0, `empty modular source: ${definition.file}`);
            if (definition.marker) assert.ok(content.startsWith(definition.marker), `boundary drift: ${definition.file}`);
            assert.equal(declared.bytes, Buffer.byteLength(content), `byte count drift: ${definition.file}`);
            assert.equal(declared.sha256, hash(content), `hash drift: ${definition.file}`);
            chunks.push(content);
          }

          const built = chunks.join('');
          assert.equal(built, latest, 'latest.js must be byte-identical to modular source bundle');
          assert.equal(manifest.artifactSha256, hash(built));
          assert.equal(manifest.version, (built.match(/^\/\/@version (.+)$/m) || [])[1]);
          assert.match(built, /const STATE_KEY = 'local-usage-dashboard-v3';/);
          assert.match(built, /^\/\/@update-url https:\/\/raw\.githubusercontent\.com\/hanmiyoo10-alt\/-\/release-usage-dashboard\/plugins\/usage-dashboard\/latest\.js$/m);
          assert.match(built, /Local runtime errors:/);
          assert.match(built, /Refresh requests:/);

          console.log(`usage-dashboard modular build v2: OK · ${PARTS.length} modules · ${manifest.version}`);
          EOF

          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release-local-usage-dashboard.yml')
          text = p.read_text()
          needle = "      - 'plugins/usage-dashboard/tools/build_usage_dashboard.cjs'\n      - 'plugins/usage-dashboard/tools/split_usage_dashboard.cjs'"
          replacement = "      - 'plugins/usage-dashboard/tools/build_usage_dashboard.cjs'\n      - 'plugins/usage-dashboard/tools/split_usage_dashboard.cjs'\n      - 'plugins/usage-dashboard/tools/usage_dashboard_parts.cjs'"
          if needle not in text:
              raise SystemExit('release workflow tool path anchor missing')
          text = text.replace(needle, replacement, 1)
          needle = "          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check\n          node --check plugins/usage-dashboard/latest.js"
          replacement = "          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write\n          if ! git diff --quiet -- plugins/usage-dashboard/latest.js plugins/usage-dashboard/src/manifest.json; then\n            echo 'Generated Usage Dashboard artifacts are stale; commit source-built latest.js and manifest.json.'\n            git diff -- plugins/usage-dashboard/latest.js plugins/usage-dashboard/src/manifest.json\n            exit 1\n          fi\n          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check\n          node --check plugins/usage-dashboard/latest.js"
          if needle not in text:
              raise SystemExit('release workflow build anchor missing')
          p.write_text(text.replace(needle, replacement, 1))
          PY

          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          old = '3.0.0-alpha.5.31'
          new = '3.0.0-alpha.5.32'
          root = Path('plugins/usage-dashboard')

          changed_parts = 0
          for path in sorted((root / 'src').glob('*.part.js')):
              text = path.read_text()
              next_text = text.replace(old, new)
              if next_text != text:
                  path.write_text(next_text)
                  changed_parts += 1
          if changed_parts == 0:
              raise SystemExit('no modular source version markers updated')

          manager = root / 'runtime' / 'bridge-manager.cjs'
          text = manager.read_text()
          if "const MANAGER_VERSION = '1.2.5';" not in text or old not in text:
              raise SystemExit('unexpected manager baseline')
          manager.write_text(text.replace(old, new))

          manifest_path = root / 'runtime' / 'product-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('productVersion') != old:
              raise SystemExit('unexpected product manifest baseline')
          manifest['productVersion'] = new
          manifest['components']['plugin']['version'] = new
          manifest['components']['bridgeManager']['productVersion'] = new
          manifest['components']['bridgeManager']['sha256'] = hashlib.sha256(manager.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          node ${ROOT}/tools/build_usage_dashboard.cjs --write
          node ${ROOT}/tools/build_usage_dashboard.cjs --check
          node ${ROOT}/tests/p2-build.cjs
          node --check ${ROOT}/latest.js
          node --check ${ROOT}/runtime/bridge-manager.cjs
          node --check ${ROOT}/runtime/bridge-engine.mjs
          bash -n ${ROOT}/runtime/bootstrap-bridge-manager.sh

          sed "s/${NEW}/${OLD}/g" ${ROOT}/latest.js > /tmp/normalized-latest.js
          cmp /tmp/release-531-latest.js /tmp/normalized-latest.js
          sed "s/${NEW}/${OLD}/g" ${ROOT}/runtime/bridge-manager.cjs > /tmp/normalized-manager.cjs
          cmp /tmp/release-531-manager.cjs /tmp/normalized-manager.cjs
          cmp /tmp/release-531-engine.mjs ${ROOT}/runtime/bridge-engine.mjs
          cmp /tmp/release-531-bootstrap.sh ${ROOT}/runtime/bootstrap-bridge-manager.sh

          python3 <<'PY'
          import json
          old = json.load(open('/tmp/release-531-product-manifest.json'))
          new = json.load(open('plugins/usage-dashboard/runtime/product-manifest.json'))
          new['productVersion'] = old['productVersion']
          new['components']['plugin']['version'] = old['components']['plugin']['version']
          new['components']['bridgeManager']['productVersion'] = old['components']['bridgeManager']['productVersion']
          new['components']['bridgeManager']['sha256'] = old['components']['bridgeManager']['sha256']
          if new != old:
              raise SystemExit('5.32 product manifest changed outside expected identity fields')
          PY

          # Full regression suite before publishing the new source-of-truth baseline.
          node ${ROOT}/tests/foundation.cjs
          node ${ROOT}/tests/p1-contract.cjs
          node ${ROOT}/tests/p3-ui.cjs
          node ${ROOT}/tests/p3-recent.cjs
          node ${ROOT}/tests/p4-render.cjs
          node ${ROOT}/tests/p4-partial.cjs
          node ${ROOT}/tests/p4-hourly-drilldown.cjs
          node ${ROOT}/tests/p4-hourly-detail.cjs
          node ${ROOT}/tests/p4-request-fidelity.cjs
          node ${ROOT}/tests/p5-unified-runtime.cjs
          node ${ROOT}/tests/p5-bridge-manager.cjs
          node ${ROOT}/tests/p5-engine-adoption.cjs
          node ${ROOT}/tests/p5-bundled-engine.cjs
          git diff --check

          grep -Fq "//@version ${NEW}" ${ROOT}/latest.js
          grep -Fq "const VERSION = '${NEW}';" ${ROOT}/latest.js
          grep -Fq "\"version\": \"${NEW}\"" ${ROOT}/src/manifest.json
          grep -Fq '"sourceOfTruth": "modules"' ${ROOT}/src/manifest.json
          grep -Fq "\"productVersion\": \"${NEW}\"" ${ROOT}/runtime/product-manifest.json
          grep -Fq "const PRODUCT_VERSION = '${NEW}';" ${ROOT}/runtime/bridge-manager.cjs
          grep -Fq "const MANAGER_VERSION = '1.2.5';" ${ROOT}/runtime/bridge-manager.cjs
          grep -Fq "const ENGINE_VERSION = '1.6.3';" ${ROOT}/runtime/bridge-engine.mjs

          git rm .github/workflows/usage-dashboard-532-source-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ${ROOT}/latest.js ${ROOT}/src ${ROOT}/runtime \
            ${ROOT}/tools/build_usage_dashboard.cjs \
            ${ROOT}/tools/split_usage_dashboard.cjs \
            ${ROOT}/tools/usage_dashboard_parts.cjs \
            ${ROOT}/tests/p2-build.cjs \
            .github/workflows/release-local-usage-dashboard.yml
          git commit -m 'chore: seal Usage Dashboard 5.32 modular source parity'
          git push origin HEAD:main

          cp ${ROOT}/latest.js /tmp/usage-dashboard-532-latest.js
          rm -rf /tmp/usage-dashboard-532-runtime
          cp -R ${ROOT}/runtime /tmp/usage-dashboard-532-runtime

          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf ${ROOT}/runtime
          mkdir -p ${ROOT}
          cp /tmp/usage-dashboard-532-latest.js ${ROOT}/latest.js
          cp -R /tmp/usage-dashboard-532-runtime ${ROOT}/runtime
          node --check ${ROOT}/latest.js
          node --check ${ROOT}/runtime/bridge-manager.cjs
          node --check ${ROOT}/runtime/bridge-engine.mjs
          python3 -m json.tool ${ROOT}/runtime/product-manifest.json >/dev/null
          ENGINE_SHA="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.components?.bridge?.sha256||""))' ${ROOT}/runtime/product-manifest.json)"
          test "$ENGINE_SHA" = "$(sha256sum ${ROOT}/runtime/bridge-engine.mjs | awk '{print $1}')"
          grep -Fq "//@version ${NEW}" ${ROOT}/latest.js
          git add ${ROOT}/latest.js ${ROOT}/runtime
          git diff --check
          git commit -m "release: publish Local Usage Dashboard ${NEW} source-parity seal"
          git push origin HEAD:release-usage-dashboard
