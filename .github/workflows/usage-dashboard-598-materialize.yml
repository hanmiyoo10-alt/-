name: Usage Dashboard 5.98 materialize

on:
  push:
    branches:
      - impl/usage-dashboard-598-models-12800-20260831

permissions:
  contents: write

concurrency:
  group: usage-dashboard-598-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: impl/usage-dashboard-598-models-12800-20260831
          fetch-depth: 0

      - name: Materialize and validate 5.98
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX=/tmp/usage-dashboard-pycache
          python3 plugins/usage-dashboard/tools/release_models_catalog_598.py
          python3 plugins/usage-dashboard/tools/release_models_catalog_598.py
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check
          node plugins/usage-dashboard/tests/p64-managed-models-catalog-refresh-fidelity.cjs
          node plugins/usage-dashboard/tests/run-all.cjs
          python3 plugins/usage-dashboard/tools/validate_release_candidate.py --spec .github/usage-dashboard/releases/5.98.json
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          git diff --check

      - name: Commit materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard docs/USAGE_DASHBOARD_GUIDELINES.md .github/usage-dashboard/releases/5.98.json
          if git diff --cached --quiet; then
            echo '5.98 already materialized'
            exit 0
          fi
          git commit -m 'release(usage-dashboard): materialize 3.0.0-alpha.5.98'
          git push origin HEAD:impl/usage-dashboard-598-models-12800-20260831
