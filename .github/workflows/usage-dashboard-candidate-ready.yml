name: Usage Dashboard Candidate Ready

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Usage Dashboard candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate completeness
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/usage-dashboard-pycache
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'CANDIDATE_READY_INVALID_SHA'; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$CANDIDATE_SHA" ]] || { echo "CANDIDATE_READY_SHA_MISMATCH:$ACTUAL_SHA"; exit 1; }

          RELEASE_SPEC="$(node plugins/usage-dashboard/tools/resolve_release_spec.cjs --manifest plugins/usage-dashboard/runtime/product-manifest.json)"
          case "$RELEASE_SPEC" in
            .github/usage-dashboard/releases/*.json) ;;
            *) echo "CANDIDATE_READY_RELEASE_SPEC_DENIED:$RELEASE_SPEC"; exit 1 ;;
          esac
          test -f "$RELEASE_SPEC"

          UD_MATERIALIZER="$(python3 - "$RELEASE_SPEC" <<'PY'
          import json, re, sys
          from pathlib import Path
          spec = json.loads(Path(sys.argv[1]).read_text())
          path = str(spec.get('materializer', ''))
          if not re.fullmatch(r'plugins/usage-dashboard/tools/[A-Za-z0-9_.-]+\.py', path):
              raise SystemExit('CANDIDATE_READY_MATERIALIZER_DENIED')
          print(path)
          PY
          )"
          python3 -m py_compile "$UD_MATERIALIZER" plugins/usage-dashboard/tools/validate_release_candidate.py

          assert_candidate_clean() {
            local status
            status="$(git status --porcelain --untracked-files=all -- plugins/usage-dashboard/src plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime plugins/usage-dashboard/runtime-src docs/USAGE_DASHBOARD_GUIDELINES.md)"
            if [[ -n "$status" ]]; then
              printf '%s\n' "$status"
              echo 'CANDIDATE_NOT_MATERIALIZED'
              return 1
            fi
          }

          forbidden="$(find .github/workflows -maxdepth 1 -type f \( -iname '*usage-dashboard*staging*' -o -iname '*usage-dashboard*materialize*' -o -iname '*usage-dashboard*temp*' \) -print -quit)"
          [[ -z "$forbidden" ]] || { echo "CANDIDATE_READY_FORBIDDEN_WORKFLOW:$forbidden"; exit 1; }

          python3 "$UD_MATERIALIZER"
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --write
          node plugins/usage-dashboard/tools/build_bridge_engine.cjs --check
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          assert_candidate_clean

          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check
          node plugins/usage-dashboard/tests/test-registry-contract.cjs
          python3 plugins/usage-dashboard/tools/validate_release_candidate.py --spec "$RELEASE_SPEC"
          git diff --check
          assert_candidate_clean

          PRODUCT_VERSION="$(node -e "console.log(require('./plugins/usage-dashboard/runtime/product-manifest.json').productVersion)")"
          echo "CANDIDATE_READY:${ACTUAL_SHA}:${PRODUCT_VERSION}"
