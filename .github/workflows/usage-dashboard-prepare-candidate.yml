name: Usage Dashboard Safe Candidate Preparation Fallback

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Exact candidate branch in release/usage-dashboard-* namespace
        required: true
        type: string
      expected_head_sha:
        description: Exact current candidate branch head SHA
        required: true
        type: string
      release_spec:
        description: Explicit target release spec path under .github/usage-dashboard/releases
        required: true
        type: string
      coordination_work_issue:
        description: Optional active Repository Work Harness issue for writer-side receipt canary
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 197 && github.actor == github.repository_owner && startsWith(github.event.comment.body, '/usage-dashboard prepare ')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.materialize.outputs.has_changes }}
      candidate_sha: ${{ steps.materialize.outputs.candidate_sha }}
      bundle_sha256: ${{ steps.materialize.outputs.bundle_sha256 }}
      target_branch: ${{ steps.request.outputs.target_branch }}
      expected_head_sha: ${{ steps.request.outputs.expected_head_sha }}
      release_spec: ${{ steps.request.outputs.release_spec }}
      coordination_work_issue: ${{ steps.request.outputs.coordination_work_issue }}
    steps:
      - name: Checkout immutable trusted fallback control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact fallback request
        id: request
        shell: bash
        env:
          RAW_TARGET_BRANCH: ${{ inputs.target_branch }}
          RAW_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RAW_RELEASE_SPEC: ${{ inputs.release_spec }}
          RAW_COORDINATION_WORK_ISSUE: ${{ inputs.coordination_work_issue }}
          CONTROL_COMMAND: ${{ github.event.comment.body }}
          CONTROL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTROL_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo "CANDIDATE_PREP_UNTRUSTED_WORKFLOW_REF:$GITHUB_REF"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            node plugins/usage-dashboard/tools/release_control_command.cjs --check-envelope "$CONTROL_ISSUE_NUMBER" "$CONTROL_ACTOR" "$REPOSITORY_OWNER"
            TARGET_BRANCH="$(node plugins/usage-dashboard/tools/release_control_command.cjs --prepare-target "$CONTROL_COMMAND")"
            EXPECTED_HEAD_SHA="$(node plugins/usage-dashboard/tools/release_control_command.cjs --prepare-sha "$CONTROL_COMMAND")"
            RELEASE_SPEC="$(node plugins/usage-dashboard/tools/release_control_command.cjs --prepare-spec "$CONTROL_COMMAND")"
            COORDINATION_WORK_ISSUE="$(node plugins/usage-dashboard/tools/release_control_command.cjs --prepare-work-issue "$CONTROL_COMMAND")"
          else
            TARGET_BRANCH="$(node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --normalize-target "$RAW_TARGET_BRANCH")"
            EXPECTED_HEAD_SHA="$(node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --normalize-sha "$RAW_EXPECTED_HEAD_SHA")"
            RELEASE_SPEC="$(node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --normalize-spec "$RAW_RELEASE_SPEC")"
            COORDINATION_WORK_ISSUE="$RAW_COORDINATION_WORK_ISSUE"
          fi
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --check-target "$TARGET_BRANCH"
          case "$RELEASE_SPEC" in .github/usage-dashboard/releases/*.json) ;; *) echo "CANDIDATE_PREP_RELEASE_SPEC_DENIED:$RELEASE_SPEC"; exit 1 ;; esac
          if [[ -n "$COORDINATION_WORK_ISSUE" && ! "$COORDINATION_WORK_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo 'USAGE_DASHBOARD_CANDIDATE_COORDINATION_ISSUE_INVALID'
            exit 3
          fi
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${EXPECTED_HEAD_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "release_spec=$RELEASE_SPEC" >> "$GITHUB_OUTPUT"
          echo "coordination_work_issue=$COORDINATION_WORK_ISSUE" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_PREP_FALLBACK_REQUEST:$TARGET_BRANCH:${EXPECTED_HEAD_SHA,,}:$RELEASE_SPEC:work_issue=${COORDINATION_WORK_ISSUE:-none}"

      - name: Checkout exact fallback candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fallback branch CAS before candidate code
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]] || { echo 'CANDIDATE_PREP_CHECKOUT_MISMATCH'; exit 1; }
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_SHA" == "$EXPECTED_HEAD_SHA" ]] || { echo "CANDIDATE_BRANCH_MOVED:$REMOTE_SHA:expected=$EXPECTED_HEAD_SHA"; exit 1; }

      - name: Materialize fallback candidate without repository credentials
        id: materialize
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/usage-dashboard-pycache
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
          RELEASE_SPEC: ${{ steps.request.outputs.release_spec }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_SPEC"
          UD_MATERIALIZER="$(node - "$RELEASE_SPEC" <<'NODE'
          const fs=require('node:fs');
          const spec=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const path=String(spec.materializer||'');
          if(!/^plugins\/usage-dashboard\/tools\/[A-Za-z0-9_.-]+\.py$/.test(path)) throw new Error('CANDIDATE_PREP_MATERIALIZER_DENIED');
          process.stdout.write(path);
          NODE
          )"
          python3 -m py_compile "$UD_MATERIALIZER" plugins/usage-dashboard/tools/reconcile_release_candidate.py plugins/usage-dashboard/tools/validate_release_candidate.py
          python3 "$UD_MATERIALIZER"
          python3 plugins/usage-dashboard/tools/reconcile_release_candidate.py --spec "$RELEASE_SPEC" --two-pass
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --check-worktree
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check
          git diff --check
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'bundle_sha256=' >> "$GITHUB_OUTPUT"
            echo "CANDIDATE_PREP_NO_CHANGES:$TARGET_BRANCH:$EXPECTED_HEAD_SHA"
            exit 0
          fi
          git config user.name 'usage-dashboard-candidate-prep'
          git config user.email 'usage-dashboard-candidate-prep@users.noreply.github.com'
          git add -A -- plugins/usage-dashboard/src plugins/usage-dashboard/runtime-src plugins/usage-dashboard/runtime plugins/usage-dashboard/latest.js docs/USAGE_DASHBOARD_GUIDELINES.md
          git diff --cached --quiet && { echo 'CANDIDATE_PREP_EMPTY_STAGE'; exit 1; }
          [[ -z "$(git diff --name-only)" ]] || { echo 'CANDIDATE_PREP_UNSTAGED_OUTPUT'; git diff --name-only; exit 1; }
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'CANDIDATE_PREP_UNTRACKED_OUTPUT'; git ls-files --others --exclude-standard; exit 1; }
          git commit -m "materialize: Usage Dashboard fallback candidate from $RELEASE_SPEC"
          PAYLOAD_SHA="$(git rev-parse HEAD)"
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --verify-payload "$EXPECTED_HEAD_SHA" "$PAYLOAD_SHA"
          git branch -f candidate-payload "$PAYLOAD_SHA"
          BUNDLE="$RUNNER_TEMP/usage-dashboard-candidate.bundle"
          META="$RUNNER_TEMP/usage-dashboard-candidate.json"
          git bundle create "$BUNDLE" refs/heads/candidate-payload ^"$EXPECTED_HEAD_SHA"
          git bundle verify "$BUNDLE"
          BUNDLE_SHA256="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          node - "$META" "$TARGET_BRANCH" "$EXPECTED_HEAD_SHA" "$PAYLOAD_SHA" "$RELEASE_SPEC" "$BUNDLE_SHA256" <<'NODE'
          const fs=require('node:fs');
          const [file,targetBranch,expectedHeadSha,payloadSha,releaseSpec,bundleSha256]=process.argv.slice(2);
          fs.writeFileSync(file,JSON.stringify({schemaVersion:1,targetBranch,expectedHeadSha,payloadSha,releaseSpec,bundleSha256},null,2)+'\n');
          NODE
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$PAYLOAD_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_PREP_BUNDLE_READY:$TARGET_BRANCH:$EXPECTED_HEAD_SHA:$PAYLOAD_SHA"

      - name: Upload immutable fallback payload
        if: steps.materialize.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: usage-dashboard-candidate-payload
          path: |
            ${{ runner.temp }}/usage-dashboard-candidate.bundle
            ${{ runner.temp }}/usage-dashboard-candidate.json
          retention-days: 1
          if-no-files-found: error

  coordination-gate:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    outputs:
      gate_ready: ${{ steps.gate.outputs.gate_ready }}
    steps:
      - name: Checkout trusted current-main Harness gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: ${{ needs.prepare.outputs.coordination_work_issue != '' }}
        with:
          node-version: 22

      - name: Revalidate optional candidate coordination receipt
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_WORK_ISSUE: ${{ needs.prepare.outputs.coordination_work_issue }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_WORK_ISSUE" ]]; then
            echo 'gate_ready=true' >> "$GITHUB_OUTPUT"
            echo 'USAGE_DASHBOARD_CANDIDATE_COORDINATION_GATE_BYPASS:NO_WORK_ISSUE'
            exit 0
          fi
          [[ "$TARGET_WORK_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo 'USAGE_DASHBOARD_CANDIDATE_COORDINATION_ISSUE_INVALID'; exit 3; }
          mkdir -p "$RUNNER_TEMP/usage-dashboard-candidate-gate"
          RESULT="$RUNNER_TEMP/usage-dashboard-candidate-gate/mutation-gate.json"
          set +e
          node .github/plugin-control-plane/canonical-main/work-harness/mutation-gate.cjs --work-issue "$TARGET_WORK_ISSUE" > "$RESULT"
          code=$?
          set -e
          status="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.status || ''))" "$RESULT")"
          adapter="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.boundary?.adapterId || ''))" "$RESULT")"
          mutation="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.boundary?.mutationClass || ''))" "$RESULT")"
          {
            echo '### Usage Dashboard Candidate Coordination Gate'
            echo '```json'
            cat "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" -ne 0 || "$status" != 'MUTATION_GATE_READY' ]]; then
            echo "USAGE_DASHBOARD_CANDIDATE_COORDINATION_GATE_BLOCKED:$status"
            exit 3
          fi
          [[ "$adapter" == 'usage-dashboard' ]] || { echo "USAGE_DASHBOARD_CANDIDATE_ADAPTER_MISMATCH:$adapter"; exit 3; }
          [[ "$mutation" == 'CANDIDATE_STATE' ]] || { echo "USAGE_DASHBOARD_CANDIDATE_MUTATION_CLASS_MISMATCH:$mutation"; exit 3; }
          echo 'gate_ready=true' >> "$GITHUB_OUTPUT"
          echo "USAGE_DASHBOARD_CANDIDATE_COORDINATION_GATE_READY:$TARGET_WORK_ISSUE"

  commit-candidate:
    needs: [prepare, coordination-gate]
    if: needs.prepare.outputs.has_changes == 'true' && needs.coordination-gate.outputs.gate_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable trusted fallback writer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download immutable fallback payload
        uses: actions/download-artifact@v4
        with:
          name: usage-dashboard-candidate-payload
          path: ${{ runner.temp }}/usage-dashboard-candidate-payload

      - name: Verify payload and fast-forward fallback candidate branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.expected_head_sha }}
          PAYLOAD_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/usage-dashboard-candidate-payload/usage-dashboard-candidate.bundle"
          test -f "$BUNDLE"
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --check-target "$TARGET_BRANCH"
          [[ "$(sha256sum "$BUNDLE" | awk '{print $1}')" == "$EXPECTED_BUNDLE_SHA256" ]] || { echo 'CANDIDATE_BUNDLE_SHA256_MISMATCH'; exit 1; }
          REMOTE_BEFORE="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_BEFORE" == "$EXPECTED_HEAD_SHA" ]] || { echo "CANDIDATE_BRANCH_MOVED:$REMOTE_BEFORE:expected=$EXPECTED_HEAD_SHA"; exit 1; }
          git fetch --no-tags --depth=1 origin "refs/heads/$TARGET_BRANCH:refs/candidate/prerequisite"
          [[ "$(git rev-parse refs/candidate/prerequisite)" == "$EXPECTED_HEAD_SHA" ]] || { echo 'CANDIDATE_PREREQUISITE_FETCH_MISMATCH'; exit 1; }
          git bundle verify "$BUNDLE"
          git fetch "$BUNDLE" 'refs/heads/candidate-payload:refs/candidate/payload'
          [[ "$(git rev-parse refs/candidate/payload)" == "$PAYLOAD_SHA" ]] || { echo 'CANDIDATE_PAYLOAD_SHA_MISMATCH'; exit 1; }
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --verify-payload "$EXPECTED_HEAD_SHA" "$PAYLOAD_SHA"
          git push origin "$PAYLOAD_SHA:refs/heads/$TARGET_BRANCH"
          [[ "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" == "$PAYLOAD_SHA" ]] || { echo 'CANDIDATE_BRANCH_POSTVERIFY_MISMATCH'; exit 1; }
          echo "CANDIDATE_MATERIALIZED_FALLBACK:$TARGET_BRANCH:$EXPECTED_HEAD_SHA:$PAYLOAD_SHA"
