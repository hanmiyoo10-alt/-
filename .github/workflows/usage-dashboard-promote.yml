name: Usage Dashboard Exact-Byte Promotion

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'plugins/usage-dashboard/**'
      - '.github/usage-dashboard/releases/**'
      - '.github/usage-dashboard/archived-release-workflows.json'
      - '.github/workflows/usage-dashboard-validate.yml'
      - '.github/workflows/usage-dashboard-candidate-ready.yml'
      - '.github/workflows/usage-dashboard-prepare-candidate.yml'
      - '.github/workflows/usage-dashboard-stage-e6.yml'
      - '.github/workflows/usage-dashboard-promote.yml'
      - '.github/workflows/reusable-usage-dashboard-validate.yml'
      - '.github/workflows/reusable-usage-dashboard-promote.yml'
      - 'docs/USAGE_DASHBOARD_GUIDELINES.md'
      - 'docs/USAGE_DASHBOARD_RELEASE_PIPELINE_V2*.md'
      - 'docs/USAGE_DASHBOARD_PR_LIFECYCLE_E*.md'

permissions:
  contents: read

jobs:
  classify:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      release_control_changed: ${{ steps.classify.outputs.release_control_changed }}
    steps:
      - name: Checkout immutable merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Classify production-byte change
        id: classify
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/classify_release_candidate.cjs \
            --candidate-sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --github-output "$GITHUB_OUTPUT"

  maintenance-release-control-smoke:
    needs: classify
    if: needs.classify.outputs.classification == 'MAINTENANCE_ONLY' && needs.classify.outputs.release_control_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove maintenance release control would noop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/check_release_blob_parity.cjs \
            --repository "${{ github.repository }}" \
            --candidate-sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --release-branch release-usage-dashboard

  promote:
    needs: classify
    if: needs.classify.outputs.classification == 'RELEASE_CANDIDATE'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-usage-dashboard-promote.yml
    with:
      candidate_sha: ${{ github.event.pull_request.merge_commit_sha }}
      release_branch: release-usage-dashboard

  release-receipt:
    needs: [classify, promote]
    if: ${{ needs.classify.outputs.classification == 'RELEASE_CANDIDATE' && needs.promote.result == 'success' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable merged release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify production parity and post deployment receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/check_release_blob_parity.cjs \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$MERGE_SHA" \
            --release-branch release-usage-dashboard
          RELEASE_SHA="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/release-usage-dashboard | awk '{print $1}')"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'E6_RELEASE_RECEIPT_SHA_INVALID'; exit 1; }
          node - <<'NODE' > "$RUNNER_TEMP/release-receipt.env"
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const manifest=JSON.parse(fs.readFileSync('plugins/usage-dashboard/runtime/product-manifest.json','utf8'));
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const rows={
            PRODUCT_VERSION:String(manifest.productVersion||''),
            ENGINE_VERSION:String(manifest.components?.bridge?.requiredVersion||''),
            MANAGER_VERSION:String(manifest.components?.bridgeManager?.version||''),
            SNAPSHOT_CONTRACT:String(manifest.contracts?.snapshot??''),
            RECENT_REQUEST_CONTRACT:String(manifest.contracts?.recentRequest??''),
            ENGINE_SHA256:sha('plugins/usage-dashboard/runtime/bridge-engine.mjs'),
          };
          for(const [k,v] of Object.entries(rows)) {
            if(!v || /[\r\n]/.test(v)) throw new Error(`E6_RECEIPT_VALUE_INVALID:${k}`);
            console.log(`${k}=${v}`);
          }
          NODE
          source "$RUNNER_TEMP/release-receipt.env"
          BODY="$(cat <<EOF
          UD_RELEASE_DEPLOYED
          release: $PRODUCT_VERSION
          engine: $ENGINE_VERSION
          manager: $MANAGER_VERSION
          contracts: $SNAPSHOT_CONTRACT / $RECENT_REQUEST_CONTRACT
          main_merge_sha: $MERGE_SHA
          release_branch_sha: $RELEASE_SHA
          engine_sha256: $ENGINE_SHA256
          exact_byte_parity: VERIFIED
          physical_verification: PENDING
          next: PocketRisu + update and actual-device acceptance
          EOF
          )"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/receipt.json"
          for ISSUE in "$PR_NUMBER" 197; do
            curl --fail-with-body --silent --show-error -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
              --data-binary @"$RUNNER_TEMP/receipt.json" >/dev/null
          done
          echo "E6_RELEASE_RECEIPT_POSTED:$PRODUCT_VERSION:$MERGE_SHA:$RELEASE_SHA"
