name: Usage Dashboard E7 Candidate-Ready Stage

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Exact source branch in release/usage-dashboard-* namespace
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: usage-dashboard-e7-stage
  cancel-in-progress: false

jobs:
  resolve_stage:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 197 && github.actor == github.repository_owner && startsWith(github.event.comment.body, '/usage-dashboard stage ')) || (github.event_name == 'issues' && github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[usage-dashboard-stage] ')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      trusted_base_sha: ${{ steps.resolve.outputs.trusted_base_sha }}
      intent_base_sha: ${{ steps.resolve.outputs.intent_base_sha }}
      candidate_branch: ${{ steps.resolve.outputs.candidate_branch }}
      candidate_parent_sha: ${{ steps.resolve.outputs.candidate_parent_sha }}
      release_spec: ${{ steps.resolve.outputs.release_spec }}
      product_version: ${{ steps.resolve.outputs.product_version }}
      engine_changed: ${{ steps.resolve.outputs.engine_changed }}
      plugin_changed: ${{ steps.resolve.outputs.plugin_changed }}
      source_files_json: ${{ steps.resolve.outputs.source_files_json }}
      failure_reason: ${{ steps.resolve.outputs.failure_reason }}
    steps:
      - name: Checkout immutable trusted control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze source intent and derived candidate identity
        id: resolve
        shell: bash
        env:
          CONTROL_EVENT_NAME: ${{ github.event_name }}
          CONTROL_COMMAND: ${{ github.event.comment.body }}
          CONTROL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTROL_ISSUE_TITLE: ${{ github.event.issue.title }}
          CONTROL_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CONTROL_ACTOR: ${{ github.actor }}
          RAW_SOURCE_BRANCH: ${{ inputs.source_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'failure_reason=E7_UNTRUSTED_WORKFLOW_REF' >> "$GITHUB_OUTPUT"; exit 1; }
          if [[ "$CONTROL_EVENT_NAME" == 'workflow_dispatch' ]]; then
            SOURCE_BRANCH="$(node plugins/usage-dashboard/tools/release_control_command.cjs --stage-branch "/usage-dashboard stage $RAW_SOURCE_BRANCH")"
            echo "E8_STAGE_TRUSTED_DISPATCH_REQUEST:$SOURCE_BRANCH"
          elif [[ "$CONTROL_EVENT_NAME" == 'issues' ]]; then
            node plugins/usage-dashboard/tools/release_control_command.cjs --check-stage-issue-envelope "$CONTROL_ACTOR" "$CONTROL_ISSUE_AUTHOR" "$REPOSITORY_OWNER"
            SOURCE_BRANCH="$(node plugins/usage-dashboard/tools/release_control_command.cjs --stage-issue-branch "$CONTROL_ISSUE_TITLE")"
            echo "E8_STAGE_CONNECTED_ISSUE_REQUEST:$SOURCE_BRANCH"
          else
            node plugins/usage-dashboard/tools/release_control_command.cjs --check-envelope "$CONTROL_ISSUE_NUMBER" "$CONTROL_ACTOR" "$REPOSITORY_OWNER"
            SOURCE_BRANCH="$(node plugins/usage-dashboard/tools/release_control_command.cjs --stage-branch "$CONTROL_COMMAND")"
          fi
          node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --check-target "$SOURCE_BRANCH"
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/e7-source"
          SOURCE_SHA="$(git rev-parse refs/remotes/origin/e7-source)"
          TRUSTED_BASE_SHA="$(git rev-parse HEAD)"
          if ! INSPECT="$(node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --inspect "$TRUSTED_BASE_SHA" "$SOURCE_SHA" 2>&1)"; then
            REASON="$(printf '%s\n' "$INSPECT" | tail -n 1 | tr -cd 'A-Za-z0-9_./:=-' | cut -c1-180)"
            echo "failure_reason=${REASON:-SOURCE_POLICY_REJECTED}" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$INSPECT" >&2
            exit 1
          fi
          INTENT_BASE_SHA="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.intentBaseSha)' "$INSPECT")"
          CANDIDATE_BRANCH="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.candidateBranch)' "$INSPECT")"
          RELEASE_SPEC="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.releaseSpec)' "$INSPECT")"
          PRODUCT_VERSION="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.productVersion)' "$INSPECT")"
          ENGINE_CHANGED="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(Boolean(j.engineChanged)))' "$INSPECT")"
          PLUGIN_CHANGED="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(Boolean(j.pluginChanged)))' "$INSPECT")"
          SOURCE_FILES_JSON="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(JSON.stringify(j.files))' "$INSPECT")"
          node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --check-derived-branch "$CANDIDATE_BRANCH" >/dev/null
          CANDIDATE_PARENT_SHA="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [[ -z "$CANDIDATE_PARENT_SHA" ]]; then CANDIDATE_PARENT_SHA="$TRUSTED_BASE_SHA"; fi
          [[ "$CANDIDATE_PARENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'failure_reason=E7_CANDIDATE_PARENT_INVALID' >> "$GITHUB_OUTPUT"; exit 1; }
          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_sha=$SOURCE_SHA"
            echo "trusted_base_sha=$TRUSTED_BASE_SHA"
            echo "intent_base_sha=$INTENT_BASE_SHA"
            echo "candidate_branch=$CANDIDATE_BRANCH"
            echo "candidate_parent_sha=$CANDIDATE_PARENT_SHA"
            echo "release_spec=$RELEASE_SPEC"
            echo "product_version=$PRODUCT_VERSION"
            echo "engine_changed=$ENGINE_CHANGED"
            echo "plugin_changed=$PLUGIN_CHANGED"
            echo "source_files_json=$SOURCE_FILES_JSON"
            echo 'failure_reason='
          } >> "$GITHUB_OUTPUT"
          echo "E7_STAGE_SOURCE_FROZEN:$SOURCE_BRANCH:$SOURCE_SHA:$TRUSTED_BASE_SHA:$CANDIDATE_BRANCH:$CANDIDATE_PARENT_SHA"

  receipt_accepted:
    needs: resolve_stage
    if: ${{ needs.resolve_stage.result == 'success' }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Post accepted transaction receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.resolve_stage.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.resolve_stage.outputs.source_sha }}
          CANDIDATE_BRANCH: ${{ needs.resolve_stage.outputs.candidate_branch }}
          PRODUCT_VERSION: ${{ needs.resolve_stage.outputs.product_version }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          UD_STAGE_ACCEPTED
          source_branch: $SOURCE_BRANCH
          source_sha: $SOURCE_SHA
          candidate_branch: $CANDIDATE_BRANCH
          release: $PRODUCT_VERSION
          transaction: $GITHUB_RUN_ID
          next: release-generic preflight + materializing
          EOF
          )"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/receipt.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/197/comments" \
            --data-binary @"$RUNNER_TEMP/receipt.json" >/dev/null

  materialize_stage:
    needs: resolve_stage
    if: ${{ needs.resolve_stage.result == 'success' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.materialize.outputs.candidate_sha }}
      bundle_sha256: ${{ steps.materialize.outputs.bundle_sha256 }}
      failure_phase: ${{ steps.materialize.outputs.failure_phase }}
      failure_reason: ${{ steps.materialize.outputs.failure_reason }}
      failure_diagnostic_code: ${{ steps.materialize.outputs.failure_diagnostic_code }}
    steps:
      - name: Checkout frozen trusted main base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect transaction-local E24 raw release evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_BASE_SHA: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
        run: |
          set -euo pipefail
          RELEASE_EVIDENCE_CONTEXT="$RUNNER_TEMP/usage-dashboard-e24-evidence.json"
          node - "$RELEASE_EVIDENCE_CONTEXT" <<'NODE'
          const fs=require('node:fs');
          const rr=require('./plugins/usage-dashboard/tools/release_request_e9.cjs');
          const out=process.argv[2];
          const apiBase=String(process.env.GITHUB_API_URL||'https://api.github.com');
          const repository=String(process.env.GITHUB_REPOSITORY||'');
          const token=String(process.env.GITHUB_TOKEN||'');
          const trustedBaseSha=String(process.env.TRUSTED_BASE_SHA||'');
          if(!repository || !token || !/^[0-9a-f]{40}$/.test(trustedBaseSha)) throw new Error('E24_CAPTURE_ENV_INCOMPLETE');
          const headers={
            Accept:'application/vnd.github+json',
            Authorization:`Bearer ${token}`,
            'X-GitHub-Api-Version':'2022-11-28',
          };
          async function api(path,{allow404=false}={}){
            const response=await fetch(`${apiBase}/repos/${repository}${path}`,{headers});
            if(allow404 && response.status===404) return null;
            if(!response.ok) throw new Error(`E24_CAPTURE_API_FAILED:${response.status}:${path}`);
            return response.json();
          }
          async function paginate(path){
            const rows=[];
            for(let page=1;;page+=1){
              const join=path.includes('?')?'&':'?';
              const batch=await api(`${path}${join}per_page=100&page=${page}`);
              if(!Array.isArray(batch)) throw new Error(`E24_CAPTURE_PAGE_SHAPE:${path}:${page}`);
              rows.push(...batch);
              if(batch.length<100) break;
            }
            return rows;
          }
          async function contentJson(path,ref,{required=false}={}){
            const encodedPath=path.split('/').map(encodeURIComponent).join('/');
            const data=await api(`/contents/${encodedPath}?ref=${encodeURIComponent(ref)}`,{allow404:!required});
            if(data===null) return null;
            if(data.type!=='file' || data.encoding!=='base64' || typeof data.content!=='string') throw new Error(`E24_CAPTURE_CONTENT_SHAPE:${path}:${ref}`);
            try{return JSON.parse(Buffer.from(data.content.replace(/\n/g,''),'base64').toString('utf8'));}
            catch{throw new Error(`E24_CAPTURE_JSON_INVALID:${path}:${ref}`);}
          }
          (async()=>{
            const allIssues=await paginate('/issues?state=all');
            const durable=allIssues.filter((issue)=>!issue.pull_request && rr.TITLE_RE.test(String(issue.title||'').trim()) && /^Plugin:\s*usage-dashboard\s*$/mi.test(String(issue.body||'')));
            const releases=[];
            for(const issue of durable){
              const parsed=rr.parseIssue(issue.title,issue.body);
              const issueComments=await paginate(`/issues/${issue.number}/comments?sort=created&direction=asc`);
              let pr=null;
              let prComments=[];
              if(parsed.prNumber!==null){
                pr=await api(`/pulls/${parsed.prNumber}`);
                if(Number(pr.number)!==parsed.prNumber) throw new Error(`E24_CAPTURE_PR_IDENTITY:${issue.number}`);
                prComments=await paginate(`/issues/${parsed.prNumber}/comments?sort=created&direction=asc`);
              }
              const combinedComments=[...issueComments,...prComments];
              const deployment=rr.latestDeployment(combinedComments,parsed.releaseVersion);
              let productionSha='';
              let productionManifest=null;
              if(deployment){
                productionSha=deployment.productionSha;
                productionManifest=await contentJson('plugins/usage-dashboard/runtime/product-manifest.json',productionSha,{required:true});
              }
              const releaseSpecIdentity=await contentJson(parsed.releaseSpec,trustedBaseSha,{required:false});
              releases.push({
                issue:{number:Number(issue.number),title:String(issue.title||''),body:String(issue.body||'')},
                comments:combinedComments.map((row)=>({id:Number(row.id),body:String(row.body||'')})),
                pr,
                productionSha,
                productionManifest,
                releaseSpecIdentity,
              });
            }
            const context={
              enumeration:{complete:true,repository,durableRequestCount:releases.length},
              releases,
            };
            fs.writeFileSync(out,JSON.stringify(context,null,2)+'\n');
            console.log(`E24_CAPTURE_COMPLETE:${releases.length}:${out}`);
          })().catch((error)=>{console.error(error?.stack||String(error));process.exitCode=1;});
          NODE
          test -s "$RELEASE_EVIDENCE_CONTEXT"

      - name: Reconstruct and validate materialized candidate without write credentials
        id: materialize
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/usage-dashboard-pycache
          SOURCE_BRANCH: ${{ needs.resolve_stage.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.resolve_stage.outputs.source_sha }}
          TRUSTED_BASE_SHA: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
          INTENT_BASE_SHA: ${{ needs.resolve_stage.outputs.intent_base_sha }}
          CANDIDATE_BRANCH: ${{ needs.resolve_stage.outputs.candidate_branch }}
          CANDIDATE_PARENT_SHA: ${{ needs.resolve_stage.outputs.candidate_parent_sha }}
          RELEASE_SPEC: ${{ needs.resolve_stage.outputs.release_spec }}
          PRODUCT_VERSION: ${{ needs.resolve_stage.outputs.product_version }}
          ENGINE_CHANGED: ${{ needs.resolve_stage.outputs.engine_changed }}
          PLUGIN_CHANGED: ${{ needs.resolve_stage.outputs.plugin_changed }}
          SOURCE_FILES_JSON: ${{ needs.resolve_stage.outputs.source_files_json }}
          RELEASE_EVIDENCE_CONTEXT: ${{ runner.temp }}/usage-dashboard-e24-evidence.json
        run: |
          set -euo pipefail
          FAILURE_PHASE='unknown'
          FAILURE_REASON='E7_MATERIALIZE_OR_SMOKE_FAILED'
          FAILURE_DIAGNOSTIC_CODE=''
          emit_failure_outputs() {
            {
              echo "failure_phase=$FAILURE_PHASE"
              echo "failure_reason=$FAILURE_REASON"
              echo "failure_diagnostic_code=$FAILURE_DIAGNOSTIC_CODE"
            } >> "$GITHUB_OUTPUT"
          }
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then emit_failure_outputs; fi' EXIT

          FAILURE_PHASE='source-intent'
          FAILURE_REASON='E7_SOURCE_INTENT_APPLY_FAILED'
          node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --check-derived-branch "$CANDIDATE_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/e7-source"
          [[ "$(git rev-parse refs/remotes/origin/e7-source)" == "$SOURCE_SHA" ]] || { echo 'E7_SOURCE_BRANCH_MOVED'; exit 1; }
          if [[ "$CANDIDATE_PARENT_SHA" != "$TRUSTED_BASE_SHA" ]]; then
            git fetch --no-tags origin "refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/e7-candidate"
            [[ "$(git rev-parse refs/remotes/origin/e7-candidate)" == "$CANDIDATE_PARENT_SHA" ]] || { echo 'E7_CANDIDATE_BRANCH_MOVED'; exit 1; }
          fi
          PATCH="$RUNNER_TEMP/usage-dashboard-source-intent.patch"
          git diff --binary "$INTENT_BASE_SHA" "$SOURCE_SHA" -- > "$PATCH"
          if ! git apply --index --3way "$PATCH"; then echo 'SOURCE_INTENT_CONFLICT'; exit 1; fi
          ACTUAL_FILES_JSON="$(git diff --cached --name-only -z | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(s.split("\0").filter(Boolean).sort())))')"
          node - "$ACTUAL_FILES_JSON" "$SOURCE_FILES_JSON" <<'NODE'
          const [actualText,expectedText]=process.argv.slice(2);
          const actual=JSON.parse(actualText), expected=JSON.parse(expectedText);
          const allowed=new Set(expected);
          for(const file of actual) if(!allowed.has(file)) throw new Error(`E7_SOURCE_PATCH_PATH_DRIFT:${file}`);
          NODE
          git config user.name 'usage-dashboard-e7-source-intent'
          git config user.email 'usage-dashboard-e7-source-intent@users.noreply.github.com'
          git diff --cached --quiet && { echo 'E7_SOURCE_INTENT_EMPTY'; exit 1; }
          git commit -m "stage: apply Usage Dashboard source intent $SOURCE_SHA"
          test -f "$RELEASE_SPEC"
          test -s "$RELEASE_EVIDENCE_CONTEXT"

          FAILURE_PHASE='preflight'
          FAILURE_REASON='E7_RELEASE_PREFLIGHT_REJECTED'
          if ! node plugins/usage-dashboard/tools/release_generic_preflight.cjs --spec "$RELEASE_SPEC" --release-evidence-context "$RELEASE_EVIDENCE_CONTEXT"; then
            exit 1
          fi

          FAILURE_PHASE='compile'
          FAILURE_REASON='E7_MATERIALIZER_COMPILE_FAILED'
          UD_MATERIALIZER="$(node - "$RELEASE_SPEC" <<'NODE'
          const fs=require('node:fs');
          const spec=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const path=String(spec.materializer||'');
          if(!/^plugins\/usage-dashboard\/tools\/[A-Za-z0-9_.-]+\.py$/.test(path)) throw new Error('E7_MATERIALIZER_DENIED');
          process.stdout.write(path);
          NODE
          )"
          python3 -m py_compile "$UD_MATERIALIZER" plugins/usage-dashboard/tools/reconcile_release_candidate.py plugins/usage-dashboard/tools/validate_release_candidate.py

          FAILURE_PHASE='materializer'
          FAILURE_REASON='E7_MATERIALIZER_EXEC_FAILED'
          python3 "$UD_MATERIALIZER"

          FAILURE_PHASE='reconcile'
          FAILURE_REASON='E7_RECONCILE_FAILED'
          python3 plugins/usage-dashboard/tools/reconcile_release_candidate.py --spec "$RELEASE_SPEC" --two-pass

          FAILURE_PHASE='syntax'
          FAILURE_REASON='E7_SYNTAX_CHECK_FAILED'
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh

          FAILURE_PHASE='guidelines'
          FAILURE_REASON='E7_GUIDELINE_SYNC_FAILED'
          python3 plugins/usage-dashboard/tools/sync_project_guidelines.py --check
          git diff --check

          FAILURE_PHASE='impact'
          FAILURE_REASON='E18_RUNTIME_IMPACT_REJECTED'
          E18_PLAN="$(node plugins/usage-dashboard/tools/derived_impact_e18.cjs --smoke-plan "$TRUSTED_BASE_SHA")"
          E18_DIAGNOSTIC="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.diagnostic)' "$E18_PLAN")"
          E18_SMOKE_MODE="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.smoke.mode)' "$E18_PLAN")"
          E18_SMOKE_REPEAT="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.smoke.repeat))' "$E18_PLAN")"
          E18_SMOKE_REASON="$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.smoke.reason)' "$E18_PLAN")"
          echo "UD_DERIVED_IMPACT:$E18_DIAGNOSTIC"
          if [[ "$E18_SMOKE_MODE" == 'block' ]]; then
            FAILURE_DIAGNOSTIC_CODE='E18_UNKNOWN_RUNTIME_IMPACT'
            echo "E18_UNKNOWN_RUNTIME_IMPACT:$E18_SMOKE_REASON"
            exit 1
          elif [[ "$E18_SMOKE_MODE" == 'run' ]]; then
            FAILURE_PHASE='smoke'
            FAILURE_REASON='E7_BEHAVIOR_SMOKE_FAILED'
            if [[ ! "$E18_SMOKE_REPEAT" =~ ^[1-9][0-9]*$ ]]; then
              FAILURE_DIAGNOSTIC_CODE='E18_SMOKE_REPEAT_INVALID'
              echo 'E18_SMOKE_REPEAT_INVALID'
              exit 1
            fi
            node plugins/usage-dashboard/tools/run_behavior_smoke.cjs --repeat "$E18_SMOKE_REPEAT"
          else
            if [[ "$E18_SMOKE_MODE" != 'skip' ]]; then
              FAILURE_DIAGNOSTIC_CODE='E18_SMOKE_MODE_INVALID'
              echo "E18_SMOKE_MODE_INVALID:$E18_SMOKE_MODE"
              exit 1
            fi
            echo "BEHAVIOR_SMOKE_SKIPPED:$E18_SMOKE_REASON"
          fi

          FAILURE_PHASE='test-tree'
          FAILURE_REASON='E7_TEST_TREE_MUTATED'
          FAILURE_DIAGNOSTIC_CODE=''
          if [[ -n "$(git status --porcelain --untracked-files=all -- plugins/usage-dashboard/tests)" ]]; then
            FAILURE_DIAGNOSTIC_CODE='TEST_TREE_MUTATED'
            git status --short plugins/usage-dashboard/tests
            echo 'TEST_TREE_MUTATED'
            exit 1
          fi

          FAILURE_PHASE='derived-verify'
          FAILURE_REASON='E7_DERIVED_VERIFY_FAILED'
          FAILURE_DIAGNOSTIC_CODE=''
          git add -A
          TREE_SHA="$(git write-tree)"
          NEEDS_FROZEN_MAIN_PARENT=false
          PARENT_ARGS=(-p "$CANDIDATE_PARENT_SHA")
          if [[ "$CANDIDATE_PARENT_SHA" != "$TRUSTED_BASE_SHA" ]] && ! git merge-base --is-ancestor "$TRUSTED_BASE_SHA" "$CANDIDATE_PARENT_SHA"; then
            NEEDS_FROZEN_MAIN_PARENT=true
            PARENT_ARGS+=(-p "$TRUSTED_BASE_SHA")
            echo "E14_ANCESTRY_PARENT_ADDED:$CANDIDATE_PARENT_SHA:$TRUSTED_BASE_SHA"
          else
            echo "E14_ANCESTRY_ALREADY_CONVERGED:$CANDIDATE_PARENT_SHA:$TRUSTED_BASE_SHA"
          fi
          PAYLOAD_SHA="$(printf 'materialize: Usage Dashboard %s from source %s\n\nUsage-Dashboard-Frozen-Main: %s\n' "$PRODUCT_VERSION" "$SOURCE_SHA" "$TRUSTED_BASE_SHA" | git commit-tree "$TREE_SHA" "${PARENT_ARGS[@]}")"
          node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --verify-derived "$TRUSTED_BASE_SHA" "$CANDIDATE_PARENT_SHA" "$PAYLOAD_SHA" "$SOURCE_FILES_JSON"
          git branch -f candidate-payload "$PAYLOAD_SHA"

          FAILURE_PHASE='bundle'
          FAILURE_REASON='E7_BUNDLE_BUILD_FAILED'
          BUNDLE="$RUNNER_TEMP/usage-dashboard-e7-candidate.bundle"
          META="$RUNNER_TEMP/usage-dashboard-e7-candidate.json"
          BUNDLE_EXCLUDES=("^$CANDIDATE_PARENT_SHA")
          if [[ "$NEEDS_FROZEN_MAIN_PARENT" == 'true' ]]; then BUNDLE_EXCLUDES+=("^$TRUSTED_BASE_SHA"); fi
          git bundle create "$BUNDLE" refs/heads/candidate-payload "${BUNDLE_EXCLUDES[@]}"
          git bundle verify "$BUNDLE"
          BUNDLE_SHA256="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          node - "$META" "$TRUSTED_BASE_SHA" "$SOURCE_SHA" "$CANDIDATE_BRANCH" "$CANDIDATE_PARENT_SHA" "$PAYLOAD_SHA" "$RELEASE_SPEC" "$SOURCE_FILES_JSON" "$BUNDLE_SHA256" <<'NODE'
          const fs=require('node:fs');
          const [file,trustedBaseSha,sourceSha,candidateBranch,candidateParentSha,payloadSha,releaseSpec,sourceFilesJson,bundleSha256]=process.argv.slice(2);
          fs.writeFileSync(file,JSON.stringify({schemaVersion:1,trustedBaseSha,sourceSha,candidateBranch,candidateParentSha,payloadSha,releaseSpec,sourceFiles:JSON.parse(sourceFilesJson),bundleSha256},null,2)+'\n');
          NODE
          echo "candidate_sha=$PAYLOAD_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"
          echo 'failure_phase=' >> "$GITHUB_OUTPUT"
          echo 'failure_reason=' >> "$GITHUB_OUTPUT"
          echo 'failure_diagnostic_code=' >> "$GITHUB_OUTPUT"
          trap - EXIT
          echo "E7_CANDIDATE_BUNDLE_READY:$CANDIDATE_BRANCH:$CANDIDATE_PARENT_SHA:$PAYLOAD_SHA"

      - name: Upload immutable derived candidate payload
        uses: actions/upload-artifact@v4
        with:
          name: usage-dashboard-e7-candidate-payload
          path: |
            ${{ runner.temp }}/usage-dashboard-e7-candidate.bundle
            ${{ runner.temp }}/usage-dashboard-e7-candidate.json
          retention-days: 1
          if-no-files-found: error

  write_candidate:
    needs: [resolve_stage, materialize_stage]
    if: ${{ needs.resolve_stage.result == 'success' && needs.materialize_stage.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.write.outputs.candidate_sha }}
      failure_reason: ${{ steps.write.outputs.failure_reason }}
    steps:
      - name: Checkout immutable trusted writer control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download candidate bundle only
        uses: actions/download-artifact@v4
        with:
          name: usage-dashboard-e7-candidate-payload
          path: ${{ runner.temp }}/usage-dashboard-e7-candidate-payload

      - name: Verify bundle and fast-forward derived candidate branch
        id: write
        shell: bash
        env:
          TRUSTED_BASE_SHA: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
          SOURCE_SHA: ${{ needs.resolve_stage.outputs.source_sha }}
          CANDIDATE_BRANCH: ${{ needs.resolve_stage.outputs.candidate_branch }}
          CANDIDATE_PARENT_SHA: ${{ needs.resolve_stage.outputs.candidate_parent_sha }}
          PAYLOAD_SHA: ${{ needs.materialize_stage.outputs.candidate_sha }}
          SOURCE_FILES_JSON: ${{ needs.resolve_stage.outputs.source_files_json }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.materialize_stage.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then echo "failure_reason=E7_WRITER_FAILED" >> "$GITHUB_OUTPUT"; fi' EXIT
          BUNDLE="$RUNNER_TEMP/usage-dashboard-e7-candidate-payload/usage-dashboard-e7-candidate.bundle"
          META="$RUNNER_TEMP/usage-dashboard-e7-candidate-payload/usage-dashboard-e7-candidate.json"
          test -f "$BUNDLE" && test -f "$META"
          node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --check-derived-branch "$CANDIDATE_BRANCH" >/dev/null
          ACTUAL_BUNDLE_SHA256="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          [[ "$ACTUAL_BUNDLE_SHA256" == "$EXPECTED_BUNDLE_SHA256" ]] || { echo 'E7_BUNDLE_SHA256_MISMATCH'; exit 1; }
          node - "$META" "$TRUSTED_BASE_SHA" "$SOURCE_SHA" "$CANDIDATE_BRANCH" "$CANDIDATE_PARENT_SHA" "$PAYLOAD_SHA" "$SOURCE_FILES_JSON" "$EXPECTED_BUNDLE_SHA256" <<'NODE'
          const fs=require('node:fs');
          const [file,trustedBaseSha,sourceSha,candidateBranch,candidateParentSha,payloadSha,sourceFilesJson,bundleSha256]=process.argv.slice(2);
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const expected={trustedBaseSha,sourceSha,candidateBranch,candidateParentSha,payloadSha,bundleSha256};
          for(const [key,value] of Object.entries(expected)) if(data[key]!==value) throw new Error(`E7_BUNDLE_METADATA_MISMATCH:${key}`);
          if(JSON.stringify(data.sourceFiles)!==JSON.stringify(JSON.parse(sourceFilesJson))) throw new Error('E7_BUNDLE_METADATA_MISMATCH:sourceFiles');
          NODE
          REMOTE_BEFORE="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [[ -z "$REMOTE_BEFORE" ]]; then
            [[ "$CANDIDATE_PARENT_SHA" == "$TRUSTED_BASE_SHA" ]] || { echo 'E7_CANDIDATE_MISSING_WITH_NONBASE_PARENT'; exit 1; }
          else
            [[ "$REMOTE_BEFORE" == "$CANDIDATE_PARENT_SHA" ]] || { echo "E7_CANDIDATE_CAS_FAILED:$REMOTE_BEFORE:expected=$CANDIDATE_PARENT_SHA"; exit 1; }
            git fetch --no-tags origin "refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/e7-candidate-parent"
          fi
          git bundle verify "$BUNDLE"
          git fetch "$BUNDLE" 'refs/heads/candidate-payload:refs/e7/candidate-payload'
          IMPORTED_SHA="$(git rev-parse refs/e7/candidate-payload)"
          [[ "$IMPORTED_SHA" == "$PAYLOAD_SHA" ]] || { echo 'E7_PAYLOAD_SHA_MISMATCH'; exit 1; }
          if ! RECORDED_FROZEN_MAIN="$(node - "$PAYLOAD_SHA" <<'NODE'
          const {execFileSync}=require('node:child_process');
          const guard=require('./plugins/usage-dashboard/tools/merge_guard_e11.cjs');
          const message=execFileSync('git',['show','-s','--format=%B',process.argv[2]],{encoding:'utf8'});
          process.stdout.write(guard.frozenMainFromMessage(message)||'');
          NODE
          )"; then
            echo 'E7_FROZEN_MAIN_TRAILER_INVALID'
            exit 1
          fi
          [[ "$RECORDED_FROZEN_MAIN" == "$TRUSTED_BASE_SHA" ]] || { echo "E7_FROZEN_MAIN_TRAILER_MISMATCH:$RECORDED_FROZEN_MAIN:expected=$TRUSTED_BASE_SHA"; exit 1; }
          node plugins/usage-dashboard/tools/candidate_stage_e6.cjs --verify-derived "$TRUSTED_BASE_SHA" "$CANDIDATE_PARENT_SHA" "$PAYLOAD_SHA" "$SOURCE_FILES_JSON"
          REMOTE_RECHECK="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_RECHECK" == "$REMOTE_BEFORE" ]] || { echo 'E7_CANDIDATE_CAS_RECHECK_FAILED'; exit 1; }
          git push origin "$PAYLOAD_SHA:refs/heads/$CANDIDATE_BRANCH"
          REMOTE_AFTER="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_AFTER" == "$PAYLOAD_SHA" ]] || { echo 'E7_CANDIDATE_POSTVERIFY_FAILED'; exit 1; }
          echo "candidate_sha=$PAYLOAD_SHA" >> "$GITHUB_OUTPUT"
          echo 'failure_reason=' >> "$GITHUB_OUTPUT"
          trap - EXIT
          echo "E7_CANDIDATE_MATERIALIZED:$CANDIDATE_BRANCH:$CANDIDATE_PARENT_SHA:$PAYLOAD_SHA"

  receipt_ready:
    needs: [resolve_stage, write_candidate]
    if: ${{ needs.resolve_stage.result == 'success' && needs.write_candidate.result == 'success' }}
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical reducer wake helper
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Post authoritative candidate-ready receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.resolve_stage.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.resolve_stage.outputs.source_sha }}
          BASE_SHA: ${{ needs.resolve_stage.outputs.trusted_base_sha }}
          CANDIDATE_SHA: ${{ needs.write_candidate.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.resolve_stage.outputs.candidate_branch }}
          PRODUCT_VERSION: ${{ needs.resolve_stage.outputs.product_version }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          UD_CANDIDATE_READY
          release: $PRODUCT_VERSION
          source_branch: $SOURCE_BRANCH
          source_sha: $SOURCE_SHA
          base_sha: $BASE_SHA
          candidate_branch: $CANDIDATE_BRANCH
          candidate_sha: $CANDIDATE_SHA
          transaction: $GITHUB_RUN_ID
          smoke: GREEN
          next: ensure deterministic PR + exact-SHA validation
          EOF
          )"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/receipt.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/197/comments" \
            --data-binary @"$RUNNER_TEMP/receipt.json" >/dev/null
          echo "E7_CANDIDATE_READY:$PRODUCT_VERSION:$CANDIDATE_BRANCH:$CANDIDATE_SHA"

      - name: Wake durable reducer after candidate publication
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash plugins/usage-dashboard/tools/reducer_wake_e13.sh stage

  receipt_failure:
    needs: [resolve_stage, materialize_stage, write_candidate]
    if: ${{ always() && (needs.resolve_stage.result == 'failure' || needs.materialize_stage.result == 'failure' || needs.write_candidate.result == 'failure') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted E25 failure projection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Post actionable stage failure receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESOLVE_RESULT: ${{ needs.resolve_stage.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize_stage.result }}
          WRITE_RESULT: ${{ needs.write_candidate.result }}
          MATERIALIZE_PHASE: ${{ needs.materialize_stage.outputs.failure_phase }}
          MATERIALIZE_REASON: ${{ needs.materialize_stage.outputs.failure_reason }}
          MATERIALIZE_DIAGNOSTIC_CODE: ${{ needs.materialize_stage.outputs.failure_diagnostic_code }}
        run: |
          set -euo pipefail
          if [[ "$RESOLVE_RESULT" == 'failure' ]]; then
            PHASE='resolve'
            REASON='E7_SOURCE_POLICY_REJECTED'
            DIAGNOSTIC=''
            NEXT='fix the source-policy rejection and run the same stage command again'
          elif [[ "$MATERIALIZE_RESULT" == 'failure' ]]; then
            PHASE="${MATERIALIZE_PHASE:-unknown}"
            REASON="${MATERIALIZE_REASON:-E7_MATERIALIZE_OR_SMOKE_FAILED}"
            DIAGNOSTIC="${MATERIALIZE_DIAGNOSTIC_CODE:-}"
            NEXT='fix the bounded failed phase and run the same stage command again'
          else
            PHASE='writer'
            REASON='E7_WRITER_FAILED'
            DIAGNOSTIC=''
            NEXT='rerun the same stage command; stale/CAS conflicts fail closed'
          fi
          BODY="$(node plugins/usage-dashboard/tools/stage_failure_projection_e25.cjs --format "$PHASE" "$REASON" "$DIAGNOSTIC" "$GITHUB_RUN_ID" "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$NEXT")"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/receipt.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/197/comments" \
            --data-binary @"$RUNNER_TEMP/receipt.json" >/dev/null
