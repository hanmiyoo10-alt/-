name: Usage Dashboard Stage Request Self-Heal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usage-dashboard-stage-e7.yml'
      - '.github/workflows/usage-dashboard-stage-request-self-heal.yml'
      - 'plugins/usage-dashboard/tools/release_control_command.cjs'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-dashboard-stage-request-self-heal
  cancel-in-progress: false

jobs:
  dispatch-open-request:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve oldest exact owner stage request
        id: request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'UD_STAGE_REQUEST_SELF_HEAL_UNTRUSTED_REF'; exit 1; }
          RESPONSE="$RUNNER_TEMP/stage-requests.json"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&labels=plugin%3Ausage-dashboard&sort=created&direction=asc&per_page=100" \
            > "$RESPONSE"

          FOUND='false'
          while IFS=$'\t' read -r NUMBER AUTHOR TITLE; do
            [[ -n "$NUMBER" ]] || continue
            [[ "$AUTHOR" == "$REPOSITORY_OWNER" ]] || continue
            if SOURCE_BRANCH="$(node plugins/usage-dashboard/tools/release_control_command.cjs --stage-issue-branch "$TITLE" 2>/dev/null)"; then
              node plugins/usage-dashboard/tools/candidate_preparation_policy.cjs --check-target "$SOURCE_BRANCH"
              echo "has_request=true" >> "$GITHUB_OUTPUT"
              echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
              echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "UD_STAGE_REQUEST_SELF_HEAL_SELECTED:$NUMBER:$SOURCE_BRANCH"
              FOUND='true'
              break
            fi
          done < <(jq -r '.[] | select(.pull_request == null) | [.number, .user.login, .title] | @tsv' "$RESPONSE")

          if [[ "$FOUND" != 'true' ]]; then
            echo 'has_request=false' >> "$GITHUB_OUTPUT"
            echo 'UD_STAGE_REQUEST_SELF_HEAL_IDLE'
          fi

      - name: Dispatch trusted stage workflow
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
          SOURCE_BRANCH: ${{ steps.request.outputs.source_branch }}
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/dispatch.json"
          jq -n --arg branch "$SOURCE_BRANCH" '{ref:"main",inputs:{source_branch:$branch}}' > "$PAYLOAD"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/usage-dashboard-stage-e7.yml/dispatches" \
            --data-binary @"$PAYLOAD"
          BODY="UD_STAGE_REQUEST_DISPATCHED\nsource_branch: $SOURCE_BRANCH\nrequest_issue: #$ISSUE_NUMBER\nconsumer_run: $GITHUB_RUN_ID\nnext: trusted stage workflow"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/request-comment.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @"$RUNNER_TEMP/request-comment.json" >/dev/null
          printf '%s\n' '{"state":"closed","state_reason":"completed"}' > "$RUNNER_TEMP/request-close.json"
          curl --fail-with-body --silent --show-error -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --data-binary @"$RUNNER_TEMP/request-close.json" >/dev/null
          echo "UD_STAGE_REQUEST_SELF_HEAL_DISPATCHED:$ISSUE_NUMBER:$SOURCE_BRANCH"
