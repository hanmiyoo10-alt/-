name: Usage Dashboard Upstream Idea Intake Contract

on:
  pull_request:
    paths:
      - '.github/usage-dashboard/upstream-idea-intake-state.json'
      - '.github/usage-dashboard/tests/upstream-idea-intake-contract.cjs'
      - 'docs/USAGE_DASHBOARD_UPSTREAM_IDEA_INTAKE_AUTOMATION.md'
      - '.github/workflows/usage-dashboard-upstream-idea-intake-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/usage-dashboard/upstream-idea-intake-state.json'
      - '.github/usage-dashboard/tests/upstream-idea-intake-contract.cjs'
      - 'docs/USAGE_DASHBOARD_UPSTREAM_IDEA_INTAKE_AUTOMATION.md'
      - '.github/workflows/usage-dashboard-upstream-idea-intake-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node .github/usage-dashboard/tests/upstream-idea-intake-contract.cjs
