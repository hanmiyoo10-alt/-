name: Usage Dashboard Candidate Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/usage-dashboard/**'
      - '.github/tooling/ci-summary/**'
      - '.github/usage-dashboard/releases/**'
      - '.github/usage-dashboard/archived-release-workflows.json'
      - '.github/usage-dashboard/legacy-release-authority.json'
      - '.github/workflows/usage-dashboard-validate.yml'
      - '.github/workflows/usage-dashboard-validate-exact.yml'
      - '.github/workflows/usage-dashboard-candidate-ready.yml'
      - '.github/workflows/usage-dashboard-prepare-candidate.yml'
      - '.github/workflows/usage-dashboard-stage-e7.yml'
      - '.github/workflows/usage-dashboard-promote.yml'
      - '.github/workflows/reusable-usage-dashboard-validate.yml'
      - '.github/workflows/reusable-usage-dashboard-promote.yml'
      - 'docs/USAGE_DASHBOARD_GUIDELINES.md'
      - 'docs/USAGE_DASHBOARD_RELEASE_PIPELINE_V2*.md'
      - 'docs/USAGE_DASHBOARD_PR_LIFECYCLE_E*.md'

permissions:
  contents: read

jobs:
  deterministic-stage-pr-note:
    name: Non-authoritative deterministic release PR lane
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'stage/usage-dashboard-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Declare exact-SHA authority for deterministic candidate PRs
        run: |
          echo 'CANDIDATE_PR_EVENT_NONAUTHORITATIVE:deterministic-stage-pr'
          echo 'NON-AUTHORITATIVE PR LANE — exact-SHA validator owns release decision'
          echo 'Authoritative gate: durable-request exact-SHA full registry.'
          {
            echo '### NON-AUTHORITATIVE PR LANE'
            echo ''
            echo 'This deterministic release PR does not own the release decision.'
            echo ''
            echo '**Authoritative gate:** durable-request exact-SHA full registry.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'stage/usage-dashboard-') }}
    uses: ./.github/workflows/reusable-usage-dashboard-validate.yml
