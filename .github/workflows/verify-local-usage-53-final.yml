name: Verify Local Usage 5.3 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-local-usage-53-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for any earlier finalizer and refresh main
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          git fetch origin main
          git switch -C main origin/main

      - name: Reconcile 5.3 only if still needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '//@version 3.0.0-alpha.5.3' plugins/usage-dashboard/src/00-runtime-core.part.js; then
            echo '5.3 already present'
          else
            grep -Fq '//@version 3.0.0-alpha.5.2' plugins/usage-dashboard/src/00-runtime-core.part.js
            test -f .github/lud53/prepatch53.py
            test -f .github/lud53/patch53.py
            test -f .github/lud53/postpatch53.py
            python3 .github/lud53/prepatch53.py
            python3 .github/lud53/patch53.py
            python3 .github/lud53/postpatch53.py
            node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --write
          fi

      - name: Validate 5.3 exact product
        shell: bash
        run: |
          set -euo pipefail
          node plugins/usage-dashboard/tools/build_usage_dashboard.cjs --check
          node --check plugins/usage-dashboard/latest.js
          node --check plugins/usage-dashboard/runtime/bridge-manager.cjs
          node --check plugins/usage-dashboard/runtime/bridge-engine.mjs
          bash -n plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          for test in plugins/usage-dashboard/tests/*.cjs; do node "$test"; done
          python3 -m json.tool plugins/usage-dashboard/src/manifest.json >/dev/null
          python3 -m json.tool plugins/usage-dashboard/runtime/product-manifest.json >/dev/null
          grep -Fq '//@version 3.0.0-alpha.5.3' plugins/usage-dashboard/latest.js
          grep -Fq "const MANAGER_VERSION = '1.2.0';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "const PRODUCT_VERSION = '3.0.0-alpha.5.3';" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq "url.pathname === '/engine/sync'" plugins/usage-dashboard/runtime/bridge-manager.cjs
          grep -Fq 'async function syncBridgeEngineBundleIfNeeded(status)' plugins/usage-dashboard/latest.js
          grep -Fq '"state": "managed-bundled"' plugins/usage-dashboard/runtime/product-manifest.json
          grep -Fq '"sourceBundled": true' plugins/usage-dashboard/runtime/product-manifest.json
          ENGINE_SHA="$(sha256sum plugins/usage-dashboard/runtime/bridge-engine.mjs | awk '{print $1}')"
          test "$ENGINE_SHA" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'
          test "$(node -e "const m=require('./plugins/usage-dashboard/runtime/product-manifest.json');process.stdout.write(String(m.components.bridge.sha256||''))")" = "$ENGINE_SHA"
          test "$(node -e "const m=require('./plugins/usage-dashboard/runtime/product-manifest.json');process.stdout.write(String(m.components.bridgeManager.sha256||''))")" = "$(sha256sum plugins/usage-dashboard/runtime/bridge-manager.cjs | awk '{print $1}')"
          git diff --check

      - name: Commit main if reconciliation was needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/usage-dashboard .github/workflows/release-local-usage-dashboard.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat: reconcile Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
            git push origin HEAD:main
          fi
          git fetch origin main
          echo "PRODUCT_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Ensure release branch has exact 5.3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          rm -rf /tmp/lud53-runtime
          mkdir -p /tmp/lud53-runtime
          cp plugins/usage-dashboard/latest.js /tmp/lud53-latest.js
          cp -R plugins/usage-dashboard/runtime/. /tmp/lud53-runtime/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release-usage-dashboard
          git switch -C release-usage-dashboard origin/release-usage-dashboard
          git reset --hard origin/release-usage-dashboard
          git clean -fd
          rm -rf plugins/usage-dashboard/runtime
          mkdir -p plugins/usage-dashboard/runtime
          cp /tmp/lud53-latest.js plugins/usage-dashboard/latest.js
          cp -R /tmp/lud53-runtime/. plugins/usage-dashboard/runtime/
          git add plugins/usage-dashboard/latest.js plugins/usage-dashboard/runtime
          if ! git diff --cached --quiet; then
            git commit -m 'release: reconcile Local Usage Dashboard 3.0.0-alpha.5.3 bundled engine'
            git push origin HEAD:release-usage-dashboard
          fi

      - name: Dispatch and wait for authoritative workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/actions/workflows/release-local-usage-dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
          RUN_ID=''
          for _ in $(seq 1 36); do
            sleep 5
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/workflows/release-local-usage-dashboard.yml/runs?event=workflow_dispatch&branch=main&per_page=20" -o /tmp/lud53-runs.json
            RUN_ID="$(PRODUCT_MAIN_SHA="$PRODUCT_MAIN_SHA" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/lud53-runs.json'))
          sha=os.environ['PRODUCT_MAIN_SHA']
          rows=[r for r in d.get('workflow_runs',[]) if r.get('head_sha')==sha and r.get('event')=='workflow_dispatch']
          rows.sort(key=lambda r:r.get('id',0), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
            )"
            [ -n "$RUN_ID" ] && break
          done
          test -n "$RUN_ID"
          for _ in $(seq 1 72); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/runs/$RUN_ID" -o /tmp/lud53-run.json
            read -r STATUS CONCLUSION < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lud53-run.json'))
          print(r.get('status',''), r.get('conclusion') or '')
          PY
            )
            echo "authoritative $RUN_ID · $STATUS · ${CONCLUSION:-pending}"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              break
            fi
            sleep 5
          done
          read -r STATUS CONCLUSION < <(python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lud53-run.json'))
          print(r.get('status',''), r.get('conclusion') or '')
          PY
          )
          test "$STATUS" = completed
          test "$CONCLUSION" = success
          echo "VERIFIED_AUTHORITATIVE_RUN=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify main/release parity after authoritative publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main release-usage-dashboard
          for p in \
            plugins/usage-dashboard/latest.js \
            plugins/usage-dashboard/runtime/product-manifest.json \
            plugins/usage-dashboard/runtime/bridge-manager.cjs \
            plugins/usage-dashboard/runtime/bridge-engine.mjs \
            plugins/usage-dashboard/runtime/bootstrap-bridge-manager.sh
          do
            A="$(git show "origin/main:$p" | sha256sum | awk '{print $1}')"
            B="$(git show "origin/release-usage-dashboard:$p" | sha256sum | awk '{print $1}')"
            echo "$p · $A · $B"
            test "$A" = "$B"
          done
          test "$(git show origin/release-usage-dashboard:plugins/usage-dashboard/runtime/bridge-engine.mjs | sha256sum | awk '{print $1}')" = 'fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d'

      - name: Record verification and clean temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' \
            'Local Usage Dashboard 3.0.0-alpha.5.3' \
            'Bridge Manager 1.2.0' \
            'Bridge 1.6.1 SHA256 fbcc3f73dc06922a71ee3d817771c6c613bf374b8c2232cfdd8e99ac7bc07b8d' \
            "Authoritative workflow run ${VERIFIED_AUTHORITATIVE_RUN}: success" \
            > plugins/usage-dashboard/tests/fixtures/p5-bundled-engine-verified.txt
          rm -rf .github/lud53
          rm -f \
            .github/workflows/stage-local-usage-53-engine.yml \
            .github/workflows/release-local-usage-53-bundled-engine.yml \
            .github/workflows/release-local-usage-53-bundled-engine-r2.yml \
            .github/workflows/release-local-usage-53-bundled-engine-r3.yml \
            .github/workflows/release-local-usage-53-bundled-engine-final.yml \
            .github/workflows/verify-local-usage-53-final.yml
          git add -A plugins/usage-dashboard/tests/fixtures .github
          git commit -m 'test: record verified Local Usage 5.3 bundled-engine release'
          git push origin HEAD:main
