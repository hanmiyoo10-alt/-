plugins {
    id 'com.android.application'
}

android {
    namespace 'io.hanmiyoo.screenoncompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.hanmiyoo.screenoncompanion'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
