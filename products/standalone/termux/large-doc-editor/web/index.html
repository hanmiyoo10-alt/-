<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Termux Large Doc Prototype</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Large Doc Prototype</h1>
        <p>전체 문서를 브라우저에 올리지 않고 현재 청크만 편집합니다.</p>
      </div>
      <span id="latency">input → paint: —</span>
    </header>

    <section class="open-row">
      <select id="fileSelect" aria-label="문서 선택"></select>
      <button id="refreshFiles">새로고침</button>
      <button id="openFile" class="primary">열기</button>
    </section>

    <section class="meta">
      <span id="documentMeta">문서를 선택하세요.</span>
      <span id="saveState">저장됨</span>
    </section>

    <section class="editor-shell">
      <textarea id="editor" spellcheck="false" disabled
        placeholder="문서를 열면 현재 청크가 여기에 표시됩니다."></textarea>
    </section>

    <nav>
      <button id="prev" disabled>← 이전</button>
      <span id="chunkLabel">0 / 0</span>
      <button id="next" disabled>다음 →</button>
      <button id="save" disabled class="primary">파일 저장</button>
    </nav>

    <section class="note">
      <strong>Prototype 0</strong>
      <span>현재는 UTF-8 텍스트/Markdown 계열만 지원합니다. Google Docs/DOCX 동기화는 성능 검증 후 별도 단계에서 추가합니다.</span>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
