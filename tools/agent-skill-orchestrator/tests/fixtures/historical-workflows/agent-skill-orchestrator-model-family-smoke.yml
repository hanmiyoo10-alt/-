name: Agent Skill Orchestrator Model Family Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/agent-skill-orchestrator-o4b-ministral3-smoke-20260902'
    paths:
      - '.o4b-model-smoke-trigger'

permissions:
  contents: read

jobs:
  ministral3-cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SMOKE_ROOT: .agent-skill-orchestrator-model-smoke
      CANDIDATE_PATH: tools/agent-skill-orchestrator/models/candidates/ministral-3-3b-instruct-2512-q4_k_m.json
      LLAMA_RELEASE: b10516
      LLAMA_SOURCE_DIGEST: b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9
      LLAMA_ARTIFACT: llama-b10516-bin-ubuntu-x64.tar.gz
      LLAMA_ARTIFACT_SHA256: f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35
      SERVER_PORT: '39135'
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve frozen candidate and enforce pre-registry boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT"
          python tools/agent-skill-orchestrator/models/model_family_smoke.py resolve \
            --candidate "$CANDIDATE_PATH" \
            --output "$SMOKE_ROOT/candidate-resolved.json"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          package = Path('tools/agent-skill-orchestrator').resolve()
          sys.path.insert(0, str(package))
          from registry import load_model_registry

          registry = load_model_registry()
          if any(p['profile_id'] == 'ministral-3-3b-instruct-2512-q4_k_m' for p in registry['profiles']):
              raise SystemExit('O4-B pre-smoke registry boundary violated')
          resolved = json.loads(Path('.agent-skill-orchestrator-model-smoke/candidate-resolved.json').read_text(encoding='utf-8'))
          candidate = resolved['candidate']
          print('O4B_CANDIDATE_SHA256:' + resolved['candidate_sha256'])
          print('O4B_MODEL_REVISION:' + candidate['revision'])
          print('O4B_MODEL_SHA256:' + candidate['sha256'])
          PY
          DOWNLOAD_URL="$(python -c 'import json; print(json.load(open(".agent-skill-orchestrator-model-smoke/candidate-resolved.json"))["download_url"])')"
          MODEL_FILE="$(python -c 'import json; print(json.load(open(".agent-skill-orchestrator-model-smoke/candidate-resolved.json"))["candidate"]["file"])')"
          MODEL_SHA256="$(python -c 'import json; print(json.load(open(".agent-skill-orchestrator-model-smoke/candidate-resolved.json"))["candidate"]["sha256"])')"
          MODEL_SIZE="$(python -c 'import json; print(json.load(open(".agent-skill-orchestrator-model-smoke/candidate-resolved.json"))["candidate"]["size_bytes"])')"
          printf 'DOWNLOAD_URL=%s\n' "$DOWNLOAD_URL" >> "$GITHUB_ENV"
          printf 'MODEL_FILE=%s\n' "$MODEL_FILE" >> "$GITHUB_ENV"
          printf 'MODEL_SHA256=%s\n' "$MODEL_SHA256" >> "$GITHUB_ENV"
          printf 'MODEL_SIZE=%s\n' "$MODEL_SIZE" >> "$GITHUB_ENV"

      - name: Prove model credential environment is absent
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_TOKEN HUGGING_FACE_HUB_TOKEN HUGGINGFACEHUB_API_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "O4B_MODEL_CREDENTIAL_PRESENT:$name"
              exit 2
            fi
          done
          echo 'O4B_MODEL_CREDENTIAL_ENV:ABSENT'

      - name: Download and verify pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/o4b-runtime"
          mkdir -p "$runtime_root"
          cd "$runtime_root"
          curl -L --fail --retry 3 --retry-all-errors \
            -o "$LLAMA_ARTIFACT" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/${LLAMA_ARTIFACT}"
          printf '%s  %s\n' "$LLAMA_ARTIFACT_SHA256" "$LLAMA_ARTIFACT" | sha256sum -c -
          mkdir extracted
          tar -xzf "$LLAMA_ARTIFACT" -C extracted
          llama_server="$(find extracted -type f -name llama-server -perm -u+x -print -quit)"
          test -n "$llama_server"
          llama_server="$(realpath "$llama_server")"
          "$llama_server" --version > "$GITHUB_WORKSPACE/$SMOKE_ROOT/llama-runtime-version.txt" 2>&1
          printf 'LLAMA_SERVER=%s\n' "$llama_server" >> "$GITHUB_ENV"

      - name: Download and verify frozen Ministral GGUF without credentials
        shell: bash
        run: |
          set -euo pipefail
          model_root="$RUNNER_TEMP/o4b-model"
          mkdir -p "$model_root"
          cd "$model_root"
          curl -L --fail --retry 3 --retry-all-errors \
            -o "$MODEL_FILE" \
            "$DOWNLOAD_URL"
          test "$(stat -c '%s' "$MODEL_FILE")" = "$MODEL_SIZE"
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_FILE" | sha256sum -c -
          printf 'MODEL_PATH=%s\n' "$(realpath "$MODEL_FILE")" >> "$GITHUB_ENV"

      - name: Run exactly one local structured CPU smoke call
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          package = Path('tools/agent-skill-orchestrator').resolve()
          sys.path.insert(0, str(package))
          from runtime.generation import scout_generation
          from runtime.llama_cpp import start_server, stop_server
          from runtime.local_server import post_chat_completion, wait_for_health

          root = Path('.agent-skill-orchestrator-model-smoke')
          prompt = 'Return exactly one JSON object with one key ready whose boolean value is true. Do not add any other key or prose.'
          schema = {
              'type': 'object',
              'properties': {'ready': {'type': 'boolean', 'const': True}},
              'required': ['ready'],
              'additionalProperties': False,
          }
          generation = scout_generation()
          (root / 'prompt.txt').write_text(prompt + '\n', encoding='utf-8')
          log = (root / 'llama-server.log').open('w', encoding='utf-8')
          process = start_server(
              Path(__import__('os').environ['LLAMA_SERVER']),
              Path(__import__('os').environ['MODEL_PATH']),
              generation,
              int(__import__('os').environ['SERVER_PORT']),
              log,
          )
          try:
              wait_for_health(int(__import__('os').environ['SERVER_PORT']), process)
              content, finish_reason, envelope = post_chat_completion(
                  int(__import__('os').environ['SERVER_PORT']),
                  prompt,
                  generation,
                  schema,
                  timeout_seconds=600.0,
              )
          finally:
              stop_server(process)
              log.close()
          try:
              structured = json.loads(content)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'O4-B structured smoke content is not JSON: {exc}')
          if structured != {'ready': True}:
              raise SystemExit('O4-B structured smoke content mismatch')
          if finish_reason != 'stop':
              raise SystemExit('O4-B smoke did not finish with stop')
          (root / 'response.json').write_text(json.dumps(envelope, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'finish-reason.txt').write_text(finish_reason + '\n', encoding='utf-8')
          (root / 'http-status.txt').write_text('200\n', encoding='utf-8')
          print('O4B_LOCAL_MODEL_CALL_COUNT:1')
          print('O4B_HOSTED_AI_CALL_COUNT:0')
          print('O4B_STRUCTURED_READY:true')
          PY

      - name: Build and validate O4-B smoke receipt
        shell: bash
        run: |
          set -euo pipefail
          python tools/agent-skill-orchestrator/models/model_family_smoke.py receipt \
            --candidate "$CANDIDATE_PATH" \
            --model-path "$MODEL_PATH" \
            --runtime-version "$SMOKE_ROOT/llama-runtime-version.txt" \
            --prompt "$SMOKE_ROOT/prompt.txt" \
            --response "$SMOKE_ROOT/response.json" \
            --http-status "$(cat "$SMOKE_ROOT/http-status.txt")" \
            --workflow-repository-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$SMOKE_ROOT/receipt.json"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.agent-skill-orchestrator-model-smoke/receipt.json').read_text(encoding='utf-8'))
          if receipt.get('status') != 'PASS':
              raise SystemExit('O4-B smoke receipt is not PASS')
          if receipt.get('local_model_call_count') != 1 or receipt.get('hosted_ai_call_count') != 0:
              raise SystemExit('O4-B smoke call accounting invalid')
          print('O4B_SMOKE_GATE:PASS')
          print('O4B_SMOKE_RECEIPT_SHA256:' + receipt['receipt_sha256'])
          PY

      - name: Upload bounded O4-B smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-skill-orchestrator-model-family-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-skill-orchestrator-model-smoke/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
