[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-admin-mcp"
version = "0.1.0"
description = "Narrow MCP server for the private-mirror writer credential lifecycle"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "cryptography>=43,<48",
  "PyNaCl>=1.5,<2",
]

[project.scripts]
repo-admin-mcp = "repo_admin_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_admin_mcp*"]
