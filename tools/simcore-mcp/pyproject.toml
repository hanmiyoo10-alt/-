[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simcore-mcp"
version = "0.1.0"
description = "Read-only MCP server for SimCore operational status"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
simcore-mcp = "simcore_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simcore_mcp*"]
