[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-dashboard-mcp"
version = "0.1.0"
description = "Read-only MCP server for Local Usage Dashboard status"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
usage-dashboard-mcp = "usage_dashboard_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["usage_dashboard_mcp*"]
